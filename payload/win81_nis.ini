; GW16G QUALITYSAFE1 - GW16F NOLOCK30_1 base + HOTKEYSAFE2 + FGGATE1 + RETURNFIX1.
; FG ON remains HIGH target60 / Present SyncInterval 1 with no automatic 30-FPS clamp.
; QUALITYSAFE1 makes CTRL+F8 safe while FG is ON: it may switch only inside the already-active ME tier.
;   /2 tier: QUALITY (2) <-> CONSERVATIVE (3)
;   /3 tier: LEGACY (0) <-> BALANCED (1)
; This prevents a live /2 <-> /3 NVENC ME-ring resize and presenter recreation.
; To choose the other ME tier, switch FG OFF first, select the desired profile with CTRL+F8, then enable FG again.
; HOTKEYSAFE2 suppresses base-key leakage at the poll source: CTRL+F6 cannot also execute plain F6,
; and CTRL+F8 cannot also execute plain F8 status or the passive DWM F8 diagnostic.
; FG OFF keeps target120 => up to 60 REAL/s; Present remains SyncInterval 1.

[WIN81_NIS]
TargetExe=Warhammer.exe
Enabled=1
UniversalSpatialPresenter=1
AutoRecovery=1
; B18K11: keep the final FG presenter/swapchain identity stable for external recorders such as FRAPS. Hotkeys are unchanged.
ExternalCaptureStable=1
PresenterExclusive=0
GraphicsCartographer=0
RootAuthority=0
AuthorityInternalScale=0
OutputWidth=1920
OutputHeight=1080
RenderWidth=1280
RenderHeight=720
F12ProfilePct=0
F12QualityProfile=2
Sharpness=0
ScalerMode=2
Overlay=1
; SAFEPOINT11/FUSEDDETAIL1 selectable interpolation profile (profile IDs unchanged):
; 0 LEGACY = historical /3 ME + Guard65 (SatGat-style)
; 1 BALANCED = /3 ME + Guard50
; 2 QUALITY = /2 ME + Guard35 (RC13/Inquisitor quality baseline)
; 3 CONSERVATIVE/FUSEDDETAIL1 = TDETAIL4 /2 ME + Guard25 + compressed motion trust, plus fused 2x2 detail stabilizer on GENERATED only
; CTRL+F8 menu: first press shows the current profile NAME without changing it.
; Press CTRL+F8 again while the name is still visible to select the next profile and refresh the notice.
; QUALITYSAFE1: with FG ON, selection stays inside the current ME tier (0<->1 or 2<->3).
; SAFEPOINT11 keeps TDETAIL4 and reuses the FG shader existing 2x2 bilinear texels to damp only excess GENERATED high-frequency deviation. No added texture-load token, resource binding or dispatch. Profile 2 QUALITY is mathematically bypassed.
; With FG OFF, the full 0->1->2->3 profile cycle is available and the selected tier is applied on the next FG enable.
; HOTKEYSAFE2 isolates this chord from plain F8 status and passive DWM F8 diagnostics.
; After the notice disappears, the next press is show-only again.
FrameGenerationQuality=2
FrameGeneration=0
FrameGenerationAsync=1
FrameGenerationSeparateDevice=1
FrameGenerationSharedFlush=1
FrameGenerationRequireVSync=0
FrameGenerationPresentSync=1
FrameGenerationTargetFPS=60
FrameGenerationVectorSign=1
FrameGenerationBlendGuard=35
FrameGenerationDisableAfterErrors=3
FrameGenerationMEScalePercent=50
FrameGenerationMEBudgetUs=6000
FrameGenerationAdaptiveDeadline=1
NativeLowResSwapChain=0
ExclusivePerformanceMode=0
LogicalResolutionForce=0
InternalFamilyScaler=0
LockOutputTarget=0
RTDiagnostics=0
PerfTelemetry=0
VBlankDiagnostics=1
NativeInputEnvelope=1
BenchmarkWarmupSeconds=3
BenchmarkDurationSeconds=10

; B18K18 unified QSV MP4 recorder: ORIGINAL internal recorder path, FG ON or OFF.
; SAFEPOINT2 defers action-8 CTRL+F9 and consumes it on all active presenter routes; FG OFF uses native USR resources while FG ON keeps the isolated path.
; FG OFF obtains the current native swapchain BackBuffer0 at the late presenter phase with IDXGISwapChain::GetBuffer(0).
; FG ON records the final REAL+GENERATED presenter stream; FG OFF records the final PTAR/native REAL presenter stream.
; Safety guards remain fail-closed and are extended mode-aware for the native D3D11 device/context/swapchain only while FG is OFF.
; Original production HUD notices/profile system are retained; no external bridge and no second recorder mode.
; SAFEPOINT4/STATEGUARD1: FG-OFF native-USR submit snapshots and restores the live D3D11 immediate-context pipeline state around B18K18 conversion.
; The conversion/encoder path itself is unchanged; FG-ON isolated presenter submit remains unchanged.
; ============================================================
; PTAR VIDEO RECORDER PROFILE
; Change ONE number only:
;
; 1 = QUALITY
;     1920x1080 / 30 FPS / 16000 kbps
;     Best spatial detail for PTAR image-quality demonstrations.
;
; 2 = MOTION
;     1600x900 / 60 FPS / 17000 kbps
;     Shows PTAR + frame generation at 60 FPS with lighter capture load.
;
; 3 = COMBINED
;     1920x1080 / 60 FPS / 22000 kbps
;     Full PTAR spatial detail + full 60 FPS.
;     Heaviest mode: hardware validation required.
;
; Invalid values fall back safely to profile 1.
VideoRecordProfile=3
; ============================================================
VideoRecordSegmentMB=256
VideoRecordSegmentCount=4

[HOTKEYS]
; RC17 QUALITYMENU1 + GW16G QUALITYSAFE1/HOTKEYSAFE2: CTRL+F8 is quality-only and same-tier while FG is ON; plain F8 remains Status when CTRL is not held.
ManualFilter=F6
Benchmark=F7
Status=F8
Capture=F9
VideoRecord=CTRL+F9
TogglePresenter=F10
ToggleHUD=CTRL+F11
FrameGeneration=CTRL+F6
FilterNext=F12

[INPUT]
Diagnostics=0
CoordinateMapping=Off
