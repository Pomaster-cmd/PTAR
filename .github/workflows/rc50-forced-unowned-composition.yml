name: RC50 Forced Unowned Composition Oracle

on:
  push:
    branches: [lab/rc50-top-level-zorder-20260914]
    paths:
      - lab/borderless/rc50/build_rc50_source.py
      - lab/borderless/rc50/build_field_unowned_host.py
      - .github/workflows/rc50-forced-unowned-composition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unowned-composition:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate RC50 and forced-unowned host
        shell: cmd
        run: |
          python lab\borderless\rc50\build_rc50_source.py lab\borderless\rc50\ptar_borderless_rc50_generated.cpp || exit /b 10
          python lab\borderless\rc50\build_field_unowned_host.py lab\borderless\rc50\ptar_rc50_field_unowned_host.cpp || exit /b 11
          findstr /C:"RC50_WINDOWED_ZORDER_REASSERT_ACTIVE" lab\borderless\rc50\ptar_borderless_rc50_generated.cpp >nul || exit /b 12
          findstr /C:"SetParent(" lab\borderless\rc50\ptar_borderless_rc50_generated.cpp >nul && exit /b 13 || ver >nul
          findstr /C:"GWLP_HWNDPARENT" lab\borderless\rc50\ptar_borderless_rc50_generated.cpp >nul && exit /b 14 || ver >nul
          findstr /C:"WS_CHILD" lab\borderless\rc50\ptar_borderless_rc50_generated.cpp >nul && exit /b 15 || ver >nul
          echo RC50_STATIC_TOPOLOGY=PASS

      - name: Reconstruct exact production runtime in both fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName System.Windows.Forms
          $base=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($base -ne '864c0ca8f24f22f6a3cd4c21a0e213f431f5268e69b04e3860c52fe72600fc3c'){throw "canonical runtime drift $base"}
          $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds;$ow=[int]$b.Width;$oh=[int]$b.Height
          $rw=[int][math]::Floor($ow*2/3);$rh=[int][math]::Floor($oh*2/3)
          foreach($name in @('rc46','rc50')){
            $o="lab/borderless/rc50/unowned_$name";New-Item -ItemType Directory -Force $o | Out-Null
            python lab/borderless/rc48/rebuild_exact_field_runtime.py payload/d3d11.dll "$o/d3d11.dll"
            if($LASTEXITCODE -ne 0){throw "runtime reconstruction failed $name"}
            $h=(Get-FileHash "$o/d3d11.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h -ne '6f1686992bef971c9995df9f0cb91b93c6946988e12a837e5de956df37c9082b'){throw "field runtime SHA mismatch $name $h"}
            Copy-Item "$o/d3d11.dll" "$o/win81_nis_dx11_x64.dll" -Force
            $ini=Get-Content payload/win81_nis.ini -Raw
            $ini=[regex]::Replace($ini,'(?m)^OutputWidth=.*$',"OutputWidth=$ow")
            $ini=[regex]::Replace($ini,'(?m)^OutputHeight=.*$',"OutputHeight=$oh")
            $ini=[regex]::Replace($ini,'(?m)^RenderWidth=.*$',"RenderWidth=$rw")
            $ini=[regex]::Replace($ini,'(?m)^RenderHeight=.*$',"RenderHeight=$rh")
            Set-Content "$o/win81_nis.ini" $ini -Encoding ASCII
          }
          "RUNNER_OUTPUT=${ow}x${oh} RUNNER_RENDER=${rw}x${rh}" | Set-Content 'lab/borderless/rc50/UNOWNED_GEOMETRY.txt' -Encoding ASCII
          Get-Content 'lab/borderless/rc50/UNOWNED_GEOMETRY.txt'

      - name: Build RC46 baseline RC50 candidate RC42 sidecar and host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          cl %CFLAGS% /LD lab\borderless\rc46\ptar_borderless_rc46_prod.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fe:lab\borderless\rc50\unowned_rc46\ptar_borderless.dll user32.lib advapi32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 20
          cl %CFLAGS% /LD lab\borderless\rc50\ptar_borderless_rc50_generated.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fe:lab\borderless\rc50\unowned_rc50\ptar_borderless.dll user32.lib advapi32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 21
          cl %CFLAGS% /I lab\raster\rc41 /LD lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc41\ptar_rc41_context_hooks.cpp lab\raster\rc41\ptar_rc41_resource_bridge.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_swapchain_hooks.cpp lab\raster\rc41\ptar_rc41_prod.cpp /Fe:lab\borderless\rc50\ptar_rc42.dll user32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 22
          cl %CFLAGS% lab\borderless\rc50\ptar_rc50_field_unowned_host.cpp /Fe:lab\borderless\rc50\Warhammer.exe user32.lib advapi32.lib gdi32.lib d3d11.lib dxgi.lib /link /SUBSYSTEM:WINDOWS,6.03 || exit /b 23
          for %%D in (rc46 rc50) do copy /y lab\borderless\rc50\ptar_rc42.dll lab\borderless\rc50\unowned_%%D\ptar_rc42.dll >nul
          for %%D in (rc46 rc50) do copy /y lab\borderless\rc50\ptar_rc42.dll lab\borderless\rc50\unowned_%%D\ptar_rc41.dll >nul
          for %%D in (rc46 rc50) do copy /y lab\borderless\rc50\Warhammer.exe lab\borderless\rc50\unowned_%%D\Warhammer.exe >nul

      - name: Verify inherited payload hashes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raster=(Get-FileHash 'lab/borderless/rc50/ptar_rc42.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($raster -ne '7ffe7aa1b9afa42d5f22557cae29a4f65e17379c2a2f181f879427277839f1ca'){throw "RC42 raster drift $raster"}
          foreach($name in @('rc46','rc50')){
            $o="lab/borderless/rc50/unowned_$name"
            $runtime=(Get-FileHash "$o/d3d11.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
            if($runtime -ne '6f1686992bef971c9995df9f0cb91b93c6946988e12a837e5de956df37c9082b'){throw "runtime drift $name $runtime"}
            $carrier=(Get-FileHash "$o/ptar_borderless.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$name runtime=$runtime raster=$raster carrier=$carrier" | Add-Content 'lab/borderless/rc50/UNOWNED_COMPONENTS.txt' -Encoding ASCII
          }
          Get-Content 'lab/borderless/rc50/UNOWNED_COMPONENTS.txt'

      - name: RC46 baseline must reproduce black when presenter is forced unowned
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o=(Resolve-Path 'lab/borderless/rc50/unowned_rc46').Path
          $p=Start-Process -FilePath "$o/Warhammer.exe" -WorkingDirectory $o -PassThru
          if(-not $p.WaitForExit(100000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'RC46 unowned baseline timeout'}
          $rc=$p.ExitCode;$text=[IO.File]::ReadAllText("$o/TRUE_RUNTIME_HOST.txt",[Text.Encoding]::Unicode)
          Write-Host "RC46_UNOWNED_EXIT=$rc";Write-Host $text
          if($rc -ne 40){throw "RC46 forced-unowned baseline did not reproduce black rc=$rc"}
          if(-not $text.Contains('FIELD_UNOWNED_VISIBLE_PIXELS=FAIL')){throw 'RC46 visible FAIL marker missing'}
          if(-not $text.Contains('PRESENTER_FIELD_EMULATED')){throw 'RC46 field-emulation marker missing'}
          $final=($text -split "`r?`n" | Where-Object {$_ -like 'TOP *class=Win81USRPresenterV041*'} | Select-Object -Last 1)
          if(-not $final){throw 'RC46 final presenter inventory missing'}
          if($final -notmatch 'parent=0+ owner=0+'){throw "RC46 final topology not unowned: $final"}
          Write-Host 'RC46_FORCED_UNOWNED_BLACK_REPRO=PASS'

      - name: RC50 must recover visible output while remaining top-level and unowned
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o=(Resolve-Path 'lab/borderless/rc50/unowned_rc50').Path
          $p=Start-Process -FilePath "$o/Warhammer.exe" -WorkingDirectory $o -PassThru
          if(-not $p.WaitForExit(100000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'RC50 unowned candidate timeout'}
          $rc=$p.ExitCode;$text=[IO.File]::ReadAllText("$o/TRUE_RUNTIME_HOST.txt",[Text.Encoding]::Unicode)
          Write-Host "RC50_UNOWNED_EXIT=$rc";Write-Host $text
          if($rc -ne 0){throw "RC50 forced-unowned visible output failed rc=$rc"}
          if(-not $text.Contains('FIELD_UNOWNED_VISIBLE_PIXELS=PASS')){throw 'RC50 visible PASS marker missing'}
          $final=($text -split "`r?`n" | Where-Object {$_ -like 'TOP *class=Win81USRPresenterV041*'} | Select-Object -Last 1)
          if(-not $final){throw 'RC50 final presenter inventory missing'}
          if($final -notmatch 'parent=0+ owner=0+'){throw "RC50 mutated parent/owner: $final"}
          if($final -match 'style=0x([0-9A-Fa-f]+)'){$style=[Convert]::ToInt64($Matches[1],16);if(($style -band 0x40000000) -ne 0){throw "RC50 presenter became WS_CHILD: $final"}}else{throw 'RC50 final style unavailable'}
          $side=Get-Content "$o/ptar_borderless_rc38.log" -Raw
          if(-not $side.Contains('RC50_WINDOWED_ZORDER_REASSERT_ACTIVE')){throw 'RC50 z-order reassert path not exercised'}
          Write-Host 'RC50_FORCED_UNOWNED_VISIBLE_RECOVERY=PASS topology=TOPLEVEL_UNOWNED'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTAR_RC50_FORCED_UNOWNED_COMPOSITION
          path: |
            lab/borderless/rc50/UNOWNED_GEOMETRY.txt
            lab/borderless/rc50/UNOWNED_COMPONENTS.txt
            lab/borderless/rc50/unowned_rc46/*.txt
            lab/borderless/rc50/unowned_rc46/*.log
            lab/borderless/rc50/unowned_rc50/*.txt
            lab/borderless/rc50/unowned_rc50/*.log
            lab/borderless/rc50/ptar_borderless_rc50_generated.cpp
            lab/borderless/rc50/ptar_rc50_field_unowned_host.cpp
          if-no-files-found: warn
          retention-days: 7
