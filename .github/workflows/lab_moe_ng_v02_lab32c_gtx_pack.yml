name: LAB32C GTX960M Compare Pack

on:
  push:
    branches:
      - lab/moe-ng-v02-lab32-axis-phase-sweep

permissions:
  contents: read

jobs:
  build-audit-pack:
    if: contains(github.event.head_commit.message, '[run-lab32c-gtx-pack]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile and freeze LAB31G LAB32C DXBC
        shell: pwsh
        run: |
          $root='lab_results\lab32c_gtx_pack'; $pack="$root\PTAR_LAB32C_GTX960M_COMPARE_PACK"; $sh="$pack\shaders"
          New-Item -ItemType Directory -Force $sh | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab31g.cso" /Fc "$root\lab31g.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab31g_host_inv_half_mad_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab32c.cso" /Fc "$root\lab32c.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab32c_host_axis_pair_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab_fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_k185_control_ps.cso "$sh\ptar_k185_control_ps.cso"
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_vs.cso "$sh\ptar_vs.cso"
          $expected=@{
            'lab31g.cso'='ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1'
            'lab32c.cso'='185efb1dc7899df178352248a17a9d71826ea509ea9d94562cf89bc92dbb9fa3'
            'ptar_k185_control_ps.cso'='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'
            'ptar_vs.cso'='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
            'lab_fullscreen_vs.cso'='f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          }
          $lines=@()
          foreach($n in $expected.Keys){
            $p="$sh\$n"; if(-not(Test-Path $p)){throw "missing $n"}
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant(); if($got -ne $expected[$n]){throw "$n hash mismatch $got"}
            $bytes=[IO.File]::ReadAllBytes($p); if($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes,0,4) -ne 'DXBC'){throw "$n not DXBC"}
            $lines += "$got  shaders/$n"
          }
          $lines | Set-Content "$pack\HASHES.txt" -Encoding ascii

      - name: Static DXBC contract and codegen audit
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab32c_gtx_pack'); pack=root/'PTAR_LAB32C_GTX960M_COMPARE_PACK'; pat=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b'); out={}
          for n in ('lab31g','lab32c'):
              ops=[]
              for raw in (root/f'{n}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'):continue
                  m=pat.match(raw)
                  if not m:continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}:continue
                  ops.append(op)
              c=Counter(ops)
              out[n]={'instructions':len(ops),'bytes':(pack/'shaders'/f'{n}.cso').stat().st_size,'div':c.get('div',0),'udiv':c.get('udiv',0),'mov':c.get('mov',0),'movc':c.get('movc',0),'gather4':sum(v for k,v in c.items() if k.startswith('gather4')),'sample_l':sum(v for k,v in c.items() if k.startswith('sample_l')),'uav':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_'))}
          contract=all(v['gather4']==1 and v['sample_l']==4 and v['uav']==0 for v in out.values())
          expected=out['lab31g']['instructions']==53 and out['lab31g']['bytes']==2568 and out['lab31g']['div']==0 and out['lab32c']['instructions']==51 and out['lab32c']['bytes']==2616 and out['lab32c']['div']==0
          r={'protocol':'LAB32C_GTX_PACK_STATIC_DXBC_AUDIT','lab31g':out['lab31g'],'lab32c':out['lab32c'],'texture_contract_pass':contract,'expected_codegen_pass':expected,'instruction_delta':out['lab32c']['instructions']-out['lab31g']['instructions'],'byte_delta':out['lab32c']['bytes']-out['lab31g']['bytes'],'pass':bool(contract and expected)}
          (root/'STATIC_DXBC_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not r['pass']:raise SystemExit('DXBC audit failed')
          '@ | python -

      - name: Generate ABI-aware LAB31G vs LAB32C comparator
        run: python tools/lab32c_prepare_gtx_comparator.py

      - name: Audit comparator ABI source
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          p=Path('lab_results/lab32c_gtx_pack/ptar_lab32c_compare.cpp'); s=p.read_text(encoding='utf-8')
          required=['LAB31G','LAB32C','lab31g.cso','lab32c.cso','LAB32C_COMPARE_RAW.csv','LAB32C_COMPARE_SUMMARY.json','float axisUVPair[4]','bd.ByteWidth=sizeof(Constants)','if(variant==0)','else if(variant==1)','c.axisUVPair[0]=invW','c.axisUVPair[3]=invH','c.inputSize[0]=(float)kInW','c.outputSize[0]=(float)kOutW']
          stale=['LAB28','lab28','LAB29','lab29','fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77','6a407b37938ec6a0bf89d13cf84fa4ae23c6f712a947fc6926bbfde9725028ed']
          missing=[x for x in required if x not in s]; residual=[x for x in stale if x in s]
          r={'protocol':'LAB32C_COMPARATOR_ABI_SOURCE_AUDIT','required_tokens':len(required),'missing':missing,'stale_tokens':residual,'lab31g_inverse_half_branch':'if(variant==0)' in s,'lab32c_axis_pair_branch':all(x in s for x in ['else if(variant==1)','c.axisUVPair[0]=invW','c.axisUVPair[3]=invH']),'k185_legacy_branch':'c.inputSize[0]=(float)kInW' in s,'constant_buffer_32_bytes':'float axisUVPair[4]' in s and 'bd.ByteWidth=sizeof(Constants)' in s,'pass':not missing and not residual}
          Path('lab_results/lab32c_gtx_pack/COMPARATOR_ABI_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8');print(json.dumps(r,indent=2))
          if not r['pass']:raise SystemExit('comparator ABI audit failed')
          '@ | python -

      - name: Build Win81 x64 MT comparison host
        shell: pwsh
        run: |
          $root='lab_results\lab32c_gtx_pack'; $pack="$root\PTAR_LAB32C_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){throw 'vcvars64.bat not found'}
          $inc='runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\include'; $src="$root\ptar_lab32c_compare.cpp"
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /MT /W4 /WX /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I `"$inc`" `"$src`" /Fe:`"$pack\ptar_lab32c_gtx960m_compare.exe`" /Fo:`"$root\ptar_lab32c_compare.obj`" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib"
          cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Audit PE imports architecture and subsystem
        shell: pwsh
        run: |
          $root='lab_results\lab32c_gtx_pack'; $pack="$root\PTAR_LAB32C_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          $cmd="call `"$vcvars`" && dumpbin /dependents `"$pack\ptar_lab32c_gtx960m_compare.exe`" > `"$pack\IMPORTS.txt`" && dumpbin /headers `"$pack\ptar_lab32c_gtx960m_compare.exe`" > `"$root\HEADERS.txt`""; cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $imports=Get-Content "$pack\IMPORTS.txt" -Raw; foreach($bad in @('D3DCOMPILER','VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($imports -match [regex]::Escape($bad)){throw "forbidden import $bad"}}
          $headers=Get-Content "$root\HEADERS.txt" -Raw; if($headers -notmatch '6\.03\s+subsystem version'){throw 'subsystem is not 6.03'}; if($headers -notmatch '8664\s+machine \(x64\)'){throw 'machine is not x64'}

      - name: WARP smoke comparator path
        shell: pwsh
        run: |
          $pack=(Resolve-Path 'lab_results\lab32c_gtx_pack\PTAR_LAB32C_GTX960M_COMPARE_PACK').Path; Push-Location $pack
          try { & .\ptar_lab32c_gtx960m_compare.exe --warp-smoke | Tee-Object -FilePath WARP_SMOKE.txt; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} } finally { Pop-Location }
          $smoke=Get-Content "$pack\WARP_SMOKE.txt" -Raw; if($smoke -notmatch '\[PASS\] WARP smoke'){throw 'WARP PASS marker missing'}; if($smoke -notmatch 'LAB31G/LAB32C/K185'){throw 'WARP variant marker mismatch'}

      - name: Finalize audited hardware pack
        shell: pwsh
        run: |
          $root='lab_results\lab32c_gtx_pack'; $pack="$root\PTAR_LAB32C_GTX960M_COMPARE_PACK"
          $exeHash=(Get-FileHash "$pack\ptar_lab32c_gtx960m_compare.exe" -Algorithm SHA256).Hash.ToLowerInvariant(); Add-Content "$pack\HASHES.txt" "$exeHash  ptar_lab32c_gtx960m_compare.exe" -Encoding ascii
          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "ptar_lab32c_gtx960m_compare.exe" (echo [FAIL] Executable absent.& exit /b 10)
          echo [PTAR] LAB32C vs LAB31G vs K185 - GTX 960M - 600 triades equilibrees
          ptar_lab32c_gtx960m_compare.exe
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" echo [FAIL] Code retour %RC%
          if "%RC%"=="0" echo [PASS] Resultats dans le dossier results
          pause
          exit /b %RC%
          '@ | Set-Content "$pack\RUN_LAB32C_GTX960M_COMPARE.bat" -Encoding ascii
          @'
          PTAR LAB32C - GTX960M TARGETED HARDWARE COMPARE

          LAB32C is fully software-admitted against hardware-selected LAB31G.
          It is bit-exact to LAB31G in canonical and six-resolution WARP float validation, exact on all 42 UNORM8 corpus cases, and exact on synthetic stress probes.
          Codegen changes from LAB31G 53 instructions / 2568 bytes to LAB32C 51 instructions / 2616 bytes. Texture contract remains 1 GatherGreen + 4 SampleLevel + 0 UAV.

          LAB31G ABI: cb0.xy=invInputSize, cb0.zw=halfInvInputSize.
          LAB32C ABI: same first 16 bytes plus cb1.xy=(invX,0), cb1.zw=(0,invY).
          K185 keeps legacy input/output-size constants. The host supplies the proper ABI per variant before the timestamped draw.

          Run only RUN_LAB32C_GTX960M_COMPARE.bat on Windows 8.1 + GTX 960M.
          60 warmup triads are followed by 600 measured triads across all six balanced LAB31G/LAB32C/K185 permutations.
          Return only the generated results folder as ZIP. Do not rerun older packs.

          Promotion rule: LAB32C replaces LAB31G only if paired real-GPU gain is reproducible across permutations and K185-defined P-state regimes. Neutral or negative = keep LAB31G.
          '@ | Set-Content "$pack\README_FIRST.txt" -Encoding utf8
          @(
            'protocol=LAB32C_GTX960M_SAME_RUN_BALANCED_COMPARE',"branch=$env:GITHUB_REF_NAME","commit=$env:GITHUB_SHA",'target=Windows 8.1 x64 / D3D11 FL11_0','host_crt=/MT','subsystem=6.03','runtime_hlsl_compiler=false','dimensions=1280x720 -> 1920x1080','warmup_triads=60','measured_triads=600','order_protocol=SIX_ROTATING_PERMUTATIONS_BALANCED','lab31g_sha256=ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1','lab32c_sha256=185efb1dc7899df178352248a17a9d71826ea509ea9d94562cf89bc92dbb9fa3','k185_sha256=6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16','texture_contract=1 GatherGreen + 4 SampleLevel + 0 UAV','lab32c_full_software_gate=PASS','lab31g_codegen=53 instructions / 2568 bytes / 0 div','lab32c_codegen=51 instructions / 2616 bytes / 0 div','lab31g_abi=invInput + halfInvInput','lab32c_abi=invInput + halfInvInput + prepacked axis pair','warp_smoke=PASS','physical_gtx960m_executed=false','main_modified=false','production_runtime_modified=false') | Set-Content "$pack\PROVENANCE.txt" -Encoding ascii
          Copy-Item "$root\STATIC_DXBC_AUDIT.json" "$pack\STATIC_DXBC_AUDIT.json"; Copy-Item "$root\COMPARATOR_ABI_AUDIT.json" "$pack\COMPARATOR_ABI_AUDIT.json"; Copy-Item "$root\HEADERS.txt" "$pack\PE_HEADERS.txt"; Copy-Item "$root\ptar_lab32c_compare.cpp" "$pack\COMPARATOR_SOURCE.cpp"
          $manifest=Get-ChildItem $pack -Recurse -File | Sort-Object FullName | ForEach-Object { $rel=$_.FullName.Substring((Resolve-Path $pack).Path.Length+1).Replace('\','/'); $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$h  $rel" }
          $manifest | Set-Content "$pack\SHA256_MANIFEST.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptar-lab32c-gtx960m-compare-pack
          path: lab_results/lab32c_gtx_pack
