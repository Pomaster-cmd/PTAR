name: promote-hudrec1-runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-hudrec1-runtime.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and patch exact HUDREC1 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($base -ne '864c0ca8f24f22f6a3cd4c21a0e213f431f5268e69b04e3860c52fe72600fc3c'){ throw "Unexpected baseline DLL: $base" }
          New-Item -ItemType Directory -Force diag/base | Out-Null
          Copy-Item payload/d3d11.dll diag/base/SAFEPOINT11_FUSEDDETAIL1_BASE.dll -Force
          $patch=''
          [IO.File]::WriteAllBytes('_hudrec_patch.py',[Convert]::FromBase64String($patch))
          python _hudrec_patch.py
          Move-Item payload/d3d11.hudrec1.dll payload/d3d11.dll -Force
          Copy-Item payload/d3d11.dll payload/win81_nis_dx11_x64.dll -Force
          Remove-Item _hudrec_patch.py -Force
          $out=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $mirror=(Get-FileHash payload/win81_nis_dx11_x64.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $basecopy=(Get-FileHash diag/base/SAFEPOINT11_FUSEDDETAIL1_BASE.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($out -ne 'e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'){ throw "HUDREC1 runtime hash mismatch: $out" }
          if($mirror -ne $out){ throw 'Mirror DLL mismatch' }
          if($basecopy -ne $base){ throw 'Baseline archive copy mismatch' }
      - name: Commit runtime promotion
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue .github/workflows/cleanup-branches-preserve-source.yml
          Remove-Item -Force -ErrorAction SilentlyContinue .github/workflows/cleanup-non-main-branches.yml
          Remove-Item -Force .github/workflows/promote-hudrec1-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: promote HUDREC1 runtime bytes'
          git push origin HEAD:main
