name: promote-hudrec1-runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-hudrec1-runtime.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'promote: stage HUDREC1 runtime'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and patch exact HUDREC1 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($base -ne '864c0ca8f24f22f6a3cd4c21a0e213f431f5268e69b04e3860c52fe72600fc3c'){ throw "Unexpected baseline DLL: $base" }
          New-Item -ItemType Directory -Force diag/base | Out-Null
          Copy-Item payload/d3d11.dll diag/base/SAFEPOINT11_FUSEDDETAIL1_BASE.dll -Force
          @'
import hashlib, struct
from pathlib import Path
src=Path('payload/d3d11.dll')
out=Path('payload/d3d11.hudrec1.dll')
data=bytearray(src.read_bytes())
BASE='864c0ca8f24f22f6a3cd4c21a0e213f431f5268e69b04e3860c52fe72600fc3c'
OUT='e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'
if hashlib.sha256(data).hexdigest()!=BASE: raise SystemExit('BASE_SHA mismatch')
pe=struct.unpack_from('<I',data,0x3C)[0]
if data[pe:pe+4]!=b'PE\0\0': raise SystemExit('PE signature missing')
nsec=struct.unpack_from('<H',data,pe+6)[0]; optsz=struct.unpack_from('<H',data,pe+20)[0]; sec_off=pe+24+optsz
secs=[]
for i in range(nsec):
 o=sec_off+i*40; name=bytes(data[o:o+8]).split(b'\0')[0].decode('ascii','replace'); vs,va,rs,rp=struct.unpack_from('<IIII',data,o+8); secs.append((name,va,vs,rp,rs))
def r2o(rva):
 for name,va,vs,rp,rs in secs:
  if va<=rva<va+max(vs,rs): return rp+(rva-va),name
 raise SystemExit('RVA not mapped')
PATCH=0x34FE9B9; OLD=0x02C7E010; NEW=0x02C7DFC8
off,sec=r2o(PATCH)
if sec!='.dwmlab' or bytes(data[off:off+3])!=b'\x48\x8b\x0d': raise SystemExit('signature mismatch')
old_disp=struct.unpack_from('<i',data,off+3)[0]
if PATCH+7+old_disp!=OLD: raise SystemExit('old target mismatch')
struct.pack_into('<i',data,off+3,NEW-(PATCH+7))
co=pe+24+64
struct.pack_into('<I',data,co,0)
t=0; i=0
while i+1<len(data): t=(t+data[i]+(data[i+1]<<8))&0xffffffff; i+=2
if i<len(data): t+=data[i]
t=(t&0xffff)+(t>>16); t=t+(t>>16); chk=((t&0xffff)+len(data))&0xffffffff
struct.pack_into('<I',data,co,chk)
if hashlib.sha256(data).hexdigest()!=OUT: raise SystemExit('OUT_SHA mismatch')
out.write_bytes(data)
print('HUDREC1_RUNTIME_PATCH=PASS')
'@ | Set-Content -Encoding ASCII _hudrec_patch.py
          python _hudrec_patch.py
          Move-Item payload/d3d11.hudrec1.dll payload/d3d11.dll -Force
          Copy-Item payload/d3d11.dll payload/win81_nis_dx11_x64.dll -Force
          Remove-Item _hudrec_patch.py -Force
          $out=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $mirror=(Get-FileHash payload/win81_nis_dx11_x64.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $basecopy=(Get-FileHash diag/base/SAFEPOINT11_FUSEDDETAIL1_BASE.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($out -ne 'e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'){ throw "HUDREC1 runtime hash mismatch: $out" }
          if($mirror -ne $out){ throw 'Mirror DLL mismatch' }
          if($basecopy -ne $base){ throw 'Baseline archive copy mismatch' }
      - name: Commit runtime promotion
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue .github/workflows/cleanup-branches-preserve-source.yml
          Remove-Item -Force -ErrorAction SilentlyContinue .github/workflows/cleanup-non-main-branches.yml
          Remove-Item -Force .github/workflows/promote-hudrec1-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: promote HUDREC1 runtime bytes'
          git push origin HEAD:main
