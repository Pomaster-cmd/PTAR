name: RC40 Package Script Lab

on:
  push:
    branches:
      - build/rc40-postwndproc-loader-20260913
    paths:
      - lab/borderless/rc40/package_scripts/**
      - .github/workflows/rc40-package-script-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-scripts:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact RC40 package scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fixture='lab/borderless/rc38/package_scripts/scripts_exact.zip'
          $h=(Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne 'db2d63537d4950f54e6c1079008a0a4cb819e19eae38d53162cf72bf90b4ca4f'){throw "RC38 fixture hash mismatch $h"}
          New-Item -ItemType Directory -Force -Path rc38_src,rc39_scripts,rc40_scripts | Out-Null
          Expand-Archive -LiteralPath $fixture -DestinationPath rc38_src -Force
          python lab/borderless/rc39/package_scripts/transform.py rc38_src rc39_scripts lab/borderless/rc39/package_scripts/collect_rc39.template.ps1
          if($LASTEXITCODE -ne 0){throw 'RC39 exact reconstruction failed'}
          python lab/borderless/rc40/package_scripts/transform.py rc39_scripts rc40_scripts lab/borderless/rc40/package_scripts/verify.template.ps1
          if($LASTEXITCODE -ne 0){throw 'RC40 exact reconstruction failed'}
          'RC40_PACKAGE_SCRIPT_RECONSTRUCTION=PASS' | Set-Content RC40_PACKAGE_SCRIPT_RECONSTRUCTION.txt -Encoding ASCII

      - name: Parse exact RC40 PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $names=@('install.ps1','verify.ps1','rollback.ps1','uninstall_overlay.ps1','collect_rc40.ps1')
          $out=@()
          foreach($n in $names){
            $p=Join-Path rc40_scripts $n;$tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -ne 0){$errors|ForEach-Object{Write-Host $_};throw "PARSE FAIL $n"}
            $out += "PASS PARSE $n"
          }
          $out | Set-Content RC40_PACKAGE_SCRIPT_PARSE.txt -Encoding ASCII
          Get-Content RC40_PACKAGE_SCRIPT_PARSE.txt

      - name: RC40 package script safety contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Get-Content rc40_scripts/install.ps1 -Raw
          $v=Get-Content rc40_scripts/verify.ps1 -Raw
          $r=Get-Content rc40_scripts/rollback.ps1 -Raw
          $u=Get-Content rc40_scripts/uninstall_overlay.ps1 -Raw
          $c=Get-Content rc40_scripts/collect_rc40.ps1 -Raw
          $checks=[ordered]@{
            'install RC40 runtime hash'=$i.Contains('774f88c976ed296d7496d5fce1fad9f8e1056337ee70e0111371866074e75669')
            'install RC40 sidecar hash'=$i.Contains('ce497e72837f95503f877f73239c63a692c90b8646dbf7a3bbd4ba8082083416')
            'install recognizes RC39 runtime migration'=$i.Contains('cb7202e5097b78c4965a8300a28a6004038d05bbfe1aaa25089e0a2c5f1b8abb')
            'install recognizes RC39 sidecar migration'=$i.Contains('f8654c6d20f243a4ba75cece6a2ceb7df559d9e33ecad2c1275376038826e89b')
            'install fail closed unknown DLL'=$i.Contains('DLL locale inconnue, installation refusee')
            'install fail closed unknown sidecar'=$i.Contains('Sidecar local inconnu, installation refusee')
            'verify old C2FE hook restored'=$v.Contains('0xE8,0xAD,0x70,0xFF,0xFF')
            'verify loader moved after HWND store'=$v.Contains('0xE8,0xF5,0xCC,0x4F,0x03')
            'verify loader P1U46 target'=$v.Contains('0x49,0x8D,0x83,0x60,0xC4,0x00,0x00')
            'verify 107 canonical base'=$v.Contains('BASE GITHUB 107/107 fichiers byte-identiques')
            'rollback fail closed unknown active'=$r.Contains('Fichier actif inconnu/modifie, rollback refuse')
            'rollback recognizes RC39 runtime'=$r.Contains('cb7202e5097b78c4965a8300a28a6004038d05bbfe1aaa25089e0a2c5f1b8abb')
            'rollback recognizes RC38 RC39 RC40 sidecars'=($r.Contains('d7eef6d9') -and $r.Contains('f8654c6d') -and $r.Contains('ce497e72'))
            'uninstall delegates canonical engine'=$u.Contains('& $Engine -Root $Root')
            'uninstall SHA ownership'=$u.Contains('OVERLAY_OWNERSHIP.tsv')
            'collector runs canonical collector'=$c.Contains("diag\collect.ps1")
            'collector adds sidecar log'=$c.Contains('ptar_borderless_rc38.log')
            'collector emits RC40 results'=$c.Contains('PTAR_RC40_RESULTS_')
          }
          $out=@();foreach($k in $checks.Keys){if(-not $checks[$k]){throw "CONTRACT FAIL $k"};$out += "PASS $k"}
          $out | Set-Content RC40_PACKAGE_SCRIPT_CONTRACT.txt -Encoding ASCII
          Get-Content RC40_PACKAGE_SCRIPT_CONTRACT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR_RC40_PACKAGE_SCRIPT_LAB
          path: |
            RC40_PACKAGE_SCRIPT_RECONSTRUCTION.txt
            RC40_PACKAGE_SCRIPT_PARSE.txt
            RC40_PACKAGE_SCRIPT_CONTRACT.txt
          retention-days: 7
          if-no-files-found: error
