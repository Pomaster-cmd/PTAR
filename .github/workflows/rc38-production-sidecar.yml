name: RC38 Production Sidecar Extension

on:
  push:
    branches:
      - build/rc38-borderless-authority-20260913
    paths:
      - lab/borderless/rc38/ptar_borderless_rc38.cpp
      - lab/borderless/rc38/ptar_borderless_rc38_prod.cpp
      - lab/borderless/rc38/ptar_borderless_host_test.cpp
      - lab/borderless/rc38/ptar_borderless_stable_host_test.cpp
      - .github/workflows/rc38-production-sidecar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-sidecar:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build production sidecar and both host tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\rc38\prod_out mkdir lab\borderless\rc38\prod_out
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          cl %CFLAGS% /LD lab\borderless\rc38\ptar_borderless_rc38_prod.cpp /Fe:lab\borderless\rc38\prod_out\ptar_borderless.dll user32.lib /link /SUBSYSTEM:WINDOWS,6.03
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\rc38\ptar_borderless_host_test.cpp /Fe:lab\borderless\rc38\prod_out\legacy_host_test.exe user32.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\rc38\ptar_borderless_stable_host_test.cpp /Fe:lab\borderless\rc38\prod_out\stable_host_test.exe user32.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 1
          dumpbin /exports lab\borderless\rc38\prod_out\ptar_borderless.dll > lab\borderless\rc38\prod_out\EXPORTS.txt
          dumpbin /imports lab\borderless\rc38\prod_out\ptar_borderless.dll > lab\borderless\rc38\prod_out\IMPORTS.txt
          dumpbin /headers lab\borderless\rc38\prod_out\ptar_borderless.dll > lab\borderless\rc38\prod_out\HEADERS.txt
          findstr /C:"PTAR_BorderlessAutoStart" lab\borderless\rc38\prod_out\EXPORTS.txt >nul || exit /b 31
          findstr /C:"PTAR_BorderlessAttachStable" lab\borderless\rc38\prod_out\EXPORTS.txt >nul || exit /b 32
          findstr /C:"PTAR_BorderlessAttach" lab\borderless\rc38\prod_out\EXPORTS.txt >nul || exit /b 33
          findstr /C:"PTAR_BorderlessQuery" lab\borderless\rc38\prod_out\EXPORTS.txt >nul || exit /b 34

      - name: Run legacy transition host gate
        shell: cmd
        run: |
          pushd lab\borderless\rc38\prod_out
          legacy_host_test.exe > LEGACY_HOST_TEST.txt 2>&1
          set RC=%ERRORLEVEL%
          type LEGACY_HOST_TEST.txt
          popd
          exit /b %RC%

      - name: Run stable runtime-composition host gate
        shell: cmd
        run: |
          pushd lab\borderless\rc38\prod_out
          stable_host_test.exe > STABLE_HOST_TEST.txt 2>&1
          set RC=%ERRORLEVEL%
          type STABLE_HOST_TEST.txt
          popd
          exit /b %RC%

      - name: Package production sidecar evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $o='lab/borderless/rc38/prod_out'
          $h=(Get-FileHash "$o/ptar_borderless.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $s=(Get-Item "$o/ptar_borderless.dll").Length
          "SHA256=$h`nSIZE=$s" | Set-Content "$o/PROD_SIDECAR_SHA256.txt" -Encoding ASCII
          Compress-Archive -Path "$o/ptar_borderless.dll","$o/EXPORTS.txt","$o/IMPORTS.txt","$o/HEADERS.txt","$o/LEGACY_HOST_TEST.txt","$o/STABLE_HOST_TEST.txt","$o/PROD_SIDECAR_SHA256.txt" -DestinationPath RC38_PRODUCTION_SIDECAR.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR_RC38_PRODUCTION_SIDECAR
          path: RC38_PRODUCTION_SIDECAR.zip
          if-no-files-found: error
          retention-days: 7
