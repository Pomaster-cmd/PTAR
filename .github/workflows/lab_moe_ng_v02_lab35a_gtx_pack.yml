name: LAB35A GTX960M Compare Pack

on:
  push:
    branches:
      - lab/moe-ng-v02-lab35-phase0-single-sample

permissions:
  contents: read

jobs:
  build-audit-pack:
    if: contains(github.event.head_commit.message, '[run-lab35a-gtx-pack]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile and freeze LAB31G LAB35A DXBC
        shell: pwsh
        run: |
          $root='lab_results\lab35a_gtx_pack'; $pack="$root\PTAR_LAB35A_GTX960M_COMPARE_PACK"; $sh="$pack\shaders"
          New-Item -ItemType Directory -Force $sh | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab31g.cso" /Fc "$root\lab31g.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab31g_host_inv_half_mad_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab35a.cso" /Fc "$root\lab35a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab35a_phase0_single_sample_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab_fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_k185_control_ps.cso "$sh\ptar_k185_control_ps.cso"
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_vs.cso "$sh\ptar_vs.cso"
          $expected=@{
            'lab31g.cso'='ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1'
            'lab35a.cso'='4789a5a345770af8c2881293a4e6c5501043b28d0c4d8aed8f7ab33ed218ae2c'
            'ptar_k185_control_ps.cso'='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'
            'ptar_vs.cso'='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
            'lab_fullscreen_vs.cso'='f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          }
          $lines=@()
          foreach($n in $expected.Keys){
            $p="$sh\$n"; if(-not(Test-Path $p)){throw "missing $n"}
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant(); if($got -ne $expected[$n]){throw "$n hash mismatch $got"}
            $bytes=[IO.File]::ReadAllBytes($p); if($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes,0,4) -ne 'DXBC'){throw "$n not DXBC"}
            $lines += "$got  shaders/$n"
          }
          $lines | Set-Content "$pack\HASHES.txt" -Encoding ascii

      - name: Static DXBC and dynamic-path audit
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab35a_gtx_pack'); pack=root/'PTAR_LAB35A_GTX960M_COMPARE_PACK'; pat=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b'); rows={}; streams={}
          for n in ('lab31g','lab35a'):
              ops=[]
              for raw in (root/f'{n}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'): continue
                  m=pat.match(raw)
                  if not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op)
              streams[n]=ops; c=Counter(ops)
              rows[n]={'instructions':len(ops),'bytes':(pack/'shaders'/f'{n}.cso').stat().st_size,'div':c.get('div',0),'udiv':c.get('udiv',0),'gather4':sum(v for k,v in c.items() if k.startswith('gather4')),'sample_l':sum(v for k,v in c.items() if k.startswith('sample_l')),'uav':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_'))}
          ops=streams['lab35a']; branch=next(i for i,x in enumerate(ops) if x in ('if_nz','if_z')); samples=[i for i,x in enumerate(ops) if x.startswith('sample_l')]
          dynamic=sum(i<branch for i in samples)==1 and sum(i>branch for i in samples)==3
          contract=all(v['gather4']==1 and v['sample_l']==4 and v['uav']==0 for v in rows.values())
          expected=rows['lab31g']['instructions']==53 and rows['lab31g']['bytes']==2568 and rows['lab35a']['instructions']==53 and rows['lab35a']['bytes']==2568 and rows['lab35a']['div']==0 and rows['lab35a']['udiv']==0
          r={'protocol':'LAB35A_GTX_PACK_STATIC_DYNAMIC_AUDIT','lab31g':rows['lab31g'],'lab35a':rows['lab35a'],'texture_contract_pass':contract,'expected_codegen_pass':expected,'phase_branch_index':branch,'sample_indices':samples,'phase0_samples_before_branch':sum(i<branch for i in samples),'nonzero_samples_after_branch':sum(i>branch for i in samples),'phase0_single_sample_path_pass':dynamic,'pass':bool(contract and expected and dynamic)}
          (root/'STATIC_DYNAMIC_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('static/dynamic audit failed')
          '@ | python -

      - name: Generate shared-ABI comparator
        run: python tools/lab35a_prepare_gtx_comparator.py

      - name: Audit comparator source
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          p=Path('lab_results/lab35a_gtx_pack/ptar_lab35a_compare.cpp'); s=p.read_text(encoding='utf-8')
          required=['LAB31G','LAB35A','lab31g.cso','lab35a.cso','LAB35A_COMPARE_RAW.csv','LAB35A_COMPARE_SUMMARY.json','if(variant==2)','c.inputSize[0]=1.0f/(float)kInW','c.outputSize[0]=0.5f/(float)kInW','c.inputSize[0]=(float)kInW','c.outputSize[0]=(float)kOutW','kWarmupTriads=60u','kSamples=600u']
          stale=['LAB28','lab28','LAB29','lab29','LAB32','lab32','LAB34','lab34']
          missing=[x for x in required if x not in s]; residual=[x for x in stale if x in s]
          r={'protocol':'LAB35A_COMPARATOR_SOURCE_AUDIT','missing':missing,'stale_tokens':residual,'shared_16_byte_abi':'if(variant==2)' in s and '1.0f/(float)kInW' in s and '0.5f/(float)kInW' in s,'k185_legacy_abi':'c.inputSize[0]=(float)kInW' in s and 'c.outputSize[0]=(float)kOutW' in s,'balanced_protocol':'kWarmupTriads=60u' in s and 'kSamples=600u' in s,'pass':not missing and not residual}
          Path('lab_results/lab35a_gtx_pack/COMPARATOR_SOURCE_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('comparator source audit failed')
          '@ | python -

      - name: Build Win81 x64 MT comparison host
        shell: pwsh
        run: |
          $root='lab_results\lab35a_gtx_pack'; $pack="$root\PTAR_LAB35A_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){throw 'vcvars64.bat not found'}
          $inc='runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\include'; $src="$root\ptar_lab35a_compare.cpp"
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /MT /W4 /WX /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I `"$inc`" `"$src`" /Fe:`"$pack\ptar_lab35a_gtx960m_compare.exe`" /Fo:`"$root\ptar_lab35a_compare.obj`" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib"
          cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Audit PE imports architecture and subsystem
        shell: pwsh
        run: |
          $root='lab_results\lab35a_gtx_pack'; $pack="$root\PTAR_LAB35A_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          $cmd="call `"$vcvars`" && dumpbin /dependents `"$pack\ptar_lab35a_gtx960m_compare.exe`" > `"$pack\IMPORTS.txt`" && dumpbin /headers `"$pack\ptar_lab35a_gtx960m_compare.exe`" > `"$root\HEADERS.txt`""; cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $imports=Get-Content "$pack\IMPORTS.txt" -Raw; foreach($bad in @('D3DCOMPILER','VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($imports -match [regex]::Escape($bad)){throw "forbidden import $bad"}}
          $headers=Get-Content "$root\HEADERS.txt" -Raw; if($headers -notmatch '6\.03\s+subsystem version'){throw 'subsystem is not 6.03'}; if($headers -notmatch '8664\s+machine \(x64\)'){throw 'machine is not x64'}

      - name: WARP smoke comparator path
        shell: pwsh
        run: |
          $pack=(Resolve-Path 'lab_results\lab35a_gtx_pack\PTAR_LAB35A_GTX960M_COMPARE_PACK').Path; Push-Location $pack
          try { & .\ptar_lab35a_gtx960m_compare.exe --warp-smoke | Tee-Object -FilePath WARP_SMOKE.txt; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} } finally { Pop-Location }
          $smoke=Get-Content "$pack\WARP_SMOKE.txt" -Raw; if($smoke -notmatch '\[PASS\] WARP smoke'){throw 'WARP PASS marker missing'}; if($smoke -notmatch 'LAB31G/LAB35A/K185'){throw 'WARP variant marker mismatch'}

      - name: Finalize audited hardware pack
        shell: pwsh
        run: |
          $root='lab_results\lab35a_gtx_pack'; $pack="$root\PTAR_LAB35A_GTX960M_COMPARE_PACK"
          $exeHash=(Get-FileHash "$pack\ptar_lab35a_gtx960m_compare.exe" -Algorithm SHA256).Hash.ToLowerInvariant(); Add-Content "$pack\HASHES.txt" "$exeHash  ptar_lab35a_gtx960m_compare.exe" -Encoding ascii
          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "ptar_lab35a_gtx960m_compare.exe" (echo [FAIL] Executable absent.& exit /b 10)
          echo [PTAR] LAB35A vs LAB31G vs K185 - GTX 960M - 600 triades equilibrees
          ptar_lab35a_gtx960m_compare.exe
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" echo [FAIL] Code retour %RC%
          if "%RC%"=="0" echo [PASS] Resultats dans le dossier results
          pause
          exit /b %RC%
          '@ | Set-Content "$pack\RUN_LAB35A_GTX960M_COMPARE.bat" -Encoding ascii
          @'
          PTAR LAB35A - GTX960M TARGETED HARDWARE COMPARE

          LAB31G remains the hardware-selected baseline. LAB35A is software bit-exact to LAB31G and keeps the same 16-byte inverse+half-inverse ABI and the same static 53-instruction DXBC.

          Structural change: the phase-0 path now reaches its early return after only one SampleLevel instead of two; the other three SampleLevel instructions remain after the branch. Non-zero phases retain the full reconstruction. This targets real dynamic texture work rather than static instruction count.

          Run only RUN_LAB35A_GTX960M_COMPARE.bat on Windows 8.1 + GTX 960M. The test uses 60 warmup triads and 600 measured triads over all six balanced LAB31G/LAB35A/K185 permutations. Return only the generated results folder as ZIP.

          Promotion rule: LAB35A replaces LAB31G only if paired real-GPU gain is reproducible across permutations and K185-defined P-state regimes. Neutral or negative = keep LAB31G.
          '@ | Set-Content "$pack\README_FIRST.txt" -Encoding utf8
          Copy-Item "$root\STATIC_DYNAMIC_AUDIT.json" "$pack\STATIC_DYNAMIC_AUDIT.json"
          Copy-Item "$root\COMPARATOR_SOURCE_AUDIT.json" "$pack\COMPARATOR_SOURCE_AUDIT.json"
          Copy-Item "$root\HEADERS.txt" "$pack\PE_HEADERS.txt"
          Copy-Item "$root\ptar_lab35a_compare.cpp" "$pack\COMPARATOR_SOURCE.cpp"
          @(
            'protocol=LAB35A_GTX960M_SAME_RUN_BALANCED_COMPARE',"branch=$env:GITHUB_REF_NAME","commit=$env:GITHUB_SHA",'target=Windows 8.1 x64 / D3D11 FL11_0','host_crt=/MT','subsystem=6.03','runtime_hlsl_compiler=false','dimensions=1280x720 -> 1920x1080','warmup_triads=60','measured_triads=600','order_protocol=SIX_ROTATING_PERMUTATIONS_BALANCED','lab31g_sha256=ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1','lab35a_sha256=4789a5a345770af8c2881293a4e6c5501043b28d0c4d8aed8f7ab33ed218ae2c','k185_sha256=6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16','texture_contract=1 GatherGreen + 4 SampleLevel static + 0 UAV','lab35a_phase0_dynamic_path=GatherGreen + 1 SampleLevel before early return','lab35a_full_software_gate=PASS','warp_smoke=PASS','physical_gtx960m_executed=false','main_modified=false','source_modified=false'
          ) | Set-Content "$pack\PROVENANCE.txt" -Encoding ascii
          $manifest=Get-ChildItem $pack -Recurse -File | Where-Object { $_.Name -ne 'SHA256_MANIFEST.txt' } | Sort-Object FullName | ForEach-Object { $rel=$_.FullName.Substring((Resolve-Path $pack).Path.Length+1).Replace('\','/'); $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$h  $rel" }
          $manifest | Set-Content "$pack\SHA256_MANIFEST.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptar-lab35a-gtx960m-compare-pack
          path: lab_results/lab35a_gtx_pack
