name: universal1-multigame-regression

on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '01-INSTALL_GW16.bat'
      - '02-VERIFY_INSTALL.bat'
      - '03-ARM_VISIBLE_FRAME_VERIFIER.bat'
      - '03-INSTALL_QSV_HELPER_WIN81.bat'
      - '04-COLLECT_RESULTS.bat'
      - '04-TEST_QSV_5S_MP4.bat'
      - '05-ROLLBACK_TEST.bat'
      - '06-DESINSTALLER_PTAR_COMPLET.bat'
      - 'README.md'
      - 'README_TEST.txt'
      - 'payload/**'
      - 'diag/**'
      - '_PTAR_UNINSTALL/**'
      - 'tools/installer/**'
      - '.github/workflows/universal1-multigame-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GW16I SATGAT1 payload identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $runtime='bc291f0f91013df7a28630ffef44983856fce6eb71d79aca597ab292012165e0'
          $ini='dea8a93e97d3ad1b438973822d67ca9ac12477b5774933eea135ab71776c5648'
          $ver='5eb6553059f675ba1a05f556b06f74dbd07b2fb11e1f1bc91be738057b92c0d2'
          $h=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $hm=(Get-FileHash payload/win81_nis_dx11_x64.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $hi=(Get-FileHash payload/win81_nis.ini -Algorithm SHA256).Hash.ToLowerInvariant()
          $hv=(Get-FileHash payload/win81_nis_version.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne $runtime){throw "runtime drift $h"}
          if($hm -ne $runtime){throw "mirror runtime drift $hm"}
          if($hi -ne $ini){throw "INI drift $hi"}
          if($hv -ne $ver){throw "version drift $hv"}
          Write-Host 'GW16I_SATGAT1_PAYLOAD_IDENTITY=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate inherited runtime contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tests=@(
            'diag/validate_recorder_hudrec1.py',
            'diag/validate_fg_marker_visibility.py',
            'diag/validate_universal_targeting.py',
            'diag/validate_win81_path_handoff.py',
            'diag/validate_ps4_compat.py'
          )
          foreach($t in $tests){
            Write-Host "== $t =="
            & python $t
            if($LASTEXITCODE -ne 0){ throw "$t failed with code $LASTEXITCODE" }
          }
          Write-Host 'GW16I_INHERITED_CONTRACTS=PASS'

      - name: Validate SATGAT1 production structure and documentation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ini=Get-Content payload/win81_nis.ini -Raw
          if($ini -notmatch '(?m)^Diagnostics=0\s*$'){throw 'template Diagnostics default is not 0'}
          if($ini -match '(?m)^Diagnostics=1\s*$'){throw 'template unexpectedly enables Diagnostics=1'}
          $install=Get-Content diag/install.ps1 -Raw
          if($install -notmatch [regex]::Escape("SatGat-Win64-Shipping.exe")){throw 'SatGat exact profile missing'}
          foreach($p in @(
            'diag/click_input/01-ENABLE_CLICK_DIAGNOSTICS.bat',
            'diag/click_input/02-COLLECT_AND_RESTORE_CLICK_DIAGNOSTICS.bat',
            'diag/click_input/03-RESTORE_DIAGNOSTICS_INI_ONLY.bat',
            'diag/click_input/diag/enable_diag.ps1',
            'diag/click_input/diag/collect_restore.ps1',
            'diag/click_input/diag/restore_only.ps1',
            'diag/GW16I_SLATEABS1_FIELD_FINDING.txt',
            'diag/GW16I_SATGAT1_MULTIGAME_FIELD_VALIDATION.txt'
          )){ if(-not(Test-Path $p)){throw "missing $p"} }
          $readme=Get-Content README.md -Raw
          foreach($needle in @('Frame-generation modes, recorder profiles and shortcuts','SatGat','Inquisitor','CTRL+F6','CTRL+F8','CTRL+F9')){
            if($readme -notmatch [regex]::Escape($needle)){throw "README missing $needle"}
          }
          Write-Host 'SATGAT1_PRODUCTION_STRUCTURE=PASS'

  multigame:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise exact SatGat profile, Inquisitor generic path, near-match isolation and x86 rejection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $runtime='bc291f0f91013df7a28630ffef44983856fce6eb71d79aca597ab292012165e0'
          $ps="$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $tmp=Join-Path $env:RUNNER_TEMP 'PTAR_GW16I_SATGAT1_MULTI'
          if(Test-Path $tmp){Remove-Item $tmp -Recurse -Force}
          New-Item -ItemType Directory -Path $tmp | Out-Null

          function Invoke-Install([string]$exe,[switch]$ViaEnv){
            if($ViaEnv){
              $env:PTAR_GAME_EXE=$exe
              & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1
              $rc=$LASTEXITCODE
              Remove-Item Env:PTAR_GAME_EXE -ErrorAction SilentlyContinue
            }else{
              & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1 -GameExe $exe
              $rc=$LASTEXITCODE
            }
            if($rc -ne 0){throw "install failed for $exe rc=$rc"}
          }

          function Assert-Installed([string]$dir,[string]$name,[int]$diagnostics){
            $dll=Join-Path $dir 'd3d11.dll'
            $ini=Join-Path $dir 'win81_nis.ini'
            if(-not(Test-Path $dll)){throw "d3d11.dll absent in $dir"}
            if(-not(Test-Path $ini)){throw "win81_nis.ini absent in $dir"}
            $h=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h -ne $runtime){throw "runtime hash drift $h"}
            $lines=Get-Content $ini
            if($lines -notcontains ("TargetExe="+$name)){throw "TargetExe mismatch, expected $name"}
            if($lines -notcontains ("Diagnostics="+$diagnostics)){throw "Diagnostics mismatch for $name expected $diagnostics"}
            & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\verify.ps1
            if($LASTEXITCODE -ne 0){throw "verify failed for $name rc=$LASTEXITCODE"}
          }

          function Invoke-Rollback([string]$dir,[string]$exe){
            & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\rollback_test.ps1
            if($LASTEXITCODE -ne 0){throw "rollback failed rc=$LASTEXITCODE"}
            if(-not(Test-Path $exe)){throw 'target exe removed by rollback'}
            foreach($n in @('d3d11.dll','win81_nis_dx11_x64.dll','win81_nis.ini','win81_nis_version.txt')){
              if(Test-Path (Join-Path $dir $n)){throw "$n remained in fresh target after rollback"}
            }
          }

          function Run-Case([string]$folder,[string]$name,[int]$diagnostics,[switch]$ViaEnv){
            $d=Join-Path $tmp $folder
            New-Item -ItemType Directory -Path $d | Out-Null
            $e=Join-Path $d $name
            Copy-Item "$env:SystemRoot\System32\notepad.exe" $e
            Invoke-Install $e -ViaEnv:$ViaEnv
            Assert-Installed $d $name $diagnostics
            Invoke-Rollback $d $e
          }

          Run-Case 'SatGat' 'SatGat-Win64-Shipping.exe' 1
          Run-Case 'Inquisitor' 'Warhammer.exe' 0
          Run-Case 'NearMatch' 'SatGat-Test-Win64-Shipping.exe' 0
          Run-Case 'Generic' 'TotallyDifferentGame.exe' 0 -ViaEnv

          $c=Join-Path $tmp 'Game_32'
          New-Item -ItemType Directory -Path $c | Out-Null
          $cExe=Join-Path $c 'Legacy32.exe'
          Copy-Item "$env:SystemRoot\SysWOW64\notepad.exe" $cExe
          & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1 -GameExe $cExe
          $x86rc=$LASTEXITCODE
          if($x86rc -eq 0){throw 'x86 executable was incorrectly accepted'}
          if(Test-Path (Join-Path $c 'd3d11.dll')){throw 'runtime copied despite x86 rejection'}

          $global:LASTEXITCODE=0
          Write-Host 'GW16I_SATGAT1_MULTIGAME_WINDOWS=PASS'
