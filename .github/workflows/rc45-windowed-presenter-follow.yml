name: RC45 Windowed Presenter Follow Lab

on:
  push:
    branches: [build/rc45-windowed-presenter-follow-20260914]
    paths:
      - lab/borderless/rc45/**
      - .github/workflows/rc45-windowed-presenter-follow.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rc45-presenter:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static RC45 architecture contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $s=Get-Content 'lab/borderless/rc45/ptar_borderless_rc45_prod.cpp' -Raw
          $h=Get-Content 'lab/borderless/rc45/ptar_borderless_rc45_windowed_presenter_host.cpp' -Raw
          $checks=[ordered]@{
            'windowed presenter remains visible'=$s.Contains('SWP_SHOWWINDOW')
            'windowed presenter follows client rect'=($s.Contains('ClientToScreen(g_game') -and $s.Contains('rc45_follow_windowed_presenter'))
            'borderless path reuses validated geometry'=$s.Contains('enforce_geometry()')
            'input mapping stays active both modes'=$s.Contains('InterlockedExchange(&g_active,1)')
            'WindowStyle registry authority read'=($s.Contains('Warhammer Martyr') -and $s.Contains('WindowStyle'))
            'pre-hook borderless startup covered'=$h.Contains('pref_initial_borderless=PASS')
            'preference-only windowed transition covered'=$h.Contains('pref_only_windowed=PASS')
            'windowed move follow covered'=$h.Contains('move_follow=PASS')
            'windowed resize follow covered'=$h.Contains('resize_follow=PASS')
            'minimize restore covered'=$h.Contains('minimize_restore=PASS')
            '500 coexistence cycles'=$h.Contains('kCycles=500')
            'presenter never intentionally hidden for live windowed mode'=(-not $s.Contains('RC45_MODE=WINDOWED borderless authority passive'))
          }
          foreach($k in $checks.Keys){if(-not $checks[$k]){throw "RC45 CONTRACT FAIL: $k"};Write-Host "PASS $k"}
          git diff --quiet 0f69490bb2210e96e94213643c382bdf89dfee10 HEAD -- lab/raster
          if($LASTEXITCODE -ne 0){throw 'RC42 raster scope changed unexpectedly'}
          Write-Host 'PASS RC42 raster tree unchanged from validated base'
          'RC45_STATIC_CONTRACT=13/13 PASS' | Set-Content RC45_STATIC_CONTRACT.txt -Encoding ASCII

      - name: Build reproducible RC45 carrier and presenter host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\rc45\out mkdir lab\borderless\rc45\out
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          cl %CFLAGS% /LD lab\borderless\rc45\ptar_borderless_rc45_prod.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fe:lab\borderless\rc45\out\ptar_borderless.dll user32.lib advapi32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 11
          copy /y lab\borderless\rc45\out\ptar_borderless.dll lab\borderless\rc45\out\ptar_borderless_first.dll >nul
          cl %CFLAGS% lab\borderless\rc45\ptar_borderless_rc45_windowed_presenter_host.cpp /Fe:lab\borderless\rc45\out\windowed_presenter_host.exe user32.lib advapi32.lib /link /SUBSYSTEM:CONSOLE,6.03 || exit /b 12
          dumpbin /exports lab\borderless\rc45\out\ptar_borderless.dll > lab\borderless\rc45\out\EXPORTS.txt
          dumpbin /imports lab\borderless\rc45\out\ptar_borderless.dll > lab\borderless\rc45\out\IMPORTS.txt
          dumpbin /headers lab\borderless\rc45\out\ptar_borderless.dll > lab\borderless\rc45\out\HEADERS.txt
          findstr /C:"PTAR_BorderlessAutoStart" lab\borderless\rc45\out\EXPORTS.txt >nul || exit /b 13
          findstr /C:"PTAR_BorderlessAttachStable" lab\borderless\rc45\out\EXPORTS.txt >nul || exit /b 14
          findstr /C:"PTAR_BorderlessQueryMode" lab\borderless\rc45\out\EXPORTS.txt >nul || exit /b 15

      - name: Run exact windowed presenter coexistence gate
        shell: cmd
        run: |
          pushd lab\borderless\rc45\out
          windowed_presenter_host.exe > WINDOWED_PRESENTER_HOST.txt 2>&1
          if errorlevel 1 (type WINDOWED_PRESENTER_HOST.txt & popd & exit /b 21)
          type WINDOWED_PRESENTER_HOST.txt
          findstr /C:"RC45_WINDOWED_PRESENTER_HOST=PASS" WINDOWED_PRESENTER_HOST.txt >nul || (popd & exit /b 22)
          findstr /C:"pref_initial_borderless=PASS" WINDOWED_PRESENTER_HOST.txt >nul || (popd & exit /b 23)
          findstr /C:"presenter_visible_windowed=PASS" WINDOWED_PRESENTER_HOST.txt >nul || (popd & exit /b 24)
          findstr /C:"borderless_reentry=PASS" WINDOWED_PRESENTER_HOST.txt >nul || (popd & exit /b 25)
          popd

      - name: Verify RC45 same-target reproducibility
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          del /q lab\borderless\rc45\out\ptar_borderless.dll
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /LD lab\borderless\rc45\ptar_borderless_rc45_prod.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fe:lab\borderless\rc45\out\ptar_borderless.dll user32.lib advapi32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 31
          fc /b lab\borderless\rc45\out\ptar_borderless_first.dll lab\borderless\rc45\out\ptar_borderless.dll >nul || exit /b 32
          echo RC45_SAME_TARGET_REPRODUCIBILITY=PASS

      - name: Build inherited borderless stress gates
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\rc45\gates mkdir lab\borderless\rc45\gates
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\borderless
          set LFLAGS=/link /SUBSYSTEM:CONSOLE,6.03
          cl %CFLAGS% lab\borderless\ptar_borderless_geometry_stress.cpp /Fe:lab\borderless\rc45\gates\geometry_stress.exe user32.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_input_stress.cpp /Fe:lab\borderless\rc45\gates\input_stress.exe user32.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_event_parity.cpp /Fe:lab\borderless\rc45\gates\event_parity.exe user32.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_user32_virtualization.cpp /Fe:lab\borderless\rc45\gates\user32_virtualization.exe user32.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_thread_affinity.cpp /Fe:lab\borderless\rc45\gates\thread_affinity.exe user32.lib d3d11.lib dxgi.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_dpi_policy.cpp /Fe:lab\borderless\rc45\gates\dpi_policy.exe user32.lib gdi32.lib shcore.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_lifecycle_stress.cpp /Fe:lab\borderless\rc45\gates\lifecycle_stress.exe user32.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_window_stress.cpp /Fe:lab\borderless\rc45\gates\window_stress.exe user32.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_takeover_harness.cpp /Fe:lab\borderless\rc45\gates\takeover_harness.exe user32.lib gdi32.lib d3d11.lib dxgi.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_warp_stress.cpp /Fe:lab\borderless\rc45\gates\warp_stress.exe user32.lib d3d11.lib dxgi.lib %LFLAGS% || exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_occlusion_focus_stress.cpp /Fe:lab\borderless\rc45\gates\occlusion_focus_stress.exe user32.lib d3d11.lib dxgi.lib %LFLAGS% || exit /b 1

      - name: Run inherited borderless stress gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tests=@('geometry_stress','input_stress','event_parity','user32_virtualization','thread_affinity','dpi_policy','lifecycle_stress','window_stress','takeover_harness','warp_stress','occlusion_focus_stress')
          $summary=@()
          foreach($n in $tests){$exe="lab/borderless/rc45/gates/$n.exe";$log="lab/borderless/rc45/gates/$($n.ToUpper()).txt";& $exe *> $log;$rc=$LASTEXITCODE;Get-Content $log;$summary += "$n RC=$rc";if($rc -ne 0){throw "$n failed RC=$rc"}}
          $summary += 'RC45_INHERITED_BORDERLESS_GATES=11/11 PASS';$summary | Set-Content 'lab/borderless/rc45/gates/GATES_SUMMARY.txt' -Encoding ASCII

      - name: Rebuild and run unchanged RC42 production host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\rc45\rc42gate mkdir lab\borderless\rc45\rc42gate
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\raster\rc41
          cl %CFLAGS% /LD lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc41\ptar_rc41_context_hooks.cpp lab\raster\rc41\ptar_rc41_resource_bridge.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_swapchain_hooks.cpp lab\raster\rc41\ptar_rc41_prod.cpp /Fe:lab\borderless\rc45\rc42gate\ptar_rc41.dll user32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 41
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_prod_host.cpp /Fe:lab\borderless\rc45\rc42gate\prod_host.exe user32.lib d3d11.lib dxgi.lib /link /SUBSYSTEM:CONSOLE,6.03 || exit /b 42
          pushd lab\borderless\rc45\rc42gate
          prod_host.exe > RC42_PROD_HOST.txt 2>&1
          if errorlevel 1 (type RC42_PROD_HOST.txt & popd & exit /b 43)
          type RC42_PROD_HOST.txt
          findstr /C:"RC41_PROD_HOST=PASS" RC42_PROD_HOST.txt >nul || (popd & exit /b 44)
          popd

      - name: Package RC45 evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $o='lab/borderless/rc45/out';$hash=(Get-FileHash "$o/ptar_borderless.dll" -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item "$o/ptar_borderless.dll").Length
          @(
            'RC45_WINDOWED_PRESENTER_FOLLOW=PASS',
            'STATIC_CONTRACT=13/13 PASS',
            'INITIAL_BORDERLESS_FROM_WINDOWSTYLE=PASS',
            'WINDOWED_PRESENTER_VISIBLE=PASS',
            'WINDOWED_PRESENTER_FOLLOWS_CLIENT=PASS',
            'WINDOWED_MOVE_RESIZE=PASS',
            'WINDOWED_MINIMIZE_RESTORE=PASS',
            'BORDERLESS_REENTRY=PASS',
            'TRANSITION_STRESS=500 CYCLES PASS',
            'INHERITED_BORDERLESS_GATES=11/11 PASS',
            'RC42_RASTER_TREE_UNCHANGED=PASS',
            'RC42_PRODUCTION_HOST=PASS',
            'SAME_TARGET_REPRODUCIBILITY=PASS',
            "RC45_CARRIER_SHA256=$hash",
            "RC45_CARRIER_SIZE=$size"
          ) | Set-Content "$o/RC45_SUMMARY.txt" -Encoding ASCII
          Get-Content "$o/RC45_SUMMARY.txt"
          Compress-Archive -Path RC45_STATIC_CONTRACT.txt,"$o/*.txt","$o/ptar_borderless.dll","lab/borderless/rc45/gates/*.txt","lab/borderless/rc45/rc42gate/RC42_PROD_HOST.txt" -DestinationPath RC45_WINDOWED_PRESENTER_FOLLOW_EVIDENCE.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR_RC45_WINDOWED_PRESENTER_FOLLOW
          path: RC45_WINDOWED_PRESENTER_FOLLOW_EVIDENCE.zip
          if-no-files-found: error
          retention-days: 7
