name: promote-universal1-final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-universal1-final.yml'

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build pristine fixed UNIVERSAL1 package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $b64=((1..4 | ForEach-Object { Get-Content -LiteralPath (".github/universal1_payload/part$_.b64") -Raw }) -join '').Trim()
          $archive=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1_DELTA.tar.xz'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($b64))
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6b1ad9026a9817b0b6599fb4ca6e4836afb699b778440ed403e77e1144509ee8'){throw 'delta hash mismatch'}
          python -c "import tarfile; t=tarfile.open(r'$archive','r:xz'); t.extractall('.'); t.close()"
          @'
          from pathlib import Path
          import hashlib, shutil, sys
          repo=Path('.').resolve(); cand=Path(sys.argv[1]).resolve()
          if cand.exists(): shutil.rmtree(cand)
          cand.mkdir(parents=True)
          vp=repo/'diag/verify.ps1'; s=vp.read_text(encoding='utf-8')
          old="foreach($k in @('TargetExe='+$targetName,'Enabled=1','UniversalSpatialPresenter=1','PresenterExclusive=0','Overlay=1','FrameGeneration=0','FrameGenerationPresentSync=1','FrameGenerationTargetFPS=60')){"
          new="foreach($k in @((('TargetExe=' + $targetName)),'Enabled=1','UniversalSpatialPresenter=1','PresenterExclusive=0','Overlay=1','FrameGeneration=0','FrameGenerationPresentSync=1','FrameGenerationTargetFPS=60')){"
          if old not in s: raise SystemExit('verify fix anchor missing')
          vp.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          wf=repo/'.github/workflows/universal1-multigame-regression.yml'; w=wf.read_text(encoding='utf-8')
          w=w.replace("            'diag/validate_gw16_hudrec1_package.py'\n",'')
          w=w.replace("          Write-Host 'UNIVERSAL1_MULTIGAME_WINDOWS=PASS'", "          $global:LASTEXITCODE=0\n          Write-Host 'UNIVERSAL1_MULTIGAME_WINDOWS=PASS'")
          wf.write_text(w,encoding='utf-8',newline='\n')
          own=repo/'_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv'; lines=own.read_text(encoding='utf-8').splitlines()
          if not lines or lines[0] != 'PTAR_STATIC_OWNERSHIP_SCHEMA\t3': raise SystemExit('ownership schema missing')
          paths=[]
          for line in lines[1:]:
              if line.strip(): paths.append(line.split('|')[1])
          for rel in paths:
              src=repo/rel
              if not src.is_file(): raise SystemExit('missing '+rel)
              dst=cand/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          dst=cand/'_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv'; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(own,dst)
          pwf=cand/'.github/workflows/universal1-multigame-regression.yml'; pwf.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(wf,pwf)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def eligible():
              out=[]
              for q in cand.rglob('*'):
                  if not q.is_file(): continue
                  rel=q.relative_to(cand).as_posix()
                  if rel.startswith('_PTAR_UNINSTALL/state/') or rel.startswith('diag/backups/') or rel.startswith('.github/'): continue
                  out.append(rel)
              return sorted(out)
          files=eligible(); sums=cand/'diag/SHA256SUMS.txt'; own2=cand/'_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv'
          sexp=[r for r in files if r not in {'diag/SHA256SUMS.txt','_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv'}]
          sums.write_text(''.join(f'{sha(cand/r)}  {r}\n' for r in sexp),encoding='utf-8',newline='\n')
          files=eligible(); oexp=[r for r in files if r!='_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv']
          rows=['PTAR_STATIC_OWNERSHIP_SCHEMA\t3\n']
          for i,r in enumerate(oexp,82600001): rows.append(f'{i:08d}|{r}|{sha(cand/r)}\n')
          own2.write_text(''.join(rows),encoding='utf-8',newline='\n')
          print('PRISTINE',len(files),'SUMS',len(sexp),'OWNERS',len(oexp),'VERIFY',sha(cand/'diag/verify.ps1'))
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'build_u1_final.py') -Encoding UTF8
          $cand=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1_PRISTINE'
          python (Join-Path $env:RUNNER_TEMP 'build_u1_final.py') $cand
          if($LASTEXITCODE -ne 0){throw 'pristine build failed'}
          if((Get-FileHash (Join-Path $cand 'payload/d3d11.dll') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'){throw 'runtime drift'}

      - name: Validate pristine package 119 gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cand=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1_PRISTINE'
          Push-Location $cand
          try{& python .\diag\validate_gw16_hudrec1_package.py;if($LASTEXITCODE -ne 0){throw "package gate rc=$LASTEXITCODE"}}finally{Pop-Location}
          Write-Host 'UNIVERSAL1_PRISTINE_119_119=PASS'

      - name: Validate two unrelated x64 games and x86 refusal
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cand=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1_PRISTINE';$test=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1_TESTCOPY'
          if(Test-Path $test){Remove-Item $test -Recurse -Force};Copy-Item -LiteralPath $cand -Destination $test -Recurse
          $ps="$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe";$tmp=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1_MULTI'
          if(Test-Path $tmp){Remove-Item $tmp -Recurse -Force};New-Item -ItemType Directory -Path $tmp|Out-Null
          Push-Location $test
          try{
            function Install([string]$exe,[bool]$envMode){if($envMode){$env:PTAR_GAME_EXE=$exe;& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1;$rc=$LASTEXITCODE;Remove-Item Env:PTAR_GAME_EXE -ErrorAction SilentlyContinue}else{& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1 -GameExe $exe;$rc=$LASTEXITCODE};if($rc -ne 0){throw "install failed $exe rc=$rc"}}
            function Check([string]$dir,[string]$name){$dll=Join-Path $dir 'd3d11.dll';$ini=Join-Path $dir 'win81_nis.ini';if((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'){throw 'installed runtime drift'};if((Get-Content $ini) -notcontains ("TargetExe="+$name)){throw "TargetExe mismatch $name"};& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\verify.ps1;if($LASTEXITCODE -ne 0){throw "verify failed $name rc=$LASTEXITCODE"}}
            function Rollback([string]$dir,[string]$exe){& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\rollback_test.ps1;if($LASTEXITCODE -ne 0){throw "rollback failed rc=$LASTEXITCODE"};if(-not(Test-Path $exe)){throw 'target exe removed'};foreach($n in @('d3d11.dll','win81_nis_dx11_x64.dll','win81_nis.ini','win81_nis_version.txt')){if(Test-Path (Join-Path $dir $n)){throw "$n remained after rollback"}}}
            $a=Join-Path $tmp 'A';New-Item -ItemType Directory $a|Out-Null;$ae=Join-Path $a 'StarGazer.exe';Copy-Item "$env:SystemRoot\System32\notepad.exe" $ae;Install $ae $false;Check $a 'StarGazer.exe';Rollback $a $ae
            $b=Join-Path $tmp 'B';New-Item -ItemType Directory $b|Out-Null;$be=Join-Path $b 'TotallyDifferentGame.exe';Copy-Item "$env:SystemRoot\System32\notepad.exe" $be;Install $be $true;Check $b 'TotallyDifferentGame.exe';Rollback $b $be
            $c=Join-Path $tmp 'C';New-Item -ItemType Directory $c|Out-Null;$ce=Join-Path $c 'Legacy32Game.exe';Copy-Item "$env:SystemRoot\SysWOW64\notepad.exe" $ce;& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1 -GameExe $ce;$x86rc=$LASTEXITCODE;if($x86rc -eq 0){throw 'x86 executable incorrectly accepted'};if(Test-Path (Join-Path $c 'd3d11.dll')){throw 'runtime copied after x86 rejection'}
          }finally{Pop-Location}
          $global:LASTEXITCODE=0
          Write-Host 'UNIVERSAL1_MULTIGAME_WINDOWS=PASS'

      - name: Promote only after all gates pass
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cand=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1_PRISTINE';robocopy $cand . /E /NFL /NDL /NJH /NJS /NP|Out-Null;if($LASTEXITCODE -ge 8){throw "robocopy rc=$LASTEXITCODE"}
          Remove-Item -Recurse -Force .github/universal1_payload
          foreach($f in @('.github/workflows/promote-universal1-transactional.yml','.github/workflows/promote-universal1-transactional-v3.yml','.github/workflows/promote-universal1-transactional-v4.yml','.github/workflows/promote-universal1-final.yml','.github/workflows/finalize-hudrec1-main.yml')){Remove-Item -Force -ErrorAction SilentlyContinue $f}
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add -A;git commit -m 'release: promote HUDREC1 UNIVERSAL1 game-agnostic targeting';git push origin HEAD:main
