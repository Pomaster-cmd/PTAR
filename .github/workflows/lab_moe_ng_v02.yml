name: LAB PTAR-NG MoE v02 Native Detail

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-hermite-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Sweep LAB05 shape-preserving Hermite experts with A+B training / C holdout
        run: >-
          python tools/lab_moe_ng_v02_hermite_sweep.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_hermite
      - uses: actions/upload-artifact@v4
        with:
          name: moe-ng-v02-hermite-sweep
          path: lab_results/moe_ng_v02_hermite

  fxc-sm5-current:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
                 Sort-Object FullName -Descending |
                 Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found on windows-latest' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT
      - name: Compile current v02 PS 5.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lab_results\moe_ng_v02_compare | Out-Null
          & '${{ steps.fxc.outputs.path }}' /nologo /T ps_5_0 /E main /O3 /WX /Fo lab_results\moe_ng_v02_compare\v02.cso /Fc lab_results\moe_ng_v02_compare\v02.asm src\hlsl\moe_ng_v02\ptar_moe_ng_v02_native_detail_ps.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: moe-ng-v02-fxc-current
          path: lab_results/moe_ng_v02_compare
