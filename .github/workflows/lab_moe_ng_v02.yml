name: LAB PTAR-NG MoE v02 Native Detail

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-hermite-sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Sweep LAB05 shape-preserving Hermite experts with A+B training / C holdout
        run: >-
          python tools/lab_moe_ng_v02_hermite_sweep.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_hermite
      - uses: actions/upload-artifact@v4
        with:
          name: moe-ng-v02-hermite-sweep
          path: lab_results/moe_ng_v02_hermite

  cpu-native-band-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Audit LAB05 native-band, luma and bounded-output behavior
        run: >-
          python tools/lab_moe_ng_v02_perceptual_gate.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_native_band
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab05-native-band
          path: lab_results/moe_ng_v02_native_band

  cpu-mc-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parity dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Verify LAB05 MC CPU/HLSL float32 algebra and corpus parity
        run: >-
          python tools/lab_moe_ng_v02_mc_parity.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_mc_parity
      - uses: actions/upload-artifact@v4
        with:
          name: moe-ng-v02-mc-parity
          path: lab_results/moe_ng_v02_mc_parity

  fxc-sm5-compare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
                 Sort-Object FullName -Descending |
                 Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found on windows-latest' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT
      - name: Compile MoE v01 and LAB05-MC PS 5.0
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_compare'
          New-Item -ItemType Directory -Force $out | Out-Null
          & '${{ steps.fxc.outputs.path }}' /nologo /T ps_5_0 /E main /O3 /WX /Fo "$out\v01.cso" /Fc "$out\v01.asm" src\hlsl\moe_ng_v01\ptar_moe_ng_v01_sf5_ps.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '${{ steps.fxc.outputs.path }}' /nologo /T ps_5_0 /E main /O3 /WX /Fo "$out\lab05_mc.cso" /Fc "$out\lab05_mc.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_mc_native_detail_ps.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit compiled texture footprint and instruction proxy
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_compare'
          function Audit([string]$name) {
            $p="$out\$name.asm"
            $txt=Get-Content $p -Raw
            $g=([regex]::Matches($txt,'(?mi)^\s*gather4\w*\b')).Count
            # FXC /O3 folds SampleLevel(...,0) into sample_indexable on this runner.
            $s=([regex]::Matches($txt,'(?mi)^\s*sample\w*\b')).Count
            $u=([regex]::Matches($txt,'(?mi)^\s*dcl_uav\w*\b')).Count
            $inst=([regex]::Matches($txt,'(?mi)^\s*(?!dcl_|def\b|ret\b|if\b|else\b|endif\b|loop\b|endloop\b|break\b)([a-z][a-z0-9_]*)\s')).Count
            $bytes=(Get-Item "$out\$name.cso").Length
            [pscustomobject]@{shader=$name;gather4=$g;sample_ops=$s;uav_decl=$u;instruction_proxy=$inst;cso_bytes=$bytes}
          }
          $rows=@(Audit 'v01'; Audit 'lab05_mc')
          $rows | Format-Table -AutoSize | Out-String | Tee-Object -FilePath "$out\AUDIT.txt"
          $rows | Export-Csv -NoTypeInformation "$out\AUDIT.csv"
          $lab=$rows | Where-Object shader -eq 'lab05_mc'
          if ($lab.gather4 -ne 1) { throw "LAB05 gather4 footprint changed: $($lab.gather4)" }
          if ($lab.sample_ops -ne 4) { throw "LAB05 sample footprint changed: $($lab.sample_ops)" }
          if ($lab.uav_decl -ne 0) { throw "LAB05 unexpectedly declares UAVs: $($lab.uav_decl)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab05-fxc-compare
          path: lab_results/moe_ng_v02_compare

  warp-runtime-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime validator dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Locate FXC
        id: warp_fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
                 Sort-Object FullName -Descending |
                 Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found on windows-latest' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT
      - name: Compile LAB05 PS and full-screen VS
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_warp'
          New-Item -ItemType Directory -Force $out | Out-Null
          & '${{ steps.warp_fxc.outputs.path }}' /nologo /T ps_5_0 /E main /O3 /WX /Fo "$out\lab05_mc.cso" /Fc "$out\lab05_mc.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_mc_native_detail_ps.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '${{ steps.warp_fxc.outputs.path }}' /nologo /T vs_5_0 /E main /O3 /WX /Fo "$out\fullscreen_vs.cso" /Fc "$out\fullscreen_vs.asm" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build D3D11 WARP harness
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_warp'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $vcvars = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'vcvars64.bat not found' }
          $cmd = "call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 tools\lab_moe_ng_v02_warp_harness.cpp /Fe:$out\warp_harness.exe d3d11.lib dxgi.lib"
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate independent CPU reference
        shell: pwsh
        run: >-
          python tools/lab_moe_ng_v02_warp_validate.py
          --outdir lab_results/moe_ng_v02_warp
          --prepare
      - name: Execute LAB05 DXBC on D3D11 WARP
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_warp'
          & "$out\warp_harness.exe" "$out\input.f32" 24 24 36 36 "$out\lab05_mc.cso" "$out\fullscreen_vs.cso" "$out\gpu_output.f32" *> "$out\WARP_RUNTIME.txt"
          $rc=$LASTEXITCODE
          Get-Content "$out\WARP_RUNTIME.txt"
          if ($rc -ne 0) { exit $rc }
      - name: Compare WARP readback against CPU reference
        shell: pwsh
        run: >-
          python tools/lab_moe_ng_v02_warp_validate.py
          --outdir lab_results/moe_ng_v02_warp
          --gpu lab_results/moe_ng_v02_warp/gpu_output.f32
          --tol 0.00005
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab05-warp-runtime
          path: lab_results/moe_ng_v02_warp
