name: RC56 P1U46 Synthetic X15 Integration

on:
  push:
    branches: [lab/rc56-presenter-only-borderless-20260915]
    paths:
      - 'lab/borderless/rc56/**'
      - '.github/workflows/rc56-p1u46-synthetic-x15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-x15:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate production and lab-only synthetic RC56
        shell: cmd
        run: |
          python lab\borderless\rc56\build_rc56_presenter_only.py lab\borderless\rc56\generated || exit /b 10
          python lab\borderless\rc56\build_rc56_synthetic_geometry_lab.py lab\borderless\rc56\generated lab\borderless\rc56\synthetic || exit /b 11
          findstr /C:"RC56_SYNTHETIC_MONITOR_OVERRIDE" lab\borderless\rc56\synthetic\ptar_borderless_rc46_presenter_only.cpp >nul || exit /b 12
          findstr /C:"RC56_SYNTHETIC_MONITOR_OVERRIDE" lab\borderless\rc56\generated\ptar_borderless_rc46_presenter_only.cpp >nul && exit /b 13 || ver >nul
          findstr /C:"RC56_BORDERLESS_POLICY=PRESENTER_ONLY_GAME_UNTOUCHED" lab\borderless\rc56\generated\ptar_borderless_rc45_presenter_only.cpp >nul || exit /b 14
          git diff --quiet 4855c75bd9ae8e613ca0f94c2c3a7ea4eb5950ae HEAD -- lab/raster || exit /b 15
          echo RC56_SYNTH_SCOPE=PASS production_untouched=1 raster_unchanged=1

      - name: Prove RC51 presenter-sync inheritance exact
        shell: cmd
        run: |
          python lab\borderless\rc56\check_rc51_inheritance.py lab\borderless\rc56\generated\ptar_borderless_rc56_prod.cpp || exit /b 16

      - name: Reconstruct exact P1U46 and fixed 1920x1080 1280x720 INI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o='lab/borderless/rc56/x15';New-Item -ItemType Directory -Force $o|Out-Null
          $base=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant();if($base -ne '864c0ca8f24f22f6a3cd4c21a0e213f431f5268e69b04e3860c52fe72600fc3c'){throw "base drift $base"}
          python lab/borderless/rc48/rebuild_exact_field_runtime.py payload/d3d11.dll "$o/d3d11.dll";if($LASTEXITCODE -ne 0){throw 'runtime reconstruction'}
          $runtime=(Get-FileHash "$o/d3d11.dll" -Algorithm SHA256).Hash.ToLowerInvariant();if($runtime -ne '6f1686992bef971c9995df9f0cb91b93c6946988e12a837e5de956df37c9082b'){throw "runtime drift $runtime"}
          Copy-Item "$o/d3d11.dll" "$o/win81_nis_dx11_x64.dll" -Force
          $ini=Get-Content payload/win81_nis.ini -Raw
          $ini=[regex]::Replace($ini,'(?m)^OutputWidth=.*$','OutputWidth=1920');$ini=[regex]::Replace($ini,'(?m)^OutputHeight=.*$','OutputHeight=1080');$ini=[regex]::Replace($ini,'(?m)^RenderWidth=.*$','RenderWidth=1280');$ini=[regex]::Replace($ini,'(?m)^RenderHeight=.*$','RenderHeight=720')
          Set-Content "$o/win81_nis.ini" $ini -Encoding ASCII
          python lab/raster/rc52/build_rc52_context_hooks.py lab/raster/rc56_x15_rc52.cpp;if($LASTEXITCODE -ne 0){throw 'rc52 gen'}
          python lab/raster/rc55/build_rc55_context_hooks.py lab/raster/rc56_x15_rc52.cpp lab/raster/rc56_x15_rc55.cpp;if($LASTEXITCODE -ne 0){throw 'rc55 gen'}
          @('P1U46_SHA256='+$runtime,'SYNTH_OUTPUT=1920x1080','SYNTH_RENDER=1280x720','EXACT_SCALE=1.5')|Set-Content 'lab/borderless/rc56/RC56_X15_GEOMETRY.txt' -Encoding ASCII

      - name: Build production carrier synthetic carrier exact RC55 and controller host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 20
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          mkdir lab\borderless\rc56\x15\prod 2>nul
          mkdir lab\borderless\rc56\x15\synth 2>nul
          cl %CFLAGS% /LD lab\borderless\rc56\generated\ptar_borderless_rc56_prod.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fo:lab\borderless\rc56\x15\prod\ /Fe:lab\borderless\rc56\x15\prod\ptar_borderless.dll user32.lib advapi32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 21
          cl %CFLAGS% /LD lab\borderless\rc56\synthetic\ptar_borderless_rc56_prod.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fo:lab\borderless\rc56\x15\synth\ /Fe:lab\borderless\rc56\x15\synth\ptar_borderless.dll user32.lib advapi32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 22
          set RCFLAGS=%CFLAGS% /I lab\raster\rc41
          cl %RCFLAGS% /LD lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc56_x15_rc55.cpp lab\raster\rc41\ptar_rc41_resource_bridge.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_swapchain_hooks.cpp lab\raster\rc41\ptar_rc41_prod.cpp /Fo:lab\borderless\rc56\x15\ /Fe:lab\borderless\rc56\x15\ptar_rc41.dll user32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 23
          cl %CFLAGS% lab\borderless\rc56\ptar_rc56_controller_integration_host.cpp /Fo:lab\borderless\rc56\x15\ /Fe:lab\borderless\rc56\x15\Warhammer.exe user32.lib advapi32.lib gdi32.lib d3d11.lib dxgi.lib /link /SUBSYSTEM:WINDOWS,6.03 || exit /b 24
          copy /y lab\borderless\rc56\x15\synth\ptar_borderless.dll lab\borderless\rc56\x15\ptar_borderless.dll >nul

      - name: Hash gates production identity and exact RC55
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$prod=(Get-FileHash 'lab/borderless/rc56/x15/prod/ptar_borderless.dll' -Algorithm SHA256).Hash.ToLowerInvariant();$synth=(Get-FileHash 'lab/borderless/rc56/x15/synth/ptar_borderless.dll' -Algorithm SHA256).Hash.ToLowerInvariant();$raster=(Get-FileHash 'lab/borderless/rc56/x15/ptar_rc41.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($prod -ne 'aeee0a4ee9eafb2a7fc46373024db63b9ac4a63932b2455bd47b2db09d56c616'){throw "production RC56 drift $prod"};if($synth -eq $prod){throw 'synthetic carrier unexpectedly identical'};if($raster -ne '271187ab9fd82b6829c52a667223f241ec79e98fa340b13c9a72270142156949'){throw "RC55 drift $raster"}
          @("RC56_PRODUCTION=$prod","RC56_SYNTHETIC=$synth","RC55_RASTER=$raster",'PRODUCTION_HASH_STABLE=PASS','RC55_HASH_STABLE=PASS')|Set-Content 'lab/borderless/rc56/RC56_X15_COMPONENTS.txt' -Encoding ASCII;Get-Content 'lab/borderless/rc56/RC56_X15_COMPONENTS.txt'

      - name: Exact-runtime presenter-only controller 80-cycle stress
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o=(Resolve-Path 'lab/borderless/rc56/x15').Path;$p=Start-Process "$o/Warhammer.exe" -WorkingDirectory $o -PassThru;if(-not $p.WaitForExit(300000)){Stop-Process $p.Id -Force;throw 'controller stress timeout'};$ev=Join-Path $o 'RC56_CONTROLLER_STRESS.txt';if(Test-Path $ev){$txt=[IO.File]::ReadAllText($ev,[Text.Encoding]::Unicode);Write-Host $txt}else{throw 'controller evidence missing'};if($p.ExitCode -ne 0){foreach($n in @('win81_nis.log','ptar_borderless_rc38.log','ptar_rc41.log','ptar_rc41_bootstrap.log')){$f=Join-Path $o $n;if(Test-Path $f){Write-Host "===== $n =====";Get-Content $f -Tail 300}};throw "controller rc=$($p.ExitCode)"};if(-not $txt.Contains('RC56_CONTROLLER_STRESS=PASS cycles=80 game_untouched=1 presenter_only=1 exact_runtime=1')){throw 'controller stress marker missing'};$ctl=Get-Content (Join-Path $o 'ptar_borderless_rc38.log') -Raw;if(-not $ctl.Contains('RC56_SYNTHETIC_MONITOR_OVERRIDE')){throw 'synthetic monitor path not exercised'};if(-not $ctl.Contains('RC56_BORDERLESS_POLICY=PRESENTER_ONLY_GAME_UNTOUCHED')){throw 'presenter-only path not exercised'};if($ctl.Contains('FAIL RC51 presenter resync')){throw 'RC51 reported a real resync failure'};$rt=Get-Content (Join-Path $o 'win81_nis.log') -Raw;if(-not $rt.Contains('PTAR-NG MoE v01 exact x1.5 active')){throw 'exact x1.5 runtime path missing'};if($rt.Contains('natural game ResizeBuffers failed')){throw 'runtime resize failure'};Write-Host 'RC56_CONTROLLER_X15_STRESS=PASS'

      - name: Exact-runtime direct-borderless controller startup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o=(Resolve-Path 'lab/borderless/rc56/x15').Path;Remove-Item (Join-Path $o 'RC56_CONTROLLER_DIRECT.txt') -Force -ErrorAction SilentlyContinue;$p=Start-Process "$o/Warhammer.exe" -ArgumentList direct -WorkingDirectory $o -PassThru;if(-not $p.WaitForExit(180000)){Stop-Process $p.Id -Force;throw 'direct timeout'};$ev=Join-Path $o 'RC56_CONTROLLER_DIRECT.txt';if(Test-Path $ev){$txt=[IO.File]::ReadAllText($ev,[Text.Encoding]::Unicode);Write-Host $txt}else{throw 'direct evidence missing'};if($p.ExitCode -ne 0){throw "direct rc=$($p.ExitCode)"};if(-not $txt.Contains('RC56_CONTROLLER_DIRECT=PASS game_untouched=1 presenter_only=1 exact_runtime=1')){throw 'direct marker missing'};Write-Host 'RC56_CONTROLLER_DIRECT=PASS'

      - name: Summary
        shell: powershell
        run: |
          $prod=(Get-FileHash 'lab/borderless/rc56/x15/prod/ptar_borderless.dll' -Algorithm SHA256).Hash.ToLowerInvariant();@('RC56_X15_CONTROLLER_INTEGRATION=PASS','P1U46_EXACT_RUNTIME=PASS','EXACT_1280x720_RENDER_TO_1920x1080_PRESENTER=PASS','TRANSITIONS=80 PASS','DIRECT_BORDERLESS=PASS','GAME_HWND_UNTOUCHED_BY_RC56=PASS','PRESENTER_ONLY=PASS','RC51_SOURCE_INHERITANCE=EXACT','RC51_LIVE_SYNC=SEPARATELY_PROVEN_DISPLAY_BOUND','RC55_RASTER_UNCHANGED=PASS',"RC56_PRODUCTION=$prod")|Set-Content 'lab/borderless/rc56/RC56_X15_SUMMARY.txt' -Encoding ASCII;Get-Content 'lab/borderless/rc56/RC56_X15_SUMMARY.txt'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTAR_RC56_P1U46_SYNTHETIC_X15
          path: |
            lab/borderless/rc56/RC56_X15_*.txt
            lab/borderless/rc56/synthetic/RC56_SYNTHETIC_GEOMETRY.txt
            lab/borderless/rc56/x15/*.txt
            lab/borderless/rc56/x15/*.log
            lab/borderless/rc56/x15/prod/ptar_borderless.dll
            lab/borderless/rc56/x15/synth/ptar_borderless.dll
            lab/borderless/rc56/x15/ptar_rc41.dll
          if-no-files-found: warn
          retention-days: 14
