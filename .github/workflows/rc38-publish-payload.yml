name: RC38 Publish Verified Payload

on:
  push:
    branches: [ build/rc38-borderless-authority-20260913 ]
    paths-ignore:
      - 'lab/borderless/rc38/generated/**'
      - 'lab/borderless/rc38/diaggen/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible Win8.1 RC38 sidecar
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\rc38\out mkdir lab\borderless\rc38\out
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          cl %CFLAGS% /LD lab\borderless\rc38\ptar_borderless_rc38.cpp /Fe:lab\borderless\rc38\out\ptar_borderless.dll user32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03
          if errorlevel 1 exit /b 1
          copy /y lab\borderless\rc38\out\ptar_borderless.dll lab\borderless\rc38\out\ptar_borderless_first.dll >nul
          if errorlevel 1 exit /b 1
          ping -n 2 127.0.0.1 >nul
          cl %CFLAGS% /LD lab\borderless\rc38\ptar_borderless_rc38.cpp /Fe:lab\borderless\rc38\out\ptar_borderless.dll user32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03
          if errorlevel 1 exit /b 1
          fc /b lab\borderless\rc38\out\ptar_borderless_first.dll lab\borderless\rc38\out\ptar_borderless.dll >nul
          if errorlevel 1 exit /b 2
          echo RC38_SIDECAR_SAME_TARGET_REPRODUCIBILITY=PASS
          cl %CFLAGS% lab\borderless\rc38\ptar_borderless_host_test.cpp /Fe:lab\borderless\rc38\out\ptar_borderless_host_test.exe user32.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 1
          pushd lab\borderless\rc38\out
          ptar_borderless_host_test.exe > RC38_HOST_TEST.txt 2>&1
          if errorlevel 1 (type RC38_HOST_TEST.txt & exit /b 1)
          type RC38_HOST_TEST.txt
          dumpbin /imports ptar_borderless.dll > SIDECAR_IMPORTS.txt
          dumpbin /headers ptar_borderless.dll > SIDECAR_HEADERS.txt
          popd
      - name: Generate verified text payload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='lab/borderless/rc38/out/ptar_borderless.dll';$gen='lab/borderless/rc38/generated'
          New-Item -ItemType Directory -Force $gen | Out-Null
          $bytes=[IO.File]::ReadAllBytes($out)
          [IO.File]::WriteAllText((Join-Path $gen 'ptar_borderless.dll.b64'),[Convert]::ToBase64String($bytes))
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content -NoNewline (Join-Path $gen 'ptar_borderless.dll.sha256') -Encoding ASCII
          $bytes.Length | Set-Content -NoNewline (Join-Path $gen 'ptar_borderless.dll.size') -Encoding ASCII
          Copy-Item 'lab/borderless/rc38/out/RC38_HOST_TEST.txt' (Join-Path $gen 'RC38_HOST_TEST.txt') -Force
          Copy-Item 'lab/borderless/rc38/out/SIDECAR_IMPORTS.txt' (Join-Path $gen 'SIDECAR_IMPORTS.txt') -Force
          Copy-Item 'lab/borderless/rc38/out/SIDECAR_HEADERS.txt' (Join-Path $gen 'SIDECAR_HEADERS.txt') -Force
          $tmp=Join-Path $env:RUNNER_TEMP 'ptar_borderless_publish_roundtrip.dll'
          [IO.File]::WriteAllBytes($tmp,[Convert]::FromBase64String((Get-Content (Join-Path $gen 'ptar_borderless.dll.b64') -Raw)))
          if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){throw 'Base64 roundtrip hash mismatch'}
          Write-Host ('RC38_PUBLISH_SHA256='+$sha)
      - name: Publish with fast-forward reconciliation
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/borderless/rc38/generated
          git diff --cached --quiet && exit 0
          git commit -m "lab: publish reproducible verified RC38 sidecar payload"
          git pull --rebase origin build/rc38-borderless-authority-20260913
          git push origin HEAD:build/rc38-borderless-authority-20260913
