name: promote-hudrec1-package-metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-hudrec1-package-metadata.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore validated HUDREC1 V2 metadata and diagnostics
        shell: bash
        env:
          PAYLOAD_B64: '[... truncated by assistant tool payload ...]'
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/hudrec-main.tar.xz
          tar -xJf /tmp/hudrec-main.tar.xz -C .
          rm -f .github/workflows/promote-hudrec1-package-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: complete HUDREC1 V2 promotion'
          git push origin HEAD:main
