name: LAB38A Full Software Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab38-branchless-phase0

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT
      - name: Compile frozen LAB37B and LAB38A
        shell: pwsh
        run: |
          $out='lab_results\lab38a_full'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab37b.cso" /Fc "$out\lab37b.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab37b_diag_axis_round_coeff_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab38a.cso" /Fc "$out\lab38a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38a_branchless_phase0_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $h37=(Get-FileHash "$out\lab37b.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h38=(Get-FileHash "$out\lab38a.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h37 -ne 'cd92ead859b9e7e210b96b1b811c95f91b1eba3c18c64a7cfa83e0a004c5a0b5'){ throw "LAB37B hash mismatch $h37" }
          if($h38 -ne 'd60820f62ca69e2cb2ef995c37001f100733e179f0821d7eb83247ad2c0014d3'){ throw "LAB38A hash mismatch $h38" }
          @("LAB37B=$h37","LAB38A=$h38") | Set-Content "$out\HASHES.txt" -Encoding ascii
      - name: Generate shared ABI harness sources
        run: python tools/moe_ng_v02_prepare_shared_abi_harnesses.py --outdir lab_results/lab38a_full
      - name: Build shared WARP harnesses
        shell: pwsh
        run: |
          $out='lab_results\lab38a_full'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          foreach($n in @('float_shared','unorm8_shared')){
            $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 $out\warp_$n.cpp /Fe:$out\warp_$n.exe d3d11.lib dxgi.lib"
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }
      - name: Run full shared-ABI software admission
        shell: pwsh
        run: |
          python tools/moe_ng_v02_shared_abi_full_gate.py `
            --outdir lab_results/lab38a_full `
            --baseline lab37b `
            --candidate lab38a `
            --baseline-sha cd92ead859b9e7e210b96b1b811c95f91b1eba3c18c64a7cfa83e0a004c5a0b5 `
            --candidate-sha d60820f62ca69e2cb2ef995c37001f100733e179f0821d7eb83247ad2c0014d3 `
            --baseline-instructions 52 `
            --candidate-instructions 49 `
            --baseline-bytes 2532 `
            --candidate-bytes 2528
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab38a-full-software-gate
          path: lab_results/lab38a_full
