name: RC51 Presenter Swapchain Contract Lab

on:
  push:
    branches: [lab/rc51-presenter-swapchain-contract-20260914]
    paths:
      - lab/presenter/rc51/**
      - .github/workflows/rc51-presenter-swapchain-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-contract:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact P1U46 runtime and adapt only geometry
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName System.Windows.Forms
          $o='lab/presenter/rc51/run';New-Item -ItemType Directory -Force $o | Out-Null
          $base=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($base -ne '864c0ca8f24f22f6a3cd4c21a0e213f431f5268e69b04e3860c52fe72600fc3c'){throw "canonical runtime drift $base"}
          python lab/borderless/rc48/rebuild_exact_field_runtime.py payload/d3d11.dll "$o/d3d11.dll"
          if($LASTEXITCODE -ne 0){throw 'runtime reconstruction failed'}
          $runtime=(Get-FileHash "$o/d3d11.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($runtime -ne '6f1686992bef971c9995df9f0cb91b93c6946988e12a837e5de956df37c9082b'){throw "field runtime mismatch $runtime"}
          Copy-Item "$o/d3d11.dll" "$o/win81_nis_dx11_x64.dll" -Force
          $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds;$ow=[int]$b.Width;$oh=[int]$b.Height;$rw=[int][math]::Floor($ow*2/3);$rh=[int][math]::Floor($oh*2/3)
          $ini=Get-Content payload/win81_nis.ini -Raw
          $ini=[regex]::Replace($ini,'(?m)^OutputWidth=.*$',"OutputWidth=$ow")
          $ini=[regex]::Replace($ini,'(?m)^OutputHeight=.*$',"OutputHeight=$oh")
          $ini=[regex]::Replace($ini,'(?m)^RenderWidth=.*$',"RenderWidth=$rw")
          $ini=[regex]::Replace($ini,'(?m)^RenderHeight=.*$',"RenderHeight=$rh")
          Set-Content "$o/win81_nis.ini" $ini -Encoding ASCII
          "OUTPUT=${ow}x${oh} RENDER=${rw}x${rh} RUNTIME=$runtime" | Set-Content 'lab/presenter/rc51/GEOMETRY.txt' -Encoding ASCII
          Get-Content 'lab/presenter/rc51/GEOMETRY.txt'

      - name: Build exact RC46 controller RC42 raster and contract host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          cl %CFLAGS% /LD lab\borderless\rc46\ptar_borderless_rc46_prod.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fe:lab\presenter\rc51\run\ptar_borderless.dll user32.lib advapi32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 20
          cl %CFLAGS% /I lab\raster\rc41 /LD lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc41\ptar_rc41_context_hooks.cpp lab\raster\rc41\ptar_rc41_resource_bridge.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_swapchain_hooks.cpp lab\raster\rc41\ptar_rc41_prod.cpp /Fe:lab\presenter\rc51\run\ptar_rc42.dll user32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 21
          copy /y lab\presenter\rc51\run\ptar_rc42.dll lab\presenter\rc51\run\ptar_rc41.dll >nul
          cl %CFLAGS% lab\presenter\rc51\ptar_rc51_contract_host.cpp /Fe:lab\presenter\rc51\run\Warhammer.exe user32.lib advapi32.lib gdi32.lib d3d11.lib dxgi.lib /link /SUBSYSTEM:WINDOWS,6.03 || exit /b 22

      - name: Verify exact inherited hashes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o='lab/presenter/rc51/run'
          $runtime=(Get-FileHash "$o/d3d11.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $raster=(Get-FileHash "$o/ptar_rc42.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $carrier=(Get-FileHash "$o/ptar_borderless.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($runtime -ne '6f1686992bef971c9995df9f0cb91b93c6946988e12a837e5de956df37c9082b'){throw "runtime drift $runtime"}
          if($raster -ne '7ffe7aa1b9afa42d5f22557cae29a4f65e17379c2a2f181f879427277839f1ca'){throw "RC42 drift $raster"}
          if($carrier -ne '8269d32ccb77b5e65ed159f75ae24266c22b410b8b465a7d504775a937b54890'){throw "RC46 drift $carrier"}
          @("RUNTIME=$runtime","RASTER=$raster","RC46=$carrier") | Set-Content 'lab/presenter/rc51/COMPONENTS.txt' -Encoding ASCII
          Get-Content 'lab/presenter/rc51/COMPONENTS.txt'

      - name: Run live presenter contract and resync lab
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o=(Resolve-Path 'lab/presenter/rc51/run').Path
          $p=Start-Process -FilePath "$o/Warhammer.exe" -WorkingDirectory $o -PassThru
          if(-not $p.WaitForExit(120000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'RC51 host timeout'}
          $rc=$p.ExitCode;Write-Host "RC51_HOST_EXIT=$rc"
          $hostFile=Join-Path $o 'RC51_CONTRACT_HOST.txt'
          if(Test-Path $hostFile){$hostText=[IO.File]::ReadAllText($hostFile,[Text.Encoding]::Unicode);Write-Host $hostText}else{throw 'RC51 host evidence missing'}
          foreach($n in @('win81_nis.log','ptar_borderless_rc38.log','ptar_rc41.log','ptar_rc41_bootstrap.log')){$f=Join-Path $o $n;if(Test-Path $f){Write-Host "===== $n =====";Get-Content $f -Tail 180}}
          if($rc -ne 0){throw "RC51 contract host failed rc=$rc"}
          foreach($marker in @('WINDOWED_NATIVE_SWAPCHAIN_MISMATCH=PASS','WINDOWED_CONTRACT_MATCHED=PASS','WINDOWED_PIXELS_AFTER_RESYNC=PASS','BORDERLESS_PIXELS_AFTER_RESYNC=PASS','WINDOWED_REENTRY_PIXELS=PASS','RC51_PRESENTER_SWAPCHAIN_CONTRACT=PASS')){if(-not $hostText.Contains($marker)){throw "missing $marker"}}
          Write-Host 'RC51_CONTRACT_ORACLE=PASS'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTAR_RC51_PRESENTER_SWAPCHAIN_CONTRACT
          path: |
            lab/presenter/rc51/GEOMETRY.txt
            lab/presenter/rc51/COMPONENTS.txt
            lab/presenter/rc51/run/*.txt
            lab/presenter/rc51/run/*.log
            lab/presenter/rc51/run/ptar_borderless.dll
          if-no-files-found: warn
          retention-days: 7
