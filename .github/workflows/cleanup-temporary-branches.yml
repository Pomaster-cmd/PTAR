name: cleanup-temporary-branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-temporary-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin --delete lab/inputfocus2-satgat-20260917
          git push origin --delete lab/moe-v01-corpus-export-20260917
