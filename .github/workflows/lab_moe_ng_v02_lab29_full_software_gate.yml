name: LAB29 Full Software Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab29-doubled-mc-slope

permissions:
  contents: read

jobs:
  lab29-full-software:
    if: contains(github.event.head_commit.message, '[run-lab29-full]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Compile frozen LAB28 and LAB29
        shell: pwsh
        run: |
          $out='lab_results\lab29_full'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab28.cso" /Fc "$out\lab28.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab28_uv_axis_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab29.cso" /Fc "$out\lab29.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab29_doubled_mc_slope_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $h28=(Get-FileHash "$out\lab28.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h29=(Get-FileHash "$out\lab29.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h28 -ne 'fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77'){ throw "LAB28 hash mismatch $h28" }
          if($h29 -ne '6a407b37938ec6a0bf89d13cf84fa4ae23c6f712a947fc6926bbfde9725028ed'){ throw "LAB29 hash mismatch $h29" }
          @("LAB28=$h28","LAB29=$h29") | Set-Content "$out\HASHES.txt" -Encoding ascii

      - name: Build float and UNORM8 WARP harnesses
        shell: pwsh
        run: |
          $out='lab_results\lab29_full'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 tools\lab_moe_ng_v02_warp_harness.cpp /Fe:$out\warp_float.exe d3d11.lib dxgi.lib && cl /nologo /EHsc /O2 /std:c++17 tools\lab_moe_ng_v02_warp_harness_unorm8.cpp /Fe:$out\warp_unorm8.exe d3d11.lib dxgi.lib"
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: CPU parity plus canonical and high-frequency float equivalence
        shell: pwsh
        run: |
          $out='lab_results\lab29_full'
          python tools/lab_moe_ng_v02_warp_validate.py --outdir $out --prepare
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & "$out\warp_float.exe" "$out\input.f32" 24 24 36 36 "$out\lab28.cso" "$out\fullscreen_vs.cso" "$out\lab28_output.f32" *> "$out\WARP_LAB28.txt"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & "$out\warp_float.exe" "$out\input.f32" 24 24 36 36 "$out\lab29.cso" "$out\fullscreen_vs.cso" "$out\lab29_output.f32" *> "$out\WARP_LAB29.txt"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/lab_moe_ng_v02_warp_validate.py --outdir $out --gpu "$out\lab29_output.f32" --tol 0.000002
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item "$out\SUMMARY.json" "$out\LAB29_CPU_PARITY.json"
          @'
          import numpy as np
          from pathlib import Path
          p=Path('lab_results/lab29_full'); H=W=24; y,x=np.mgrid[0:H,0:W]; F=np.float32
          checker=((x+y)&1).astype(np.float32); stripes=((2*x+y)%5<2).astype(np.float32)
          rng=np.random.default_rng(290929); noise=rng.random((H,W),dtype=np.float32)
          img=np.stack([F(.03)+F(.94)*checker,F(.05)+F(.88)*stripes,F(.02)+F(.95)*noise,np.ones((H,W),np.float32)],2).astype(np.float32)
          img.tofile(p/'probe_hf.f32')
          '@ | python -
          & "$out\warp_float.exe" "$out\probe_hf.f32" 24 24 36 36 "$out\lab28.cso" "$out\fullscreen_vs.cso" "$out\hf28.f32" *> "$out\WARP_HF28.txt"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & "$out\warp_float.exe" "$out\probe_hf.f32" 24 24 36 36 "$out\lab29.cso" "$out\fullscreen_vs.cso" "$out\hf29.f32" *> "$out\WARP_HF29.txt"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          @'
          import json,numpy as np
          from pathlib import Path
          p=Path('lab_results/lab29_full'); rows=[]
          for n,a,b in [('canonical','lab28_output.f32','lab29_output.f32'),('high_frequency','hf28.f32','hf29.f32')]:
              aa=np.fromfile(p/a,np.float32); bb=np.fromfile(p/b,np.float32); d=np.abs(aa-bb)
              rows.append({'probe':n,'values':int(aa.size),'different_values':int(np.count_nonzero(d)),'max_abs':float(d.max()) if d.size else 0.0,'bit_exact':bool(np.array_equal(aa,bb))})
          out={'protocol':'LAB29_FLOAT_EQUIVALENCE','probes':rows,'pass':all(r['bit_exact'] for r in rows)}
          (p/'FLOAT_EQUIVALENCE.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))
          if not out['pass']: raise SystemExit('float equivalence failed')
          '@ | python -

      - name: Prepare canonical 42-case LR corpus
        shell: pwsh
        run: |
          @'
          import csv
          import numpy as np
          from pathlib import Path
          from PIL import Image
          src=Path('runtime_autonomous/PTAR_NG_MOE_V01_WIN81_X64/corpus/input_lr')
          out=Path('lab_results/lab29_full'); inp=out/'inputs_f32'; inp.mkdir(parents=True,exist_ok=True)
          files=sorted(src.glob('*.png'))
          if len(files)!=42: raise SystemExit(f'expected 42 corpus PNGs, got {len(files)}')
          rows=[]
          for p in files:
              im=Image.open(p).convert('RGBA'); w,h=im.size
              a=np.asarray(im,dtype=np.float32)/np.float32(255.0)
              q=inp/(p.stem+'.f32'); a.tofile(q)
              rows.append({'case':p.stem,'input':str(q),'inW':w,'inH':h,'outW':w*3//2,'outH':h*3//2})
          with (out/'CORPUS_MANIFEST.csv').open('w',newline='',encoding='utf-8') as f:
              wr=csv.DictWriter(f,fieldnames=rows[0].keys()); wr.writeheader(); wr.writerows(rows)
          '@ | python -

      - name: 42-case R8G8B8A8 UNORM equivalence LAB28 vs LAB29
        shell: pwsh
        run: |
          @'
          import csv,json,subprocess
          from pathlib import Path
          out=Path('lab_results/lab29_full'); exe=out/'warp_unorm8.exe'; vs=out/'fullscreen_vs.cso'; ps28=out/'lab28.cso'; ps29=out/'lab29.cso'
          rows=[]; total_diff=0; total_bytes=0
          with (out/'CORPUS_MANIFEST.csv').open(newline='',encoding='utf-8') as f: manifest=list(csv.DictReader(f))
          od=out/'corpus_outputs'; od.mkdir(exist_ok=True)
          for r in manifest:
              case=r['case']; a=od/(case+'_28.rgba8'); b=od/(case+'_29.rgba8')
              base=[str(exe),r['input'],r['inW'],r['inH'],r['outW'],r['outH']]
              subprocess.run(base+[str(ps28),str(vs),str(a)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
              subprocess.run(base+[str(ps29),str(vs),str(b)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
              ba=a.read_bytes(); bb=b.read_bytes()
              if len(ba)!=len(bb): raise SystemExit(f'{case}: size mismatch')
              diff=sum(x!=y for x,y in zip(ba,bb)); total_diff+=diff; total_bytes+=len(ba)
              rows.append({'case':case,'bytes':len(ba),'different_bytes':diff,'byte_exact':diff==0})
          report={'protocol':'LAB29_42_CASE_WARP_R8G8B8A8_UNORM','cases':len(rows),'exact_cases':sum(r['byte_exact'] for r in rows),'different_bytes':total_diff,'total_bytes':total_bytes,'pass':all(r['byte_exact'] for r in rows)}
          (out/'CORPUS_UNORM8_SUMMARY.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          if not report['pass']: raise SystemExit('42-case UNORM8 drift')
          '@ | python -

      - name: Synthetic UNORM8 stress equivalence
        shell: pwsh
        run: |
          @'
          import json,subprocess
          import numpy as np
          from pathlib import Path
          out=Path('lab_results/lab29_full'); td=out/'synthetic'; td.mkdir(exist_ok=True)
          H=W=64; y,x=np.mgrid[0:H,0:W]; rng=np.random.default_rng(0x4C41423239)
          def rgba8(r,g,b,a=None):
              if a is None: a=np.full((H,W),255,dtype=np.uint8)
              return np.stack([r,g,b,a],axis=2).astype(np.uint8)
          ramp=np.rint(np.linspace(0,255,W,dtype=np.float32)).astype(np.uint8)[None,:].repeat(H,0); vramp=ramp.T
          imgs=[('ramps',rgba8(ramp,vramp,((ramp.astype(np.uint16)+vramp.astype(np.uint16))//2).astype(np.uint8)))]
          step=np.where(x>=W//2,255,0).astype(np.uint8); diag=np.where(x+y>=W-1,255,0).astype(np.uint8)
          imgs.append(('steps',rgba8(step,diag,np.where((2*x+y)%5<2,240,15).astype(np.uint8))))
          checker=np.where((x+y)&1,255,0).astype(np.uint8); imgs.append(('checker',rgba8(checker,np.roll(checker,1,1),np.roll(checker,1,0))))
          for i in range(5): imgs.append((f'random_{i}',rng.integers(0,256,size=(H,W,4),dtype=np.uint8)))
          exe=out/'warp_unorm8.exe'; vs=out/'fullscreen_vs.cso'; ps28=out/'lab28.cso'; ps29=out/'lab29.cso'; rows=[]
          for name,u8 in imgs:
              inp=td/(name+'.f32'); (u8.astype(np.float32)/np.float32(255.0)).tofile(inp)
              a=td/(name+'_28.rgba8'); b=td/(name+'_29.rgba8'); base=[str(exe),str(inp),str(W),str(H),str(W*3//2),str(H*3//2)]
              subprocess.run(base+[str(ps28),str(vs),str(a)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
              subprocess.run(base+[str(ps29),str(vs),str(b)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
              ba=a.read_bytes(); bb=b.read_bytes(); diff=sum(x!=y for x,y in zip(ba,bb)); rows.append({'probe':name,'different_bytes':diff,'byte_exact':diff==0})
          report={'protocol':'LAB29_SYNTHETIC_WARP_R8G8B8A8_UNORM','probes':rows,'pass':all(r['byte_exact'] for r in rows)}
          (out/'SYNTHETIC_UNORM8_SUMMARY.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          if not report['pass']: raise SystemExit('synthetic UNORM8 drift')
          '@ | python -

      - name: Final software admission
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          p=Path('lab_results/lab29_full')
          cpu=json.loads((p/'LAB29_CPU_PARITY.json').read_text())
          fl=json.loads((p/'FLOAT_EQUIVALENCE.json').read_text())
          co=json.loads((p/'CORPUS_UNORM8_SUMMARY.json').read_text())
          sy=json.loads((p/'SYNTHETIC_UNORM8_SUMMARY.json').read_text())
          report={'protocol':'LAB29_FULL_SOFTWARE_ADMISSION','lab29_sha256':'6a407b37938ec6a0bf89d13cf84fa4ae23c6f712a947fc6926bbfde9725028ed','baseline_lab28_sha256':'fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77','cpu_parity':cpu,'float_equivalence_pass':fl['pass'],'corpus_unorm8_pass':co['pass'],'synthetic_unorm8_pass':sy['pass'],'instructions':57,'cso_bytes':2732,'baseline_lab28_instructions':59,'baseline_lab28_cso_bytes':2788}
          report['pass']=bool(fl['pass'] and co['pass'] and sy['pass'])
          (p/'ADMISSION.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          if not report['pass']: raise SystemExit('LAB29 software admission failed')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab29-full-software-gate
          path: lab_results/lab29_full
