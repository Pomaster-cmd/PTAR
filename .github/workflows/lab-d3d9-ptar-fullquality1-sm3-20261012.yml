name: LAB D3D9 PTAR FULLQUALITY1 SM3 20261012

on:
  push:
    branches: [lab/d3d9-ptar-fullquality1-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sm3:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile and audit full-quality SM3 shaders
        shell: pwsh
        run: .\lab\fullquality1\compile_sm3_quality.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-D3D9-FULLQUALITY1-SM3
          path: |
            artifact/
            build_x86/ptar_qstage4diag2_d3d9_ps_bytecode.h
            build_x86/ptar_spec5_d3d9_ps_bytecode.h
            build_x86/ptar_hq900_d3d9_ps_bytecode.h
          if-no-files-found: error
