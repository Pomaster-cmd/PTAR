name: LAB PTAR-NG MoE v02 Stress Probes

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  cpu-stress-probes:
    if: contains(github.event.head_commit.message, '[run-stress]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stress dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Run LAB08 anti-ringing and frequency-response probes
        run: python tools/lab_moe_ng_v02_stress.py --out lab_results/moe_ng_v02_stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab08-stress
          path: lab_results/moe_ng_v02_stress
