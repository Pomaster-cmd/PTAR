name: LAB38 Full Software Sweep

on:
  push:
    branches:
      - lab/moe-ng-v02-lab38-post-lab37b-sweep

permissions:
  contents: read

jobs:
  full-gate:
    if: contains(github.event.head_commit.message, '[run-lab38-full]')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: lab38a
            source: src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38a_phase_round_early_ps.hlsl
            sha: e50ff93fca833141fd02f266819c8d1c3700ecc92bee00239bfad5b500166570
            bytes: 2532
          - id: lab38b
            source: src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38b_coeff_early_ps.hlsl
            sha: b05c573ebeb24754ee88abb6a319b5ed0f62667d4cb021cf285665c061497abc
            bytes: 2532
          - id: lab38c
            source: src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38c_f2_recurrence_ps.hlsl
            sha: 4147b5964118e4341fd560bce61f8fe01a1bec68943e08848a412913f02aeaa0
            bytes: 2512
          - id: lab38d
            source: src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38d_coeff_early_f2_recurrence_ps.hlsl
            sha: 12d25c573d00b23717c04c7104d63ca5365c47a3b917d40b67a747c03630cb5b
            bytes: 2512
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile frozen LAB37B and ${{ matrix.id }}
        shell: pwsh
        run: |
          $out='lab_results\lab38_full_${{ matrix.id }}'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab37b.cso" /Fc "$out\lab37b.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab37b_diag_axis_round_coeff_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\${{ matrix.id }}.cso" /Fc "$out\${{ matrix.id }}.asm" '${{ matrix.source }}'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $hb=(Get-FileHash "$out\lab37b.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $hc=(Get-FileHash "$out\${{ matrix.id }}.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hb -ne 'cd92ead859b9e7e210b96b1b811c95f91b1eba3c18c64a7cfa83e0a004c5a0b5'){ throw "LAB37B hash mismatch $hb" }
          if($hc -ne '${{ matrix.sha }}'){ throw "candidate hash mismatch $hc" }

      - name: Generate shared ABI harness sources
        run: python tools/moe_ng_v02_prepare_shared_abi_harnesses.py --outdir lab_results/lab38_full_${{ matrix.id }}

      - name: Build shared WARP harnesses
        shell: pwsh
        run: |
          $out='lab_results\lab38_full_${{ matrix.id }}'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          foreach($n in @('float_shared','unorm8_shared')){
            $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 $out\warp_$n.cpp /Fe:$out\warp_$n.exe d3d11.lib dxgi.lib"
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }

      - name: Run full software admission
        shell: pwsh
        run: |
          python tools/moe_ng_v02_shared_abi_full_gate.py `
            --outdir lab_results/lab38_full_${{ matrix.id }} `
            --baseline lab37b `
            --candidate ${{ matrix.id }} `
            --baseline-sha cd92ead859b9e7e210b96b1b811c95f91b1eba3c18c64a7cfa83e0a004c5a0b5 `
            --candidate-sha ${{ matrix.sha }} `
            --baseline-instructions 52 `
            --candidate-instructions 52 `
            --baseline-bytes 2532 `
            --candidate-bytes ${{ matrix.bytes }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab38-full-${{ matrix.id }}
          path: lab_results/lab38_full_${{ matrix.id }}
