name: LAB48 Center-FMA Codegen Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab48-svpos-center-fma

permissions:
  contents: read

jobs:
  codegen:
    if: contains(github.event.head_commit.message, '[run-lab48-codegen]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile frozen baseline and LAB48A raw
        shell: pwsh
        run: |
          $root='lab_results\lab48_codegen'; New-Item -ItemType Directory -Force $root | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$root\lab38a.cso" /Fc "$root\lab38a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38a_branchless_phase0_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$root\lab48a_raw.cso" /Fc "$root\lab48a_raw.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab48a_svpos_center_fma_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Audit raw codegen
        shell: pwsh
        run: |
          @'
          import hashlib,json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab48_codegen')
          pat=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b')
          rows={}
          for n in ('lab38a','lab48a_raw'):
              ops=[]; temps=None; samples=[]; lines=[]
              for raw in (root/f'{n}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip(); m=pat.match(raw)
                  if s.startswith('dcl_temps '):
                      try: temps=int(s.split()[1])
                      except: pass
                  if not s or s.startswith('//') or s.startswith('ps_5_0') or not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op); lines.append(s)
                  if op.startswith('sample_l'): samples.append(len(ops))
              c=Counter(ops)
              data=(root/f'{n}.cso').read_bytes()
              rows[n]={
                  'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'instructions':len(ops),'temps':temps,
                  'ops':dict(sorted(c.items())),'sample_positions':samples,
                  'eq_lines':[x for x in lines if x.startswith('eq ')],
                  'final_movc_lines':[x for x in lines if x.startswith('movc o0')],
                  'first_instructions':lines[:6],
              }
          b=rows['lab38a']; c=rows['lab48a_raw']
          contract=(c['ops'].get('gather4_indexable',0)==1 and c['ops'].get('sample_l_indexable',0)==4 and c['ops'].get('div',0)==0 and c['ops'].get('udiv',0)==0 and c['sample_positions']==[14,15,19,20])
          expected=(b['sha256']=='d60820f62ca69e2cb2ef995c37001f100733e179f0821d7eb83247ad2c0014d3' and b['instructions']==49 and b['bytes']==2528 and c['instructions']<=48 and c['temps']<=8 and contract and len(c['eq_lines'])==1 and len(c['final_movc_lines'])==1)
          r={'protocol':'LAB48A_RAW_CENTER_FMA_CODEGEN_GATE','baseline':'LAB38A raw before LAB47 peephole','rows':rows,'instruction_delta_raw_vs_lab38a':c['instructions']-b['instructions'],'byte_delta_raw_vs_lab38a':c['bytes']-b['bytes'],'texture_contract_pass':contract,'phase_mask_patch_shape_present':len(c['eq_lines'])==1 and len(c['final_movc_lines'])==1,'pass':bool(expected)}
          (root/'CODEGEN_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('LAB48A raw codegen gate failed')
          '@ | python -

      - uses: actions/upload-artifact@v4
        with:
          name: lab48a-raw-codegen-gate
          path: lab_results/lab48_codegen
          if-no-files-found: error
          compression-level: 0
