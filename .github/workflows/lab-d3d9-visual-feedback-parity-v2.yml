name: LAB D3D9 visual feedback parity v2

on:
  push:
    branches: [lab/d3d9-visual-feedback-parity-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove rendering cores untouched
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='174a07d28d5d4dde73fe3b709fd1e17d5ab3fb10'
          $changed=@(git diff --name-only $base HEAD)
          $bad=@($changed | Where-Object { $_ -notlike 'lab/d3d9_visual_feedback/*' -and $_ -ne '.github/workflows/lab-d3d9-visual-feedback-parity-v2.yml' })
          if($bad.Count -ne 0){ throw ('Unexpected file changed: '+($bad -join ', ')) }
          Write-Host 'D3D9_CORE_UNTOUCHED=PASS'
          Write-Host 'D3D11_CORE_UNTOUCHED=PASS'

      - name: Compile exact visual shell x86 and x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=(Resolve-Path 'lab/d3d9_visual_feedback/VisualFeedbackProbe.cs').Path
          $c32="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          $c64="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $x86=Join-Path $PWD 'probe_x86.exe';$x64=Join-Path $PWD 'probe_x64.exe'
          & $c32 /nologo /target:winexe /optimize+ /platform:x86 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll (('/out:{0}' -f $x86)) $src
          if($LASTEXITCODE -ne 0){throw 'x86 compile failed'}
          & $c64 /nologo /target:winexe /optimize+ /platform:x64 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll (('/out:{0}' -f $x64)) $src
          if($LASTEXITCODE -ne 0){throw 'x64 compile failed'}
          Write-Host 'COMPILE_X86=PASS'
          Write-Host 'COMPILE_X64=PASS'

      - name: Prove x64 visual path and reproduce x86 missing feedback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Launch([string]$exe,[string]$tag){
            $state=Join-Path $PWD ($tag+'.txt');Remove-Item $state -Force -ErrorAction SilentlyContinue;$env:PTAR_LAB_STATE=$state
            $p=Start-Process -FilePath (Join-Path $PWD $exe) -PassThru -WindowStyle Hidden
            Start-Sleep -Milliseconds 1200
            $text='';if(Test-Path -LiteralPath $state){$text=Get-Content -LiteralPath $state -Raw}
            Write-Host ($tag+' PID='+$p.Id);Write-Host $text
            return [pscustomobject]@{P=$p;Text=$text}
          }
          $x64=Launch 'probe_x64.exe' 'X64_HIDDEN'
          if($x64.Text -notmatch 'SHOWN' -or $x64.Text -notmatch 'NATIVE_VISIBLE=True'){throw 'x64 visual contract not reached'}
          Stop-Process -Id $x64.P.Id -Force -ErrorAction SilentlyContinue
          $x86=Launch 'probe_x86.exe' 'X86_HIDDEN'
          if($x86.Text -notmatch 'MAIN_ENTER'){throw 'x86 reproduction did not start'}
          if($x86.Text -match 'SHOWN|NATIVE_VISIBLE=True'){throw 'x86 unexpectedly reached visible feedback'}
          Stop-Process -Id $x86.P.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'X64_D3D11_VISUAL_CONTRACT_NATIVE_VISIBLE=PASS'
          Write-Host 'X86_WINFORMS_FEEDBACK_MISSING=REPRODUCED'
          Write-Host 'FIX_POLICY=D3D9_EXTERNAL_UI_CONTROLLERS_X64_KEEP_VERIFIERS_X86'
