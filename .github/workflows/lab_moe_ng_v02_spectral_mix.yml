name: LAB PTAR-NG MoE v02 Spectral Mix Diagnostic

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  spectral-mix:
    if: contains(github.event.head_commit.message, '[run-spectral]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Run LAB09 2D multi-frequency spectral diagnostic
        run: >-
          python tools/lab_moe_ng_v02_spectral_mix.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --out lab_results/moe_ng_v02_spectral_mix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab09-spectral-mix
          path: lab_results/moe_ng_v02_spectral_mix
