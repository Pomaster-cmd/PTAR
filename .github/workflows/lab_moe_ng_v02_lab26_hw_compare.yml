name: LAB PTAR-NG MoE v02 LAB26 One-Shot GTX HW Compare Pack

on:
  push:
    branches:
      - lab/moe-ng-v02-lab26-hw-compare

permissions:
  contents: read

jobs:
  build-validate-package:
    if: contains(github.event.head_commit.message, '[run-lab26-hw-pack]')
    runs-on: windows-latest
    steps:
      - name: Checkout runtime integration scaffold
        uses: actions/checkout@v4

      - name: Checkout exact admitted LAB25/LAB26 research sources
        uses: actions/checkout@v4
        with:
          ref: 2c64764fea0706763cd74cd96c1948f5615449a1
          path: _research_ref

      - name: Checkout frozen balanced comparator template
        uses: actions/checkout@v4
        with:
          ref: 6006fb7d2a5fa297493422303620dbfa8b243b6c
          path: _lab22_hw_ref

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reference dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Locate x64 FXC and VS toolchain
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "FXC=$($fxc.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if(-not $vs){ throw 'Visual Studio C++ toolchain not found' }
          "VCVARS=$(Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reproduce exact admitted LAB25 and LAB26 DXBC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'lab26_hw_pack_stage'; New-Item -ItemType Directory -Force $stage | Out-Null
          $src25='_research_ref\src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab25_proven_shape_ps.hlsl'
          $src26='_research_ref\src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab26_phase0_early_exit_ps.hlsl'
          $c25=Join-Path $stage 'ptar_moe_ng_v02_lab25_proven_shape_ps.cso'
          $c26=Join-Path $stage 'ptar_moe_ng_v02_lab26_phase0_early_exit_ps.cso'
          $a25=Join-Path $stage 'lab25.asm'; $a26=Join-Path $stage 'lab26.asm'
          & $env:FXC /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo $c25 /Fc $a25 $src25
          if($LASTEXITCODE -ne 0){ throw 'LAB25 FXC failed' }
          & $env:FXC /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo $c26 /Fc $a26 $src26
          if($LASTEXITCODE -ne 0){ throw 'LAB26 FXC failed' }
          $h25=(Get-FileHash $c25 -Algorithm SHA256).Hash.ToLowerInvariant()
          $h26=(Get-FileHash $c26 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h25 -ne 'ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72'){ throw "LAB25 hash mismatch $h25" }
          if($h26 -ne 'ac02f3d69923e1173c0d82439ce4094012d7ce62fb92e44141a444158f3829cb'){ throw "LAB26 hash mismatch $h26" }
          $asm=Get-Content $a26 -Raw
          $g=([regex]::Matches($asm,'(?mi)^\s*gather4')).Count
          $s=([regex]::Matches($asm,'(?mi)^\s*sample_l')).Count
          if($g -ne 1 -or $s -ne 4 -or $asm -match '(?mi)^\s*(store_uav|atomic_)'){ throw "LAB26 texture contract failure gather=$g sample=$s" }
          $sampleLines=@(); $branchLines=@(); $i=0
          foreach($line in (Get-Content $a26)){
            if($line -match '^\s*sample_l'){ $sampleLines += $i }
            if($line -match '^\s*if_[nz]'){ $branchLines += $i }
            $i++
          }
          if($sampleLines.Count -ne 4){ throw 'LAB26 sample line audit failed' }
          $between=$false; foreach($b in $branchLines){ if($b -gt $sampleLines[0] -and $b -lt $sampleLines[1]){ $between=$true } }
          if(-not $between){ throw 'LAB26 phase0 dynamic-fetch branch not retained' }
          "LAB25_CSO=$c25" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LAB26_CSO=$c26" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host '[PASS] exact admitted LAB25/LAB26 binaries reproduced; LAB26 branch retained before samples 2-4'

      - name: Prepare isolated LAB26 full parity runtime
        shell: pwsh
        run: |
          $bundle=Join-Path $env:RUNNER_TEMP 'PTAR_NG_MOE_V02_LAB26_HW_COMPARE_WIN81_X64'
          python tools/prepare_moe_ng_v02_runtime_bundle.py --root $env:GITHUB_WORKSPACE --v02-cso $env:LAB26_CSO --out $bundle
          if($LASTEXITCODE -ne 0){ throw 'bundle preparation failed' }
          "BUNDLE=$bundle" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Relabel LAB26 full validator and generate LAB25 LAB26 K185 comparator
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:BUNDLE 'shaders\ptar_moe_ng_v02_mc_native_detail_ps.cso'
          $lab26=Join-Path $env:BUNDLE 'shaders\ptar_moe_ng_v02_lab26_phase0_early_exit_ps.cso'
          if(-not (Test-Path $old)){ throw 'prepared LAB26 candidate shader missing' }
          Move-Item $old $lab26
          Copy-Item $env:LAB25_CSO (Join-Path $env:BUNDLE 'shaders\ptar_moe_ng_v02_lab25_proven_shape_ps.cso')
          @'
          from pathlib import Path
          import os
          bundle=Path(os.environ['BUNDLE'])

          # Full 42-case validator: patch only exact LAB07 runtime tokens.
          full=bundle/'source/ptar_moe_ng_v02_autonomous_validation.cpp'
          s=full.read_text(encoding='utf-8')
          replacements={
            'ptar_moe_ng_v02_mc_native_detail_ps.cso':'ptar_moe_ng_v02_lab26_phase0_early_exit_ps.cso',
            'PTAR-NG MoE v02 LAB07':'PTAR-NG MoE v02 LAB26',
            'PTAR_NG_MOE_V02_LAB07_MC':'PTAR_NG_MOE_V02_LAB26_PHASE0_EARLY_EXIT',
            'MoE v02 LAB07':'MoE v02 LAB26'
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit(f'full-validator token absent: {a}')
              s=s.replace(a,b)
          if 'LAB07' in s or 'ptar_moe_ng_v02_mc_native_detail_ps.cso' in s:
              raise SystemExit('old LAB07 full-validator token remains')
          full.write_text(s,encoding='utf-8')

          # Frozen comparator template was already physically validated for its
          # balanced 600-triad / six-permutation timing protocol.  Transform
          # semantic LAB07/LAB22 names only; never replace short hex-like tokens.
          src=Path('_lab22_hw_ref/tools/moe_ng_v02_lab22_hw_compare.cpp').read_text(encoding='utf-8')
          old07='LAB07_SHA="caa7352d84c1a9ea840ff0f783323478a4f1532a949a1d3640ba4c04b441ebd1"'
          old22='LAB22_SHA="148a26f453a49fa319ea7aa7a448ef30b01dece508fccc6bd21f4fdae10926b8"'
          if old07 not in src or old22 not in src: raise SystemExit('template SHA token missing')
          src=src.replace(old07,'LAB25_SHA="ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72"')
          src=src.replace(old22,'LAB26_SHA="ac02f3d69923e1173c0d82439ce4094012d7ce62fb92e44141a444158f3829cb"')
          src=src.replace('ptar_moe_ng_v02_mc_native_detail_ps.cso','ptar_moe_ng_v02_lab25_proven_shape_ps.cso')
          src=src.replace('ptar_moe_ng_v02_lab22_phase_fused_mc_ps.cso','ptar_moe_ng_v02_lab26_phase0_early_exit_ps.cso')
          src=src.replace('LAB07','LAB25').replace('lab07','lab25')
          src=src.replace('LAB22','LAB26').replace('lab22','lab26')
          out=bundle/'source/moe_ng_v02_lab26_hw_compare.cpp'
          out.write_text(src,encoding='utf-8')
          required=[
            '6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c',
            'ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72',
            'ac02f3d69923e1173c0d82439ce4094012d7ce62fb92e44141a444158f3829cb',
            '6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16',
            'SAMPLE_TRIADS=600u','SIX_ROTATING_PERMUTATIONS_BALANCED',
            'lab25_median_ms','lab26_median_ms','delta_lab26_minus_lab25_ms'
          ]
          for token in required:
              if token not in src: raise SystemExit(f'generated comparator missing {token}')
          wrong_vs='6328bbd87aac73b25d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
          if wrong_vs in src: raise SystemExit('known corrupted VS SHA detected')
          if 'LAB07' in src or 'lab07' in src or 'LAB22' in src or 'lab22' in src:
              raise SystemExit('old comparator semantic token remains')
          print('[PASS] LAB26 full validator and token-safe LAB25/LAB26 comparator generated')
          '@ | python -
          if($LASTEXITCODE -ne 0){ throw 'source transformation failed' }
          @"
          {
            "variant": "PTAR_NG_MOE_V02_LAB26_PHASE0_EARLY_EXIT",
            "runtime_scaffold_branch": "lab/moe-ng-v02-runtime-integration",
            "research_commit": "2c64764fea0706763cd74cd96c1948f5615449a1",
            "lab25_hardware_result_commit": "041464df41525ffd625a178a577750d8cee170bc",
            "lab26_software_run": 34347812420,
            "lab25_cso_sha256": "ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72",
            "lab26_cso_sha256": "ac02f3d69923e1173c0d82439ce4094012d7ce62fb92e44141a444158f3829cb",
            "lab26_software_equivalence": "WARP_BIT_EXACT_TO_LAB25_CANONICAL_PLUS_3_STRESS_PROBES",
            "lab26_dynamic_fetch_hypothesis": "PHASE0_SKIPS_3_OF_4_SAMPLELEVEL_AFTER_RETAINED_BRANCH",
            "worst_case_texture_contract": "1_GatherGreen_4_SampleLevel_0_UAV",
            "expected_cases": 42,
            "hardware_executed": false
          }
          "@ | Set-Content (Join-Path $env:BUNDLE 'SHADER_PROVENANCE.json') -Encoding utf8

      - name: Build full validator and balanced comparator MT Win8.1
        shell: pwsh
        run: |
          $cmd=@"
          call "$env:VCVARS"
          call "$env:BUNDLE\BUILD_HOST_ONCE_IN_DEV_ENV.bat"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /O2 /MT /W4 /WX /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I "$env:BUNDLE\include" "$env:BUNDLE\source\moe_ng_v02_lab26_hw_compare.cpp" /Fe:"$env:BUNDLE\bin\moe_ng_v02_lab26_hw_compare.exe" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib
          exit /b %errorlevel%
          "@
          $bat=Join-Path $env:RUNNER_TEMP 'build_lab26_compare.bat'; Set-Content $bat $cmd -Encoding ascii
          cmd.exe /d /s /c "`"$bat`""
          if($LASTEXITCODE -ne 0){ throw "build failed $LASTEXITCODE" }

      - name: Hard static audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $full=Join-Path $env:BUNDLE 'bin\ptar_moe_ng_v02_autonomous_validation.exe'
          $cmp=Join-Path $env:BUNDLE 'bin\moe_ng_v02_lab26_hw_compare.exe'
          if(-not (Test-Path $full) -or -not (Test-Path $cmp)){ throw 'runtime executable missing' }
          if((Get-ChildItem "$env:BUNDLE\corpus\input_lr" -Filter '*.png' -File).Count -ne 42){ throw 'input count !=42' }
          if((Get-ChildItem "$env:BUNDLE\corpus\expected_moe_v02_float32" -Filter '*.png' -File).Count -ne 42){ throw 'expected count !=42' }
          $fullImports=Get-Content "$env:BUNDLE\build_evidence\IMPORTS_VALIDATED.txt" -Raw
          if($fullImports -match 'D3DCOMPILER|VCRUNTIME|MSVCP|UCRTBASE|API-MS-WIN-CRT'){ throw 'full validator forbidden import' }
          $dump=Join-Path $env:BUNDLE 'build_evidence\LAB26_COMPARE_IMPORTS.txt'
          $cmd="call `"$env:VCVARS`" && dumpbin /dependents `"$cmp`" > `"$dump`""
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ throw 'dumpbin comparator failed' }
          if((Get-Content $dump -Raw) -match 'D3DCOMPILER|VCRUNTIME|MSVCP|UCRTBASE|API-MS-WIN-CRT'){ throw 'comparator forbidden import' }
          foreach($p in @(
            @{Path="$env:BUNDLE\shaders\ptar_moe_ng_v02_lab25_proven_shape_ps.cso";Hash='ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72'},
            @{Path="$env:BUNDLE\shaders\ptar_moe_ng_v02_lab26_phase0_early_exit_ps.cso";Hash='ac02f3d69923e1173c0d82439ce4094012d7ce62fb92e44141a444158f3829cb'},
            @{Path="$env:BUNDLE\shaders\ptar_k185_control_ps.cso";Hash='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'},
            @{Path="$env:BUNDLE\shaders\ptar_vs.cso";Hash='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'}
          )){
            $got=(Get-FileHash $p.Path -Algorithm SHA256).Hash.ToLowerInvariant(); if($got -ne $p.Hash){ throw "shader hash mismatch $($p.Path) got=$got" }
          }
          $hostSrc=Get-Content "$env:BUNDLE\source\ptar_moe_ng_v02_autonomous_validation.cpp" -Raw
          if($hostSrc -notmatch 'ptar_moe_ng_v02_lab26_phase0_early_exit_ps\.cso' -or $hostSrc -match 'LAB07'){ throw 'full validator LAB26 patch audit failed' }
          $cmpSrc=Get-Content "$env:BUNDLE\source\moe_ng_v02_lab26_hw_compare.cpp" -Raw
          foreach($tok in @('SAMPLE_TRIADS=600u','lab25_median_ms','lab26_median_ms','6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c')){ if($cmpSrc -notmatch [regex]::Escape($tok)){ throw "comparator audit missing $tok" } }
          if($cmpSrc -match '6328bbd87aac73b25d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'){ throw 'known bad VS SHA present' }
          @(
            'LAB26_ONE_SHOT_STATIC_AUDIT=PASS',
            'full_parity_cases=42',
            'same_run_triads=600',
            'same_run_permutations=6',
            'lab25_cso=ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72',
            'lab26_cso=ac02f3d69923e1173c0d82439ce4094012d7ce62fb92e44141a444158f3829cb',
            'runtime_d3dcompiler_required=NO',
            'dynamic_crt_required=NO',
            'windows_subsystem_target=6.03',
            'hardware_executed=false'
          ) | Set-Content "$env:BUNDLE\build_evidence\LAB26_STATIC_AUDIT.txt" -Encoding ascii
          Write-Host '[PASS] LAB26 one-shot hardware pack static audit complete'

      - name: Add one-click hardware launcher and package
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal EnableExtensions
          for %%I in ("%~dp0.") do set "BUNDLE=%%~fI"
          set "OUT=%BUNDLE%\results_lab26_compare_%RANDOM%_%RANDOM%"
          set "FULL=%OUT%\lab26_full"
          set "CMP=%OUT%\same_run_compare"
          mkdir "%OUT%" >nul 2>nul
          mkdir "%FULL%" >nul 2>nul
          mkdir "%CMP%" >nul 2>nul
          echo [PTAR] Step 1/2 - LAB26 42-case hardware parity...
          "%BUNDLE%\bin\ptar_moe_ng_v02_autonomous_validation.exe" --bundle-root "%BUNDLE%" --out "%FULL%"
          if errorlevel 1 goto :fail
          echo [PTAR] Step 2/2 - LAB25 / LAB26 / K185 balanced same-run comparison...
          "%BUNDLE%\bin\moe_ng_v02_lab26_hw_compare.exe" --bundle-root "%BUNDLE%" --out "%CMP%"
          if errorlevel 1 goto :fail
          echo.
          echo [PTAR] PASS - LAB26 full parity and comparison complete.
          echo [PTAR] Results: "%OUT%"
          pause
          exit /b 0
          :fail
          set "RC=%ERRORLEVEL%"
          echo.
          echo [PTAR] FAIL rc=%RC%
          echo [PTAR] Partial results: "%OUT%"
          pause
          exit /b %RC%
          '@ | Set-Content "$env:BUNDLE\RUN_LAB26_FULL_AND_COMPARE.bat" -Encoding ascii
          @'
          PTAR-NG MoE v02 LAB26 GTX960M targeted validation

          Run only RUN_LAB26_FULL_AND_COMPARE.bat.
          It performs the necessary new hardware work only:
          1) 42-case LAB26 parity on the real NVIDIA GPU;
          2) 600 balanced triads comparing hardware-selected LAB25, LAB26, K185.
          Do not close the console before the final PASS line.
          Return the complete results_lab26_compare_... folder as a ZIP.
          '@ | Set-Content "$env:BUNDLE\LAB26_README.txt" -Encoding ascii
          $zip=Join-Path $env:RUNNER_TEMP 'PTAR_NG_MOE_V02_LAB26_ONE_SHOT_GTX_HW_COMPARE_WIN81_X64.zip'
          Compress-Archive -Path (Join-Path $env:BUNDLE '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ZIP_SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-NG-MOE-V02-LAB26-ONE-SHOT-GTX-HW-COMPARE-WIN81-X64
          path: ${{ env.ZIP }}
