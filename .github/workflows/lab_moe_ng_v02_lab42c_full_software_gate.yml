name: LAB42C Full Software Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab42-texture-issue-sweep

permissions:
  contents: read

jobs:
  full-gate:
    if: contains(github.event.head_commit.message, '[run-lab42c-full]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT
      - name: Compile frozen LAB38A and LAB42C
        shell: pwsh
        run: |
          $out='lab_results\lab42c_full'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab38a.cso" /Fc "$out\lab38a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38a_branchless_phase0_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab42c.cso" /Fc "$out\lab42c.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab42c_packed_m1p2_uv_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $hb=(Get-FileHash "$out\lab38a.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $hc=(Get-FileHash "$out\lab42c.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hb -ne 'd60820f62ca69e2cb2ef995c37001f100733e179f0821d7eb83247ad2c0014d3'){ throw "LAB38A hash mismatch $hb" }
          if($hc -ne '24fc8f5a8e28a6f4452cdf57e306cbb5431fee57dbe65141078162769194628f'){ throw "LAB42C hash mismatch $hc" }
          @("LAB38A=$hb","LAB42C=$hc") | Set-Content "$out\HASHES.txt" -Encoding ascii
      - name: Generate shared ABI harness sources
        run: python tools/moe_ng_v02_prepare_shared_abi_harnesses.py --outdir lab_results/lab42c_full
      - name: Build shared WARP harnesses
        shell: pwsh
        run: |
          $out='lab_results\lab42c_full'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          foreach($n in @('float_shared','unorm8_shared')){
            $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 $out\warp_$n.cpp /Fe:$out\warp_$n.exe d3d11.lib dxgi.lib"
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }
      - name: Run full shared-ABI software admission
        shell: pwsh
        run: |
          python tools/moe_ng_v02_shared_abi_full_gate.py `
            --outdir lab_results/lab42c_full `
            --baseline lab38a `
            --candidate lab42c `
            --baseline-sha d60820f62ca69e2cb2ef995c37001f100733e179f0821d7eb83247ad2c0014d3 `
            --candidate-sha 24fc8f5a8e28a6f4452cdf57e306cbb5431fee57dbe65141078162769194628f `
            --baseline-instructions 49 `
            --candidate-instructions 48 `
            --baseline-bytes 2528 `
            --candidate-bytes 2496
      - name: Record packed-UV static facts
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          out=Path('lab_results/lab42c_full')
          r={'protocol':'LAB42C_PACKED_UV_STATIC_FACTS','baseline_sample_positions':[15,16,20,21],'candidate_sample_positions':[16,17,18,19],'baseline_sample_span':6,'candidate_sample_span':3,'instruction_delta':-1,'byte_delta':-32,'candidate_hash':'24fc8f5a8e28a6f4452cdf57e306cbb5431fee57dbe65141078162769194628f'}
          (out/'PACKED_UV_FACTS.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8')
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab42c-full-software-gate
          path: lab_results/lab42c_full
