name: LAB31G Full Software Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab31-codegen-sweep

permissions:
  contents: read

jobs:
  full-gate:
    if: contains(github.event.head_commit.message, '[run-lab31g-full]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Compile frozen LAB30C and LAB31G
        shell: pwsh
        run: |
          $out='lab_results\lab31g_full_v2'
          New-Item -ItemType Directory -Force $out | Out-Null
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab30c.cso" /Fc "$out\lab30c.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab30c_movc_frac_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab31g.cso" /Fc "$out\lab31g.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab31g_host_inv_half_mad_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Generate ABI-specific harness sources
        run: python tools/lab31g_prepare_harnesses.py

      - name: Build WARP harness variants
        shell: pwsh
        run: |
          $out='lab_results\lab31g_full_v2'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          foreach($n in @('float_legacy','float_lab31g','unorm8_legacy','unorm8_lab31g')){
            $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 $out\warp_$n.cpp /Fe:$out\warp_$n.exe d3d11.lib dxgi.lib"
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }

      - name: Run full ABI-aware software admission
        run: python tools/lab31g_full_validate.py --outdir lab_results/lab31g_full_v2

      - name: Upload full gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab31g-full-software-gate-v2
          path: lab_results/lab31g_full_v2
