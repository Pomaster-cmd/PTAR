name: RC38 Borderless Authority Lab

on:
  push:
    branches:
      - build/rc38-borderless-authority-20260913
    paths-ignore:
      - 'lab/borderless/rc38/generated/**'

permissions:
  contents: read

jobs:
  windows-rc38-lab:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build reproducible RC38 Win8.1 sidecar and integration host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\rc38\out mkdir lab\borderless\rc38\out
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          cl %CFLAGS% /LD lab\borderless\rc38\ptar_borderless_rc38.cpp /Fe:lab\borderless\rc38\out\ptar_borderless.dll user32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\rc38\ptar_borderless_host_test.cpp /Fe:lab\borderless\rc38\out\ptar_borderless_host_test.exe user32.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 1
          dumpbin /imports lab\borderless\rc38\out\ptar_borderless.dll > lab\borderless\rc38\out\SIDECAR_IMPORTS.txt
          dumpbin /headers lab\borderless\rc38\out\ptar_borderless.dll > lab\borderless\rc38\out\SIDECAR_HEADERS.txt

      - name: Verify RC38 sidecar reproducibility
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /LD lab\borderless\rc38\ptar_borderless_rc38.cpp /Fe:lab\borderless\rc38\out\ptar_borderless_repro.dll user32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03
          if errorlevel 1 exit /b 1
          fc /b lab\borderless\rc38\out\ptar_borderless.dll lab\borderless\rc38\out\ptar_borderless_repro.dll >nul
          if errorlevel 1 exit /b 2
          echo RC38_SIDECAR_REPRODUCIBILITY=PASS

      - name: Run RC38 integrated sidecar host test
        shell: cmd
        run: |
          pushd lab\borderless\rc38\out
          ptar_borderless_host_test.exe > RC38_HOST_TEST.txt 2>&1
          set RC=%ERRORLEVEL%
          type RC38_HOST_TEST.txt
          popd
          exit /b %RC%

      - name: Rebuild inherited borderless lab gates
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\out mkdir lab\borderless\out
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\borderless
          set LFLAGS=/link /SUBSYSTEM:CONSOLE,6.03
          cl %CFLAGS% lab\borderless\ptar_borderless_geometry_stress.cpp /Fe:lab\borderless\out\geometry_stress.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_input_stress.cpp /Fe:lab\borderless\out\input_stress.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_event_parity.cpp /Fe:lab\borderless\out\event_parity.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_user32_virtualization.cpp /Fe:lab\borderless\out\user32_virtualization.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_thread_affinity.cpp /Fe:lab\borderless\out\thread_affinity.exe user32.lib d3d11.lib dxgi.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_dpi_policy.cpp /Fe:lab\borderless\out\dpi_policy.exe user32.lib gdi32.lib shcore.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_lifecycle_stress.cpp /Fe:lab\borderless\out\lifecycle_stress.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_window_stress.cpp /Fe:lab\borderless\out\window_stress.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_takeover_harness.cpp /Fe:lab\borderless\out\takeover_harness.exe user32.lib gdi32.lib d3d11.lib dxgi.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_warp_stress.cpp /Fe:lab\borderless\out\warp_stress.exe user32.lib d3d11.lib dxgi.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_occlusion_focus_stress.cpp /Fe:lab\borderless\out\occlusion_focus_stress.exe user32.lib d3d11.lib dxgi.lib %LFLAGS%
          if errorlevel 1 exit /b 1

      - name: Run inherited borderless regression gates with diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            @{ Exe='geometry_stress.exe';          Log='GEOMETRY_STRESS.txt' },
            @{ Exe='input_stress.exe';             Log='INPUT_STRESS.txt' },
            @{ Exe='event_parity.exe';             Log='EVENT_PARITY.txt' },
            @{ Exe='user32_virtualization.exe';    Log='USER32_VIRTUALIZATION.txt' },
            @{ Exe='thread_affinity.exe';          Log='THREAD_AFFINITY.txt' },
            @{ Exe='dpi_policy.exe';               Log='DPI_POLICY.txt' },
            @{ Exe='lifecycle_stress.exe';         Log='LIFECYCLE_STRESS.txt' },
            @{ Exe='window_stress.exe';            Log='WINDOW_STRESS.txt' },
            @{ Exe='takeover_harness.exe';         Log='TAKEOVER_HARNESS.txt' },
            @{ Exe='warp_stress.exe';              Log='WARP_STRESS.txt' },
            @{ Exe='occlusion_focus_stress.exe';   Log='OCCLUSION_FOCUS_STRESS.txt' }
          )
          foreach ($t in $tests) {
            $exe = Join-Path 'lab/borderless/out' $t.Exe
            $log = Join-Path 'lab/borderless/out' $t.Log
            Write-Host "::group::$($t.Exe)"
            Write-Host ("START={0:o}" -f (Get-Date))
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            & $exe *> $log
            $rc = $LASTEXITCODE
            $sw.Stop()
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            Write-Host ("EXIT={0} ELAPSED_MS={1}" -f $rc,$sw.ElapsedMilliseconds)
            Write-Host "::endgroup::"
            if ($rc -ne 0) { throw ("{0} failed with exit code {1}" -f $t.Exe,$rc) }
          }

      - name: Export and verify generated payload locally
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='lab/borderless/rc38/out/ptar_borderless.dll'
          $gen='lab/borderless/rc38/generated'
          New-Item -ItemType Directory -Force -Path $gen | Out-Null
          $bytes=[IO.File]::ReadAllBytes($out)
          $b64=[Convert]::ToBase64String($bytes)
          [IO.File]::WriteAllText((Join-Path $gen 'ptar_borderless.dll.b64'),$b64)
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content -NoNewline (Join-Path $gen 'ptar_borderless.dll.sha256') -Encoding ASCII
          $bytes.Length | Set-Content -NoNewline (Join-Path $gen 'ptar_borderless.dll.size') -Encoding ASCII
          Copy-Item 'lab/borderless/rc38/out/RC38_HOST_TEST.txt' (Join-Path $gen 'RC38_HOST_TEST.txt') -Force
          Copy-Item 'lab/borderless/rc38/out/SIDECAR_IMPORTS.txt' (Join-Path $gen 'SIDECAR_IMPORTS.txt') -Force
          Copy-Item 'lab/borderless/rc38/out/SIDECAR_HEADERS.txt' (Join-Path $gen 'SIDECAR_HEADERS.txt') -Force
          $roundtrip=[Convert]::FromBase64String((Get-Content (Join-Path $gen 'ptar_borderless.dll.b64') -Raw))
          $tmp=Join-Path $env:RUNNER_TEMP 'ptar_borderless_roundtrip.dll'
          [IO.File]::WriteAllBytes($tmp,$roundtrip)
          if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){throw 'Base64 roundtrip hash mismatch'}
          foreach($p in @('ptar_borderless.dll.b64','ptar_borderless.dll.sha256','ptar_borderless.dll.size','RC38_HOST_TEST.txt','SIDECAR_IMPORTS.txt','SIDECAR_HEADERS.txt')){if(-not(Test-Path (Join-Path $gen $p) -PathType Leaf)){throw ('Missing generated payload file: '+$p)}}
          Write-Host ('RC38_LOCAL_EXPORT_SHA256='+$sha)
          Write-Host 'RC38_GENERATED_PAYLOAD_READY=PASS'
          Write-Host 'PUBLISH_OWNER=rc38-publish-payload.yml'
