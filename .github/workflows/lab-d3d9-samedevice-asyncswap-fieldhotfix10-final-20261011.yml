name: LAB D3D9 HF10 SAME DEVICE FINAL 20261011

on:
  push:
    branches: [lab/d3d9-samedevice-asyncswap-fieldhotfix10-20261011]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Apply exact HF10 source stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\lab\pairbal2_singleclock_fieldhotfix5\apply_d3d9_immediate_present_policy.ps1
          .\lab\pairbal2_fieldhotfix3\apply_existing_diag_ring.ps1
          python .\lab\d3d11_presenter_port_fieldhotfix7\apply_d3d11_presenter_topology.py
          python .\lab\d3d11_presenter_port_fieldhotfix7\apply_d3d9_nonblocking_mailbox.py
          python .\lab\d3d9_same_adapter_fieldhotfix8\apply_same_adapter_presenter.py
          python .\lab\d3d9_activation_identity_fieldhotfix9\apply_activation_identity_presenter.py
          python .\lab\d3d9_samedevice_asyncswap_fieldhotfix10\apply_samedevice_asyncswap.py

      - uses: actions/download-artifact@v4
        with:
          name: PTAR-D3D9-SAME-DEVICE-ASYNC-SWAP-FIELDHOTFIX10
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Pomaster-cmd/PTAR
          run-id: 38129809535

      - name: Validate compiled HF10 runtime and exact topology
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='94be2ca76366bf9d9e807e76ba040fb4c9004f82dbc5ce1a630f2d0a58189ef0'
          $actual=(Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "runtime hash mismatch $actual"}
          $p=Get-Content compat\x86_d3d9\ptar_d3d9_proxy.cpp -Raw
          $h=Get-Content compat\x86_d3d9\ptar_d3d9_isolated_presenter.h -Raw
          foreach($m in @('CreateAdditionalSwapChain','IDirect3DSwapChain9','D3DPRESENT_INTERVAL_ONE','D3DPRESENT_DONOTWAIT','PTAR_D3D9_FG_ACTIVATION_STATE.txt','SAME_DEVICE_ADDITIONAL_SWAPCHAIN')){if($h -notmatch [regex]::Escape($m)){throw "HF10 header gate missing $m"}}
          if($p -notmatch [regex]::Escape('ptarCreateFlags=flags|D3DCREATE_MULTITHREADED')){throw 'D3DCREATE_MULTITHREADED source gate missing'}
          foreach($bad in @('IDirect3D9Ex','IDirect3DDevice9Ex','CreateDeviceEx','PresentEx','PtD3D9IsoOpenSharedTexture','g_ptarD3D9IsoDisplayDevice')){if($h -match [regex]::Escape($bad)){throw "obsolete second-device path remains $bad"}}
          $starts=([regex]::Matches($p,'PtD3D9IsolatedPresenterStart\(')).Count;if($starts -ne 1){throw "lazy start regression $starts"}
          $g=$h.IndexOf('slot->generatedSurface,true,slot->generatedMarker');$r=$h.IndexOf('slot->realSurface,false,slot->realMarker');if($g -lt 0 -or $r -lt 0 -or $g -gt $r){throw 'G-before-R order lost'}
          $code=($h -split "`n"|ForEach-Object{($_ -replace '//.*$','')}) -join "`n"
          if($code -match 'WaitForVBlank|DwmFlush|\bSleep\s*\('){throw 'manual pacing call introduced'}
          if($h -match 'PtD3D9IsoFenceProducer'){throw 'blocking producer fence returned'}
          @(
            'HF10_FINAL_TOPOLOGY=PASS',
            ('D3D9_SHA256='+$actual),
            'SECOND_D3D9EX_DEVICE=REMOVED',
            'CROSS_GPU_SHARED_HANDLES=REMOVED',
            'SOURCE_DEVICE=D3DCREATE_MULTITHREADED',
            'DISPLAY_SWAP=ADDITIONAL_SAME_DEVICE',
            'DISPLAY_INTERVAL=ONE',
            'DISPLAY_PRESENT_FLAG=DONOTWAIT',
            'DISPLAY_ORDER=GENERATED_THEN_MATCHING_REAL',
            'ACTIVATION_STATE_ALWAYS_ON=YES'
          )|Set-Content artifact\HF10_FINAL_TOPOLOGY.txt -Encoding ascii

      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x86}

      - name: Compile existing F5 F1 verifiers and validate ring ABI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force smoke_game | Out-Null
          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe";$shared='lab\ctrl_ui_real_visibility\PTARD3D9PresentTelemetryReader.cs'
          & $csc /nologo /target:exe /optimize+ /platform:x86 /out:artifact\ptar_vblank3_d3d9_autostart.exe $shared lab\ctrl_ui_real_visibility\PTARVisiblePacingVerifier_D3D9RuntimeRing.cs;if($LASTEXITCODE){throw 'F5 compile failed'}
          & $csc /nologo /target:exe /optimize+ /platform:x86 /out:artifact\ptar_presentshed1_visible.exe $shared lab\ctrl_ui_real_visibility\PTARVisiblePacingVerifierPresentShed1_D3D9RuntimeRing.cs;if($LASTEXITCODE){throw 'F1 compile failed'}
          & artifact\ptar_vblank3_d3d9_autostart.exe --selftest|Tee-Object artifact\F5_VERIFIER_SELFTEST.txt;if($LASTEXITCODE){throw 'F5 selftest failed'}
          & artifact\ptar_presentshed1_visible.exe --selftest|Tee-Object artifact\F1_VERIFIER_SELFTEST.txt;if($LASTEXITCODE){throw 'F1 selftest failed'}
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 lab\ctrl_ui_real_visibility\d3d9_diag_ring_harness.cpp /link /OUT:smoke_game\game.exe /SUBSYSTEM:CONSOLE,6.03;if($LASTEXITCODE){throw 'harness compile failed'}
          Copy-Item artifact\d3d9.dll smoke_game\d3d9.dll -Force
          $root=(Resolve-Path smoke_game).Path;$game=(Resolve-Path smoke_game\game.exe).Path;$dll=(Resolve-Path smoke_game\d3d9.dll).Path;$env:PTAR_GAME_ROOT=$root;$env:PTAR_TARGET_EXE=$game
          $proc=Start-Process $game -ArgumentList ('"'+$dll+'" mixed 20000') -PassThru -RedirectStandardOutput artifact\HARNESS.txt;Start-Sleep -Milliseconds 300
          & artifact\ptar_vblank3_d3d9_autostart.exe 5 --autostart 2>&1|Tee-Object artifact\F5_RUNTIME_RING_SMOKE.txt;if($LASTEXITCODE){throw 'F5 ring failed'}
          $env:PTAR_FG_PRESENTSHED1_OUTPUT_PREFIX=Join-Path $root 'F1_SMOKE'; & artifact\ptar_presentshed1_visible.exe 5 --autostart 2>&1|Tee-Object artifact\F1_RUNTIME_RING_SMOKE.txt;if($LASTEXITCODE){throw 'F1 ring failed'}
          if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force}
          'CTRL_F5_RUNTIME_RING_ABI=PASS'|Set-Content artifact\CTRL_F5_RUNTIME_RING.txt -Encoding ascii
          'CTRL_F1_RUNTIME_RING_ABI=PASS'|Set-Content artifact\CTRL_F1_RUNTIME_RING.txt -Encoding ascii

      - name: Package final evidence
        shell: pwsh
        run: |
          Copy-Item compat\x86_d3d9\ptar_d3d9_isolated_presenter.h artifact\ptar_d3d9_isolated_presenter.h -Force
          Copy-Item compat\x86_d3d9\ptar_d3d9_proxy.cpp artifact\ptar_d3d9_proxy_patched.cpp -Force
          @(
            'PTAR_D3D9_FIELDHOTFIX10=SAME_DEVICE_ASYNC_SWAPCHAIN_FINAL',
            ('SOURCE_COMMIT='+$env:GITHUB_SHA),
            'COMPILED_RUNTIME_SOURCE_RUN=38129809535',
            'D3D9_SHA256=94be2ca76366bf9d9e807e76ba040fb4c9004f82dbc5ce1a630f2d0a58189ef0',
            'FIELD_HF9=CTRL_F6_REQUEST_STILL_RETURNS_OFF',
            'CORRECTION=SAME_GAME_D3D9_DEVICE_PLUS_ADDITIONAL_SWAPCHAIN',
            'SOURCE_DEVICE_THREADSAFE=D3DCREATE_MULTITHREADED',
            'DISPLAY_PRESENT=D3DPRESENT_INTERVAL_ONE_PLUS_DONOTWAIT',
            'CROSS_GPU_SHARED_HANDLES=REMOVED',
            'ACTIVATION_STATE_FILE=PTAR_D3D9_FG_ACTIVATION_STATE.txt',
            'CTRL_F5_F1_PRESERVED=YES'
          )|Set-Content artifact\PTAR_D3D9_FIELDHOTFIX10_VERSION.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-D3D9-SAME-DEVICE-ASYNC-SWAP-FIELDHOTFIX10-FINAL
          path: artifact/
          if-no-files-found: error
