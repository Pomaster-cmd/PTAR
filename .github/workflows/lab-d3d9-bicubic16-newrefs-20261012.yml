name: LAB D3D9 BIC16 R3
on:
  push:
    branches:
      - lab/bic16-r3
  workflow_dispatch:
jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile Bic16 R3 SM3
        shell: pwsh
        run: .\lab\bicubic16\compile_bicubic16.ps1
      - name: Benchmark Bic16 R3 against canonical SPEC5
        shell: pwsh
        run: .\lab\bicubic16\run_bicubic16_perf.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BIC16-R3-LAB
          path: artifact/
          if-no-files-found: error
