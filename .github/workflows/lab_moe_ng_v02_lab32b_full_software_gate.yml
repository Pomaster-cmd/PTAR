name: LAB32B Full Software Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab32-axis-phase-sweep

permissions:
  contents: read

jobs:
  full-gate:
    if: contains(github.event.head_commit.message, '[run-lab32b-full]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile frozen LAB31G and LAB32B
        shell: pwsh
        run: |
          $out='lab_results\lab32b_full'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab31g.cso" /Fc "$out\lab31g.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab31g_host_inv_half_mad_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab32b.cso" /Fc "$out\lab32b.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab32b_axis_component_movc_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $h31=(Get-FileHash "$out\lab31g.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h32=(Get-FileHash "$out\lab32b.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h31 -ne 'ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1'){ throw "LAB31G hash mismatch $h31" }
          if($h32 -ne '65ed361923b37f0f2ec93e602b841bd11801820afa7ca94382606974d2eccab2'){ throw "LAB32B hash mismatch $h32" }
          @("LAB31G=$h31","LAB32B=$h32") | Set-Content "$out\HASHES.txt" -Encoding ascii

      - name: Generate shared ABI harness sources
        shell: pwsh
        run: python tools/lab32b_prepare_harnesses.py

      - name: Build shared WARP harnesses
        shell: pwsh
        run: |
          $out='lab_results\lab32b_full'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          foreach($n in @('float_shared','unorm8_shared')){
            $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 $out\warp_$n.cpp /Fe:$out\warp_$n.exe d3d11.lib dxgi.lib"
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }

      - name: Run full shared-ABI software admission
        shell: pwsh
        run: python tools/lab32b_full_validate.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab32b-full-software-gate
          path: lab_results/lab32b_full
