name: LAB CTRL UI bridge controller 20261009

on:
  push:
    branches: [lab/ctrl-ui-real-visibility-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-controller:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile x64 bridge controller
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifact | Out-Null
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /optimize+ /platform:x64 /out:artifact\PTARD3D9DiagHudBridgeController.exe lab\ctrl_ui_real_visibility\PTARD3D9DiagHudBridgeController.cs
          if($LASTEXITCODE -ne 0){throw 'bridge controller compile failed'}
          Write-Host 'BRIDGE_CONTROLLER_X64_COMPILE=PASS'
      - name: Run bridge writer selftest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & artifact\PTARD3D9DiagHudBridgeController.exe --selftest | Tee-Object artifact\PTARD3D9DiagHudBridgeController_SELFTEST.txt
          if($LASTEXITCODE -ne 0){throw "bridge controller selftest failed rc=$LASTEXITCODE"}
          $t=Get-Content artifact\PTARD3D9DiagHudBridgeController_SELFTEST.txt -Raw
          if($t -notmatch 'SELFTEST=PASS'){throw 'bridge selftest PASS marker missing'}
          if($t -notmatch 'F5_TYPES=19-23,28'){throw 'F5 type contract missing'}
          if($t -notmatch 'F1_TYPES=24-27'){throw 'F1 type contract missing'}
          Write-Host 'CTRL_F1_F5_BRIDGE_WRITER=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-CTRL-UI-BRIDGE-CONTROLLER
          path: |
            artifact/PTARD3D9DiagHudBridgeController.exe
            artifact/PTARD3D9DiagHudBridgeController_SELFTEST.txt
