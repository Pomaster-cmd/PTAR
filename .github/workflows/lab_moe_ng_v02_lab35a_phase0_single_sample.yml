name: LAB35A Phase0 Single-Sample Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab35-phase0-single-sample

permissions:
  contents: read

jobs:
  codegen-warp:
    if: contains(github.event.head_commit.message, '[run-lab35a]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy

      - name: Compile LAB31G and LAB35A
        shell: pwsh
        run: |
          $out='lab_results\lab35a'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab31g.cso" /Fc "$out\lab31g.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab31g_host_inv_half_mad_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab35a.cso" /Fc "$out\lab35a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab35a_phase0_single_sample_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $h31=(Get-FileHash "$out\lab31g.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h31 -ne 'ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1'){ throw "LAB31G hash mismatch $h31" }
          $h35=(Get-FileHash "$out\lab35a.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("LAB31G=$h31","LAB35A=$h35") | Set-Content "$out\HASHES.txt" -Encoding ascii
          Write-Host "LAB35A=$h35"

      - name: Audit codegen and phase0 dynamic texture path
        shell: pwsh
        run: |
          @'
          import hashlib,json,re
          from collections import Counter
          from pathlib import Path
          p=Path('lab_results/lab35a'); pat=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b')
          def ops(name):
              out=[]
              for raw in (p/f'{name}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'): continue
                  m=pat.match(raw)
                  if not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  out.append(op)
              return out
          rows={}
          for n in ('lab31g','lab35a'):
              o=ops(n); c=Counter(o); cso=p/f'{n}.cso'
              rows[n]={'sha256':hashlib.sha256(cso.read_bytes()).hexdigest(),'instructions':len(o),'bytes':cso.stat().st_size,'gather4':sum(v for k,v in c.items() if k.startswith('gather4')),'sample_l':sum(v for k,v in c.items() if k.startswith('sample_l')),'div':c.get('div',0),'udiv':c.get('udiv',0),'op_counts':dict(sorted(c.items()))}
          o=ops('lab35a')
          if_positions=[i for i,x in enumerate(o) if x in ('if_nz','if_z')]
          if not if_positions: raise SystemExit('no phase branch found')
          branch=if_positions[0]
          samples=[i for i,x in enumerate(o) if x.startswith('sample_l')]
          before=sum(i<branch for i in samples); after=sum(i>branch for i in samples)
          contract=all(rows[n]['gather4']==1 and rows[n]['sample_l']==4 for n in rows)
          dynamic=(before==1 and after==3)
          r={'protocol':'LAB35A_PHASE0_SINGLE_SAMPLE_CODEGEN','lab31g':rows['lab31g'],'lab35a':rows['lab35a'],'texture_contract_pass':contract,'phase_branch_instruction_index':branch,'sample_indices':samples,'sample_l_before_phase_branch':before,'sample_l_after_phase_branch':after,'phase0_single_sample_path_pass':dynamic,'pass':bool(contract and dynamic)}
          (p/'CODEGEN_DYNAMIC_PATH.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8');print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('dynamic-path audit failed')
          '@ | python -

      - name: Prepare and build shared-ABI float WARP harness
        shell: pwsh
        run: |
          python tools/moe_ng_v02_prepare_shared_abi_harnesses.py --outdir lab_results/lab35a
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 lab_results\lab35a\warp_float_shared.cpp /Fe:lab_results\lab35a\warp_float_shared.exe d3d11.lib dxgi.lib"
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Six-resolution bit-exact WARP parity
        shell: pwsh
        run: |
          @'
          import json,subprocess
          from pathlib import Path
          import numpy as np
          p=Path('lab_results/lab35a'); exe=p/'warp_float_shared.exe'; vs=p/'fullscreen_vs.cso'; rows=[]
          for w,h in [(24,24),(64,64),(192,192),(320,180),(640,360),(1280,720)]:
              ow,oh=w*3//2,h*3//2; y,x=np.mgrid[0:h,0:w]; rng=np.random.default_rng(350000+w*7+h*11)
              xf=x.astype(np.float32)/np.float32(max(w-1,1)); yf=y.astype(np.float32)/np.float32(max(h-1,1)); noise=rng.random((h,w),dtype=np.float32); checker=((x+y)&1).astype(np.float32)
              img=np.stack([np.clip(.06+.62*xf+.28*checker,0,1),np.clip(.04+.67*yf+.24*noise,0,1),np.clip(.08+.50*noise+.35*(xf*yf),0,1),np.ones((h,w),np.float32)],2).astype(np.float32)
              inp=p/f'in_{w}x{h}.f32'; a=p/f'a_{w}x{h}.f32'; b=p/f'b_{w}x{h}.f32'; img.tofile(inp)
              common=[str(exe),str(inp),str(w),str(h),str(ow),str(oh)]
              subprocess.run(common+[str(p/'lab31g.cso'),str(vs),str(a)],check=True)
              subprocess.run(common+[str(p/'lab35a.cso'),str(vs),str(b)],check=True)
              aa=np.fromfile(a,np.float32); bb=np.fromfile(b,np.float32); d=np.abs(aa-bb)
              rows.append({'input':f'{w}x{h}','output':f'{ow}x{oh}','values':int(aa.size),'different_values':int(np.count_nonzero(d)),'max_abs':float(d.max()) if d.size else 0.0,'bit_exact':bool(np.array_equal(aa,bb))})
              for q in (inp,a,b): q.unlink(missing_ok=True)
          r={'protocol':'LAB35A_MULTIRES_WARP_PARITY','cases':rows,'pass':all(x['bit_exact'] for x in rows)}
          (p/'WARP_PARITY.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8');print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('LAB35A WARP drift')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab35a-phase0-single-sample-gate
          path: lab_results/lab35a
