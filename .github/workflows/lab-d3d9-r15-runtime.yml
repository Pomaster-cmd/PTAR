name: LAB D3D9 R15 TRUE SAMPLING RUNTIME
on:
  push:
    branches:
      - lab/r15-jitter9-true720
  workflow_dispatch:

jobs:
  runtime-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Rebuild R14 lineage and compile R15 game sampling hooks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifact,build_x86 | Out-Null

          $fgFiles=@(
            'compat/x86_d3d9/ptar_fg_pacer.h',
            'compat/x86_d3d9/ptar_fg_me_coarse_ps.hlsl',
            'compat/x86_d3d9/ptar_fg_me_refine_ps.hlsl',
            'compat/x86_d3d9/ptar_fg_interpolate_ps.hlsl',
            'compat/x86_d3d9/ptar_f7_benchmark.h')

          .\lab\tsr1\apply_r10_aliasresidual.ps1
          .\lab\tsr1\apply_r11_plsr1.ps1
          .\lab\tsr1\apply_r12_resaa1.ps1
          .\lab\tsr1\apply_r13_plsr_max1.ps1
          .\lab\tsr1\run_r13_tsr_ci_compat.ps1

          $fgBefore=@{}
          foreach($f in $fgFiles){$fgBefore[$f]=(Get-FileHash $f -Algorithm SHA256).Hash}

          .\lab\tsr1\apply_r14_mfsr1_accum1080.ps1
          $fxc=Get-Command fxc.exe -ErrorAction Stop
          $fxcPath=if($fxc.Path){$fxc.Path}else{$fxc.FullName}

          & $fxcPath /nologo /T ps_3_0 /E main /O3 `
            /Fh build_x86\ptar_tsr1_resolve_ps_bytecode.h /Vn g_ptarTsr1ResolvePs `
            /Fo artifact\R14_TSR_RESOLVE.cso /Fc artifact\R14_TSR_RESOLVE_ASM.txt `
            lab\tsr1\ptar_tsr1_resolve_ps.hlsl
          if($LASTEXITCODE){throw 'R14 resolve compile failed'}

          & $fxcPath /nologo /T ps_3_0 /E main /O3 `
            /Fh build_x86\ptar_r14_restore_ps_bytecode.h /Vn g_ptarR14RestorePs `
            /Fo artifact\R14_RESTORE.cso /Fc artifact\R14_RESTORE_ASM.txt `
            lab\tsr1\ptar_r14_restore_ps.hlsl
          if($LASTEXITCODE){throw 'R14 restore compile failed'}

          .\lab\tsr1\apply_r14_runtime_accum1080.ps1

          Copy-Item lab\r15_jitter9\ptar_vs_jitter_patch.h build_x86\ptar_r15_vs_jitter_patch.h -Force
          .\lab\r15_jitter9\apply_r15_game_sampling_runtime.ps1

          & cl.exe /nologo /LD /O2 /MT /W4 /WX /EHsc `
            /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 `
            /I build_x86 `
            compat\x86_d3d9\ptar_d3d9_proxy.cpp `
            /link user32.lib `
            /DEF:compat\x86_d3d9\d3d9_proxy.def `
            /OUT:artifact\d3d9_r15_sampling.dll `
            /SUBSYSTEM:WINDOWS,6.03
          if($LASTEXITCODE){throw 'R15 sampling runtime compile failed'}

          dumpbin /headers artifact\d3d9_r15_sampling.dll | Out-File artifact\R15_HEADERS.txt -Encoding ascii
          dumpbin /exports artifact\d3d9_r15_sampling.dll | Out-File artifact\R15_EXPORTS.txt -Encoding ascii
          dumpbin /dependents artifact\d3d9_r15_sampling.dll | Out-File artifact\R15_DEPENDENTS.txt -Encoding ascii
          $hd=Get-Content artifact\R15_HEADERS.txt -Raw
          $ex=Get-Content artifact\R15_EXPORTS.txt -Raw
          $dp=Get-Content artifact\R15_DEPENDENTS.txt -Raw
          if($hd -notmatch '14C machine \(x86\)' -or $hd -notmatch '6\.03 subsystem version'){throw 'R15 Win8.1 x86 PE contract failed'}
          foreach($n in @('Direct3DCreate9','Direct3DCreate9Ex','PTAR_D3D9_DIAG_STATE')){if($ex -notmatch [regex]::Escape($n)){throw "R15 missing export $n"}}
          foreach($bad in @('VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($dp -match $bad){throw "R15 forbidden dependency $bad"}}

          foreach($f in $fgFiles)
          {
            $after=(Get-FileHash $f -Algorithm SHA256).Hash
            if($after -ne $fgBefore[$f]){throw "R15 modified frozen FG file: $f"}
          }

          $proxy=Get-Content compat\x86_d3d9\ptar_d3d9_proxy.cpp -Raw
          foreach($token in @(
            'PTAR R15 TRUE720 JITTER9 RUNTIME',
            'gameBias-=0.5849625007211562f',
            'PatchVtableSlot(dev,69',
            'PatchVtableSlot(dev,91',
            'PatchVtableSlot(dev,92',
            'PatchVtableSlot(dev,94',
            'PtR15AdvanceForNextGameFrame(self)',
            'R14_MFSR1_ACCUM_RESOLVE'))
          {
            if($proxy -notmatch [regex]::Escape($token)){throw "R15 runtime token missing: $token"}
          }
          if($proxy -match [regex]::Escape('g_ptar.currentRealTexture=g_ptar.generatedTexture')){throw 'R15 contaminates FG history'}

          $runtimeSha=(Get-FileHash artifact\d3d9_r15_sampling.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            ('SOURCE_COMMIT='+$env:GITHUB_SHA),
            'R15_RUNTIME_CLASS=LAB_ONLY_NO_FIELD_PACKAGE',
            'R15_JITTER=CALIBRATED_D3D9_3X3',
            'R15_JITTER_PHASES=-1/3,0,+1/3_SOURCE_PIXEL',
            'R15_JITTER_SCOPE=MAIN_SOURCE_RT_ONLY',
            'R15_LOD_BIAS=-0.5849625007211562',
            'R15_LOD_SCOPE=MAIN_SOURCE_RT_ONLY',
            'R15_FG_SCOPE=OFF_ONLY',
            'R15_R14_HISTORY=UNCHANGED_AT_THIS_STAGE',
            'R15_FG_FILES_IDENTICAL_TO_R13=PASS',
            'WIN81_X86=PASS',
            ('R15_RUNTIME_SHA256='+$runtimeSha)) | Set-Content artifact\R15_RUNTIME_VALIDATION.txt -Encoding ascii

          Write-Host "R15_SAMPLING_RUNTIME_SHA256=$runtimeSha"
          Write-Host 'R15_FG_FILES_IDENTICAL_TO_QUALIFIED_R13=PASS'
          Write-Host 'R15_TRUE_SAMPLING_RUNTIME_BUILD=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: R15-TRUE-SAMPLING-RUNTIME-LAB
          path: |
            artifact/d3d9_r15_sampling.dll
            artifact/R15_RUNTIME_VALIDATION.txt
            artifact/R15_HEADERS.txt
            artifact/R15_EXPORTS.txt
            artifact/R15_DEPENDENTS.txt
          if-no-files-found: error
