name: LAB46 cubic-anchor full software gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab46-cubic-anchor
    paths:
      - 'src/hlsl/moe_ng_v02/ptar_moe_ng_v02_lab38a_branchless_phase0_ps.hlsl'
      - 'src/hlsl/moe_ng_v02/ptar_moe_ng_v02_lab46*.hlsl'
      - '.github/workflows/lab_moe_ng_v02_lab46_full_software_gate.yml'
      - 'tools/moe_ng_v02_prepare_shared_abi_harnesses.py'
      - 'tools/moe_ng_v02_shared_abi_full_gate.py'
      - 'tools/lab_moe_ng_v02_warp_validate.py'
      - 'tools/lab_moe_ng_v02_warp_harness*.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: lab46a
            source: src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab46a_f0_anchor_compact_coeff_ps.hlsl
            sha: c019ca0533ad14e8dd24caf3c52d792a334526de2c7f24f2e3b0d9d3726883bf
            bytes: 2500
          - candidate: lab46b
            source: src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab46b_f1_anchor_compact_coeff_ps.hlsl
            sha: e3971da8f8268db6532cd606d468efac5782bd4154d7a1c96503b0c0186103ea
            bytes: 2504
          - candidate: lab46c
            source: src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab46c_f0_anchor_full_coeff_ps.hlsl
            sha: 5ae19a8c0748bee70a14f52f18bd73453fb04025eab060c9e019d2ff12936924
            bytes: 2500
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile frozen LAB38A and candidate
        shell: pwsh
        run: |
          $out='lab_results\${{ matrix.candidate }}_full'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab38a.cso" /Fc "$out\lab38a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38a_branchless_phase0_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\${{ matrix.candidate }}.cso" /Fc "$out\${{ matrix.candidate }}.asm" '${{ matrix.source }}'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $hb=(Get-FileHash "$out\lab38a.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $hc=(Get-FileHash "$out\${{ matrix.candidate }}.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hb -ne 'd60820f62ca69e2cb2ef995c37001f100733e179f0821d7eb83247ad2c0014d3'){ throw "LAB38A hash mismatch $hb" }
          if($hc -ne '${{ matrix.sha }}'){ throw "${{ matrix.candidate }} hash mismatch $hc" }
          @("LAB38A=$hb","${{ matrix.candidate }}=$hc") | Set-Content "$out\HASHES.txt" -Encoding ascii

      - name: Generate shared ABI harness sources
        run: python tools/moe_ng_v02_prepare_shared_abi_harnesses.py --outdir lab_results/${{ matrix.candidate }}_full

      - name: Build shared WARP harnesses
        shell: pwsh
        run: |
          $out='lab_results\${{ matrix.candidate }}_full'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          foreach($n in @('float_shared','unorm8_shared')){
            $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 $out\warp_$n.cpp /Fe:$out\warp_$n.exe d3d11.lib dxgi.lib"
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }

      - name: Run full shared-ABI software admission
        shell: pwsh
        run: |
          python tools/moe_ng_v02_shared_abi_full_gate.py `
            --outdir lab_results/${{ matrix.candidate }}_full `
            --baseline lab38a `
            --candidate ${{ matrix.candidate }} `
            --baseline-sha d60820f62ca69e2cb2ef995c37001f100733e179f0821d7eb83247ad2c0014d3 `
            --candidate-sha ${{ matrix.sha }} `
            --baseline-instructions 49 `
            --candidate-instructions 48 `
            --baseline-bytes 2528 `
            --candidate-bytes ${{ matrix.bytes }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.candidate }}-full-software-gate
          path: lab_results/${{ matrix.candidate }}_full
          if-no-files-found: error
