name: LAB PTAR-NG MoE v02 Fresh Post-Freeze Validation

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  fresh-validation:
    if: contains(github.event.head_commit.message, '[run-fresh-validation]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact validation dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scikit-image==0.26.0
      - name: Run LAB16 post-freeze fresh validation
        run: >-
          python tools/lab_moe_ng_v02_fresh_validation.py
          --frozen lab_protocols/LAB15_FROZEN_CANDIDATE.json
          --out lab_results/moe_ng_v02_fresh_validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab16-fresh-validation
          path: lab_results/moe_ng_v02_fresh_validation
