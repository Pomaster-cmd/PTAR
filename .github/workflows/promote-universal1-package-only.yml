name: promote-universal1-package-only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-universal1-package-only.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild exact pristine UNIVERSAL1 package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $delta=Join-Path $env:RUNNER_TEMP 'U1_DELTA'
          $cand=Join-Path $env:RUNNER_TEMP 'U1_PRISTINE'
          foreach($d in @($delta,$cand)){if(Test-Path $d){Remove-Item $d -Recurse -Force};New-Item -ItemType Directory -Path $d|Out-Null}
          $b64=((1..4|ForEach-Object{Get-Content -LiteralPath (".github/universal1_payload/part$_.b64") -Raw}) -join '').Trim()
          $archive=Join-Path $env:RUNNER_TEMP 'U1_DELTA.tar.xz'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($b64))
          $h=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne '6b1ad9026a9817b0b6599fb4ca6e4836afb699b778440ed403e77e1144509ee8'){throw "delta hash mismatch $h"}
          python -c "import tarfile; t=tarfile.open(r'$archive','r:xz'); t.extractall(r'$delta'); t.close()"
          @'
          from pathlib import Path
          import hashlib, shutil, sys
          repo=Path('.').resolve(); delta=Path(sys.argv[1]); cand=Path(sys.argv[2])
          own=repo/'_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv'
          lines=own.read_text(encoding='utf-8').splitlines()
          paths=[x.split('|')[1] for x in lines[1:] if x.strip()]
          for rel in paths:
              src=repo/rel
              if not src.is_file(): raise SystemExit('missing base package path '+rel)
              dst=cand/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          dst=cand/'_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv'; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(own,dst)
          # Overlay validated UNIVERSAL1 delta, excluding workflow content (already installed separately via connector).
          for src in delta.rglob('*'):
              if not src.is_file(): continue
              rel=src.relative_to(delta).as_posix()
              if rel.startswith('.github/'): continue
              dst=cand/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          # Fix the PowerShell array-expression ambiguity discovered by real Windows verification.
          vp=cand/'diag/verify.ps1'; s=vp.read_text(encoding='utf-8')
          old="foreach($k in @('TargetExe='+$targetName,'Enabled=1','UniversalSpatialPresenter=1','PresenterExclusive=0','Overlay=1','FrameGeneration=0','FrameGenerationPresentSync=1','FrameGenerationTargetFPS=60')){"
          new="foreach($k in @((('TargetExe=' + $targetName)),'Enabled=1','UniversalSpatialPresenter=1','PresenterExclusive=0','Overlay=1','FrameGeneration=0','FrameGenerationPresentSync=1','FrameGenerationTargetFPS=60')){"
          if old not in s: raise SystemExit('verify fix anchor missing')
          vp.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def eligible():
              out=[]
              for q in cand.rglob('*'):
                  if not q.is_file(): continue
                  rel=q.relative_to(cand).as_posix()
                  if rel.startswith('_PTAR_UNINSTALL/state/') or rel.startswith('diag/backups/') or rel.startswith('.github/'): continue
                  out.append(rel)
              return sorted(out)
          files=eligible(); sums=cand/'diag/SHA256SUMS.txt'; own2=cand/'_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv'
          sexp=[r for r in files if r not in {'diag/SHA256SUMS.txt','_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv'}]
          sums.write_text(''.join(f'{sha(cand/r)}  {r}\n' for r in sexp),encoding='utf-8',newline='\n')
          files=eligible(); oexp=[r for r in files if r!='_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv']
          rows=['PTAR_STATIC_OWNERSHIP_SCHEMA\t3\n']
          for i,r in enumerate(oexp,82600001): rows.append(f'{i:08d}|{r}|{sha(cand/r)}\n')
          own2.write_text(''.join(rows),encoding='utf-8',newline='\n')
          print('PRISTINE_FILES=%d SHA=%d OWN=%d'%(len(files),len(sexp),len(oexp)))
          print('VERIFY_SHA256='+sha(vp))
          '@|Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'build_u1_package.py') -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP 'build_u1_package.py') $delta $cand
          if($LASTEXITCODE -ne 0){throw 'pristine builder failed'}
          $rh=(Get-FileHash (Join-Path $cand 'payload/d3d11.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($rh -ne 'e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'){throw "runtime drift $rh"}
          Push-Location $cand
          try{python .\diag\validate_gw16_hudrec1_package.py;if($LASTEXITCODE -ne 0){throw "119 gate failed rc=$LASTEXITCODE"}}finally{Pop-Location}
          Write-Host 'UNIVERSAL1_PACKAGE_ONLY_REBUILD=PASS'

      - name: Commit package files only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cand=Join-Path $env:RUNNER_TEMP 'U1_PRISTINE'
          robocopy $cand . /E /XD .github /NFL /NDL /NJH /NJS /NP|Out-Null
          if($LASTEXITCODE -ge 8){throw "robocopy rc=$LASTEXITCODE"}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '01-INSTALL_GW16.bat' '02-VERIFY_INSTALL.bat' '03-ARM_VISIBLE_FRAME_VERIFIER.bat' '03-INSTALL_QSV_HELPER_WIN81.bat' '04-COLLECT_RESULTS.bat' '04-TEST_QSV_5S_MP4.bat' '05-ROLLBACK_TEST.bat' '06-DESINSTALLER_PTAR_COMPLET.bat' 'README.md' 'README_TEST.txt' '_PTAR_UNINSTALL' 'diag' 'payload' 'tools/installer'
          git commit -m 'release: promote HUDREC1 UNIVERSAL1 game-agnostic targeting'
          git push origin HEAD:main
