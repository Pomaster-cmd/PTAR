name: RC38 Sidecar Diagnostic

on:
  push:
    branches: [ build/rc38-borderless-authority-20260913 ]
    paths-ignore:
      - 'lab/borderless/rc38/diaggen/**'
      - 'lab/borderless/rc38/generated/**'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\rc38\out mkdir lab\borderless\rc38\out
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          cl %CFLAGS% /LD lab\borderless\rc38\ptar_borderless_rc38.cpp /Fe:lab\borderless\rc38\out\ptar_borderless.dll user32.lib /link /SUBSYSTEM:WINDOWS,6.03
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\rc38\ptar_borderless_host_test.cpp /Fe:lab\borderless\rc38\out\ptar_borderless_host_test.exe user32.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 1
          dumpbin /imports lab\borderless\rc38\out\ptar_borderless.dll > lab\borderless\rc38\out\SIDECAR_IMPORTS.txt
          dumpbin /headers lab\borderless\rc38\out\ptar_borderless.dll > lab\borderless\rc38\out\SIDECAR_HEADERS.txt
      - name: Host test
        id: host
        continue-on-error: true
        shell: cmd
        run: |
          pushd lab\borderless\rc38\out
          ptar_borderless_host_test.exe > RC38_HOST_TEST.txt 2>&1
          set RC=%ERRORLEVEL%
          type RC38_HOST_TEST.txt
          if exist ptar_borderless_rc38.log type ptar_borderless_rc38.log
          popd
          exit /b %RC%
      - name: Publish diagnostic text
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $d='lab/borderless/rc38/diaggen'; New-Item -ItemType Directory -Force $d | Out-Null
          foreach($n in @('RC38_HOST_TEST.txt','ptar_borderless_rc38.log','SIDECAR_IMPORTS.txt','SIDECAR_HEADERS.txt')){ $p=Join-Path 'lab/borderless/rc38/out' $n; if(Test-Path $p){Copy-Item $p (Join-Path $d $n) -Force} }
          "host_outcome=${{ steps.host.outcome }}" | Set-Content (Join-Path $d 'OUTCOME.txt') -Encoding ASCII
      - name: Commit diagnostic text
        if: always()
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/borderless/rc38/diaggen
          git diff --cached --quiet && exit /b 0
          git commit -m "lab: publish RC38 sidecar diagnostic"
          git push origin HEAD:build/rc38-borderless-authority-20260913
      - name: Gate
        if: always()
        shell: powershell
        run: |
          if ('${{ steps.host.outcome }}' -ne 'success') { throw 'RC38 host test failed' }
