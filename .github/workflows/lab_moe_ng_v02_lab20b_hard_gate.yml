name: LAB PTAR-NG MoE v02 LAB20B Hard Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  cpu-hard-gate-sweep:
    if: contains(github.event.head_commit.message, '[run-lab20b]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scikit-image==0.26.0
      - name: Run LAB20B A+B-only hard-gate cost sweep
        run: >-
          python tools/lab_moe_ng_v02_lab20b_hard_gate.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_lab20b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab20b-hard-gate
          path: lab_results/moe_ng_v02_lab20b
