name: LAB D3D9 BIC16 R4 POINTAB
on:
  push:
    branches:
      - lab/bic16-r4-pointab
  workflow_dispatch:
jobs:
  r4:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Qualify R4 POINT A-B over exact R3
        shell: pwsh
        run: .\lab\pointab\run_r4_full_ci.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BIC16-R4-POINTAB
          path: artifact/
          if-no-files-found: error
