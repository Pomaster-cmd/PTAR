name: Borderless Control Lab

on:
  push:
    branches:
      - lab/borderless-control-research-20260913

permissions:
  contents: read

jobs:
  windows-warp-lab:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build Win32 + D3D11 WARP harness
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\out mkdir lab\borderless\out
          cl /nologo /EHsc /std:c++17 /W4 /WX lab\borderless\ptar_borderless_takeover_harness.cpp /Fe:lab\borderless\out\ptar_borderless_takeover_harness.exe user32.lib gdi32.lib d3d11.lib dxgi.lib

      - name: Run 20k real Win32/DXGI transitions + 320k input probes
        shell: cmd
        run: |
          lab\borderless\out\ptar_borderless_takeover_harness.exe > lab\borderless\out\BORDERLESS_WARP_LAB.txt 2>&1
          set RC=%ERRORLEVEL%
          type lab\borderless\out\BORDERLESS_WARP_LAB.txt
          exit /b %RC%

      - name: Upload lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: borderless-control-lab-report
          path: lab/borderless/out/BORDERLESS_WARP_LAB.txt
          if-no-files-found: error
