name: Borderless Control Lab

on:
  push:
    branches:
      - lab/borderless-control-research-20260913

permissions:
  contents: read

jobs:
  windows-borderless-lab:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build Win8.1-targeted lab executables
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\borderless\out mkdir lab\borderless\out
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\borderless
          set LFLAGS=/link /SUBSYSTEM:CONSOLE,6.03
          cl %CFLAGS% lab\borderless\ptar_borderless_geometry_stress.cpp /Fe:lab\borderless\out\geometry_stress.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_input_stress.cpp /Fe:lab\borderless\out\input_stress.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_event_parity.cpp /Fe:lab\borderless\out\event_parity.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_thread_affinity.cpp /Fe:lab\borderless\out\thread_affinity.exe user32.lib d3d11.lib dxgi.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_window_stress.cpp /Fe:lab\borderless\out\window_stress.exe user32.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_warp_stress.cpp /Fe:lab\borderless\out\warp_stress.exe user32.lib d3d11.lib dxgi.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          cl %CFLAGS% lab\borderless\ptar_borderless_occlusion_focus_stress.cpp /Fe:lab\borderless\out\occlusion_focus_stress.exe user32.lib d3d11.lib dxgi.lib %LFLAGS%
          if errorlevel 1 exit /b 1
          dumpbin /imports lab\borderless\out\window_stress.exe > lab\borderless\out\WINDOW_IMPORTS.txt
          dumpbin /imports lab\borderless\out\warp_stress.exe > lab\borderless\out\WARP_IMPORTS.txt
          dumpbin /headers lab\borderless\out\warp_stress.exe > lab\borderless\out\WARP_HEADERS.txt

      - name: Geometry stress - 1.5M coordinate + clip cases
        shell: cmd
        run: lab\borderless\out\geometry_stress.exe > lab\borderless\out\GEOMETRY_STRESS.txt 2>&1

      - name: Input virtualization stress - 2M cases
        shell: cmd
        run: lab\borderless\out\input_stress.exe > lab\borderless\out\INPUT_STRESS.txt 2>&1

      - name: Pointer event and focus parity - 20k routed geometry transitions
        shell: cmd
        run: lab\borderless\out\event_parity.exe > lab\borderless\out\EVENT_PARITY.txt 2>&1

      - name: UI-thread HWND affinity with worker-thread D3D - 2k presents each
        shell: cmd
        run: lab\borderless\out\thread_affinity.exe > lab\borderless\out\THREAD_AFFINITY.txt 2>&1

      - name: Win32 takeover state stress - 20k hostile requests
        shell: cmd
        run: lab\borderless\out\window_stress.exe > lab\borderless\out\WINDOW_STRESS.txt 2>&1

      - name: D3D11 WARP dual-swapchain stress - 12k transitions
        shell: cmd
        run: lab\borderless\out\warp_stress.exe > lab\borderless\out\WARP_STRESS.txt 2>&1

      - name: Occlusion focus capture stress - 2k presents
        shell: cmd
        run: lab\borderless\out\occlusion_focus_stress.exe > lab\borderless\out\OCCLUSION_FOCUS_STRESS.txt 2>&1

      - name: Print reports
        if: always()
        shell: cmd
        run: |
          for %%F in (GEOMETRY_STRESS.txt INPUT_STRESS.txt EVENT_PARITY.txt THREAD_AFFINITY.txt WINDOW_STRESS.txt WARP_STRESS.txt OCCLUSION_FOCUS_STRESS.txt) do if exist lab\borderless\out\%%F (echo ==== %%F ==== & type lab\borderless\out\%%F)

      - name: Upload lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: borderless-control-lab-report
          path: |
            lab/borderless/out/*.txt
          if-no-files-found: error
