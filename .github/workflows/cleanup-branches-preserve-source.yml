name: cleanup-branches-preserve-source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-branches-preserve-source.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main and SOURCE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branches="$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')"
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if [ "$branch" = "main" ] || [ "$branch" = "SOURCE" ]; then
              echo "KEEP=$branch"
              continue
            fi
            echo "DELETE=$branch"
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
          done <<< "$branches"

          remaining="$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')"
          echo "$remaining"
          unexpected="$(printf '%s\n' "$remaining" | grep -v '^main$' | grep -v '^SOURCE$' || true)"
          test -z "$unexpected"
          gh api "repos/$repo/branches/SOURCE" --silent
          gh api "repos/$repo/branches/main" --silent
          echo 'BRANCH_CLEANUP=PASS'
