name: LAB CTRL UI deliverable 20261009

on:
  push:
    branches: [lab/ctrl-ui-real-visibility-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deliverable:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deliverable-only UI detail and F1 result-path fixes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $hud='compat\x86_d3d9\ptar_gw16i_hud_d3d9.h'
          $bridge='lab\ctrl_ui_real_visibility\PTARD3D9DiagHudBridgeController.cs'
          $h=Get-Content $hud -Raw
          $h=$h.Replace('PtGw16Text(dev,&batch,x,y,"C+F5 MEASURE",fg);','PtGw16Text(dev,&batch,x,y,"C+F5 MEASURE",fg);`r`n            PtGw16Text(dev,&batch,x,originY+48,a==0?"PRE FG 20 SEC":a==1?"FG ACTIVE 20 SEC":"POST FG 20 SEC",fg);')
          $h=$h.Replace('PtGw16Text(dev,&batch,x,y,"C+F5 DONE",fg);','PtGw16Text(dev,&batch,x,y,"C+F5 DONE",fg);`r`n            PtGw16Text(dev,&batch,x,originY+48,a==0?"PRE FG":a==1?"FG ACTIVE":"POST FG",fg);')
          $h=$h.Replace('PtGw16Text(dev,&batch,x,y,"C+F1 READY",fg);','PtGw16Text(dev,&batch,x,y,"C+F1 MODE",fg);`r`n            PtGw16Text(dev,&batch,x,originY+48,a==0?"60 SEC":"120 SEC",fg);')
          $h=$h.Replace('PtGw16Text(dev,&batch,x,y,"C+F1 MEASURE",fg);','PtGw16Text(dev,&batch,x,y,"C+F1 MEASURE",fg);`r`n            PtGw16Text(dev,&batch,x,originY+48,a==0?"60 SEC":"120 SEC",fg);')
          $h=$h.Replace('PtGw16Text(dev,&batch,x,y,"C+F1 DONE",fg);','PtGw16Text(dev,&batch,x,y,"C+F1 DONE",fg);`r`n            PtGw16Text(dev,&batch,x,originY+48,a==0?"60 SEC":"120 SEC",fg);')
          $h=$h.Replace('PtGw16Text(dev,&batch,x,y,"C+F1 ERROR",fg);','PtGw16Text(dev,&batch,x,y,"C+F1 ERROR",fg);`r`n            PtGw16Text(dev,&batch,x,originY+48,a==0?"60 SEC":"120 SEC",fg);')
          $h=$h.Replace('PtGw16Text(dev,&batch,x,y,"C+F5 ERROR",fg);','PtGw16Text(dev,&batch,x,y,"C+F5 ERROR",fg);`r`n            PtGw16Text(dev,&batch,x,originY+48,a==0?"PRE FG":a==1?"FG ACTIVE":"POST FG",fg);')
          Set-Content -LiteralPath $hud -Value $h -Encoding ASCII

          $b=Get-Content $bridge -Raw
          $old='string[] logs=Directory.GetFiles(gameRoot,"PTAR_PRESENTSHED1_CTRL_F1_*.log");'
          $new='string f1Dir=Path.Combine(gameRoot,"diag","PTAR_PRESENTSHED1");`r`n                string[] logs=Directory.Exists(f1Dir)?Directory.GetFiles(f1Dir,"PTAR_PRESENTSHED1_CTRL_F1_*.log"):new string[0];'
          if(-not $b.Contains($old)){throw 'Expected F1 log lookup not found in bridge source'}
          $b=$b.Replace($old,$new)
          Set-Content -LiteralPath $bridge -Value $b -Encoding UTF8

          $hh=Get-Content $hud -Raw
          $bb=Get-Content $bridge -Raw
          foreach($token in @('PRE FG 20 SEC','FG ACTIVE 20 SEC','POST FG 20 SEC','C+F1 MODE','60 SEC','120 SEC')){if($hh -notmatch [regex]::Escape($token)){throw "HUD detail token missing: $token"}}
          if($bb -notmatch 'diag","PTAR_PRESENTSHED1'){throw 'Correct PRESENTSHED1 result path not wired'}
          Write-Host 'DELIVERABLE_PATCH_STATIC=PASS'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile required shader bytecode
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build_x86,artifact | Out-Null
          $fxc=Get-Command fxc.exe -ErrorAction SilentlyContinue
          if(-not $fxc){
            foreach($root in @("$env:ProgramFiles(x86)\Windows Kits\10\bin","$env:ProgramFiles(x86)\Windows Kits\8.1\bin")){
              if(Test-Path $root){$fxc=Get-ChildItem $root -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1;if($fxc){break}}
            }
          }
          if(-not $fxc){throw 'fxc.exe not found'}
          $fxcPath=if($fxc.Path){$fxc.Path}else{$fxc.FullName}
          $jobs=@(
            @('ps_3_0','compat\x86_d3d9\ptar_moe_d3d9_ps.hlsl','build_x86\ptar_ps_bytecode.h','g_ptarPs'),
            @('ps_3_0','compat\x86_d3d9\ptar_moe_universal_d3d9_ps.hlsl','build_x86\ptar_universal_ps_bytecode.h','g_ptarUniversalPs'),
            @('ps_2_0','compat\x86_d3d9\ptar_bilinear_ref_ps.hlsl','build_x86\ptar_bilinear_ps_bytecode.h','g_ptarBilinearPs'),
            @('ps_3_0','compat\x86_d3d9\ptar_gw16i_hud_ps.hlsl','build_x86\ptar_gw16i_hud_ps_bytecode.h','g_ptarGw16iHudPs'),
            @('ps_3_0','compat\x86_d3d9\ptar_gw16i_feedback_ps.hlsl','build_x86\ptar_gw16i_feedback_ps_bytecode.h','g_ptarGw16iFeedbackPs'),
            @('ps_3_0','compat\x86_d3d9\ptar_fg_me_coarse_ps.hlsl','build_x86\ptar_fg_me_coarse_ps_bytecode.h','g_ptarFgMeCoarsePs'),
            @('ps_3_0','compat\x86_d3d9\ptar_fg_me_refine_ps.hlsl','build_x86\ptar_fg_me_refine_ps_bytecode.h','g_ptarFgMeRefinePs'),
            @('ps_3_0','compat\x86_d3d9\ptar_fg_interpolate_ps.hlsl','build_x86\ptar_fg_interpolate_ps_bytecode.h','g_ptarFgInterpolatePs')
          )
          foreach($j in $jobs){& $fxcPath /nologo /T $j[0] /E main /O3 /Fh $j[2] /Vn $j[3] $j[1];if($LASTEXITCODE -ne 0){throw "FXC failed: $($j[1])"}}
          Write-Host 'FXC_ALL=PASS'

      - name: Build exact x86 D3D9 deliverable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /LD /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\ptar_d3d9_proxy.cpp /link user32.lib /DEF:compat\x86_d3d9\d3d9_proxy.def /OUT:artifact\d3d9.dll /SUBSYSTEM:WINDOWS,6.03
          if($LASTEXITCODE -ne 0){throw 'D3D9 runtime compile failed'}
          dumpbin /headers artifact\d3d9.dll | Tee-Object build_x86\HEADERS.txt
          dumpbin /dependents artifact\d3d9.dll | Tee-Object build_x86\DEPENDENTS.txt
          $h=Get-Content build_x86\HEADERS.txt -Raw;$d=Get-Content build_x86\DEPENDENTS.txt -Raw
          if($h -notmatch '14C machine \(x86\)'){throw 'runtime is not x86'}
          if($h -notmatch '6\.03 operating system version'){throw 'Win8.1 subsystem target missing'}
          foreach($bad in @('VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($d -match $bad){throw "forbidden dynamic runtime dependency $bad"}}
          Write-Host ('D3D9_DLL_SHA256='+((Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()))
          Write-Host 'D3D9_RUNTIME_BUILD=PASS'

      - name: Build x64 HUD bridge controller
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /platform:x64 /out:artifact\PTARD3D9DiagHudBridgeController.exe lab\ctrl_ui_real_visibility\PTARD3D9DiagHudBridgeController.cs
          if($LASTEXITCODE -ne 0){throw 'HUD bridge compile failed'}
          $p=Start-Process -FilePath artifact\PTARD3D9DiagHudBridgeController.exe -ArgumentList '--selftest' -PassThru -WindowStyle Hidden
          $p.WaitForExit();if($p.ExitCode -ne 0){throw "HUD bridge selftest failed rc=$($p.ExitCode)"}
          Write-Host 'HUD_BRIDGE_X64_SELFTEST=PASS'

      - name: Re-run base HUD and diagnostic bridge GPU visibility tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I compat\x86_d3d9 compat\x86_d3d9\d3d9_gw16i_hud_gpu_smoke.cpp /link user32.lib /OUT:artifact\d3d9_gw16i_hud_gpu_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){throw 'HUD smoke compile failed'}
          & artifact\d3d9_gw16i_hud_gpu_smoke.exe | Tee-Object build_x86\D3D9_GW16I_HUD_GPU_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "HUD smoke failed rc=$LASTEXITCODE"}
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I compat\x86_d3d9 lab\ctrl_ui_real_visibility\d3d9_diag_ui_bridge_gpu_smoke.cpp /link user32.lib /OUT:artifact\d3d9_diag_ui_bridge_gpu_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){throw 'bridge GPU smoke compile failed'}
          & artifact\d3d9_diag_ui_bridge_gpu_smoke.exe | Tee-Object build_x86\D3D9_DIAG_UI_BRIDGE_GPU_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "bridge GPU smoke failed rc=$LASTEXITCODE"}
          $t=Get-Content build_x86\D3D9_DIAG_UI_BRIDGE_GPU_SMOKE.txt -Raw
          foreach($token in @('F5_PRE','F5_FG_ACTIVE','F5_POST','F5_MEASURE','F5_DONE','F1_READY','F1_MEASURE','F1_DONE','F1_ERROR','F5_ERROR')){if($t -notmatch ($token+' type=[0-9]+ changed=[1-9][0-9]{3,}')){throw "No visible D3D9 pixels for $token"}}
          if($t -notmatch 'DIAG_UI_EXPIRY=PASS'){throw 'bridge expiry gate missing'}
          Write-Host 'CTRL_F1_F5_IN_GAME_BACKBUFFER_VISIBILITY=PASS'

      - name: Prove render and FG cores remain untouched
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='0066c7d4b32aed167d2a74030801e896b8fe9aa4'
          foreach($core in @(
            'compat/x86_d3d9/ptar_d3d9_proxy.cpp',
            'compat/x86_d3d9/ptar_fg_pacer.h',
            'compat/x86_d3d9/ptar_fg_me_coarse_ps.hlsl',
            'compat/x86_d3d9/ptar_fg_me_refine_ps.hlsl',
            'compat/x86_d3d9/ptar_fg_interpolate_ps.hlsl',
            'compat/x86_d3d9/ptar_moe_d3d9_ps.hlsl',
            'compat/x86_d3d9/ptar_moe_universal_d3d9_ps.hlsl'
          )){if(git diff --name-only $base HEAD -- $core){throw "Core changed unexpectedly: $core"}}
          Write-Host 'D3D9_RENDER_FG_CORE_UNTOUCHED=PASS'

      - name: Package deliverable payload
        shell: pwsh
        run: |
          $sha=(Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $bsha=(Get-FileHash artifact\PTARD3D9DiagHudBridgeController.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'PTAR_D3D9_CTRL_UI_DELIVERABLE=PASS',
            'SOURCE_HEAD=4516e2359b395af38d06e2fbf3e30e67a588dc94',
            'D3D9_UI_PATH=IN_GAME_BACKBUFFER_CLEAR_RECTS',
            'CTRL_F1_F5_BRIDGE=PTAR_D3D9_DIAG_UI.ini',
            'F1_RESULT_PATH=diag\\PTAR_PRESENTSHED1',
            'F1_MODE_DETAILS=60_SEC_120_SEC',
            'F5_MEASURE_DETAILS=MODE_PLUS_20_SEC',
            'CORE_FG_UNTOUCHED=YES',
            ('D3D9_DLL_SHA256='+$sha),
            ('HUD_BRIDGE_EXE_SHA256='+$bsha)
          ) | Set-Content artifact\PTAR_D3D9_CTRL_UI_DELIVERABLE_VERSION.txt -Encoding ASCII
          Copy-Item compat\x86_d3d9\ptar_gw16i_hud_d3d9.h artifact\ptar_gw16i_hud_d3d9_DELIVERABLE.h
          Copy-Item lab\ctrl_ui_real_visibility\PTARD3D9DiagHudBridgeController.cs artifact\PTARD3D9DiagHudBridgeController_DELIVERABLE.cs

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-D3D9-CTRL-UI-DELIVERABLE
          path: |
            artifact/d3d9.dll
            artifact/PTARD3D9DiagHudBridgeController.exe
            artifact/PTAR_D3D9_CTRL_UI_DELIVERABLE_VERSION.txt
            artifact/ptar_gw16i_hud_d3d9_DELIVERABLE.h
            artifact/PTARD3D9DiagHudBridgeController_DELIVERABLE.cs
            build_x86/HEADERS.txt
            build_x86/DEPENDENTS.txt
            build_x86/D3D9_GW16I_HUD_GPU_SMOKE.txt
            build_x86/D3D9_DIAG_UI_BRIDGE_GPU_SMOKE.txt
