name: RC41 Logical Native Subraster Lab

on:
  push:
    branches:
      - build/rc41-logical-native-subraster-20260913
    paths:
      - lab/raster/rc41/**
      - .github/workflows/rc41-logical-native-subraster.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rc41-lab:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Static architecture contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='lab/raster/rc41'
          $all=(Get-ChildItem $root -File | Get-Content -Raw) -join "`n"
          $contract=Get-Content "$root/ptar_rc41_contract.h" -Raw
          $warp=Get-Content "$root/ptar_rc41_warp_harness.cpp" -Raw
          $hooks=Get-Content "$root/ptar_rc41_context_hooks.h" -Raw
          $hookcpp=Get-Content "$root/ptar_rc41_context_hooks.cpp" -Raw
          $classifier=Get-Content "$root/ptar_rc41_target_classifier.cpp" -Raw
          $swapHooks=Get-Content "$root/ptar_rc41_swapchain_hooks.h" -Raw
          $swapCpp=Get-Content "$root/ptar_rc41_swapchain_hooks.cpp" -Raw
          $swapPolicy=Get-Content "$root/ptar_rc41_swapchain_policy.h" -Raw
          $swapWarp=Get-Content "$root/ptar_rc41_swapchain_warp_harness.cpp" -Raw
          $dual=Get-Content "$root/ptar_rc41_dual_interface_harness.cpp" -Raw
          $resourcePolicy=Get-Content "$root/ptar_rc41_resource_policy.h" -Raw
          $resourceBridge=Get-Content "$root/ptar_rc41_resource_bridge.h" -Raw
          $resourceBridgeCpp=Get-Content "$root/ptar_rc41_resource_bridge.cpp" -Raw
          $resourceTag=Get-Content "$root/ptar_rc41_resource_tag.h" -Raw
          $resourceWarp=Get-Content "$root/ptar_rc41_resource_warp_harness.cpp" -Raw
          $checks=[ordered]@{
            'logical and physical spaces are distinct'=($contract.Contains('SizeU logical') -and $contract.Contains('SizeU physical'))
            'viewport mapping is primary-family gated'=$contract.Contains('primaryFamilyBound')
            'scissor mapping uses conservative floor/ceil'=($contract.Contains('std::floor') -and $contract.Contains('std::ceil'))
            'same-size unrelated render targets are rejected'=$warp.Contains('same_size_nonprimary=PASS')
            'offscreen targets remain passthrough'=$warp.Contains('offscreen_passthrough=PASS')
            'RC41 contains no new HWND geometry policy'=(-not $all.Contains('SetWindowPos(') -and -not $all.Contains('SetWindowLongPtr'))
            'RC41 contains no USER32 virtualization'=(-not $all.Contains('GetCursorPos(') -and -not $all.Contains('ClipCursor('))
            'D3D11 context hook slots are explicit'=($hooks.Contains('kSlotOMSetRenderTargets=33') -and $hooks.Contains('kSlotOMSetRenderTargetsAndUAV=34') -and $hooks.Contains('kSlotRSSetViewports=44') -and $hooks.Contains('kSlotRSSetScissorRects=45'))
            'context hook is instance-local shadow vtable'=($hooks.Contains('shadowVtable_') -and $hookcpp.Contains('InterlockedCompareExchangePointer'))
            'ClearState invalidates target state'=($hooks.Contains('kSlotClearState=110') -and $hookcpp.Contains('hook_clear_state'))
            'command-list execution reclassifies target state'=($hooks.Contains('kSlotExecuteCommandList=58') -and $hookcpp.Contains('refresh_primary_from_context(ctx)'))
            'backbuffer classifier owns no persistent COM reference'=($classifier.Contains('do NOT retain a COM reference') -and $classifier.Contains('if(identity) identity->Release();'))
            'swapchain hook slots are explicit'=($swapHooks.Contains('kSlotGetDesc=12') -and $swapHooks.Contains('kSlotResizeBuffers=13') -and $swapHooks.Contains('kSlotGetDesc1=18'))
            'swapchain virtualization is game-caller only'=$swapPolicy.Contains('domain==CallerDomain::Game')
            'successful resize refreshes primary resource'=($swapCpp.Contains('if(self->onResize_) self->onResize_') -and $hookcpp.Contains('update_primary_resource'))
            'swapchain WARP gate requires repeated resize renewal'=($swapWarp.Contains('kResizes=128') -and $swapWarp.Contains('classifier_no_hold=PASS'))
            'distinct base and derived swapchain interfaces are independently shadowed'=($swapCpp.Contains('baseShadowVtable_') -and $swapCpp.Contains('derivedShadowVtable_') -and $dual.Contains('base_ptr_distinct=1'))
            'resource bridge only remaps exact logical game render/depth family'=($resourcePolicy.Contains('domain!=CallerDomain::Game') -and $resourcePolicy.Contains('in.Width!=contract_.logical.w') -and $resourcePolicy.Contains('D3D11_BIND_RENDER_TARGET|D3D11_BIND_DEPTH_STENCIL'))
            'resource bridge fails open for initial/shared resources'=($resourcePolicy.Contains('if(initialData)') -and $resourcePolicy.Contains('D3D11_RESOURCE_MISC_SHARED') -and $resourceBridgeCpp.Contains('textureFallbacks_'))
            'resource-family ownership is private-data lifetime safe'=($resourceTag.Contains('SetPrivateData') -and $resourceTag.Contains('needs no persistent') -and $classifier.Contains('view_or_resource_has_family_tag'))
            'D3D11 device resource hook slots are explicit'=($resourceBridge.Contains('kSlotCreateTexture2D=5') -and $resourceBridge.Contains('kSlotCreateRenderTargetView=9') -and $resourceBridge.Contains('kSlotCreateDepthStencilView=10'))
            'resource WARP gate covers depth-only and non-family isolation'=($resourceWarp.Contains('dsv_only_mapping=PASS') -and $resourceWarp.Contains('same_size_nonfamily=PASS'))
            'device resource shadow preserves highest aliased interface'=($resourceBridge.Contains('kMaxVtableSlots=kDevice5VtableSlots') -and $resourceBridgeCpp.Contains('aliases_base_device') -and $resourceBridgeCpp.Contains('highest_aliased_device_slots') -and $resourceBridgeCpp.Contains('shadowSlots_*sizeof(void*)') -and $resourceWarp.Contains('shadow_contract_ok'))
          }
          foreach($k in $checks.Keys){ if(-not $checks[$k]){ throw "RC41 CONTRACT FAIL: $k" }; Write-Host "PASS $k" }
          'RC41_STATIC_ARCHITECTURE=23/23 PASS' | Set-Content "$root/STATIC_ARCHITECTURE.txt" -Encoding ASCII

      - name: Build RC41 lab gates
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist lab\raster\rc41\out mkdir lab\raster\rc41\out
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\raster\rc41
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_math_stress.cpp /Fe:lab\raster\rc41\out\math_stress.exe /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 11
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_framing_oracle.cpp /Fe:lab\raster\rc41\out\framing_oracle.exe /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 12
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_warp_harness.cpp /Fe:lab\raster\rc41\out\warp_harness.exe d3d11.lib dxgi.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 13
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc41\ptar_rc41_context_hooks.cpp lab\raster\rc41\ptar_rc41_hook_warp_harness.cpp /Fe:lab\raster\rc41\out\hook_warp_harness.exe d3d11.lib dxgi.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 14
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc41\ptar_rc41_context_hooks.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_swapchain_hooks.cpp lab\raster\rc41\ptar_rc41_swapchain_warp_harness.cpp /Fe:lab\raster\rc41\out\swapchain_warp_harness.exe user32.lib d3d11.lib dxgi.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 15
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_swapchain_hooks.cpp lab\raster\rc41\ptar_rc41_dual_interface_harness.cpp /Fe:lab\raster\rc41\out\dual_interface_harness.exe user32.lib dxgi.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 16
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc41\ptar_rc41_context_hooks.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_resource_bridge.cpp lab\raster\rc41\ptar_rc41_resource_warp_harness.cpp /Fe:lab\raster\rc41\out\resource_warp_harness.exe user32.lib d3d11.lib dxgi.lib /link /SUBSYSTEM:CONSOLE,6.03
          if errorlevel 1 exit /b 17

      - name: Run RC41 geometry stress
        shell: cmd
        run: |
          lab\raster\rc41\out\math_stress.exe > lab\raster\rc41\out\MATH_STRESS.txt 2>&1
          if errorlevel 1 (type lab\raster\rc41\out\MATH_STRESS.txt & exit /b 21)
          type lab\raster\rc41\out\MATH_STRESS.txt

      - name: Run RC41 framing oracle
        shell: cmd
        run: |
          lab\raster\rc41\out\framing_oracle.exe > lab\raster\rc41\out\FRAMING_ORACLE.txt 2>&1
          if errorlevel 1 (type lab\raster\rc41\out\FRAMING_ORACLE.txt & exit /b 22)
          type lab\raster\rc41\out\FRAMING_ORACLE.txt

      - name: Run RC41 WARP target-family gate
        shell: cmd
        run: |
          lab\raster\rc41\out\warp_harness.exe > lab\raster\rc41\out\WARP_TARGET_CLASSIFIER.txt 2>&1
          if errorlevel 1 (type lab\raster\rc41\out\WARP_TARGET_CLASSIFIER.txt & exit /b 23)
          type lab\raster\rc41\out\WARP_TARGET_CLASSIFIER.txt

      - name: Run RC41 actual hook WARP stress
        shell: cmd
        run: |
          lab\raster\rc41\out\hook_warp_harness.exe > lab\raster\rc41\out\HOOK_WARP_STRESS.txt 2>&1
          if errorlevel 1 (type lab\raster\rc41\out\HOOK_WARP_STRESS.txt & exit /b 24)
          type lab\raster\rc41\out\HOOK_WARP_STRESS.txt

      - name: Run RC41 swapchain virtualization and resize stress
        shell: cmd
        run: |
          lab\raster\rc41\out\swapchain_warp_harness.exe > lab\raster\rc41\out\SWAPCHAIN_WARP_STRESS.txt 2>&1
          if errorlevel 1 (type lab\raster\rc41\out\SWAPCHAIN_WARP_STRESS.txt & exit /b 25)
          type lab\raster\rc41\out\SWAPCHAIN_WARP_STRESS.txt

      - name: Run RC41 distinct COM interface shadow gate
        shell: cmd
        run: |
          lab\raster\rc41\out\dual_interface_harness.exe > lab\raster\rc41\out\DUAL_INTERFACE.txt 2>&1
          if errorlevel 1 (type lab\raster\rc41\out\DUAL_INTERFACE.txt & exit /b 26)
          type lab\raster\rc41\out\DUAL_INTERFACE.txt

      - name: Run RC41 selective resource-family bridge gate
        shell: cmd
        run: |
          pushd lab\raster\rc41\out
          if exist RC41_RESOURCE_WARP_RESULT.txt del /q RC41_RESOURCE_WARP_RESULT.txt
          resource_warp_harness.exe > RESOURCE_WARP_STDOUT.txt 2>&1
          if errorlevel 1 (type RESOURCE_WARP_STDOUT.txt & popd & exit /b 27)
          if not exist RC41_RESOURCE_WARP_RESULT.txt (type RESOURCE_WARP_STDOUT.txt & popd & exit /b 28)
          type RC41_RESOURCE_WARP_RESULT.txt
          findstr /C:"RC41_RESOURCE_WARP=PASS" RC41_RESOURCE_WARP_RESULT.txt >nul || (popd & exit /b 29)
          copy /y RC41_RESOURCE_WARP_RESULT.txt RESOURCE_WARP_STRESS.txt >nul
          popd

      - name: Package RC41 evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $o='lab/raster/rc41/out'
          function Read-Evidence([string]$path,[string]$marker){
            $text=Get-Content $path -Raw -ErrorAction Stop
            if([string]::IsNullOrWhiteSpace($text)){ throw "empty evidence: $path" }
            if(-not $text.Contains($marker)){ throw "missing marker $marker in $path" }
            return $text.Trim()
          }
          $summary=@(
            'RC41_LAB_STATUS=PASS',
            'STATIC_ARCHITECTURE=23/23 PASS',
            (Read-Evidence "$o/MATH_STRESS.txt" 'RC41_MATH_STRESS=PASS'),
            (Read-Evidence "$o/FRAMING_ORACLE.txt" 'RC41_FRAMING_ORACLE=PASS'),
            (Read-Evidence "$o/WARP_TARGET_CLASSIFIER.txt" 'RC41_WARP_TARGET_CLASSIFIER=PASS'),
            (Read-Evidence "$o/HOOK_WARP_STRESS.txt" 'RC41_HOOK_WARP=PASS'),
            (Read-Evidence "$o/SWAPCHAIN_WARP_STRESS.txt" 'RC41_SWAPCHAIN_WARP=PASS'),
            (Read-Evidence "$o/DUAL_INTERFACE.txt" 'RC41_DUAL_INTERFACE=PASS'),
            (Read-Evidence "$o/RESOURCE_WARP_STRESS.txt" 'RC41_RESOURCE_WARP=PASS')
          )
          $summary | Set-Content "$o/RC41_SUMMARY.txt" -Encoding ASCII
          Copy-Item 'lab/raster/rc41/STATIC_ARCHITECTURE.txt' "$o/STATIC_ARCHITECTURE.txt" -Force
          Compress-Archive -Path "$o/*.txt" -DestinationPath RC41_LOGICAL_NATIVE_SUBRASTER_EVIDENCE.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR_RC41_LOGICAL_NATIVE_SUBRASTER
          path: RC41_LOGICAL_NATIVE_SUBRASTER_EVIDENCE.zip
          if-no-files-found: error
          retention-days: 7
