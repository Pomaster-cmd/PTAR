name: LAB27 GTX960M Compare Pack V2

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail-gtxpack-v2-safety

permissions:
  contents: read

jobs:
  build-audit-pack-v2:
    if: contains(github.event.head_commit.message, '[run-lab27-gtx-pack-v2]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "FXC=$($fxc.FullName)"
          Write-Host "FXC FileVersion=$($fxc.VersionInfo.FileVersion)"

      - name: Compile and freeze DXBC twice where needed
        shell: pwsh
        run: |
          $root='lab_results\lab27_gtx_pack_v2'
          $pack="$root\PTAR_LAB27_GTX960M_COMPARE_PACK_V2"
          $sh="$pack\shaders"
          New-Item -ItemType Directory -Force $sh | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'

          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab25.cso" /Fc "$root\lab25.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab25_proven_shape_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab27.cso" /Fc "$root\lab27.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab27_scalar_phase_mod_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab_fullscreen_vs.cso" /Fc "$root\lab_fullscreen_vs.asm" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$root\lab_fullscreen_vs_repeat.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_k185_control_ps.cso "$sh\ptar_k185_control_ps.cso"
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_vs.cso "$sh\ptar_vs.cso"

          $expected=@{
            'lab25.cso'='ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72'
            'lab27.cso'='48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44'
            'ptar_k185_control_ps.cso'='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'
            'ptar_vs.cso'='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
            'lab_fullscreen_vs.cso'='f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          }

          $hashLines=@()
          foreach($n in $expected.Keys){
            $p="$sh\$n"
            if(-not (Test-Path $p)){ throw "missing $n" }
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$n SHA256=$got"
            if($got -ne $expected[$n]){ throw "$n frozen SHA256 mismatch expected=$($expected[$n]) got=$got" }
            $hashLines += "$got  shaders/$n"
            $bytes=(Get-Item $p).Length
            if($bytes -lt 4){ throw "$n is too small" }
            $magic=[System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($p),0,4)
            if($magic -ne 'DXBC'){ throw "$n is not DXBC" }
          }

          $vs1=(Get-FileHash "$sh\lab_fullscreen_vs.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $vs2=(Get-FileHash "$root\lab_fullscreen_vs_repeat.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($vs1 -ne $vs2){ throw "fullscreen VS compile is not deterministic: $vs1 vs $vs2" }
          if($vs1 -ne 'f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'){ throw 'fullscreen VS repeat hash differs from frozen V2 hash' }

          $hashLines | Sort-Object | Set-Content "$pack\HASHES.txt" -Encoding ascii

          @(
            "fxc_path=$fxc",
            "fxc_file_version=$((Get-Item $fxc).VersionInfo.FileVersion)",
            'compile_flags=/nologo /O3 /Ges /WX',
            'ps_profile=ps_5_0',
            'vs_profile=vs_5_0',
            'fullscreen_vs_repeat_compile_sha256=f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          ) | Set-Content "$pack\TOOLCHAIN.txt" -Encoding ascii

      - name: Static DXBC contract audit
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab27_gtx_pack_v2')
          out={}
          op_re=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b')
          for name in ('lab25','lab27'):
              lines=(root/f'{name}.asm').read_text(encoding='utf-8',errors='replace').splitlines()
              ops=[]; udiv_lines=[]
              for raw in lines:
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'): continue
                  m=op_re.match(raw)
                  if not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op)
                  if op=='udiv': udiv_lines.append(raw.strip())
              c=Counter(ops)
              cso=root/'PTAR_LAB27_GTX960M_COMPARE_PACK_V2'/'shaders'/f'{name}.cso'
              out[name]={
                  'instruction_total':len(ops),
                  'cso_bytes':cso.stat().st_size,
                  'gather4_ops':sum(v for k,v in c.items() if k.startswith('gather4')),
                  'sample_l_ops':sum(v for k,v in c.items() if k.startswith('sample_l')),
                  'uav_ops':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_')),
                  'udiv_lines':udiv_lines,
              }
          a=out['lab25']; b=out['lab27']
          vector25=any(re.search(r'\budiv\s+[^,]*\.xy\b',x,re.I) for x in a['udiv_lines'])
          scalar27=any(re.search(r'^udiv\s+r\d+\.[xyzw]\s*,',x,re.I) for x in b['udiv_lines'])
          no_vec27=not any(re.search(r'\budiv\s+[^,]*\.xy\b',x,re.I) for x in b['udiv_lines'])
          texture_ok=all(x['gather4_ops']==1 and x['sample_l_ops']==4 and x['uav_ops']==0 for x in (a,b))
          cost_ok=(a['instruction_total']==62 and b['instruction_total']==62 and a['cso_bytes']==2920 and b['cso_bytes']==2908)
          report={
              'protocol':'LAB27_GTX_PACK_V2_STATIC_DXBC_AUDIT',
              'lab25':a,'lab27':b,
              'lab25_vector_udiv_xy':vector25,
              'lab27_scalar_udiv':scalar27,
              'lab27_no_vector_udiv_xy':no_vec27,
              'texture_contract_pass':texture_ok,
              'expected_cost_pass':cost_ok,
          }
          report['pass']=bool(vector25 and scalar27 and no_vec27 and texture_ok and cost_ok)
          (root/'STATIC_DXBC_AUDIT.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          if not report['pass']: raise SystemExit('static DXBC audit failed')
          '@ | python -

      - name: Prepare bench-local corrected host source
        shell: pwsh
        run: |
          $root='lab_results\lab27_gtx_pack_v2'
          $src=Get-Content 'hardware_validation\ptar_moe_ng_v02_lab27_compare.cpp' -Raw
          $old='static const char* kLabVsSha ="f2512c09f70c30aa6f4b06e6885f34acac23ee5e5e3b94486b0846159578fcf8";'
          $new='static const char* kLabVsSha ="f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b";'
          if(-not $src.Contains($old)){ throw 'expected stale kLabVsSha marker not found in bench source' }
          $patched=$src.Replace($old,$new)
          if($patched.Contains('f2512c09f70c30aa6f4b06e6885f34acac23ee5e5e3b94486b0846159578fcf8')){ throw 'stale fullscreen VS hash remains in patched bench source' }
          $patched | Set-Content "$root\ptar_moe_ng_v02_lab27_compare_v2.cpp" -Encoding utf8
          @'
          V2 bench-local source correction only.
          The committed LAB27 algorithm source is not changed.
          The previous pack expected the wrong hash for lab_fullscreen_vs.cso.
          CI compilation on the same LAB27 branch produced f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b,
          and V2 requires two independent same-job compilations to reproduce that exact SHA-256 before building the host.
          '@ | Set-Content "$root\PTAR_LAB27_GTX960M_COMPARE_PACK_V2\BENCH_LOCAL_HASH_CORRECTION.txt" -Encoding ascii

      - name: Build Win81 x64 MT comparison host
        shell: pwsh
        run: |
          $root='lab_results\lab27_gtx_pack_v2'
          $pack="$root\PTAR_LAB27_GTX960M_COMPARE_PACK_V2"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          $inc='runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\include'
          $src="$root\ptar_moe_ng_v02_lab27_compare_v2.cpp"
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /MT /W4 /WX /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I `"$inc`" `"$src`" /Fe:`"$pack\ptar_lab27_gtx960m_compare.exe`" /Fo:`"$root\ptar_lab27_gtx960m_compare.obj`" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib"
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(-not (Test-Path "$pack\ptar_lab27_gtx960m_compare.exe")){ throw 'EXE not produced' }
          if((Get-Item "$pack\ptar_lab27_gtx960m_compare.exe").Length -le 0){ throw 'EXE empty' }

      - name: Audit PE imports and subsystem
        shell: pwsh
        run: |
          $root='lab_results\lab27_gtx_pack_v2'
          $pack="$root\PTAR_LAB27_GTX960M_COMPARE_PACK_V2"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          $cmd="call `"$vcvars`" && dumpbin /dependents `"$pack\ptar_lab27_gtx960m_compare.exe`" > `"$pack\IMPORTS.txt`" && dumpbin /headers `"$pack\ptar_lab27_gtx960m_compare.exe`" > `"$pack\PE_HEADERS.txt`" && dumpbin /imports `"$pack\ptar_lab27_gtx960m_compare.exe`" > `"$pack\PE_IMPORTS_FULL.txt`""
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $imports=Get-Content "$pack\IMPORTS.txt" -Raw
          foreach($bad in @('D3DCOMPILER','VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){
            if($imports -match [regex]::Escape($bad)){ throw "forbidden runtime import detected: $bad" }
          }
          $headers=Get-Content "$pack\PE_HEADERS.txt" -Raw
          if($headers -notmatch '8664 machine \(x64\)'){ throw 'PE machine is not x64' }
          if($headers -notmatch '6\.03\s+subsystem version'){ throw 'PE subsystem version is not 6.03' }
          Write-Host '[PASS] x64 / subsystem 6.03 / no D3DCompiler or dynamic CRT imports'

      - name: WARP smoke all frozen shaders
        shell: pwsh
        run: |
          $pack=(Resolve-Path 'lab_results\lab27_gtx_pack_v2\PTAR_LAB27_GTX960M_COMPARE_PACK_V2').Path
          Push-Location $pack
          try {
            & .\ptar_lab27_gtx960m_compare.exe --warp-smoke | Tee-Object -FilePath WARP_SMOKE.txt
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          } finally { Pop-Location }
          $smoke=Get-Content "$pack\WARP_SMOKE.txt" -Raw
          if($smoke -notmatch '\[PASS\] WARP smoke'){ throw 'WARP smoke PASS marker missing' }
          foreach($h in @(
            'ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72',
            '48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44',
            '6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16',
            'f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          )){
            if($smoke -notmatch [regex]::Escape($h)){ throw "WARP smoke did not verify expected hash $h" }
          }

      - name: Finalize pack provenance and launcher
        shell: pwsh
        run: |
          $root='lab_results\lab27_gtx_pack_v2'
          $pack="$root\PTAR_LAB27_GTX960M_COMPARE_PACK_V2"
          $exeHash=(Get-FileHash "$pack\ptar_lab27_gtx960m_compare.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content "$pack\HASHES.txt" "$exeHash  ptar_lab27_gtx960m_compare.exe" -Encoding ascii
          Copy-Item "$root\STATIC_DXBC_AUDIT.json" "$pack\STATIC_DXBC_AUDIT.json"

          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "ptar_lab27_gtx960m_compare.exe" (
            echo [FAIL] Executable absent.
            exit /b 10
          )
          echo [PTAR] LAB27 vs LAB25 vs K185 - GTX 960M - 600 triades equilibrees
          ptar_lab27_gtx960m_compare.exe
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" echo [FAIL] Code retour %RC%
          if "%RC%"=="0" echo [PASS] Resultats dans le dossier results
          pause
          exit /b %RC%
          '@ | Set-Content "$pack\RUN_LAB27_GTX960M_COMPARE.bat" -Encoding ascii

          @'
          PTAR LAB27 - GTX960M TARGETED HARDWARE COMPARE V2

          Objectif: mesurer LAB27 face a la baseline LAB25 dans UNE MEME execution, avec K185 comme controle de P-state.
          Le test effectue 60 triades de chauffe puis 600 triades mesurees selon les six permutations possibles de LAB25/LAB27/K185.

          Lancer uniquement RUN_LAB27_GTX960M_COMPARE.bat sur Windows 8.1 + GTX 960M.
          Ne pas relancer LAB25/LAB26 ni la parite 42 cas deja valides.

          A retourner: le dossier results cree par le test, compresse en ZIP si possible.

          Aucun resultat materiel n'est pre-suppose. LAB27 ne sera promu que si le gain face a LAB25 est reproductible dans les deltas apparies et coherent avec K185.
          '@ | Set-Content "$pack\README_FIRST.txt" -Encoding utf8

          @(
            'protocol=LAB27_GTX960M_SAME_RUN_BALANCED_COMPARE_V2',
            "branch=$env:GITHUB_REF_NAME",
            "commit=$env:GITHUB_SHA",
            'target=Windows 8.1 x64 / D3D11 FL11_0',
            'host_crt=/MT',
            'pe_subsystem=6.03',
            'runtime_hlsl_compiler=false',
            'dimensions=1280x720 -> 1920x1080',
            'warmup_triads=60',
            'measured_triads=600',
            'order_protocol=SIX_ROTATING_PERMUTATIONS_BALANCED',
            'lab25_sha256=ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72',
            'lab27_sha256=48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44',
            'k185_sha256=6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16',
            'lab_fullscreen_vs_sha256=f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b',
            'texture_contract=1 GatherGreen + 4 SampleLevel + 0 UAV',
            'software_dimension_gate=PASS_6_OF_6_BIT_EXACT',
            'warp_smoke=PASS',
            'physical_gtx960m_executed=false',
            'main_modified=false',
            'source_modified=false',
            'canonical_lab_branch_modified=false'
          ) | Set-Content "$pack\PROVENANCE.txt" -Encoding ascii

          $manifest=Get-ChildItem $pack -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel=$_.FullName.Substring((Resolve-Path $pack).Path.Length+1).Replace('\','/')
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $rel"
          }
          $manifest | Set-Content "$pack\MANIFEST_SHA256.txt" -Encoding ascii

      - name: Final pack integrity audit
        shell: pwsh
        run: |
          $pack=(Resolve-Path 'lab_results\lab27_gtx_pack_v2\PTAR_LAB27_GTX960M_COMPARE_PACK_V2').Path
          foreach($f in @(
            'ptar_lab27_gtx960m_compare.exe',
            'RUN_LAB27_GTX960M_COMPARE.bat',
            'README_FIRST.txt',
            'PROVENANCE.txt',
            'HASHES.txt',
            'MANIFEST_SHA256.txt',
            'STATIC_DXBC_AUDIT.json',
            'IMPORTS.txt',
            'PE_HEADERS.txt',
            'PE_IMPORTS_FULL.txt',
            'WARP_SMOKE.txt',
            'TOOLCHAIN.txt',
            'BENCH_LOCAL_HASH_CORRECTION.txt',
            'shaders\lab25.cso',
            'shaders\lab27.cso',
            'shaders\lab_fullscreen_vs.cso',
            'shaders\ptar_k185_control_ps.cso',
            'shaders\ptar_vs.cso'
          )){
            if(-not (Test-Path (Join-Path $pack $f))){ throw "pack missing $f" }
          }
          $prov=Get-Content "$pack\PROVENANCE.txt" -Raw
          foreach($needle in @('host_crt=/MT','pe_subsystem=6.03','runtime_hlsl_compiler=false','software_dimension_gate=PASS_6_OF_6_BIT_EXACT','physical_gtx960m_executed=false','main_modified=false','source_modified=false','canonical_lab_branch_modified=false')){
            if($prov -notmatch [regex]::Escape($needle)){ throw "provenance missing $needle" }
          }
          $audit=Get-Content "$pack\STATIC_DXBC_AUDIT.json" -Raw | ConvertFrom-Json
          if(-not $audit.pass){ throw 'STATIC_DXBC_AUDIT pass=false' }
          Write-Host '[PASS] isolated V2 GTX960M compare pack integrity audit complete'

      - name: Upload V2 GTX960M compare pack
        uses: actions/upload-artifact@v4
        with:
          name: PTAR_LAB27_GTX960M_COMPARE_PACK_V2
          path: lab_results/lab27_gtx_pack_v2/PTAR_LAB27_GTX960M_COMPARE_PACK_V2
          if-no-files-found: error
          compression-level: 9
