name: RC45 Package Script Lab

on:
  push:
    branches: [build/rc45-windowed-presenter-follow-20260914]
    paths:
      - lab/borderless/rc45/package_scripts/**
      - .github/workflows/rc45-package-script-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rc45-package-scripts:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct certified RC41 script fixture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$root='lab/raster/rc41/package_scripts';$joined=''
          foreach($name in @('part01.b64','part02.b64','part03.b64','part04.b64','part05.b64')){$joined += (Get-Content -LiteralPath "$root/fixture_parts/$name" -Raw).Trim()}
          $zip="$root/rc41_exact.zip";[IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($joined))
          $h=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne 'd12ac6a05f21477e720e909be37139545c033008ef7bfafddf518f418ca7c43d'){throw "RC41 fixture drift $h"}
          Expand-Archive $zip "$root/rc41_exact" -Force

      - name: Regenerate certified RC41B to RC44 chain
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python lab/raster/rc41b/package_scripts/build_rc41b_scripts.py lab/raster/rc41/package_scripts/rc41_exact lab/borderless/rc45/package_scripts/rc41b
          if($LASTEXITCODE -ne 0){throw 'RC41B transformer failed'}
          python lab/raster/rc42/package_scripts/build_rc42_scripts.py lab/borderless/rc45/package_scripts/rc41b lab/borderless/rc45/package_scripts/rc42
          if($LASTEXITCODE -ne 0){throw 'RC42 transformer failed'}
          python lab/borderless/rc43/package_scripts/build_rc43_scripts.py lab/borderless/rc45/package_scripts/rc42 lab/borderless/rc45/package_scripts/rc43
          if($LASTEXITCODE -ne 0){throw 'RC43 transformer failed'}
          python lab/borderless/rc44/package_scripts/build_rc44_scripts.py lab/borderless/rc45/package_scripts/rc43 lab/borderless/rc45/package_scripts/rc44
          if($LASTEXITCODE -ne 0){throw 'RC44 transformer failed'}
          $expected=[ordered]@{
            'install.ps1'='607819a3d95e24cd1ad4bcf827de0b07800823a98fbd7d468d8f85c3ba7bf580'
            'verify.ps1'='fc6ed6a7235182f53cd0b66a50ba40e7d10cd3d24595c1225d70f4569a4694fb'
            'rollback.ps1'='de10055d5fd52507c1f9e74615d6f8b8aa1a155da2e0f1b2635a62e557b8b150'
            'uninstall_overlay.ps1'='cdcd3c010effba0954e88c1deaaf1a9543fe6634ac2021bb0975e74670939343'
            'collect_rc41.ps1'='45810d723a19dccfb64fb3167c9e1fce150bf0e2693d66680075618bde14c944'
          }
          foreach($name in $expected.Keys){$h=(Get-FileHash "lab/borderless/rc45/package_scripts/rc44/$name" -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $expected[$name]){throw "RC44 source drift $name $h"}}

      - name: Generate exact RC45 scripts and verify hashes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$out='lab/borderless/rc45/package_scripts/out'
          python lab/borderless/rc45/package_scripts/build_rc45_scripts.py lab/borderless/rc45/package_scripts/rc44 $out
          if($LASTEXITCODE -ne 0){throw 'RC45 transformer failed'}
          $expected=[ordered]@{
            'install.ps1'='aaed0d7a59de9aa9a7afc834496c8492c906113520e666a65b44f82d467a788e'
            'verify.ps1'='e0405017838491b307d94ac5ee09655ec9baddf6d4f7cbd4e8ef827ab9e0ebfd'
            'rollback.ps1'='e1b39421e6992a4d7639a0b9c099ca19564065fd5fd785e9742c17ddbede5068'
            'uninstall_overlay.ps1'='170c44661304089bea414efa3662e76941e39a57b32db49a8c927a25a7e763d0'
            'collect_rc41.ps1'='3b13f3a570baccac931802b26ce4e9d7086d658e8dfdf5b5a69e034cb81679a0'
          }
          foreach($name in $expected.Keys){$h=(Get-FileHash "$out/$name" -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $expected[$name]){throw "RC45 hash mismatch $name $h"};Write-Host "PASS RC45 HASH $name $h"}

      - name: Parse RC45 scripts with Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$root='lab/borderless/rc45/package_scripts/out'
          foreach($name in @('install.ps1','verify.ps1','rollback.ps1','uninstall_overlay.ps1','collect_rc41.ps1')){
            $tokens=$null;$errors=$null;[void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "$root/$name"),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Host "PARSE_ERROR $name $($_.Message)"};throw "PowerShell parse failure $name"};Write-Host "PASS PARSE $name"
          }

      - name: Validate RC45 package safety contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$root='lab/borderless/rc45/package_scripts/out'
          $i=Get-Content "$root/install.ps1" -Raw;$v=Get-Content "$root/verify.ps1" -Raw;$r=Get-Content "$root/rollback.ps1" -Raw;$u=Get-Content "$root/uninstall_overlay.ps1" -Raw;$c=Get-Content "$root/collect_rc41.ps1" -Raw
          $old='13f544d39bbe39811a83c1f5b3bf823d18ef00edf6c9d8cc8ac891208bdc8551';$new='a9c0eb2ec74ac278c2aaef33d1bca237aa504366b43774f8e624374314a6695c';$raster='7ffe7aa1b9afa42d5f22557cae29a4f65e17379c2a2f181f879427277839f1ca'
          $checks=[ordered]@{
            'install exact RC45 carrier'=$i.Contains("`$ExpectedBorderless='$new'")
            'upgrade accepts RC44 carrier'=($i.Contains($old) -and $i.Contains($new))
            'RC42 raster remains exact'=($i.Contains($raster) -and $v.Contains($raster))
            'no WindowStyle force'=(-not $i.Contains('Set-ItemProperty -LiteralPath $key -Name WindowStyle -Type DWord -Value 1'))
            'WindowStyle remains passive'=($i.Contains('WINDOWSTYLE_PRESERVED=') -and $i.Contains('$m.windowstyle.applied=$false'))
            'no AffectGuiResolution force'=(-not $i.Contains('-Name AffectGuiResolution -Type DWord -Value 1'))
            'package marker RC45'=$i.Contains("package='PTAR_RC45_WINDOWED_PRESENTER_FOLLOW'")
            'mode marker RC45'=$i.Contains('MODE=RC45_WINDOWED_PRESENTER_FOLLOW_WITH_RC42_RASTER')
            'verify marker RC45'=$v.Contains('VERIFY_RC45_WINDOWED_PRESENTER_FOLLOW=PASS')
            'rollback accepts RC45 carrier'=($r.Contains($new) -and $r.Contains('KnownBorder'))
            'uninstall accepts RC45 carrier'=($u.Contains($new) -and $u.Contains('borderExpected'))
            'collector emits RC45 zip'=$c.Contains('PTAR_RC45_RESULTS_')
            'collector includes borderless log'=$c.Contains('ptar_borderless_rc38.log')
            'collector includes raster log'=$c.Contains('ptar_rc41.log')
            'collector includes bootstrap log'=$c.Contains('ptar_rc41_bootstrap.log')
            'unknown runtime refusal retained'=$i.Contains('DLL locale inconnue')
            'unknown carrier refusal retained'=$i.Contains('Sidecar borderless local inconnu')
            'unknown raster refusal retained'=$i.Contains('Sidecar RC41 local inconnu')
            'transaction rollback retained'=$i.Contains('Installation transaction annulee')
            'canonical 107 verification retained'=$v.Contains('BASE GITHUB 107/107 fichiers byte-identiques')
          }
          foreach($k in $checks.Keys){if(-not $checks[$k]){throw "CONTRACT FAIL $k"};Write-Host "PASS $k"}
          'RC45_PACKAGE_SCRIPTS=20/20 PASS' | Set-Content RC45_PACKAGE_SCRIPT_CONTRACT.txt -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR_RC45_PACKAGE_SCRIPT_LAB
          path: |
            RC45_PACKAGE_SCRIPT_CONTRACT.txt
            lab/borderless/rc45/package_scripts/out/*.ps1
          if-no-files-found: error
          retention-days: 7
