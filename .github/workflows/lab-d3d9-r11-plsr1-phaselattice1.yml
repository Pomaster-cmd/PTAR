name: LAB D3D9 R11 PLSR1 PHASELATTICE1
on:
  push:
    branches:
      - lab/r11-plsr1-phaselattice1
  workflow_dispatch:
jobs:
  r11:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Qualify R11 phase-lattice SR over R10
        shell: pwsh
        run: |
          .\lab\tsr1\apply_r10_aliasresidual.ps1
          .\lab\tsr1\apply_r11_plsr1.ps1
          .\lab\tsr1\run_r8_tsr_ci_compat.ps1
          .\lab\tsr1\run_tsr1_gpu_smoke.ps1
          .\lab\tsr1\run_tsr1_perf.ps1

          $src=Get-Content .\lab\tsr1\ptar_tsr1_resolve_ps.hlsl -Raw
          foreach($token in @(
            'PTAR R11 PLSR1 PHASELATTICE1',
            'PtLatticeWeights',
            'phaseSep',
            'latticeSample',
            'latticeStrength=lerp(0.80f,1.00f,detailProtect)'))
          {
            if($src -notmatch [regex]::Escape($token)){throw "R11 PLSR token missing: $token"}
          }
          foreach($old in @('float wc00=SharpWeight','aliasResidual=historyBilinear-currentBilinear'))
          {
            if($src -match [regex]::Escape($old)){throw "R11 obsolete averaging token remained: $old"}
          }

          $quality=Get-Content .\artifact\R8_TSR1_QUALITY_ORACLE.txt -Raw
          $x=[regex]::Match($quality,'TSR1_NATIVE_X_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          $y=[regex]::Match($quality,'TSR1_NATIVE_Y_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          $xy=[regex]::Match($quality,'TSR1_NATIVE_XY_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          if(-not ($x.Success -and $y.Success -and $xy.Success)){throw 'R11 quality oracle parse failed'}
          $ci=[Globalization.CultureInfo]::InvariantCulture
          $xp=[double]::Parse($x.Groups[3].Value,$ci)
          $yp=[double]::Parse($y.Groups[3].Value,$ci)
          $xyp=[double]::Parse($xy.Groups[3].Value,$ci)
          $worst=[Math]::Min($xp,[Math]::Min($yp,$xyp))
          if($worst -lt 60.0){throw "R11 phase-lattice native-reference improvement too small: $worst%"}

          $asm=Get-Content .\artifact\TSR1_RESOLVE_ASM.txt -Raw
          $tex=([regex]::Matches($asm,'(?im)^\s*texld')).Count
          $slots=[int]([regex]::Match($asm,'(?i)approximately\s+(\d+)\s+instruction slots').Groups[1].Value)
          if($tex -ne 10){throw "R11 resolve texture-read regression: $tex"}
          if($slots -gt 240){throw "R11 resolve slot budget exceeded: $slots"}

          Copy-Item .\artifact\PTAR_R8_VALIDATION.txt .\artifact\PTAR_R11_VALIDATION.txt -Force
          @(
            'PTAR_D3D9_BRANCH=R11_PLSR1_PHASELATTICE1_OVER_R10_ALIASRESIDUAL1',
            ('SOURCE_COMMIT='+$env:GITHUB_SHA),
            'R11_RECONSTRUCTION=DOMINANT_AXIS_IRREGULAR_FOUR_SAMPLE_LATTICE_CUBIC',
            'R11_FLAT_LATTICE_STRENGTH=0.80',
            'R11_DETAIL_LATTICE_STRENGTH=1.00',
            'R11_PHASE_SEPARATION_MIN=0.08',
            'R11_PHASE_SEPARATION_FULL=0.25',
            'R11_EXTRA_TEXTURE_READS_OVER_R10=0',
            'R11_EXTRA_PASSES_OVER_R10=0',
            ('R11_RESOLVE_TEXLD='+$tex),
            ('R11_RESOLVE_SLOTS='+$slots),
            'R11_FG_SCOPE=UNCHANGED_R10_FG_OFF_ONLY',
            ('R11_NATIVE_X_IMPROVEMENT_PCT='+$xp.ToString('F3',$ci)),
            ('R11_NATIVE_Y_IMPROVEMENT_PCT='+$yp.ToString('F3',$ci)),
            ('R11_NATIVE_XY_IMPROVEMENT_PCT='+$xyp.ToString('F3',$ci)),
            ('R11_NATIVE_WORST_IMPROVEMENT_PCT='+$worst.ToString('F3',$ci)),
            'R11_FIELD_BASIS=REAL_POINT720_R10_NATIVE1080_TRIO_20261014',
            'R11_PRIMARY_OBJECTIVE=PERCEIVED_RESOLUTION_AND_NATIVE_CORRELATED_MICRODETAIL') | Add-Content .\artifact\PTAR_R11_VALIDATION.txt -Encoding ascii
          Write-Host "R11_RESOLVE=$slots`_SLOTS_$tex`_TEXLD"
          Write-Host "R11_NATIVE_WORST_IMPROVEMENT_PCT=$($worst.ToString('F3',$ci))"
          Write-Host 'R11_PLSR1_PHASELATTICE1=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: R11-PLSR1-PHASELATTICE1
          path: artifact/
          if-no-files-found: error
