name: LAB D3D9 BIC16 R3 FULL
on:
  push:
    branches:
      - lab/bic16-r3
  workflow_dispatch:
jobs:
  r3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Qualify Bic16 R3 delta over FULLQUALITY1
        shell: pwsh
        run: .\lab\bicubic16\run_r3_full_ci.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BIC16-R3-FULL
          path: artifact/
          if-no-files-found: error
