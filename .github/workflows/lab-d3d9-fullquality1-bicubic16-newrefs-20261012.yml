name: LAB D3D9 FULLQUALITY1 BICUBIC16 NEWREFS 20261012
on:
  push:
    branches:
      - lab/d3d9-spec5-bicubic16-newrefs-20261012
  workflow_dispatch:
jobs:
  bicubic16:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Reconstruct FULLQUALITY1 and qualify only Bicubic16 delta
        shell: pwsh
        run: .\lab\bicubic16\run_bicubic16_full_ci.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-D3D9-FULLQUALITY1-BICUBIC16-VALIDATED
          path: artifact/
          if-no-files-found: error
