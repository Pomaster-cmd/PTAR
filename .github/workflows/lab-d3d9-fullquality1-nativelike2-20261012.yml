name: LAB D3D9 FULLQUALITY1 NATIVELIKE2 20261012

on:
  push:
    branches: [lab/d3d9-fullquality1-nativelike2-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nativelike2:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Reconstruct FULLQUALITY1 and qualify only NATIVELIKE2 SPEC5 delta
        shell: pwsh
        run: .\lab\nativelike2prod\run_nativelike2_full_ci.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-D3D9-FULLQUALITY1-NATIVELIKE2-VALIDATED
          path: artifact/
          if-no-files-found: error
