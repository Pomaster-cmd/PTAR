name: LAB36A Diag Product Full Software Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab36-diag-product-revisit

permissions:
  contents: read

jobs:
  full-gate:
    if: contains(github.event.head_commit.message, '[run-lab36a-full]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile frozen LAB31G and LAB36A
        shell: pwsh
        run: |
          $out='lab_results\lab36a_full'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab31g.cso" /Fc "$out\lab31g.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab31g_host_inv_half_mad_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab36a.cso" /Fc "$out\lab36a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab36a_diag_product_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $h31=(Get-FileHash "$out\lab31g.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h36=(Get-FileHash "$out\lab36a.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h31 -ne 'ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1'){ throw "LAB31G hash mismatch $h31" }
          if($h36 -ne 'cd519ccaa32523c7e6a931a052e123c31860c0e0f964b41be5d17500ea27fd6c'){ throw "LAB36A hash mismatch $h36" }
          @("LAB31G=$h31","LAB36A=$h36") | Set-Content "$out\HASHES.txt" -Encoding ascii

      - name: Predicate Monte Carlo equivalence
        shell: pwsh
        run: |
          @'
          import json,numpy as np
          rng=np.random.default_rng(3601001)
          tested=0; mismatch=0
          for _ in range(20):
              n=250000
              tl=rng.random(n,dtype=np.float32); tr=rng.random(n,dtype=np.float32); bl=rng.random(n,dtype=np.float32); br=rng.random(n,dtype=np.float32)
              gx=np.float32(np.float32(tr+br)-np.float32(tl+bl)); gy=np.float32(np.float32(bl+br)-np.float32(tl+tr))
              base=np.abs(gx)>=np.abs(gy)
              a=np.float32(br-tl); b=np.float32(tr-bl); diag=np.float32(a*b)>=np.float32(0.0)
              mismatch += int(np.count_nonzero(base!=diag)); tested += n
          r={'protocol':'LAB36A_DIRECTION_PREDICATE_FLOAT32_MONTE_CARLO','tested_quads':tested,'mismatches':mismatch,'pass':mismatch==0}
          open('lab_results/lab36a_full/PREDICATE_AUDIT.json','w').write(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          if mismatch: raise SystemExit('direction predicate mismatch')
          '@ | python -

      - name: Generate shared ABI harness sources
        run: python tools/moe_ng_v02_prepare_shared_abi_harnesses.py --outdir lab_results/lab36a_full

      - name: Build shared WARP harnesses
        shell: pwsh
        run: |
          $out='lab_results\lab36a_full'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          foreach($n in @('float_shared','unorm8_shared')){
            $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 $out\warp_$n.cpp /Fe:$out\warp_$n.exe d3d11.lib dxgi.lib"
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }

      - name: Run full shared-ABI software admission
        shell: pwsh
        run: |
          python tools/moe_ng_v02_shared_abi_full_gate.py `
            --outdir lab_results/lab36a_full `
            --baseline lab31g `
            --candidate lab36a `
            --baseline-sha ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1 `
            --candidate-sha cd519ccaa32523c7e6a931a052e123c31860c0e0f964b41be5d17500ea27fd6c `
            --baseline-instructions 53 `
            --candidate-instructions 53 `
            --baseline-bytes 2568 `
            --candidate-bytes 2560

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab36a-diag-product-full-software-gate
          path: lab_results/lab36a_full
