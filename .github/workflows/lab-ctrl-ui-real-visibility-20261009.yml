name: LAB CTRL UI real visibility 20261009

on:
  push:
    branches: [lab/ctrl-ui-real-visibility-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove rendering and FG cores untouched
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='0066c7d4b32aed167d2a74030801e896b8fe9aa4'
          $allowed=@(
            'compat/x86_d3d9/ptar_diag_ui_bridge.h',
            'compat/x86_d3d9/ptar_hud.h',
            'compat/x86_d3d9/ptar_gw16i_hud_d3d9.h',
            '.github/workflows/lab-ctrl-ui-real-visibility-20261009.yml'
          )
          $changed=@(git diff --name-only $base HEAD)
          $bad=@($changed | Where-Object { ($_ -notin $allowed) -and ($_ -notlike 'lab/ctrl_ui_real_visibility/*') })
          if($bad.Count -ne 0){throw ('Unexpected file changed: '+($bad -join ', '))}
          foreach($core in @(
            'compat/x86_d3d9/ptar_d3d9_proxy.cpp',
            'compat/x86_d3d9/ptar_fg_pacer.h',
            'compat/x86_d3d9/ptar_fg_me_coarse_ps.hlsl',
            'compat/x86_d3d9/ptar_fg_me_refine_ps.hlsl',
            'compat/x86_d3d9/ptar_fg_interpolate_ps.hlsl',
            'compat/x86_d3d9/ptar_moe_d3d9_ps.hlsl',
            'compat/x86_d3d9/ptar_moe_universal_d3d9_ps.hlsl'
          )){
            $d=git diff --name-only $base HEAD -- $core
            if($d){throw "Core changed unexpectedly: $core"}
          }
          Write-Host 'D3D9_RENDER_CORE_UNTOUCHED=PASS'
          Write-Host 'D3D9_FG_PACER_UNTOUCHED=PASS'
          Write-Host 'D3D9_FG_SHADERS_UNTOUCHED=PASS'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile shader bytecode required by exact runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build_x86,artifact | Out-Null
          $fxc=Get-Command fxc.exe -ErrorAction SilentlyContinue
          if(-not $fxc){
            $roots=@("$env:ProgramFiles(x86)\Windows Kits\10\bin","$env:ProgramFiles(x86)\Windows Kits\8.1\bin")
            foreach($root in $roots){if(Test-Path $root){$fxc=Get-ChildItem $root -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1;if($fxc){break}}}
          }
          if(-not $fxc){throw 'fxc.exe not found'}
          $fxcPath=if($fxc.Path){$fxc.Path}else{$fxc.FullName}
          $jobs=@(
            @('ps_3_0','compat\x86_d3d9\ptar_moe_d3d9_ps.hlsl','build_x86\ptar_ps_bytecode.h','g_ptarPs'),
            @('ps_3_0','compat\x86_d3d9\ptar_moe_universal_d3d9_ps.hlsl','build_x86\ptar_universal_ps_bytecode.h','g_ptarUniversalPs'),
            @('ps_2_0','compat\x86_d3d9\ptar_bilinear_ref_ps.hlsl','build_x86\ptar_bilinear_ps_bytecode.h','g_ptarBilinearPs'),
            @('ps_3_0','compat\x86_d3d9\ptar_gw16i_hud_ps.hlsl','build_x86\ptar_gw16i_hud_ps_bytecode.h','g_ptarGw16iHudPs'),
            @('ps_3_0','compat\x86_d3d9\ptar_gw16i_feedback_ps.hlsl','build_x86\ptar_gw16i_feedback_ps_bytecode.h','g_ptarGw16iFeedbackPs'),
            @('ps_3_0','compat\x86_d3d9\ptar_fg_me_coarse_ps.hlsl','build_x86\ptar_fg_me_coarse_ps_bytecode.h','g_ptarFgMeCoarsePs'),
            @('ps_3_0','compat\x86_d3d9\ptar_fg_me_refine_ps.hlsl','build_x86\ptar_fg_me_refine_ps_bytecode.h','g_ptarFgMeRefinePs'),
            @('ps_3_0','compat\x86_d3d9\ptar_fg_interpolate_ps.hlsl','build_x86\ptar_fg_interpolate_ps_bytecode.h','g_ptarFgInterpolatePs')
          )
          foreach($j in $jobs){& $fxcPath /nologo /T $j[0] /E main /O3 /Fh $j[2] /Vn $j[3] $j[1];if($LASTEXITCODE -ne 0){throw "FXC failed: $($j[1])"}}
          Write-Host 'FXC_ALL=PASS'

      - name: Build exact x86 D3D9 runtime with diagnostic HUD bridge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /LD /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\ptar_d3d9_proxy.cpp /link user32.lib /DEF:compat\x86_d3d9\d3d9_proxy.def /OUT:artifact\d3d9.dll /SUBSYSTEM:WINDOWS,6.03
          if($LASTEXITCODE -ne 0){throw 'D3D9 runtime compile failed'}
          dumpbin /headers artifact\d3d9.dll | Tee-Object build_x86\HEADERS.txt
          dumpbin /dependents artifact\d3d9.dll | Tee-Object build_x86\DEPENDENTS.txt
          $h=Get-Content build_x86\HEADERS.txt -Raw
          $d=Get-Content build_x86\DEPENDENTS.txt -Raw
          if($h -notmatch '14C machine \(x86\)'){throw 'runtime is not x86'}
          foreach($bad in @('VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($d -match $bad){throw "forbidden dynamic runtime dependency $bad"}}
          $sha=(Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "D3D9_DLL_SHA256=$sha"
          Write-Host 'D3D9_RUNTIME_BUILD=PASS'

      - name: Re-run production GW16I GPU visibility test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I compat\x86_d3d9 compat\x86_d3d9\d3d9_gw16i_hud_gpu_smoke.cpp /link user32.lib /OUT:artifact\d3d9_gw16i_hud_gpu_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){throw 'HUD smoke compile failed'}
          & artifact\d3d9_gw16i_hud_gpu_smoke.exe | Tee-Object build_x86\D3D9_GW16I_HUD_GPU_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "HUD smoke failed rc=$LASTEXITCODE"}
          $t=Get-Content build_x86\D3D9_GW16I_HUD_GPU_SMOKE.txt -Raw
          if($t -notmatch 'D3D9_GW16I_HUD_GPU_SMOKE=PASS'){throw 'base HUD PASS marker missing'}
          if($t -notmatch 'HUD_MAIN changed=[1-9][0-9]*'){throw 'base HUD has no visible pixels'}
          if($t -notmatch 'HUD_FEEDBACK changed=[1-9][0-9]*'){throw 'base feedback has no visible pixels'}
          Write-Host 'BASE_D3D9_HUD_VISIBILITY=PASS'

      - name: End-to-end controller-file to D3D9 backbuffer bridge GPU test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I compat\x86_d3d9 lab\ctrl_ui_real_visibility\d3d9_diag_ui_bridge_gpu_smoke.cpp /link user32.lib /OUT:artifact\d3d9_diag_ui_bridge_gpu_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){throw 'bridge GPU smoke compile failed'}
          & artifact\d3d9_diag_ui_bridge_gpu_smoke.exe | Tee-Object build_x86\D3D9_DIAG_UI_BRIDGE_GPU_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "bridge GPU smoke failed rc=$LASTEXITCODE"}
          $t=Get-Content build_x86\D3D9_DIAG_UI_BRIDGE_GPU_SMOKE.txt -Raw
          foreach($token in @('F5_PRE','F5_FG_ACTIVE','F5_POST','F5_MEASURE','F5_DONE','F1_READY','F1_MEASURE','F1_DONE','F1_ERROR','F5_ERROR')){
            if($t -notmatch ($token+' type=[0-9]+ changed=[1-9][0-9]{3,}')){throw "No visible D3D9 pixels for $token"}
          }
          if($t -notmatch 'DIAG_UI_EXPIRY=PASS'){throw 'bridge expiry gate missing'}
          if($t -notmatch 'D3D9_DIAG_UI_BRIDGE_GPU_SMOKE=PASS'){throw 'bridge PASS marker missing'}
          Write-Host 'CTRL_F1_F5_IN_GAME_BACKBUFFER_VISIBILITY=PASS'

      - name: Compile x64 CTRL+F5 fallback UI and run logic selftest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /optimize+ /platform:x64 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:artifact\PTARRawCompare3Controller_D3D9_UIFIX1.exe lab\ctrl_ui_real_visibility\PTARRawCompare3Controller_D3D9_UIFIX1.cs
          if($LASTEXITCODE -ne 0){throw 'CTRL+F5 x64 compile failed'}
          & artifact\PTARRawCompare3Controller_D3D9_UIFIX1.exe --selftest | Tee-Object build_x86\CTRL_F5_SELFTEST.txt
          if($LASTEXITCODE -ne 0){throw "CTRL+F5 selftest failed rc=$LASTEXITCODE"}
          if((Get-Content build_x86\CTRL_F5_SELFTEST.txt -Raw) -notmatch 'SELFTEST=PASS'){throw 'CTRL+F5 PASS marker missing'}
          Write-Host 'CTRL_F5_X64_CONTROLLER=PASS'

      - name: Package lab proof
        shell: pwsh
        run: |
          $sha=(Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'PTAR_CTRL_UI_REAL_VISIBILITY_LAB=PASS',
            'D3D9_UI_PATH=IN_GAME_BACKBUFFER_CLEAR_RECTS',
            'EXTERNAL_WINFORMS=FALLBACK_ONLY',
            'CTRL_F1_F5_BRIDGE=PTAR_D3D9_DIAG_UI.ini',
            'CORE_FG_UNTOUCHED=YES',
            ('D3D9_DLL_SHA256='+$sha),
            ('SOURCE_COMMIT='+$env:GITHUB_SHA)
          ) | Set-Content artifact\PTAR_CTRL_UI_REAL_VISIBILITY_VERSION.txt -Encoding ASCII
          Compress-Archive -Path artifact\d3d9.dll,artifact\PTAR_CTRL_UI_REAL_VISIBILITY_VERSION.txt -DestinationPath PTAR_CTRL_UI_REAL_VISIBILITY_LAB.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-CTRL-UI-REAL-VISIBILITY-LAB
          path: |
            PTAR_CTRL_UI_REAL_VISIBILITY_LAB.zip
            build_x86/HEADERS.txt
            build_x86/DEPENDENTS.txt
            build_x86/D3D9_GW16I_HUD_GPU_SMOKE.txt
            build_x86/D3D9_DIAG_UI_BRIDGE_GPU_SMOKE.txt
            build_x86/CTRL_F5_SELFTEST.txt
