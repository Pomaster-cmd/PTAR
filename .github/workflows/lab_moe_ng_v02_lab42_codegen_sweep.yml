name: LAB42 Packed UV Codegen Sweep

on:
  push:
    branches:
      - lab/moe-ng-v02-lab42-texture-issue-sweep

permissions:
  contents: read

jobs:
  codegen-sweep:
    if: contains(github.event.head_commit.message, '[run-lab42-codegen]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){throw 'x64 FXC not found'}
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT
      - name: Compile baseline and packed UV candidates
        shell: pwsh
        run: |
          $out='lab_results\lab42_codegen'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          $map=@{
            'lab38a'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38a_branchless_phase0_ps.hlsl'
            'lab42a'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab42a_packed_pm_uv_ps.hlsl'
            'lab42b'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab42b_packed_p1p2_uv_ps.hlsl'
            'lab42c'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab42c_packed_m1p2_uv_ps.hlsl'
            'lab42d'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab42d_packed_pm_reordered_samples_ps.hlsl'
          }
          foreach($n in $map.Keys){
            & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\$n.cso" /Fc "$out\$n.asm" $map[$n]
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          }
      - name: Audit static DXBC and texture issue positions
        shell: pwsh
        run: |
          @'
          import hashlib,json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab42_codegen'); names=['lab38a','lab42a','lab42b','lab42c','lab42d']
          op_re=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b'); temp_re=re.compile(r'^\s*dcl_temps\s+(\d+)\b',re.I)
          rows={}
          for n in names:
              lines=(root/f'{n}.asm').read_text(encoding='utf-8',errors='replace').splitlines(); ops=[]; temps=None; stream=[]
              for raw in lines:
                  mt=temp_re.match(raw)
                  if mt: temps=int(mt.group(1))
                  s=raw.lstrip(); m=op_re.match(raw)
                  if not s or s.startswith('//') or s.startswith('ps_5_0') or not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op); stream.append((len(ops),op,raw.strip()))
              c=Counter(ops); data=(root/f'{n}.cso').read_bytes(); tex=[x for x in stream if x[1].startswith('sample_l') or x[1].startswith('gather4')]
              sample_pos=[i for i,op,_ in tex if op.startswith('sample_l')]
              rows[n]={
                'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'instructions':len(ops),'temps':temps,
                'ops':dict(sorted(c.items())),'sample_instruction_positions':sample_pos,
                'sample_span':(max(sample_pos)-min(sample_pos) if sample_pos else None),
                'texture_stream':[{'instruction':i,'op':op,'asm':raw} for i,op,raw in tex],
                'gather4':sum(v for k,v in c.items() if k.startswith('gather4')),
                'sample_l':sum(v for k,v in c.items() if k.startswith('sample_l')),
                'uav':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_')),
                'div':c.get('div',0),'udiv':c.get('udiv',0)
              }
          base=rows['lab38a']
          for n,r in rows.items():
              r['instruction_delta_vs_lab38a']=r['instructions']-base['instructions']; r['byte_delta_vs_lab38a']=r['bytes']-base['bytes']; r['same_hash_as_lab38a']=r['sha256']==base['sha256']; r['texture_contract_pass']=r['gather4']==1 and r['sample_l']==4 and r['uav']==0 and r['div']==0 and r['udiv']==0
          report={'protocol':'LAB42_PACKED_UV_CODEGEN_SWEEP_V01','baseline':'lab38a','rows':rows}
          (root/'CODEGEN_SWEEP.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8'); print(json.dumps(report,indent=2))
          if rows['lab38a']['sha256']!='d60820f62ca69e2cb2ef995c37001f100733e179f0821d7eb83247ad2c0014d3': raise SystemExit('LAB38A hash mismatch')
          if not all(r['texture_contract_pass'] for r in rows.values()): raise SystemExit('texture/div contract failure')
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: lab42-codegen-sweep
          path: lab_results/lab42_codegen
