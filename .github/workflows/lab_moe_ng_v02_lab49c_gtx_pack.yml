name: LAB49C GTX960M Compare Pack

on:
  push:
    branches:
      - lab/moe-ng-v02-lab49-svpos-add-half
    paths:
      - 'tools/lab49c_prepare_gtx_comparator.py'
      - 'tools/moe_ng_v02_lab47_patch_dxbc.py'
      - 'tools/moe_ng_v02_lab49c_patch_dxbc.py'
      - '.github/workflows/lab_moe_ng_v02_lab49c_gtx_pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audit-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build and freeze LAB47A LAB49C DXBC
        shell: pwsh
        run: |
          $root='lab_results\lab49c_gtx_pack'; $pack="$root\PTAR_LAB49C_GTX960M_COMPARE_PACK"; $sh="$pack\shaders"
          New-Item -ItemType Directory -Force $sh | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$root\lab38a.cso" /Fc "$root\lab38a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38a_branchless_phase0_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/moe_ng_v02_lab47_patch_dxbc.py --input "$root\lab38a.cso" --output "$sh\lab47a.cso" --audit "$root\LAB47_PATCH_AUDIT.json"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/moe_ng_v02_lab49c_patch_dxbc.py --input "$sh\lab47a.cso" --output "$sh\lab49c.cso" --audit "$root\LAB49C_PATCH_AUDIT.json"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /dumpbin /Fc "$root\lab47a.asm" "$sh\lab47a.cso"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /dumpbin /Fc "$root\lab49c.asm" "$sh\lab49c.cso"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab_fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_k185_control_ps.cso "$sh\ptar_k185_control_ps.cso"
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_vs.cso "$sh\ptar_vs.cso"
          $expected=@{
            'lab47a.cso'='12ab14074c5de7a91b50aa8c114f4f235aea2f6d8903f8d0e6b2813e8907cc72'
            'lab49c.cso'='1e9692db2bf685fab74b3b1bf88afaf29b5ba21ac3cc86f4a2949b64da7f4f82'
            'ptar_k185_control_ps.cso'='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'
            'ptar_vs.cso'='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
            'lab_fullscreen_vs.cso'='f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          }
          $lines=@()
          foreach($n in ($expected.Keys | Sort-Object)){
            $p="$sh\$n"; if(-not(Test-Path $p)){throw "missing $n"}
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant(); if($got -ne $expected[$n]){throw "$n hash mismatch $got"}
            $bytes=[IO.File]::ReadAllBytes($p); if($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes,0,4) -ne 'DXBC'){throw "$n not DXBC"}
            $lines += "$got  shaders/$n"
          }
          $lines | Set-Content "$pack\HASHES.txt" -Encoding ascii

      - name: Static DXBC audit
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab49c_gtx_pack'); pack=root/'PTAR_LAB49C_GTX960M_COMPARE_PACK'; pat=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b'); rows={}
          for n in ('lab47a','lab49c'):
              ops=[]; temps=None; samples=[]; executable=[]
              for raw in (root/f'{n}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip(); m=pat.match(raw)
                  if s.startswith('dcl_temps '):
                      try: temps=int(s.split()[1])
                      except: pass
                  if not s or s.startswith('//') or s.startswith('ps_5_0') or not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op); executable.append(s.strip())
                  if op.startswith('sample_l'): samples.append(len(ops))
              c=Counter(ops)
              rows[n]={'instructions':len(ops),'bytes':(pack/'shaders'/f'{n}.cso').stat().st_size,'temps':temps,'add':c.get('add',0),'round_ni':c.get('round_ni',0),'div':c.get('div',0),'udiv':c.get('udiv',0),'eq':c.get('eq',0),'round_ne':c.get('round_ne',0),'mad':c.get('mad',0),'movc':c.get('movc',0),'ret':c.get('ret',0),'gather4':sum(v for k,v in c.items() if k.startswith('gather4')),'sample_l':sum(v for k,v in c.items() if k.startswith('sample_l')),'uav':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_')),'sample_positions':samples,'first_three':executable[:3],'final_movc':[x for x in executable if x.startswith('movc o0')][-1]}
          b=rows['lab47a']; c=rows['lab49c']
          contract=all(v['gather4']==1 and v['sample_l']==4 and v['uav']==0 and v['div']==0 and v['udiv']==0 for v in rows.values())
          expected=(b['instructions']==48 and b['bytes']==2500 and b['temps']==8 and b['add']==8 and b['round_ni']==2 and b['sample_positions']==[15,16,20,21] and c['instructions']==48 and c['bytes']==2520 and c['temps']==8 and c['add']==9 and c['round_ni']==1 and c['sample_positions']==[15,16,20,21] and c['first_three'][0].startswith('add r0.xy, v0.xyxx, l(-0.500000') and c['first_three'][1].startswith('mul r0.zw, r0.xxxy') and c['first_three'][2].startswith('round_ni r0.xy, r0.zwzz') and 'r0.zzzz' in c['final_movc'])
          r={'protocol':'LAB49C_GTX_PACK_STATIC_DXBC_AUDIT','lab47a':b,'lab49c':c,'texture_contract_pass':contract,'texture_schedule_identical':b['sample_positions']==c['sample_positions'],'expected_codegen_pass':expected,'instruction_delta':c['instructions']-b['instructions'],'byte_delta':c['bytes']-b['bytes'],'pass':bool(contract and expected)}
          (pack/'STATIC_DXBC_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('DXBC audit failed')
          '@ | python -

      - name: Generate shared-ABI comparator
        run: python tools/lab49c_prepare_gtx_comparator.py

      - name: Audit comparator source
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          root=Path('lab_results/lab49c_gtx_pack'); p=root/'ptar_lab49c_compare.cpp'; s=p.read_text(encoding='utf-8')
          required=['LAB47A','LAB49C','lab47a.cso','lab49c.cso','LAB49C_COMPARE_RAW.csv','LAB49C_COMPARE_SUMMARY.json','LAB49C_GTX960M_SAME_RUN_BALANCED_COMPARE','if(variant==2)','c.inputSize[0]=1.0f/(float)kInW','c.outputSize[0]=0.5f/(float)kInW','c.inputSize[0]=(float)kInW','c.outputSize[0]=(float)kOutW','kWarmupTriads=60u','kSamples=600u','12ab14074c5de7a91b50aa8c114f4f235aea2f6d8903f8d0e6b2813e8907cc72','1e9692db2bf685fab74b3b1bf88afaf29b5ba21ac3cc86f4a2949b64da7f4f82','GTX 960M']
          stale=['LAB28','lab28','LAB29','lab29','LAB38A','lab38a','LAB31G','lab31g','LAB35A','lab35a','LAB36B','lab36b','LAB37B','lab37b']
          missing=[x for x in required if x not in s]; residual=[x for x in stale if x in s]
          perms=['{0,1,2}','{0,2,1}','{1,0,2}','{1,2,0}','{2,0,1}','{2,1,0}']
          r={'protocol':'LAB49C_COMPARATOR_SOURCE_AUDIT','missing':missing,'stale_tokens':residual,'shared_16_byte_abi':'if(variant==2)' in s and '1.0f/(float)kInW' in s and '0.5f/(float)kInW' in s,'k185_legacy_abi':'c.inputSize[0]=(float)kInW' in s and 'c.outputSize[0]=(float)kOutW' in s,'balanced_protocol':all(x in s for x in perms) and 'kWarmupTriads=60u' in s and 'kSamples=600u' in s,'strict_gtx960m':'d.VendorId==kNvidiaVendor' in s and 'GTX 960M' in s,'pass':not missing and not residual and all(x in s for x in perms)}
          (root/'PTAR_LAB49C_GTX960M_COMPARE_PACK'/'COMPARATOR_SOURCE_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('comparator source audit failed')
          '@ | python -

      - name: Freeze comparator source into pack
        shell: pwsh
        run: |
          $root='lab_results\lab49c_gtx_pack'; $pack="$root\PTAR_LAB49C_GTX960M_COMPARE_PACK"
          Copy-Item "$root\ptar_lab49c_compare.cpp" "$pack\COMPARATOR_SOURCE.cpp"
          Copy-Item "$root\LAB47_PATCH_AUDIT.json" "$pack\LAB47_PATCH_AUDIT.json"
          Copy-Item "$root\LAB49C_PATCH_AUDIT.json" "$pack\LAB49C_PATCH_AUDIT.json"

      - name: Build Win81 x64 MT comparison host
        shell: pwsh
        run: |
          $root='lab_results\lab49c_gtx_pack'; $pack="$root\PTAR_LAB49C_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){throw 'vcvars64.bat not found'}
          $inc='runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\include'; $src="$root\ptar_lab49c_compare.cpp"
          if(-not(Test-Path "$inc\PTARD3D11GpuTimerRing.h")){throw 'timer header missing'}
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /MT /W4 /WX /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I `"$inc`" `"$src`" /Fe:`"$pack\ptar_lab49c_gtx960m_compare.exe`" /Fo:`"$root\ptar_lab49c_compare.obj`" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib"
          cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Audit PE and WARP smoke
        shell: pwsh
        run: |
          $root='lab_results\lab49c_gtx_pack'; $pack=(Resolve-Path "$root\PTAR_LAB49C_GTX960M_COMPARE_PACK").Path
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          $cmd="call `"$vcvars`" && dumpbin /dependents `"$pack\ptar_lab49c_gtx960m_compare.exe`" > `"$pack\IMPORTS.txt`" && dumpbin /headers `"$pack\ptar_lab49c_gtx960m_compare.exe`" > `"$pack\PE_HEADERS.txt`""; cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $imports=Get-Content "$pack\IMPORTS.txt" -Raw; foreach($bad in @('D3DCOMPILER','VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($imports -match [regex]::Escape($bad)){throw "forbidden import $bad"}}
          foreach($need in @('d3d11.dll','dxgi.dll','bcrypt.dll','KERNEL32.dll')){if($imports -notmatch [regex]::Escape($need)){throw "required import missing $need"}}
          $headers=Get-Content "$pack\PE_HEADERS.txt" -Raw; if($headers -notmatch '6\.03\s+subsystem version'){throw 'subsystem is not 6.03'}; if($headers -notmatch '8664\s+machine \(x64\)'){throw 'machine is not x64'}
          @{
            protocol='LAB49C_PE_AUDIT'; machine_x64=$true; subsystem_version='6.03'; static_crt=$true; forbidden_runtime_imports=$false; required_imports=@('d3d11.dll','dxgi.dll','bcrypt.dll','KERNEL32.dll'); pass=$true
          } | ConvertTo-Json -Depth 4 | Set-Content "$pack\PE_AUDIT.json" -Encoding utf8
          Push-Location $pack
          try { & .\ptar_lab49c_gtx960m_compare.exe --warp-smoke | Tee-Object -FilePath WARP_SMOKE.txt; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} } finally { Pop-Location }
          $smoke=Get-Content "$pack\WARP_SMOKE.txt" -Raw; if($smoke -notmatch '\[PASS\] WARP smoke'){throw 'WARP PASS marker missing'}; if($smoke -notmatch 'LAB47A/LAB49C/K185'){throw 'WARP variant marker mismatch'}

      - name: Finalize protocol README launcher and manifests
        shell: pwsh
        run: |
          $root='lab_results\lab49c_gtx_pack'; $pack="$root\PTAR_LAB49C_GTX960M_COMPARE_PACK"
          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "ptar_lab49c_gtx960m_compare.exe" (echo [FAIL] Executable absent.& exit /b 10)
          echo [PTAR] LAB49C vs LAB47A vs K185 - GTX 960M - 600 triades equilibrees
          ptar_lab49c_gtx960m_compare.exe
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" echo [FAIL] Code retour %RC%
          if "%RC%"=="0" echo [PASS] Resultats dans le dossier results
          pause
          exit /b %RC%
          '@ | Set-Content "$pack\RUN_LAB49C_GTX960M_COMPARE.bat" -Encoding ascii
          @'
          PTAR LAB49C - GTX960M TARGETED HARDWARE COMPARE

          Reference: LAB47A, current replicated hardware-selected baseline.
          Candidate: LAB49C, algorithm-identical direct-DXBC substitution of only the first SV_Position ROUND_NI with ADD -0.5 while preserving the following MUL, the exact texture issue/interleave schedule, the LAB47 phase-mask peephole, ABI, and all sampling operations.
          Control: K185, used only for P-state/drift segmentation. K185 is never a baseline.

          Frozen shaders:
          LAB47A SHA256 12ab14074c5de7a91b50aa8c114f4f235aea2f6d8903f8d0e6b2813e8907cc72
          LAB49C SHA256 1e9692db2bf685fab74b3b1bf88afaf29b5ba21ac3cc86f4a2949b64da7f4f82
          K185   SHA256 6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16

          Software admission: PASS. LAB49C is bit-exact to LAB47A on canonical float, multires float, synthetic cases, and the 42-case UNORM8 corpus; WARP parity against the independent D3D11-filter CPU reference passes at the established tolerance.

          Hardware protocol: exact NVIDIA GTX 960M selection, 1280x720 -> 1920x1080, 60 warmup triads, 600 measured triads, six rotating permutations exactly balanced at 100 each. Output: results/LAB49C_COMPARE_RAW.csv, results/BLOCKS_60.csv, results/LAB49C_COMPARE_SUMMARY.json.

          Run only RUN_LAB49C_GTX960M_COMPARE.bat once. Return the results ZIP. Under the project cutoff, a statistically valid gain clearly below about 3 percent ends this optimization line without a replication run.
          '@ | Set-Content "$pack\README_FIRST.txt" -Encoding utf8
          @{
            protocol='LAB49C_GTX960M_SAME_RUN_BALANCED_COMPARE'; reference='LAB47A'; candidate='LAB49C'; control='K185'; adapter_required='NVIDIA GeForce GTX 960M'; input='1280x720'; output='1920x1080'; warmup_triads=60; measured_triads=600; permutations=@('K185>LAB47A>LAB49C','K185>LAB49C>LAB47A','LAB47A>K185>LAB49C','LAB47A>LAB49C>K185','LAB49C>K185>LAB47A','LAB49C>LAB47A>K185'); each_permutation_count=100; k185_role='P-state/drift control only'; software_admission='PASS'; user_minimum_material_gain_percent=3.0
          } | ConvertTo-Json -Depth 4 | Set-Content "$pack\PROTOCOL.json" -Encoding utf8
          @{
            protocol='LAB49C_BUILD_INFO'; target='Windows 8.1 x64 / D3D11 FL11_0'; compiler='MSVC /O2 /MT /W4 /WX'; defines=@('WINVER=0x0603','_WIN32_WINNT=0x0603'); linker_subsystem='CONSOLE,6.03'; shaders='precompiled DXBC only'; runtime_d3dcompiler=$false; pass=$true
          } | ConvertTo-Json -Depth 4 | Set-Content "$pack\BUILD_INFO.json" -Encoding utf8
          $exeHash=(Get-FileHash "$pack\ptar_lab49c_gtx960m_compare.exe" -Algorithm SHA256).Hash.ToLowerInvariant(); Add-Content "$pack\HASHES.txt" "$exeHash  ptar_lab49c_gtx960m_compare.exe" -Encoding ascii
          $files=Get-ChildItem $pack -Recurse -File | Where-Object { $_.Name -ne 'MANIFEST_SHA256.txt' } | Sort-Object FullName
          $base=(Resolve-Path $pack).Path
          $manifest=@()
          foreach($f in $files){$rel=$f.FullName.Substring($base.Length+1).Replace('\','/');$h=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant();$manifest += "$h  $rel"}
          $manifest | Set-Content "$pack\MANIFEST_SHA256.txt" -Encoding ascii

      - name: Final fail-closed pack audit and ZIP
        shell: pwsh
        run: |
          @'
          import hashlib,json,re,zipfile
          from pathlib import Path
          root=Path('lab_results/lab49c_gtx_pack'); pack=root/'PTAR_LAB49C_GTX960M_COMPARE_PACK'
          manifest=(pack/'MANIFEST_SHA256.txt').read_text(encoding='ascii').splitlines(); checked=0
          for line in manifest:
              h,rel=line.split('  ',1); p=pack/rel
              if not p.is_file(): raise SystemExit(f'manifest missing {rel}')
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=h: raise SystemExit(f'manifest mismatch {rel}')
              checked+=1
          protocol=json.loads((pack/'PROTOCOL.json').read_text(encoding='utf-8-sig'))
          static=json.loads((pack/'STATIC_DXBC_AUDIT.json').read_text(encoding='utf-8-sig'))
          source=json.loads((pack/'COMPARATOR_SOURCE_AUDIT.json').read_text(encoding='utf-8-sig'))
          pe=json.loads((pack/'PE_AUDIT.json').read_text(encoding='utf-8-sig'))
          smoke=(pack/'WARP_SMOKE.txt').read_text(encoding='utf-8',errors='replace')
          hashes=(pack/'HASHES.txt').read_text(encoding='ascii')
          expected={'shaders/lab47a.cso':'12ab14074c5de7a91b50aa8c114f4f235aea2f6d8903f8d0e6b2813e8907cc72','shaders/lab49c.cso':'1e9692db2bf685fab74b3b1bf88afaf29b5ba21ac3cc86f4a2949b64da7f4f82','shaders/ptar_k185_control_ps.cso':'6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'}
          for rel,h in expected.items():
              got=hashlib.sha256((pack/rel).read_bytes()).hexdigest()
              if got!=h or h not in hashes: raise SystemExit(f'frozen hash failure {rel}')
          if not (protocol.get('measured_triads')==600 and protocol.get('warmup_triads')==60 and len(protocol.get('permutations',[]))==6 and protocol.get('each_permutation_count')==100): raise SystemExit('protocol failure')
          if not static.get('pass') or not static.get('texture_schedule_identical'): raise SystemExit('static audit failure')
          if not source.get('pass') or not source.get('balanced_protocol') or not source.get('strict_gtx960m'): raise SystemExit('source audit failure')
          if not pe.get('pass'): raise SystemExit('PE audit failure')
          if '[PASS] WARP smoke' not in smoke or 'LAB47A/LAB49C/K185' not in smoke: raise SystemExit('WARP smoke failure')
          required=['RUN_LAB49C_GTX960M_COMPARE.bat','README_FIRST.txt','ptar_lab49c_gtx960m_compare.exe','COMPARATOR_SOURCE.cpp','STATIC_DXBC_AUDIT.json','COMPARATOR_SOURCE_AUDIT.json','PE_AUDIT.json','PROTOCOL.json','BUILD_INFO.json','HASHES.txt','MANIFEST_SHA256.txt','shaders/lab47a.cso','shaders/lab49c.cso','shaders/ptar_k185_control_ps.cso','shaders/lab_fullscreen_vs.cso','shaders/ptar_vs.cso']
          for rel in required:
              if not (pack/rel).is_file(): raise SystemExit(f'pack missing {rel}')
          audit={'protocol':'LAB49C_FINAL_PACK_AUDIT','manifest_files_checked':checked,'zip_crc_pending':True,'frozen_hashes_pass':True,'protocol_pass':True,'static_dxbc_pass':True,'source_pass':True,'pe_pass':True,'warp_smoke_pass':True,'required_files_pass':True,'pass':True}
          (pack/'FINAL_PACK_AUDIT.json').write_text(json.dumps(audit,indent=2)+'\n',encoding='utf-8')
          # regenerate manifest after adding final audit
          files=sorted([p for p in pack.rglob('*') if p.is_file() and p.name!='MANIFEST_SHA256.txt'])
          lines=[]
          for p in files:
              rel=p.relative_to(pack).as_posix(); lines.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}')
          (pack/'MANIFEST_SHA256.txt').write_text('\n'.join(lines)+'\n',encoding='ascii')
          zip_path=root/'PTAR_LAB49C_GTX960M_COMPARE_PACK.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(pack.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(pack).as_posix())
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'ZIP CRC failure {bad}')
              names=set(z.namelist())
              if not set(required).issubset(names): raise SystemExit('ZIP required file missing')
          print(json.dumps({'zip':str(zip_path),'sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),'size':zip_path.stat().st_size,'manifest_files':len(lines),'zip_crc_pass':True},indent=2))
          '@ | python -

      - uses: actions/upload-artifact@v4
        with:
          name: ptar-lab49c-gtx960m-compare-pack
          path: lab_results/lab49c_gtx_pack/PTAR_LAB49C_GTX960M_COMPARE_PACK.zip
          if-no-files-found: error
          compression-level: 0
