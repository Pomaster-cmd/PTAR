name: LAB D3D9 HF6 VISIBLE60 FASTBLIT2 20261011

on:
  push:
    branches: [lab/d3d9-hf6-visible60-fastblit2-20261011]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Apply existing D3D9 runtime ring and presentation-only fastblit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\lab\pairbal2_fieldhotfix3\apply_existing_diag_ring.ps1
          python .\lab\hf6_visible60_fastblit2\apply_hf6_visible60_fastblit2.py | Tee-Object apply.txt
          if($LASTEXITCODE){throw 'FASTBLIT2 patch failed'}
          $a=Get-Content apply.txt -Raw
          foreach($m in @(
            'HF6_VISIBLE60_FASTBLIT2=PASS',
            'BASE=FIELDHOTFIX6_WORKING_SAME_DEVICE_FG',
            'FG_ME_REFINE_INTERPOLATE=UNCHANGED',
            'PACER=EXACT_FIELDHOTFIX4_SYNC1_NO_SOFTWARE_WAIT',
            'PRESENT_COPY=STRETCHRECT_FASTPATH_WITH_EXACT_HF6_SHADER_FALLBACK',
            'SECOND_DEVICE=NONE','ASYNC_WORKER=NONE','ADDITIONAL_SWAPCHAIN=NONE')){
            if($a -notmatch [regex]::Escape($m)){throw "apply gate missing: $m"}
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x86}

      - name: Compile exact HF6 shaders and Win81 x86 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build_x86,artifact,smoke_game | Out-Null
          $fxc=Get-Command fxc.exe -ErrorAction SilentlyContinue
          if(-not $fxc){
            foreach($root in @("$env:ProgramFiles(x86)\Windows Kits\10\bin","$env:ProgramFiles(x86)\Windows Kits\8.1\bin")){
              if(Test-Path $root){
                $fxc=Get-ChildItem $root -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
                if($fxc){break}
              }
            }
          }
          if(-not $fxc){throw 'fxc.exe not found'}
          $f=if($fxc.Path){$fxc.Path}else{$fxc.FullName}
          $jobs=@(
            @('ps_3_0','ptar_moe_d3d9_ps.hlsl','ptar_ps_bytecode.h','g_ptarPs'),
            @('ps_3_0','ptar_moe_universal_d3d9_ps.hlsl','ptar_universal_ps_bytecode.h','g_ptarUniversalPs'),
            @('ps_2_0','ptar_bilinear_ref_ps.hlsl','ptar_bilinear_ps_bytecode.h','g_ptarBilinearPs'),
            @('ps_3_0','ptar_gw16i_hud_ps.hlsl','ptar_gw16i_hud_ps_bytecode.h','g_ptarGw16iHudPs'),
            @('ps_3_0','ptar_gw16i_feedback_ps.hlsl','ptar_gw16i_feedback_ps_bytecode.h','g_ptarGw16iFeedbackPs'),
            @('ps_3_0','ptar_fg_me_coarse_ps.hlsl','ptar_fg_me_coarse_ps_bytecode.h','g_ptarFgMeCoarsePs'),
            @('ps_3_0','ptar_fg_me_refine_ps.hlsl','ptar_fg_me_refine_ps_bytecode.h','g_ptarFgMeRefinePs'),
            @('ps_3_0','ptar_fg_interpolate_ps.hlsl','ptar_fg_interpolate_ps_bytecode.h','g_ptarFgInterpolatePs'))
          foreach($j in $jobs){
            & $f /nologo /T $j[0] /E main /O3 /Fh ("build_x86\"+$j[2]) /Vn $j[3] ("compat\x86_d3d9\"+$j[1])
            if($LASTEXITCODE){throw "FXC failed $($j[1])"}
          }
          'D3D9_SHADER_SET_HF6_UNCHANGED_BUILD=PASS' | Set-Content artifact\D3D9_SHADER_BUILD.txt -Encoding ascii
          & cl.exe /nologo /LD /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\ptar_d3d9_proxy.cpp /link user32.lib /DEF:compat\x86_d3d9\d3d9_proxy.def /OUT:artifact\d3d9.dll /SUBSYSTEM:WINDOWS,6.03
          if($LASTEXITCODE){throw 'runtime compile failed'}
          dumpbin /headers artifact\d3d9.dll | Out-File artifact\HEADERS.txt -Encoding ascii
          dumpbin /exports artifact\d3d9.dll | Out-File artifact\EXPORTS.txt -Encoding ascii
          dumpbin /dependents artifact\d3d9.dll | Out-File artifact\DEPENDENTS.txt -Encoding ascii
          $h=Get-Content artifact\HEADERS.txt -Raw;$e=Get-Content artifact\EXPORTS.txt -Raw;$d=Get-Content artifact\DEPENDENTS.txt -Raw
          if($h -notmatch '14C machine \(x86\)' -or $h -notmatch '6\.03 subsystem version'){throw 'Win8.1 x86 PE contract failed'}
          foreach($n in @('Direct3DCreate9','Direct3DCreate9Ex','PTAR_D3D9_DIAG_STATE')){if($e -notmatch [regex]::Escape($n)){throw "missing export $n"}}
          foreach($bad in @('VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($d -match $bad){throw "forbidden dependency $bad"}}
          $sha=(Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content artifact\D3D9_SHA256.txt -Encoding ascii
          Write-Host "D3D9_DLL_SHA256=$sha"

      - name: Prove only the final presentation copy changed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='9a47a93e1c3cb87975903eb21298408e26c2957a'
          cur=Path('compat/x86_d3d9/ptar_d3d9_proxy.cpp').read_text()
          old=subprocess.check_output(['git','show',base+':compat/x86_d3d9/ptar_d3d9_proxy.cpp'],text=True)
          def grab(s,a,z):
              i=s.index(a); j=s.index(z,i); return s[i:j]
          # Motion estimation / refine / interpolation must remain exact HF6.
          assert grab(cur,'static HRESULT RenderFGMotionAndIntermediate','static HRESULT PtRefreshQueuedRealBackBuffer') == grab(old,'static HRESULT RenderFGMotionAndIntermediate','static HRESULT RenderTextureToBackBuffer')
          # Spatial current-real production also remains exact HF6.
          assert grab(cur,'static HRESULT RenderSpatialToCurrent','static HRESULT RenderFGMotionAndIntermediate') == grab(old,'static HRESULT RenderSpatialToCurrent','static HRESULT RenderFGMotionAndIntermediate')
          print('HF6_SPATIAL_CURRENT_REAL_IDENTICAL=PASS')
          print('HF6_FG_ME_REFINE_INTERPOLATE_IDENTICAL=PASS')
          PY
          if($LASTEXITCODE){throw 'HF6 core identity failed'}
          git diff --exit-code 9a47a93e1c3cb87975903eb21298408e26c2957a -- compat/x86_d3d9/ptar_fg_me_coarse_ps.hlsl compat/x86_d3d9/ptar_fg_me_refine_ps.hlsl compat/x86_d3d9/ptar_fg_interpolate_ps.hlsl
          if($LASTEXITCODE){throw 'FG shader source changed'}
          python - <<'PY'
          from pathlib import Path
          import subprocess
          a=Path('compat/x86_d3d9/ptar_fg_pacer.h').read_bytes()
          b=subprocess.check_output(['git','show','b36e2be32678dcfb56b50cc4cc55d251d5c5f8b2:compat/x86_d3d9/ptar_fg_pacer.h'])
          assert a==b
          print('EXACT_HF4_SYNC1_PACER_REUSED=PASS')
          PY
          if($LASTEXITCODE){throw 'HF4 pacer identity failed'}
          $p=Get-Content compat\x86_d3d9\ptar_d3d9_proxy.cpp -Raw
          foreach($m in @(
            'actual->BackBufferCount=2',
            'actual->SwapEffect=D3DSWAPEFFECT_DISCARD',
            'actual->PresentationInterval=D3DPRESENT_INTERVAL_ONE',
            'PtFastBlitSurfaceToBackBuffer',
            'StretchRect(',
            'VISIBLE60_FASTBLIT_FALLBACK',
            'g_ptar.generatedTexture,g_ptar.generatedSurface',
            'g_ptar.currentRealTexture,g_ptar.currentRealSurface')){
            if($p -notmatch [regex]::Escape($m)){throw "FASTBLIT2 marker missing: $m"}
          }
          foreach($bad in @('CreateAdditionalSwapChain','PtD3D9IsolatedPresenterStart(','g_ptarD3D9IsoDisplayDevice','ptar_d3d9_isolated_presenter.h','D3DCREATE_MULTITHREADED')){
            if($p -match [regex]::Escape($bad)){throw "post-HF6 architecture leaked: $bad"}
          }
          @(
            'BASE_FIELD_RUNTIME_HF6=46858bf10cc2d0de9bf75e229073e2e63ee807deafd8044f3d8c3fc13aa3ee28',
            'BASE_QF1_RUNTIME=8b849a0a70cd0b48ed8a2a4a3db33dba9a39a39367255db0b14404a4570ac849',
            'BASE_QF1_FIELD=REAL28.044_GENERATED28.060_PRESENT_RING56.128',
            'BASE_QF1_DEFECT=SOURCE_MEAN_PAIR35.643MS_PLUS_STARVATION',
            'FG_ALGORITHM=EXACT_HF6',
            'PRESENTATION_QUEUE=QF1_BACKBUFFERCOUNT2_DISCARD_SYNC1',
            'PRESENTATION_COPY=STRETCHRECT_FASTPATH',
            'PRESENTATION_COPY_FALLBACK=EXACT_HF6_BILINEAR_SHADER',
            'SECOND_DEVICE=NONE',
            'D3D9EX_PRESENTER=NONE',
            'ASYNC_WORKER=NONE',
            'ADDITIONAL_SWAPCHAIN=NONE'
          ) | Set-Content artifact\HF6_VISIBLE60_FASTBLIT2_CONTRACT.txt -Encoding ascii

      - name: Compile and selftest existing F5 F1 verifiers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe";$shared='lab\ctrl_ui_real_visibility\PTARD3D9PresentTelemetryReader.cs'
          & $csc /nologo /target:exe /optimize+ /platform:x86 /out:artifact\ptar_vblank3_d3d9_autostart.exe $shared lab\ctrl_ui_real_visibility\PTARVisiblePacingVerifier_D3D9RuntimeRing.cs;if($LASTEXITCODE){throw 'F5 compile failed'}
          & $csc /nologo /target:exe /optimize+ /platform:x86 /out:artifact\ptar_presentshed1_visible.exe $shared lab\ctrl_ui_real_visibility\PTARVisiblePacingVerifierPresentShed1_D3D9RuntimeRing.cs;if($LASTEXITCODE){throw 'F1 compile failed'}
          & artifact\ptar_vblank3_d3d9_autostart.exe --selftest | Tee-Object artifact\F5_VERIFIER_SELFTEST.txt;if($LASTEXITCODE){throw 'F5 selftest failed'}
          & artifact\ptar_presentshed1_visible.exe --selftest | Tee-Object artifact\F1_VERIFIER_SELFTEST.txt;if($LASTEXITCODE){throw 'F1 selftest failed'}

      - name: Validate existing diagnostic ring ABI end to end
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 lab\ctrl_ui_real_visibility\d3d9_diag_ring_harness.cpp /link /OUT:smoke_game\game.exe /SUBSYSTEM:CONSOLE,6.03;if($LASTEXITCODE){throw 'harness compile failed'}
          Copy-Item artifact\d3d9.dll smoke_game\d3d9.dll -Force
          $root=(Resolve-Path smoke_game).Path;$game=(Resolve-Path smoke_game\game.exe).Path;$dll=(Resolve-Path smoke_game\d3d9.dll).Path;$env:PTAR_GAME_ROOT=$root;$env:PTAR_TARGET_EXE=$game
          $proc=Start-Process $game -ArgumentList ('"'+$dll+'" mixed 20000') -PassThru -RedirectStandardOutput artifact\HARNESS.txt;Start-Sleep -Milliseconds 300
          & artifact\ptar_vblank3_d3d9_autostart.exe 5 --autostart 2>&1 | Tee-Object artifact\F5_RUNTIME_RING_SMOKE.txt;if($LASTEXITCODE){throw 'F5 ring failed'}
          $env:PTAR_FG_PRESENTSHED1_OUTPUT_PREFIX=Join-Path $root 'F1_SMOKE'; & artifact\ptar_presentshed1_visible.exe 5 --autostart 2>&1 | Tee-Object artifact\F1_RUNTIME_RING_SMOKE.txt;if($LASTEXITCODE){throw 'F1 ring failed'}
          if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force}
          'CTRL_F5_RUNTIME_RING_ABI=PASS' | Set-Content artifact\CTRL_F5_RUNTIME_RING.txt -Encoding ascii
          'CTRL_F1_RUNTIME_RING_ABI=PASS' | Set-Content artifact\CTRL_F1_RUNTIME_RING.txt -Encoding ascii

      - name: Package evidence
        shell: pwsh
        run: |
          Copy-Item compat\x86_d3d9\ptar_fg_pacer.h artifact\ptar_fg_pacer.h -Force
          Copy-Item compat\x86_d3d9\ptar_d3d9_proxy.cpp artifact\ptar_d3d9_proxy_patched.cpp -Force
          Copy-Item apply.txt artifact\APPLY_GATES.txt -Force
          @(
            'PTAR_D3D9_BRANCH=HF6_VISIBLE60_FASTBLIT2',
            ('SOURCE_COMMIT='+$env:GITHUB_SHA),
            ('D3D9_SHA256='+(Get-Content artifact\D3D9_SHA256.txt -Raw).Trim()),
            'BASE_COMMIT=9a47a93e1c3cb87975903eb21298408e26c2957a',
            'BASE_FIELD_RUNTIME_HF6=46858bf10cc2d0de9bf75e229073e2e63ee807deafd8044f3d8c3fc13aa3ee28',
            'BASE_QF1_RUNTIME=8b849a0a70cd0b48ed8a2a4a3db33dba9a39a39367255db0b14404a4570ac849',
            'BASE_QF1_FIELD_REAL=28.044',
            'BASE_QF1_FIELD_GENERATED=28.060',
            'BASE_QF1_FIELD_PRESENT_RING_FPS=56.128',
            'BASE_QF1_FIELD_REAL_DWELL_MEDIAN_MS=30.853',
            'BASE_QF1_FIELD_GENERATED_DWELL_MEDIAN_MS=1.419',
            'FG_ALGORITHM=EXACT_HF6',
            'PRESENTATION_COPY=STRETCHRECT_FASTPATH_WITH_HF6_SHADER_FALLBACK',
            'PRESENTATION_QUEUE=BACKBUFFERCOUNT2_DISCARD_SYNC1',
            'SECOND_DEVICE=NONE',
            'D3D9EX_PRESENTER=NONE',
            'ASYNC_WORKER=NONE',
            'CTRL_F5_F1=PRESERVED',
            'HARDWARE_EFFECTIVE_VISIBLE60=PENDING_TARGET_RETEST'
          ) | Set-Content artifact\PTAR_D3D9_HF6_VISIBLE60_FASTBLIT2_VERSION.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTAR-D3D9-HF6-VISIBLE60-FASTBLIT2
          path: artifact/
          if-no-files-found: error
