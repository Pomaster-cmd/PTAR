name: LAB35A Full Software Gate

on:
  push:
    branches:
      - lab/moe-ng-v02-lab35-phase0-single-sample

permissions:
  contents: read

jobs:
  full-gate:
    if: contains(github.event.head_commit.message, '[run-lab35a-full]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Compile frozen LAB31G and LAB35A
        shell: pwsh
        run: |
          $out='lab_results\lab35a_full'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 FXC not found' }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab31g.cso" /Fc "$out\lab31g.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab31g_host_inv_half_mad_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab35a.cso" /Fc "$out\lab35a.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab35a_phase0_single_sample_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $h31=(Get-FileHash "$out\lab31g.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h35=(Get-FileHash "$out\lab35a.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h31 -ne 'ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1'){ throw "LAB31G hash mismatch $h31" }
          if($h35 -ne '4789a5a345770af8c2881293a4e6c5501043b28d0c4d8aed8f7ab33ed218ae2c'){ throw "LAB35A hash mismatch $h35" }
          @("LAB31G=$h31","LAB35A=$h35") | Set-Content "$out\HASHES.txt" -Encoding ascii

      - name: Generate and build shared ABI WARP harnesses
        shell: pwsh
        run: |
          python tools/moe_ng_v02_prepare_shared_abi_harnesses.py --outdir lab_results/lab35a_full
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          foreach($n in @('float_shared','unorm8_shared')){
            $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 lab_results\lab35a_full\warp_$n.cpp /Fe:lab_results\lab35a_full\warp_$n.exe d3d11.lib dxgi.lib"
            cmd.exe /d /s /c $cmd
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }

      - name: Full software admission
        shell: pwsh
        run: |
          python tools/moe_ng_v02_shared_abi_full_gate.py `
            --outdir lab_results/lab35a_full `
            --baseline lab31g `
            --candidate lab35a `
            --baseline-sha ead1e18944b392ef23562d9a45a9429d5bdee77ae914e313b415c3143c39aed1 `
            --candidate-sha 4789a5a345770af8c2881293a4e6c5501043b28d0c4d8aed8f7ab33ed218ae2c `
            --baseline-instructions 53 `
            --candidate-instructions 53 `
            --baseline-bytes 2568 `
            --candidate-bytes 2568

      - name: Re-audit phase0 sample ordering
        shell: pwsh
        run: |
          @'
          import json,re
          from pathlib import Path
          p=Path('lab_results/lab35a_full'); pat=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b'); ops=[]
          for raw in (p/'lab35a.asm').read_text(encoding='utf-8',errors='replace').splitlines():
              s=raw.lstrip()
              if not s or s.startswith('//') or s.startswith('ps_5_0'): continue
              m=pat.match(raw)
              if not m: continue
              op=m.group(1).lower()
              if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
              ops.append(op)
          branch=next(i for i,x in enumerate(ops) if x in ('if_nz','if_z')); samples=[i for i,x in enumerate(ops) if x.startswith('sample_l')]
          r={'protocol':'LAB35A_PHASE0_DYNAMIC_PATH_REAUDIT','branch_index':branch,'sample_indices':samples,'samples_before_branch':sum(i<branch for i in samples),'samples_after_branch':sum(i>branch for i in samples)}
          r['pass']=r['samples_before_branch']==1 and r['samples_after_branch']==3
          (p/'DYNAMIC_PATH_REAUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('phase0 dynamic path lost')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab35a-full-software-gate
          path: lab_results/lab35a_full
