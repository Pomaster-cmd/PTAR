name: LAB PTAR-NG MoE v02 Texture Admission

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  texture-admission:
    if: contains(github.event.head_commit.message, '[run-texture-admission]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact search dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scikit-image==0.26.0
      - name: Run LAB18 texture-admission A+B selection and consumed diagnostics
        run: >-
          python tools/lab_moe_ng_v02_texture_admission.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_texture_admission
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab18-texture-admission
          path: lab_results/moe_ng_v02_texture_admission
