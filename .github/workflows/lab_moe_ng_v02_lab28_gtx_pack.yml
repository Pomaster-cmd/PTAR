name: LAB28 GTX960M Compare Pack

on:
  push:
    branches:
      - lab/moe-ng-v02-lab28-gtxpack

permissions:
  contents: read

jobs:
  build-audit-pack:
    if: contains(github.event.head_commit.message, '[run-lab28-gtx-pack]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile frozen LAB27 LAB28 DXBC
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'
          $pack="$root\PTAR_LAB28_GTX960M_COMPARE_PACK"
          $sh="$pack\shaders"
          New-Item -ItemType Directory -Force $sh | Out-Null
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          Write-Host "FXC=$($fxc.FullName) version=$($fxc.VersionInfo.FileVersion)"

          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab27.cso" /Fc "$root\lab27.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab27_scalar_phase_mod_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab28.cso" /Fc "$root\lab28.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab28_uv_axis_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab_fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc.FullName /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$root\lab_fullscreen_vs_repeat.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_k185_control_ps.cso "$sh\ptar_k185_control_ps.cso"
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_vs.cso "$sh\ptar_vs.cso"

          $expected=@{
            'lab27.cso'='48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44'
            'lab28.cso'='fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77'
            'lab_fullscreen_vs.cso'='f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
            'ptar_k185_control_ps.cso'='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'
            'ptar_vs.cso'='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
          }
          $hashLines=@()
          foreach($n in $expected.Keys){
            $p=Join-Path $sh $n
            if(-not (Test-Path $p)){ throw "missing $n" }
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($got -ne $expected[$n]){ throw "$n hash mismatch expected=$($expected[$n]) got=$got" }
            $bytes=[IO.File]::ReadAllBytes($p)
            if($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes,0,4) -ne 'DXBC'){ throw "$n is not DXBC" }
            $hashLines += "$got  shaders/$n"
            Write-Host "$n SHA256=$got"
          }
          $repeat=(Get-FileHash "$root\lab_fullscreen_vs_repeat.cso" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($repeat -ne $expected['lab_fullscreen_vs.cso']){ throw "fullscreen VS repeat hash mismatch $repeat" }
          $hashLines | Sort-Object | Set-Content "$pack\HASHES.txt" -Encoding ascii
          @(
            "fxc_path=$($fxc.FullName)",
            "fxc_file_version=$($fxc.VersionInfo.FileVersion)",
            'compile_flags=/nologo /O3 /Ges /WX',
            'ps_profile=ps_5_0',
            'vs_profile=vs_5_0',
            "fullscreen_vs_repeat_sha256=$repeat"
          ) | Set-Content "$pack\TOOLCHAIN.txt" -Encoding ascii

      - name: Static DXBC contract audit
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab28_gtx_pack')
          out={}
          op_re=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b')
          for name in ('lab27','lab28'):
              lines=(root/f'{name}.asm').read_text(encoding='utf-8',errors='replace').splitlines()
              ops=[]; udiv=[]
              for raw in lines:
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'): continue
                  m=op_re.match(raw)
                  if not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op)
                  if op=='udiv': udiv.append(raw.strip())
              c=Counter(ops)
              cso=root/'PTAR_LAB28_GTX960M_COMPARE_PACK'/'shaders'/f'{name}.cso'
              out[name]={
                  'instruction_total':len(ops),
                  'cso_bytes':cso.stat().st_size,
                  'gather4_ops':sum(v for k,v in c.items() if k.startswith('gather4')),
                  'sample_l_ops':sum(v for k,v in c.items() if k.startswith('sample_l')),
                  'uav_ops':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_')),
                  'udiv_lines':udiv,
                  'op_counts':dict(sorted(c.items()))
              }
          a,b=out['lab27'],out['lab28']
          texture_ok=all(x['gather4_ops']==1 and x['sample_l_ops']==4 and x['uav_ops']==0 for x in (a,b))
          cost_ok=(a['instruction_total'],b['instruction_total'],a['cso_bytes'],b['cso_bytes'])==(62,59,2908,2788)
          scalar_ok=all(not any('.xy,' in line.lower() for line in x['udiv_lines']) for x in (a,b))
          report={'protocol':'LAB28_GTX_PACK_STATIC_DXBC_AUDIT','lab27':a,'lab28':b,
                  'texture_contract_pass':texture_ok,'expected_cost_pass':cost_ok,'scalar_phase_modulo_pass':scalar_ok,
                  'instruction_delta':b['instruction_total']-a['instruction_total'],
                  'byte_delta':b['cso_bytes']-a['cso_bytes']}
          report['pass']=bool(texture_ok and cost_ok and scalar_ok)
          (root/'STATIC_DXBC_AUDIT.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          if not report['pass']: raise SystemExit('static DXBC audit failed')
          '@ | python -

      - name: Prepare warning-clean LAB27 vs LAB28 bench host
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'
          $src=Get-Content 'hardware_validation\ptar_moe_ng_v02_lab27_compare.cpp' -Raw

          $oldAdapter='    std::string ad(adapter.begin(),adapter.end());'
          $newAdapter=@'
              std::string ad;
              ad.reserve(adapter.size());
              for(size_t ai=0; ai<adapter.size(); ++ai){
                  const wchar_t wc=adapter[ai];
                  ad.push_back(wc<=0x7f ? static_cast<char>(wc) : '?');
              }
          '@
          if(-not $src.Contains($oldAdapter)){ throw 'adapter conversion marker not found' }
          $src=$src.Replace($oldAdapter,$newAdapter.TrimEnd("`r","`n"))

          $src=$src.Replace('kLab25Sha','kLab27BaseSha')
          $src=$src.Replace('kLab27Sha','kLab28Sha')
          $src=$src.Replace('ee882f82dd017c470a5003cd522f2cb5ec31ce4b31ae341ec75f3bb737642e72','__BASE_HASH__')
          $src=$src.Replace('48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44','fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77')
          $src=$src.Replace('__BASE_HASH__','48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44')
          $src=$src.Replace('f2512c09f70c30aa6f4b06e6885f34acac23ee5e5e3b94486b0846159578fcf8','f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b')

          $src=$src.Replace('lab25','__BASELOW__')
          $src=$src.Replace('LAB25','__BASEUP__')
          $src=$src.Replace('lab27','lab28')
          $src=$src.Replace('LAB27','LAB28')
          $src=$src.Replace('__BASELOW__','lab27')
          $src=$src.Replace('__BASEUP__','LAB27')

          if($src.Contains('std::string ad(adapter.begin(),adapter.end());')){ throw 'warning-prone adapter conversion remains' }
          if($src.Contains('lab25') -or $src.Contains('LAB25')){ throw 'LAB25 naming remains in transformed host' }
          foreach($marker in @(
            'double lab27,lab28,k185;',
            'L"lab27.cso"',
            'L"lab28.cso"',
            'LAB28_GTX960M_SAME_RUN_BALANCED_COMPARE',
            'static const UINT kWarmupTriads=60u;',
            'static const UINT kSamples=600u;',
            'static const int perms[6][3]={{0,1,2},{0,2,1},{1,0,2},{1,2,0},{2,0,1},{2,1,0}};'
          )){ if(-not $src.Contains($marker)){ throw "protocol marker missing after transform: $marker" } }
          if($src -notmatch 'return v==0\?"LAB27":\(v==1\?"LAB28":"K185"\)'){ throw 'variant labels are not LAB27/LAB28/K185' }

          $tmp="$root\ptar_moe_ng_v02_lab28_compare.cpp"
          $src | Set-Content $tmp -Encoding utf8
          @'
          Bench-local source transformation only.
          Baseline variant 0 = frozen LAB27; candidate variant 1 = frozen LAB28; control variant 2 = frozen K185.
          The canonical LAB27 and LAB28 HLSL sources are not edited by this packaging workflow.
          Adapter reporting is converted explicitly to ASCII so /W4 /WX remains clean on the current MSVC toolchain.
          '@ | Set-Content "$root\BENCH_SOURCE_TRANSFORM.txt" -Encoding ascii

      - name: Build Win81 x64 MT comparison host
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'
          $pack="$root\PTAR_LAB28_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          $inc='runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\include'
          $src="$root\ptar_moe_ng_v02_lab28_compare.cpp"
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /MT /W4 /WX /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I `"$inc`" `"$src`" /Fe:`"$pack\ptar_lab28_gtx960m_compare.exe`" /Fo:`"$root\ptar_lab28_gtx960m_compare.obj`" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib"
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(-not (Test-Path "$pack\ptar_lab28_gtx960m_compare.exe")){ throw 'EXE not produced' }

      - name: Audit PE imports subsystem and WARP smoke
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'
          $pack="$root\PTAR_LAB28_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          $cmd="call `"$vcvars`" && dumpbin /dependents `"$pack\ptar_lab28_gtx960m_compare.exe`" > `"$pack\IMPORTS.txt`" && dumpbin /headers `"$pack\ptar_lab28_gtx960m_compare.exe`" > `"$pack\PE_HEADERS.txt`""
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $deps=Get-Content "$pack\IMPORTS.txt" -Raw
          foreach($bad in @('D3DCOMPILER','VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){
            if($deps -match [regex]::Escape($bad)){ throw "forbidden runtime dependency: $bad" }
          }
          $hdr=Get-Content "$pack\PE_HEADERS.txt" -Raw
          if($hdr -notmatch '8664 machine \(x64\)'){ throw 'PE is not x64' }
          if($hdr -notmatch '6\.03\s+subsystem version'){ throw 'PE subsystem version is not 6.03' }

          Push-Location $pack
          try {
            & .\ptar_lab28_gtx960m_compare.exe --warp-smoke | Tee-Object -FilePath WARP_SMOKE.txt
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          } finally { Pop-Location }
          $smoke=Get-Content "$pack\WARP_SMOKE.txt" -Raw
          if($smoke -notmatch '\[PASS\] WARP smoke'){ throw 'WARP smoke PASS marker missing' }
          foreach($h in @(
            '48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44',
            'fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77',
            '6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16',
            '6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c',
            'f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          )){ if($smoke -notmatch [regex]::Escape($h)){ throw "WARP hash verification missing $h" } }
          Write-Host '[PASS] PE audit and WARP smoke'

      - name: Finalize provenance launcher and manifest
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'
          $pack="$root\PTAR_LAB28_GTX960M_COMPARE_PACK"
          Copy-Item "$root\STATIC_DXBC_AUDIT.json" "$pack\STATIC_DXBC_AUDIT.json"
          Copy-Item "$root\BENCH_SOURCE_TRANSFORM.txt" "$pack\BENCH_SOURCE_TRANSFORM.txt"
          $exeHash=(Get-FileHash "$pack\ptar_lab28_gtx960m_compare.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content "$pack\HASHES.txt" "$exeHash  ptar_lab28_gtx960m_compare.exe" -Encoding ascii

          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "ptar_lab28_gtx960m_compare.exe" (
            echo [FAIL] Executable absent.
            exit /b 10
          )
          echo [PTAR] LAB28 vs LAB27 vs K185 - GTX 960M - 600 triades equilibrees
          ptar_lab28_gtx960m_compare.exe
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" echo [FAIL] Code retour %RC%
          if "%RC%"=="0" echo [PASS] Resultats dans le dossier results
          pause
          exit /b %RC%
          '@ | Set-Content "$pack\RUN_LAB28_GTX960M_COMPARE.bat" -Encoding ascii

          @'
          PTAR LAB28 - GTX960M TARGETED HARDWARE COMPARE

          Objectif: mesurer LAB28 face a la baseline LAB27 dans UNE MEME execution, avec K185 comme controle de P-state.
          LAB28 a deja passe les gates logiciels: 59 instructions contre 62 pour LAB27, 2788 octets contre 2908, contrat texture identique, WARP multi-resolution 6/6 bit-exact, corpus UNORM8 42/42 exact et stress synthetique exact.

          Lancer uniquement RUN_LAB28_GTX960M_COMPARE.bat sur la machine Windows 8.1 + GTX 960M.
          Ne pas relancer LAB25/LAB26/LAB27 ni les anciens tests de parite.

          Le test effectue 60 triades de chauffe puis 600 triades mesurees avec les six permutations LAB27/LAB28/K185 equilibrees.
          A retourner: le dossier results cree par le test, de preference compresse en ZIP.

          Promotion LAB28 uniquement si un gain materiel reproductible face a LAB27 ressort des deltas apparies avec un controle K185 coherent.
          '@ | Set-Content "$pack\README_FIRST.txt" -Encoding utf8

          @(
            'protocol=LAB28_GTX960M_SAME_RUN_BALANCED_COMPARE',
            "pack_branch=$env:GITHUB_REF_NAME",
            "pack_commit=$env:GITHUB_SHA",
            'algorithm_base_commit=7450cead101883f665889d280e9915ffb55ed064',
            'target=Windows 8.1 x64 / D3D11 FL11_0',
            'host_crt=/MT',
            'runtime_hlsl_compiler=false',
            'dimensions=1280x720 -> 1920x1080',
            'warmup_triads=60',
            'measured_triads=600',
            'order_protocol=SIX_ROTATING_PERMUTATIONS_BALANCED',
            'lab27_sha256=48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44',
            'lab28_sha256=fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77',
            'k185_sha256=6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16',
            'texture_contract=1 GatherGreen + 4 SampleLevel + 0 UAV',
            'lab27_instructions=62',
            'lab28_instructions=59',
            'lab27_cso_bytes=2908',
            'lab28_cso_bytes=2788',
            'software_multires_gate=PASS_6_OF_6_BIT_EXACT',
            'software_42_case_unorm8_gate=PASS_42_OF_42_BYTE_EXACT',
            'software_full_gate=PASS',
            'warp_smoke=PASS',
            'physical_gtx960m_executed=false',
            'main_modified=false',
            'source_modified=false'
          ) | Set-Content "$pack\PROVENANCE.txt" -Encoding ascii

          $manifest=Get-ChildItem $pack -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel=$_.FullName.Substring((Resolve-Path $pack).Path.Length+1).Replace('\','/')
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $rel"
          }
          $manifest | Set-Content "$pack\MANIFEST_SHA256.txt" -Encoding ascii

      - name: Final pack integrity audit
        shell: pwsh
        run: |
          $pack='lab_results\lab28_gtx_pack\PTAR_LAB28_GTX960M_COMPARE_PACK'
          foreach($f in @('README_FIRST.txt','RUN_LAB28_GTX960M_COMPARE.bat','ptar_lab28_gtx960m_compare.exe','HASHES.txt','PROVENANCE.txt','MANIFEST_SHA256.txt','STATIC_DXBC_AUDIT.json','WARP_SMOKE.txt','IMPORTS.txt','PE_HEADERS.txt','TOOLCHAIN.txt','shaders\lab27.cso','shaders\lab28.cso','shaders\ptar_k185_control_ps.cso','shaders\ptar_vs.cso','shaders\lab_fullscreen_vs.cso')){
            if(-not (Test-Path "$pack\$f")){ throw "pack file missing: $f" }
          }
          $prov=Get-Content "$pack\PROVENANCE.txt" -Raw
          foreach($m in @('software_full_gate=PASS','physical_gtx960m_executed=false','main_modified=false','source_modified=false')){
            if($prov -notmatch [regex]::Escape($m)){ throw "provenance marker missing: $m" }
          }
          Write-Host '[PASS] final LAB28 GTX pack integrity audit'

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR_LAB28_GTX960M_COMPARE_PACK
          path: lab_results/lab28_gtx_pack/PTAR_LAB28_GTX960M_COMPARE_PACK
