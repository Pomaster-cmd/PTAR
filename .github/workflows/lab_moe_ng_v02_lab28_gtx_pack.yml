name: LAB28 GTX960M Compare Pack

on:
  push:
    branches:
      - lab/moe-ng-v02-lab28-axis-address

permissions:
  contents: read

jobs:
  build-audit-pack:
    if: contains(github.event.head_commit.message, '[run-lab28-gtx-pack]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile and freeze LAB27 LAB28 DXBC
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'
          $pack="$root\PTAR_LAB28_GTX960M_COMPARE_PACK"
          $sh="$pack\shaders"
          New-Item -ItemType Directory -Force $sh | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab27.cso" /Fc "$root\lab27.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab27_scalar_phase_mod_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab28.cso" /Fc "$root\lab28.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab28_uv_axis_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab_fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_k185_control_ps.cso "$sh\ptar_k185_control_ps.cso"
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_vs.cso "$sh\ptar_vs.cso"

          $expected=@{
            'lab27.cso'='48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44'
            'lab28.cso'='fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77'
            'ptar_k185_control_ps.cso'='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'
            'ptar_vs.cso'='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
            'lab_fullscreen_vs.cso'='f2512c09f70c30aa6f4b06e6885f34acac23ee5e5e3b94486b0846159578fcf8'
          }
          $hashLines=@()
          foreach($n in $expected.Keys){
            $p="$sh\$n"; if(-not (Test-Path $p)){ throw "missing $n" }
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($got -ne $expected[$n]){ throw "$n frozen SHA256 mismatch expected=$($expected[$n]) got=$got" }
            $bytes=(Get-Item $p).Length
            if($bytes -lt 4){ throw "$n too small" }
            $magic=[System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($p),0,4)
            if($magic -ne 'DXBC'){ throw "$n is not DXBC" }
            $hashLines += "$got  shaders/$n"
          }
          $hashLines | Set-Content "$pack\HASHES.txt" -Encoding ascii

      - name: Static DXBC contract and cost audit
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab28_gtx_pack'); out={}
          op_re=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b')
          for name in ('lab27','lab28'):
              ops=[]
              for raw in (root/f'{name}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'): continue
                  m=op_re.match(raw)
                  if not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op)
              c=Counter(ops)
              cs=root/'PTAR_LAB28_GTX960M_COMPARE_PACK'/'shaders'/f'{name}.cso'
              out[name]={'instruction_total':len(ops),'cso_bytes':cs.stat().st_size,'gather4_ops':sum(v for k,v in c.items() if k.startswith('gather4')),'sample_l_ops':sum(v for k,v in c.items() if k.startswith('sample_l')),'uav_ops':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_'))}
          contract=all(x['gather4_ops']==1 and x['sample_l_ops']==4 and x['uav_ops']==0 for x in out.values())
          expected=(out['lab27']['instruction_total']==62 and out['lab27']['cso_bytes']==2908 and out['lab28']['instruction_total']==59 and out['lab28']['cso_bytes']==2788)
          report={'protocol':'LAB28_GTX_PACK_STATIC_DXBC_AUDIT','lab27':out['lab27'],'lab28':out['lab28'],'texture_contract_pass':contract,'expected_cost_pass':expected,'delta_instructions':out['lab28']['instruction_total']-out['lab27']['instruction_total'],'delta_cso_bytes':out['lab28']['cso_bytes']-out['lab27']['cso_bytes']}
          report['pass']=bool(contract and expected)
          (root/'STATIC_DXBC_AUDIT.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          if not report['pass']: raise SystemExit('static DXBC audit failed')
          '@ | python -

      - name: Build Win81 x64 MT comparison host
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'; $pack="$root\PTAR_LAB28_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          $inc='runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\include'
          $src='hardware_validation\ptar_moe_ng_v02_lab28_compare.cpp'
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /MT /W4 /WX /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I `"$inc`" `"$src`" /Fe:`"$pack\ptar_lab28_gtx960m_compare.exe`" /Fo:`"$root\ptar_lab28_gtx960m_compare.obj`" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib"
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(-not (Test-Path "$pack\ptar_lab28_gtx960m_compare.exe")){ throw 'EXE not produced' }

      - name: Audit PE imports and subsystem
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'; $pack="$root\PTAR_LAB28_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          $cmd="call `"$vcvars`" && dumpbin /dependents `"$pack\ptar_lab28_gtx960m_compare.exe`" > `"$pack\IMPORTS.txt`" && dumpbin /headers `"$pack\ptar_lab28_gtx960m_compare.exe`" > `"$root\HEADERS.txt`""
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $imports=Get-Content "$pack\IMPORTS.txt" -Raw
          foreach($bad in @('D3DCOMPILER','VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){ if($imports -match [regex]::Escape($bad)){ throw "forbidden runtime import detected: $bad" } }
          $headers=Get-Content "$root\HEADERS.txt" -Raw
          if($headers -notmatch '6\.03\s+subsystem version'){ throw 'PE subsystem version is not 6.03' }

      - name: WARP smoke all frozen shaders
        shell: pwsh
        run: |
          $pack=(Resolve-Path 'lab_results\lab28_gtx_pack\PTAR_LAB28_GTX960M_COMPARE_PACK').Path
          Push-Location $pack
          try { & .\ptar_lab28_gtx960m_compare.exe --warp-smoke | Tee-Object -FilePath WARP_SMOKE.txt; if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE } } finally { Pop-Location }
          if((Get-Content "$pack\WARP_SMOKE.txt" -Raw) -notmatch '\[PASS\] WARP smoke'){ throw 'WARP smoke PASS marker missing' }

      - name: Finalize audited hardware pack
        shell: pwsh
        run: |
          $root='lab_results\lab28_gtx_pack'; $pack="$root\PTAR_LAB28_GTX960M_COMPARE_PACK"
          $exeHash=(Get-FileHash "$pack\ptar_lab28_gtx960m_compare.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content "$pack\HASHES.txt" "$exeHash  ptar_lab28_gtx960m_compare.exe" -Encoding ascii
          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "ptar_lab28_gtx960m_compare.exe" (echo [FAIL] Executable absent.& exit /b 10)
          echo [PTAR] LAB28 vs LAB27 vs K185 - GTX 960M - 600 triades equilibrees
          ptar_lab28_gtx960m_compare.exe
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" echo [FAIL] Code retour %RC%
          if "%RC%"=="0" echo [PASS] Resultats dans le dossier results
          pause
          exit /b %RC%
          '@ | Set-Content "$pack\RUN_LAB28_GTX960M_COMPARE.bat" -Encoding ascii
          @'
          PTAR LAB28 - GTX960M TARGETED HARDWARE COMPARE

          Objectif: mesurer LAB28 face a LAB27 dans UNE MEME execution, avec K185 comme controle de P-state.
          Le test effectue 60 triades de chauffe puis 600 triades mesurees selon les six permutations LAB27/LAB28/K185, 100 fois chacune.

          Lancer uniquement RUN_LAB28_GTX960M_COMPARE.bat sur Windows 8.1 + GTX 960M.
          Ne pas relancer les anciennes suites LAB25/LAB26/LAB27: elles sont deja validees.

          A retourner: le dossier results cree par le test, de preference compresse en ZIP.

          Regle: LAB28 n'est promu que si son gain materiel apparie face a LAB27 est reproductible. Un resultat neutre ou negatif conserve LAB27.
          '@ | Set-Content "$pack\README_FIRST.txt" -Encoding utf8
          @(
            'protocol=LAB28_GTX960M_SAME_RUN_BALANCED_COMPARE',
            "branch=$env:GITHUB_REF_NAME",
            "commit=$env:GITHUB_SHA",
            'target=Windows 8.1 x64 / D3D11 FL11_0',
            'host_crt=/MT',
            'runtime_hlsl_compiler=false',
            'dimensions=1280x720 -> 1920x1080',
            'warmup_triads=60',
            'measured_triads=600',
            'order_protocol=SIX_ROTATING_PERMUTATIONS_BALANCED',
            'lab27_sha256=48e3964198c6d1e4371201655519d8ccfc37fe22838b26f3ce4e93cd20d3db44',
            'lab28_sha256=fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77',
            'k185_sha256=6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16',
            'texture_contract=1 GatherGreen + 4 SampleLevel + 0 UAV',
            'lab28_full_software_gate=PASS',
            'warp_smoke=PASS',
            'physical_gtx960m_executed=false',
            'main_modified=false',
            'source_modified=false'
          ) | Set-Content "$pack\PROVENANCE.txt" -Encoding ascii
          Copy-Item "$root\STATIC_DXBC_AUDIT.json" "$pack\STATIC_DXBC_AUDIT.json"
          Copy-Item "$root\HEADERS.txt" "$pack\PE_HEADERS.txt"
          $manifest=Get-ChildItem $pack -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel=$_.FullName.Substring((Resolve-Path $pack).Path.Length+1).Replace('\','/')
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $rel"
          }
          $manifest | Set-Content "$pack\SHA256_MANIFEST.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptar-lab28-gtx960m-compare-pack
          path: lab_results/lab28_gtx_pack
