name: cleanup-non-main-branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-non-main-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: prune all non-main branches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          default='${{ github.event.repository.default_branch }}'
          echo "Default branch retained: ${default}"

          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          echo "Branches before cleanup: ${#branches[@]}"

          failures=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "$default" ]]; then
              continue
            fi
            echo "Deleting: $branch"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "::error::Failed to delete branch: $branch"
              failures=1
            fi
          done

          mapfile -t survivors < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | grep -vFx "$default" || true)
          echo "Non-default survivors: ${#survivors[@]}"
          if (( ${#survivors[@]} > 0 )); then
            printf 'SURVIVOR=%s\n' "${survivors[@]}"
            exit 1
          fi
          if (( failures != 0 )); then
            exit 1
          fi
          echo 'BRANCH_CLEANUP=PASS'
