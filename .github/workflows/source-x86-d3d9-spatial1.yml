name: SOURCE x86 D3D9 PRODPORT1

on:
  push:
    branches: [SOURCE]
    paths:
      - 'compat/x86_d3d9/**'
      - '.github/workflows/source-x86-d3d9-spatial1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Locate FXC and compile PTAR MoE ps_3_0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build_x86 | Out-Null
          $fxc=Get-Command fxc.exe -ErrorAction SilentlyContinue
          if(-not $fxc){
            $roots=@("$env:ProgramFiles(x86)\Windows Kits\10\bin","$env:ProgramFiles(x86)\Windows Kits\8.1\bin")
            foreach($root in $roots){
              if(Test-Path $root){
                $fxc=Get-ChildItem $root -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
                if($fxc){break}
              }
            }
          }
          if(-not $fxc){throw 'fxc.exe not found'}
          $fxcPath=if($fxc.Path){$fxc.Path}else{$fxc.FullName}
          if(-not $fxcPath){throw 'fxc.exe path resolution failed'}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fh build_x86\ptar_ps_bytecode.h /Vn g_ptarPs compat\x86_d3d9\ptar_moe_d3d9_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fh build_x86\ptar_universal_ps_bytecode.h /Vn g_ptarUniversalPs compat\x86_d3d9\ptar_moe_universal_d3d9_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $fxcPath /nologo /T ps_2_0 /E main /O3 /Fh build_x86\ptar_bilinear_ps_bytecode.h /Vn g_ptarBilinearPs compat\x86_d3d9\ptar_bilinear_ref_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fh build_x86\ptar_gw16i_hud_ps_bytecode.h /Vn g_ptarGw16iHudPs compat\x86_d3d9\ptar_gw16i_hud_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fh build_x86\ptar_gw16i_feedback_ps_bytecode.h /Vn g_ptarGw16iFeedbackPs compat\x86_d3d9\ptar_gw16i_feedback_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fh build_x86\ptar_fg_me_coarse_ps_bytecode.h /Vn g_ptarFgMeCoarsePs compat\x86_d3d9\ptar_fg_me_coarse_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fh build_x86\ptar_fg_me_refine_ps_bytecode.h /Vn g_ptarFgMeRefinePs compat\x86_d3d9\ptar_fg_me_refine_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fh build_x86\ptar_fg_interpolate_ps_bytecode.h /Vn g_ptarFgInterpolatePs compat\x86_d3d9\ptar_fg_interpolate_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          foreach($header in @(
            'build_x86\ptar_ps_bytecode.h',
            'build_x86\ptar_universal_ps_bytecode.h',
            'build_x86\ptar_bilinear_ps_bytecode.h',
            'build_x86\ptar_gw16i_hud_ps_bytecode.h',
            'build_x86\ptar_gw16i_feedback_ps_bytecode.h',
            'build_x86\ptar_fg_me_coarse_ps_bytecode.h',
            'build_x86\ptar_fg_me_refine_ps_bytecode.h',
            'build_x86\ptar_fg_interpolate_ps_bytecode.h'
          )){
            if(-not(Test-Path $header)){throw "shader header missing: $header"}
          }
          Write-Host "FXC=$fxcPath"

      - name: Build 32-bit D3D9 proxy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifact | Out-Null
          & cl.exe /nologo /LD /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\ptar_d3d9_proxy.cpp /link user32.lib /DEF:compat\x86_d3d9\d3d9_proxy.def /OUT:artifact\d3d9.dll /SUBSYSTEM:WINDOWS,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(-not(Test-Path artifact\d3d9.dll)){throw 'd3d9.dll missing'}

      - name: Static PE and export gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dumpbin /headers artifact\d3d9.dll | Tee-Object build_x86\HEADERS.txt
          dumpbin /exports artifact\d3d9.dll | Tee-Object build_x86\EXPORTS.txt
          dumpbin /dependents artifact\d3d9.dll | Tee-Object build_x86\DEPENDENTS.txt
          $h=Get-Content build_x86\HEADERS.txt -Raw
          $e=Get-Content build_x86\EXPORTS.txt -Raw
          $d=Get-Content build_x86\DEPENDENTS.txt -Raw
          if($h -notmatch '14C machine \(x86\)'){throw 'PE is not x86/I386'}
          foreach($n in @('Direct3DCreate9','Direct3DCreate9Ex','D3DPERF_BeginEvent','D3DPERF_EndEvent')){
            if($e -notmatch [regex]::Escape($n)){throw "missing export $n"}
          }
          foreach($bad in @('VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){
            if($d -match $bad){throw "forbidden dynamic runtime dependency $bad"}
          }
          $sha=(Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'PTAR_VARIANT=PTAR_X86_D3D9_PRODPORT1_GENERIC_VTABLEFIX2_CRASHLOG1',
            'PE_MACHINE=I386_0x014C',
            'API=D3D9',
            'SPATIAL=PTAR_NG_MOE_X15_PLUS_UNIVERSAL_EDGE_PS3',
            'RESOLUTION_POLICY=ANY_GAME_RESOLUTION_BELOW_OUTPUT_USES_PTAR_ELSE_NATIVE_1X1',
            'ASPECT_POLICY=PRESENTER_ASPECT_FIT',
            'NATIVE_1X1_FG=SUPPORTED',
            'RESOLUTION_RESET_PERSISTENCE=SUPPORTED',
            'HUD=GW16I_EXACT_RASTER_PORT_D3D9_CLEAR_RECTS',
            'HUD_SHADER_DEPENDENCY=NONE',
            'MANUAL_FILTER=F6_MOE_VS_BILINEAR',
            'STATUS=F8_TEMPORARY_NOTICE_AND_RUNTIME_TELEMETRY',
            'FG_PROFILE=CTRL_F8',
            'CAPTURE=F9_POST_OVERLAY_BMP',
            'VIDEO_RECORD=CTRL_F9',
            'TOGGLE_PRESENTER=F10_FUNCTIONAL_ASYNC_ON_OFF',
            'FILTER_NEXT=F12',
            'FG=CTRL_F6_PRODPORT1_SHADER_ME_DIV4_DIV2_INTERPOLATE',
            'FG_VISIBLE_TARGET_HZ=60',
            'FG_PACING=GW16I_ISOLATED_PRESENTER_SYNC1',
            'FG_LATE_POLICY=EXISTING_LOAD_SHED_REAL_ONLY',
            'PRESENTER_ARCH=D3D11_MODEL_SEPARATE_DEVICE_SHARED_RING',
            'PRESENTER_SWAP_INTERVAL=SYNC1',
            'FG_GENERATION_POLICY=GW16I_HIGH_TARGET60_REAL_GOVERNOR',
            'FPS_METRIC=QPC_WALLCLOCK_ROLLING_WINDOW',
            'CRASH_DIAGNOSTICS=EARLY_VEH_UNHANDLED_STAGE_REGISTERS',
            ('DLL_SHA256='+$sha),
            ('SOURCE_COMMIT='+$env:GITHUB_SHA)
          ) | Set-Content artifact\PTAR_X86_D3D9_VERSION.txt -Encoding ASCII
          Write-Host 'X86_PE_GATE=PASS'
          Write-Host "DLL_SHA256=$sha"

      - name: Validate universal D3D9 resolution policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I compat\x86_d3d9 compat\x86_d3d9\d3d9_resolution_policy_smoke.cpp /link /OUT:artifact\d3d9_resolution_policy_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_resolution_policy_smoke.exe | Tee-Object build_x86\D3D9_RESOLUTION_POLICY_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "D3D9 resolution policy smoke failed rc=$LASTEXITCODE"}
          $rp=Get-Content build_x86\D3D9_RESOLUTION_POLICY_SMOKE.txt -Raw
          if($rp -notmatch 'D3D9_RESOLUTION_POLICY_SMOKE=PASS'){throw 'resolution policy PASS marker missing'}
          if($rp -notmatch 'NATIVE_1080_FG_ONLY'){throw 'native 1080/FG-only gate missing'}
          if($rp -notmatch 'SPATIAL_720_TO_1080'){throw '720p spatial gate missing'}
          if($rp -notmatch 'SPATIAL_900_TO_1080'){throw '1600x900 spatial gate missing'}
          if($rp -notmatch 'SPATIAL_576_TO_1080'){throw '1024x576 spatial gate missing'}
          if($rp -notmatch 'ASPECT_FIT_4X3 fit=240,0 1440x1080'){throw '4:3 aspect-fit gate missing'}
          Write-Host 'D3D9_UNIVERSAL_RESOLUTION_POLICY=PASS'

      - name: Validate arbitrary-resolution PTAR GPU reconstruction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\d3d9_universal_spatial_gpu_smoke.cpp /link user32.lib /OUT:artifact\d3d9_universal_spatial_gpu_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_universal_spatial_gpu_smoke.exe | Tee-Object build_x86\D3D9_UNIVERSAL_SPATIAL_GPU_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "D3D9 universal spatial GPU smoke failed rc=$LASTEXITCODE"}
          $u=Get-Content build_x86\D3D9_UNIVERSAL_SPATIAL_GPU_SMOKE.txt -Raw
          if($u -notmatch 'D3D9_UNIVERSAL_SPATIAL_GPU_SMOKE=PASS'){throw 'universal spatial GPU PASS marker missing'}
          if($u -notmatch 'UNIVERSAL_4X3_ASPECT_FIT'){throw 'aspect-fit GPU evidence missing'}
          Write-Host 'D3D9_UNIVERSAL_SPATIAL_GPU=PASS'

      - name: Validate exact GW16I HUD source contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $hud=Get-Content compat\x86_d3d9\ptar_gw16i_hud_ps.hlsl -Raw
          $fb=Get-Content compat\x86_d3d9\ptar_gw16i_feedback_ps.hlsl -Raw
          $cpu=Get-Content compat\x86_d3d9\ptar_gw16i_hud_d3d9.h -Raw
          $proxy=Get-Content compat\x86_d3d9\ptar_d3d9_proxy.cpp -Raw
          foreach($token in @(
            '87,73,78,56,49,32,85,83,82,32',
            '70,80,83,32,32,32,32,32,32,32',
            '82,69,83,46,32,32,32,32,32,32',
            '70,73,76,84,69,82,32,32,32,32',
            '67,79,80,89,32,49,88,49,32,32',
            'float3(.01,.012,.018)',
            'float3(.92,.96,1)'
          )){
            if($hud -notmatch [regex]::Escape($token)){throw "GW16I HUD HLSL provenance token missing: $token"}
          }
          foreach($token in @(
            'case 87:return 24557',
            'case 73:return 29847',
            'case 78:return 24573',
            'case 56:return 31727',
            'case 49:return 29850',
            'WIN81 USR V0.41',
            'COPY 1X1',
            'PTAR X15',
            'EDGE 25',
            'EDGE 45'
          )){
            if($cpu -notmatch [regex]::Escape($token)){throw "GW16I D3D9 raster contract missing: $token"}
          }
          foreach($token in @(
            'PtHudFeedback(5',
            'PtHudFeedback(8',
            'PtHudFeedback(g_ptarHudFgEnabled?12:13',
            'PtHudStateFeedback(g_ptarHudVisible?3:4)'
          )){
            $state=Get-Content compat\x86_d3d9\ptar_hud.h -Raw
            if($state -notmatch [regex]::Escape($token)){throw "GW16I HUD state contract missing: $token"}
          }
          if($fb -notmatch 'float Line1' -or $fb -notmatch 'float DLine1'){throw 'GW16I feedback provenance source incomplete'}
          if($proxy -match 'CreateGW16IHUDShaders' -or $proxy -match 'g_ptarGw16iHudPs' -or $proxy -match 'g_ptarGw16iFeedbackPs'){
            throw 'runtime regressed to field-rejected monolithic HUD pixel-shader dependency'
          }
          if($proxy -notmatch 'PtGw16RenderExactHudD3D9'){
            throw 'D3D9 exact GW16I raster renderer is not wired'
          }
          Write-Host 'D3D9_GW16I_HUD_CONTRACT=PASS'
          Write-Host 'D3D9_GW16I_HUD_NO_PS3_RUNTIME_DEPENDENCY=PASS'

      - name: Validate GW16I HUD visibility on D3D9 GPU
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\d3d9_gw16i_hud_gpu_smoke.cpp /link user32.lib /OUT:artifact\d3d9_gw16i_hud_gpu_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_gw16i_hud_gpu_smoke.exe | Tee-Object build_x86\D3D9_GW16I_HUD_GPU_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "D3D9 GW16I HUD GPU smoke failed rc=$LASTEXITCODE"}
          $hudgpu=Get-Content build_x86\D3D9_GW16I_HUD_GPU_SMOKE.txt -Raw
          if($hudgpu -notmatch 'D3D9_GW16I_HUD_GPU_SMOKE=PASS'){throw 'GW16I HUD GPU PASS marker missing'}
          if($hudgpu -notmatch 'HUD_MAIN changed=[1-9][0-9]*'){throw 'GW16I main HUD produced no visible pixels'}
          if($hudgpu -notmatch 'HUD_FEEDBACK changed=[1-9][0-9]*'){throw 'GW16I feedback HUD produced no visible pixels'}
          Write-Host 'D3D9_GW16I_HUD_GPU=PASS'

      - name: Validate wall-clock FPS metric
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I compat\x86_d3d9 compat\x86_d3d9\d3d9_wallclock_fps_smoke.cpp /link /OUT:artifact\d3d9_wallclock_fps_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_wallclock_fps_smoke.exe | Tee-Object build_x86\D3D9_WALLCLOCK_FPS_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "D3D9 wall-clock FPS smoke failed rc=$LASTEXITCODE"}
          $m=Get-Content build_x86\D3D9_WALLCLOCK_FPS_SMOKE.txt -Raw
          if($m -notmatch 'D3D9_WALLCLOCK_FPS_SMOKE=PASS'){throw 'wall-clock FPS PASS marker missing'}
          if($m -notmatch 'FPS_AFTER_200MS_STALL='){throw 'stall-sensitive FPS evidence missing'}
          Write-Host 'D3D9_WALLCLOCK_FPS=PASS'

      - name: Validate F9 post-overlay BMP capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I compat\x86_d3d9 compat\x86_d3d9\d3d9_f9_capture_smoke.cpp /link user32.lib /OUT:artifact\d3d9_f9_capture_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Push-Location artifact
          try{
            & .\d3d9_f9_capture_smoke.exe | Tee-Object ..\build_x86\D3D9_F9_CAPTURE_SMOKE.txt
            if($LASTEXITCODE -ne 0){throw "D3D9 F9 capture smoke failed rc=$LASTEXITCODE"}
          } finally {
            Pop-Location
          }
          $cap=Get-Content build_x86\D3D9_F9_CAPTURE_SMOKE.txt -Raw
          if($cap -notmatch 'D3D9_F9_CAPTURE_SMOKE=PASS'){throw 'F9 capture PASS marker missing'}
          if($cap -notmatch 'CAPTURE_DIMENSIONS=320x180'){throw 'F9 capture dimensions gate failed'}
          Write-Host 'D3D9_F9_CAPTURE=PASS'

      - name: Probe regular-D3D9 to isolated-D3D9Ex shared resources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 compat\x86_d3d9\d3d9_regular_to_ex_shared_smoke.cpp /link user32.lib /OUT:artifact\d3d9_regular_to_ex_shared_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_regular_to_ex_shared_smoke.exe | Tee-Object build_x86\D3D9_REGULAR_TO_EX_SHARED_SMOKE.txt
          $rc=$LASTEXITCODE
          $rx=Get-Content build_x86\D3D9_REGULAR_TO_EX_SHARED_SMOKE.txt -Raw
          if($rx -notmatch 'REGULAR_D3D9_SHARED_ANY='){
            throw 'regular->Ex shared resource probe emitted no capability marker'
          }
          if($rc -eq 0){
            Write-Host 'D3D9_REGULAR_TO_EX_SHARED=SUPPORTED'
          } elseif($rx -match 'REGULAR_D3D9_TO_D3D9EX_SHARED_RESOURCE=UNSUPPORTED'){
            Write-Host 'D3D9_REGULAR_TO_EX_SHARED=UNSUPPORTED_EXPECTED_PROBE_RESULT'
          } else {
            throw "regular D3D9 to D3D9Ex probe failed unexpectedly rc=$rc"
          }

      - name: Probe regular D3D9 swapchain Present DONOTWAIT isolation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 compat\x86_d3d9\d3d9_swapchain_donotwait_smoke.cpp /link user32.lib /OUT:artifact\d3d9_swapchain_donotwait_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_swapchain_donotwait_smoke.exe | Tee-Object build_x86\D3D9_SWAPCHAIN_DONOTWAIT_SMOKE.txt
          $rc=$LASTEXITCODE
          $sd=Get-Content build_x86\D3D9_SWAPCHAIN_DONOTWAIT_SMOKE.txt -Raw
          if($sd -notmatch 'SWAPCHAIN_NOWAIT_PRODUCER_MS='){
            throw 'swapchain DONOTWAIT probe emitted no timing evidence'
          }
          if($rc -eq 0){
            Write-Host 'D3D9_SWAPCHAIN_DONOTWAIT=SUPPORTED'
          } else {
            Write-Host "D3D9_SWAPCHAIN_DONOTWAIT=UNSUITABLE rc=$rc"
          }

      - name: Probe D3D9Ex managed-pool compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 compat\x86_d3d9\d3d9_ex_managed_pool_probe.cpp /link user32.lib /OUT:artifact\d3d9_ex_managed_pool_probe.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_ex_managed_pool_probe.exe | Tee-Object build_x86\D3D9_EX_MANAGED_POOL_PROBE.txt
          if($LASTEXITCODE -ne 0){throw "D3D9Ex managed-pool probe failed rc=$LASTEXITCODE"}
          $mp=Get-Content build_x86\D3D9_EX_MANAGED_POOL_PROBE.txt -Raw
          if($mp -notmatch 'D3D9EX_MANAGED_RESOURCES='){
            throw 'D3D9Ex managed-pool capability marker missing'
          }
          Write-Host ($mp.Trim())

      - name: Probe Ex-factory base CreateDevice compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 compat\x86_d3d9\d3d9_ex_factory_base_device_probe.cpp /link user32.lib /OUT:artifact\d3d9_ex_factory_base_device_probe.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_ex_factory_base_device_probe.exe | Tee-Object build_x86\D3D9_EX_FACTORY_BASE_DEVICE_PROBE.txt
          if($LASTEXITCODE -ne 0){throw "Ex-factory base-device probe failed rc=$LASTEXITCODE"}
          $eb=Get-Content build_x86\D3D9_EX_FACTORY_BASE_DEVICE_PROBE.txt -Raw
          if($eb -notmatch 'EX_FACTORY_BASE_MANAGED=' -or $eb -notmatch 'EX_FACTORY_BASE_SHARED='){
            throw 'Ex-factory base-device capability markers missing'
          }
          Write-Host ($eb.Trim())

      - name: Validate D3D11-model isolated D3D9Ex presenter architecture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 compat\x86_d3d9\d3d9_separate_device_presenter_smoke.cpp /link user32.lib /OUT:artifact\d3d9_separate_device_presenter_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_separate_device_presenter_smoke.exe | Tee-Object build_x86\D3D9_SEPARATE_DEVICE_PRESENTER_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "D3D9 separate-device presenter smoke failed rc=$LASTEXITCODE"}
          $sp=Get-Content build_x86\D3D9_SEPARATE_DEVICE_PRESENTER_SMOKE.txt -Raw
          if($sp -notmatch 'D3D9_SEPARATE_DEVICE_SHARED_PRESENTER_SMOKE=PASS'){throw 'separate-device presenter PASS marker missing'}
          if($sp -notmatch 'SHARED_HANDLE_SUPPORTED=1'){throw 'D3D9Ex shared resource gate failed'}
          if($sp -notmatch 'SEPARATE_DEVICE_PRODUCER_MS='){throw 'producer timing evidence missing'}
          if($sp -notmatch 'SEPARATE_DEVICE_PRESENTED=[1-9][0-9]*'){throw 'isolated presenter produced no visible presents'}
          if($sp -notmatch 'SEPARATE_DEVICE_ERRORS=0'){throw 'isolated presenter reported errors'}
          Write-Host 'D3D9_SEPARATE_DEVICE_PRESENTER=PASS'

      - name: Execute generic D3D9 FG GPU pipeline smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\d3d9_fg_gpu_pipeline_smoke.cpp /link user32.lib /OUT:artifact\d3d9_fg_gpu_pipeline_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_fg_gpu_pipeline_smoke.exe | Tee-Object build_x86\D3D9_FG_GPU_PIPELINE_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "D3D9 FG GPU pipeline smoke failed rc=$LASTEXITCODE"}
          $fg=Get-Content build_x86\D3D9_FG_GPU_PIPELINE_SMOKE.txt -Raw
          if($fg -notmatch 'D3D9_FG_GPU_PIPELINE_SMOKE=PASS'){throw 'FG GPU PASS marker missing'}
          if($fg -notmatch 'FG_MOTION_NONZERO_PIXELS=[1-9][0-9]*'){throw 'FG motion evidence missing'}
          Write-Host 'D3D9_FG_GPU_PIPELINE=PASS'

      - name: Validate generic D3D9 FG QPC pacing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I compat\x86_d3d9 compat\x86_d3d9\d3d9_fg_pacer_smoke.cpp /link /OUT:artifact\d3d9_fg_pacer_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & artifact\d3d9_fg_pacer_smoke.exe | Tee-Object build_x86\D3D9_FG_PACER_SMOKE.txt
          if($LASTEXITCODE -ne 0){throw "D3D9 FG pacer smoke failed rc=$LASTEXITCODE"}
          $p=Get-Content build_x86\D3D9_FG_PACER_SMOKE.txt -Raw
          if($p -notmatch 'D3D9_FG_PACER_SMOKE=PASS'){throw 'FG pacer PASS marker missing'}
          if($p -notmatch 'FG_PACER_LATE_SKIP_COUNT=0'){throw 'FG late-skip regression detected'}
          if($p -notmatch 'FG_PACER_RESYNC_COUNT=0'){throw 'legacy local-grid resync unexpectedly active'}
          if($p -notmatch 'FG_PACER_WAIT_YIELDS=0'){throw 'producer-thread wait/yield regression detected'}
          if($p -notmatch 'FG_PRODUCER_GENERATED_PREP_MS='){throw 'producer generated prep evidence missing'}
          if($p -notmatch 'FG_PRODUCER_REAL_PREP_MS='){throw 'producer real prep evidence missing'}
          Write-Host 'D3D9_FG_PRODUCER_NO_WAIT=PASS'

      - name: Reproduce Direct3DCreate9 object lifetime sequence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 compat\x86_d3d9\d3d9_object_lifetime_smoke.cpp /link user32.lib /OUT:artifact\d3d9_object_lifetime_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Push-Location artifact
          try{
            & .\d3d9_object_lifetime_smoke.exe | Tee-Object ..\build_x86\D3D9_OBJECT_LIFETIME_SMOKE.txt
            if($LASTEXITCODE -ne 0){throw "D3D9 object lifetime smoke failed rc=$LASTEXITCODE"}
          } finally {
            Pop-Location
          }
          $smoke=Get-Content build_x86\D3D9_OBJECT_LIFETIME_SMOKE.txt -Raw
          if($smoke -notmatch 'D3D9_OBJECT_LIFETIME_SMOKE=PASS'){throw 'lifetime PASS marker missing'}
          if($smoke -notmatch 'D3D9_DYNAMIC_RESOLUTION_SEQUENCE=PASS'){throw 'dynamic resolution sequence gate missing'}
          Write-Host 'D3D9_VTABLE_PRESERVATION=PASS'
          Write-Host 'D3D9_DYNAMIC_RESOLUTION=PASS'

      - name: Installer path, in-place and diagnostic collector smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $smoke=Join-Path $PWD '_smoke'
          if(Test-Path $smoke){Remove-Item $smoke -Recurse -Force}
          New-Item -ItemType Directory $smoke | Out-Null

          # Separate package with spaces/apostrophe.
          $pack=Join-Path $smoke "Pack O'Hara"
          $game=Join-Path $smoke "Game Space"
          New-Item -ItemType Directory $pack,$game | Out-Null
          Copy-Item artifact\d3d9.dll $pack\d3d9.dll
          Copy-Item compat\x86_d3d9\install_x86_d3d9.ps1 $pack\install_x86_d3d9.ps1
          Copy-Item compat\x86_d3d9\uninstall_x86_d3d9.ps1 $pack\uninstall_x86_d3d9.ps1
          $exe=Join-Path $game 'ptar_test_x86.exe'
          Copy-Item "$env:SystemRoot\SysWOW64\notepad.exe" $exe
          & (Join-Path $pack 'install_x86_d3d9.ps1') -GameExe $exe
          if(-not(Test-Path (Join-Path $game 'd3d9.dll'))){throw 'separate-package install did not copy d3d9.dll'}
          $state=Get-Content (Join-Path $game 'PTAR_X86_D3D9_INSTALL_STATE.txt') -Raw
          if($state -notmatch '(?m)^INPLACE_PACKAGE=0\r?$'){throw 'separate-package state mismatch'}
          if((Get-FileHash (Join-Path $game 'd3d9.dll') -Algorithm SHA256).Hash -ne (Get-FileHash (Join-Path $pack 'd3d9.dll') -Algorithm SHA256).Hash){throw 'separate-package DLL mismatch'}
          & (Join-Path $pack 'uninstall_x86_d3d9.ps1') -GameExe $exe
          if(Test-Path (Join-Path $game 'd3d9.dll')){throw 'separate-package uninstall left d3d9.dll'}

          # Package extracted directly next to game EXE.
          $inplace=Join-Path $smoke 'In Place Generic'
          New-Item -ItemType Directory $inplace | Out-Null
          Copy-Item artifact\d3d9.dll $inplace\d3d9.dll
          Copy-Item compat\x86_d3d9\install_x86_d3d9.ps1 $inplace\install_x86_d3d9.ps1
          Copy-Item compat\x86_d3d9\uninstall_x86_d3d9.ps1 $inplace\uninstall_x86_d3d9.ps1
          Copy-Item compat\x86_d3d9\collect_x86_d3d9_diag.ps1 $inplace\collect_x86_d3d9_diag.ps1
          $iex=Join-Path $inplace 'ptar_test_x86.exe'
          Copy-Item "$env:SystemRoot\SysWOW64\notepad.exe" $iex
          & (Join-Path $inplace 'install_x86_d3d9.ps1') -GameExe $iex
          $istate=Get-Content (Join-Path $inplace 'PTAR_X86_D3D9_INSTALL_STATE.txt') -Raw
          if($istate -notmatch '(?m)^INPLACE_PACKAGE=1\r?$'){throw 'in-place state mismatch'}
          if(Test-Path (Join-Path $inplace 'd3d9.dll.ptar_original')){throw 'in-place install created false backup'}

          # Collector package content smoke test.
          "synthetic crash log" | Set-Content (Join-Path $inplace 'PTAR_X86_D3D9.log') -Encoding ASCII
          & (Join-Path $inplace 'collect_x86_d3d9_diag.ps1') -GameExe $iex
          $diag=Get-ChildItem $inplace -Filter 'PTAR_X86_D3D9_DIAG_*.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $diag){throw 'diagnostic collector produced no ZIP'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $za=[IO.Compression.ZipFile]::OpenRead($diag.FullName)
          try{
            $names=@($za.Entries | ForEach-Object {$_.FullName})
            foreach($required in @('SUMMARY.txt','PTAR_X86_D3D9.log','PTAR_X86_D3D9_INSTALL_STATE.txt')){
              if($names -notcontains $required){throw "diagnostic ZIP missing $required"}
            }
          } finally {
            $za.Dispose()
          }
          Write-Host 'CRASH_DIAGNOSTIC_COLLECTOR_SMOKE=PASS'

          & (Join-Path $inplace 'uninstall_x86_d3d9.ps1') -GameExe $iex
          if(Test-Path (Join-Path $inplace 'd3d9.dll')){throw 'in-place uninstall left d3d9.dll'}
          if(-not(Test-Path $iex)){throw 'in-place uninstall removed game EXE'}
          Write-Host 'INSTALLER_PATH_SMOKE=PASS'
          Write-Host 'INSTALLER_INPLACE_SMOKE=PASS'

      - name: Package generic x86 D3D9 PRODPORT1 test build
