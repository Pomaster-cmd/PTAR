name: promote-universal1-transactional-v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-universal1-transactional-v3.yml'

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct exact UNIVERSAL1 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $b64=((1..4 | ForEach-Object { Get-Content -LiteralPath (".github/universal1_payload/part$_.b64") -Raw }) -join '').Trim()
          $archive=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1.tar.xz'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($b64))
          $h=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne '6b1ad9026a9817b0b6599fb4ca6e4836afb699b778440ed403e77e1144509ee8'){throw "candidate hash mismatch $h"}
          python -c "import tarfile; t=tarfile.open(r'$archive','r:xz'); t.extractall('.'); t.close()"
          $rh=(Get-FileHash payload/d3d11.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($rh -ne 'e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'){throw "runtime drift $rh"}
          if((Get-FileHash payload/win81_nis_dx11_x64.dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $rh){throw 'runtime mirror drift'}
          Write-Host 'UNIVERSAL1_RECONSTRUCT=PASS'

      - name: Repository-safe static gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($t in @(
            'diag/validate_universal_targeting.py',
            'diag/validate_win81_path_handoff.py',
            'diag/validate_ps4_compat.py',
            'diag/validate_recorder_hudrec1.py',
            'diag/validate_fg_marker_visibility.py'
          )){
            & python $t
            if($LASTEXITCODE -ne 0){throw "$t failed rc=$LASTEXITCODE"}
          }
          $functional=@(
            'payload/win81_nis.ini','diag/install.ps1','diag/verify.ps1','diag/collect.ps1','diag/rollback_test.ps1',
            'diag/set_vblank_diagnostics.ps1','03-ARM_VISIBLE_FRAME_VERIFIER.bat','03-INSTALL_QSV_HELPER_WIN81.bat',
            '04-TEST_QSV_5S_MP4.bat','diag/visible_pacing/run_single_engine_verifier.ps1',
            '_PTAR_UNINSTALL/PTAR_SAFE_UNINSTALL.ps1','tools/installer/INSTALL_QSV_HELPER_WIN81.ps1'
          )
          foreach($f in $functional){
            $s=Get-Content $f -Raw
            foreach($bad in @('Warhammer.exe','SatGat-Win64-Shipping.exe','NeoCore Games\Warhammer')){
              if($s.IndexOf($bad,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "forbidden '$bad' in functional path $f"}
            }
          }
          Write-Host 'UNIVERSAL1_REPOSITORY_STATIC=PASS'

      - name: Windows multi-game install verify rollback and x86 refusal
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ps="$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $tmp=Join-Path $env:RUNNER_TEMP 'PTAR_UNIVERSAL1_MULTI'
          if(Test-Path $tmp){Remove-Item $tmp -Recurse -Force}
          New-Item -ItemType Directory -Path $tmp | Out-Null
          function Install([string]$exe,[bool]$envMode){
            if($envMode){$env:PTAR_GAME_EXE=$exe;& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1;$rc=$LASTEXITCODE;Remove-Item Env:PTAR_GAME_EXE -ErrorAction SilentlyContinue}
            else{& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1 -GameExe $exe;$rc=$LASTEXITCODE}
            if($rc -ne 0){throw "install failed $exe rc=$rc"}
          }
          function Check([string]$dir,[string]$name){
            $dll=Join-Path $dir 'd3d11.dll';$ini=Join-Path $dir 'win81_nis.ini'
            if((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'){throw 'installed runtime drift'}
            if((Get-Content $ini) -notcontains ("TargetExe="+$name)){throw "TargetExe mismatch $name"}
            & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\verify.ps1
            if($LASTEXITCODE -ne 0){throw "verify failed $name rc=$LASTEXITCODE"}
          }
          function Rollback([string]$dir,[string]$exe){
            & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\rollback_test.ps1
            if($LASTEXITCODE -ne 0){throw "rollback failed rc=$LASTEXITCODE"}
            if(-not(Test-Path $exe)){throw 'target exe removed'}
            foreach($n in @('d3d11.dll','win81_nis_dx11_x64.dll','win81_nis.ini','win81_nis_version.txt')){if(Test-Path (Join-Path $dir $n)){throw "$n remained after rollback"}}
          }
          $a=Join-Path $tmp 'A';New-Item -ItemType Directory $a|Out-Null;$ae=Join-Path $a 'StarGazer.exe';Copy-Item "$env:SystemRoot\System32\notepad.exe" $ae
          Install $ae $false;Check $a 'StarGazer.exe';Rollback $a $ae
          $b=Join-Path $tmp 'B';New-Item -ItemType Directory $b|Out-Null;$be=Join-Path $b 'TotallyDifferentGame.exe';Copy-Item "$env:SystemRoot\System32\notepad.exe" $be
          Install $be $true;Check $b 'TotallyDifferentGame.exe';Rollback $b $be
          $c=Join-Path $tmp 'C';New-Item -ItemType Directory $c|Out-Null;$ce=Join-Path $c 'Legacy32Game.exe';Copy-Item "$env:SystemRoot\SysWOW64\notepad.exe" $ce
          & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\diag\install.ps1 -GameExe $ce
          if($LASTEXITCODE -eq 0){throw 'x86 executable incorrectly accepted'}
          if(Test-Path (Join-Path $c 'd3d11.dll')){throw 'runtime copied after x86 rejection'}
          Write-Host 'UNIVERSAL1_MULTIGAME_WINDOWS=PASS'

      - name: Promote only after every gate passed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item -Recurse -Force .github/universal1_payload
          Remove-Item -Force .github/workflows/promote-universal1-transactional.yml
          Remove-Item -Force .github/workflows/promote-universal1-transactional-v3.yml
          Remove-Item -Force -ErrorAction SilentlyContinue .github/workflows/finalize-hudrec1-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: promote HUDREC1 UNIVERSAL1 game-agnostic targeting'
          git push origin HEAD:main
