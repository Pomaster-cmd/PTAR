name: LAB PTAR-NG MoE v02 LAB27 Scalar Phase Modulo

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  fxc-warp-scalar-phase-audit:
    if: contains(github.event.head_commit.message, '[run-lab27]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile LAB25 and LAB27 identically
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab27'; New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab25.cso" /Fc "$out\lab25.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab25_proven_shape_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab27.cso" /Fc "$out\lab27.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab27_scalar_phase_mod_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Static scalar-phase DXBC audit
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          p=Path('lab_results/moe_ng_v02_lab27')
          res={'protocol':'LAB27_SCALAR_PHASE_MOD_STATIC_AUDIT'}
          for name in ('lab25','lab27'):
              lines=(p/f'{name}.asm').read_text(errors='replace').splitlines()
              ops=[]
              for line in lines:
                  s=line.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'): continue
                  m=re.match(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b',line)
                  if not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op)
              udiv=[x.strip() for x in lines if re.match(r'^\s*udiv\b',x)]
              sample=[x for x in lines if re.match(r'^\s*sample_l',x)]
              gather=[x for x in lines if re.match(r'^\s*gather4',x)]
              res[name]={'instructions':len(ops),'cso_bytes':(p/f'{name}.cso').stat().st_size,'udiv_lines':udiv,'sample_count':len(sample),'gather_count':len(gather),'opcode_histogram':dict(sorted(Counter(ops).items()))}
          u25=' '.join(res['lab25']['udiv_lines']); u27=' '.join(res['lab27']['udiv_lines'])
          res['lab25_vector_modulo']=('.xy' in u25 or '.zw' in u25)
          res['lab27_scalar_modulo']=not ('.xy' in u27 or '.zw' in u27 or '.xyz' in u27 or '.xyzw' in u27)
          res['texture_contract_preserved']=res['lab27']['sample_count']==4 and res['lab27']['gather_count']==1
          res['static_candidate_pass']=bool(res['lab27_scalar_modulo'] and res['texture_contract_preserved'])
          (p/'STATIC_AUDIT.json').write_text(json.dumps(res,indent=2)+'\n')
          print(json.dumps(res,indent=2))
          if not res['static_candidate_pass']: raise SystemExit('LAB27 did not compile to the intended scalar modulo shape')
          '@ | python -

      - name: Build WARP harness
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){ throw 'vcvars64.bat not found' }
          $out='lab_results\moe_ng_v02_lab27'
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 tools\lab_moe_ng_v02_warp_harness.cpp /Fe:$out\warp_harness.exe d3d11.lib dxgi.lib"
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Prepare canonical input and CPU reference
        run: python tools/lab_moe_ng_v02_warp_validate.py --outdir lab_results/moe_ng_v02_lab27 --prepare

      - name: WARP canonical and stress equivalence
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab27'
          & "$out\warp_harness.exe" "$out\input.f32" 24 24 36 36 "$out\lab25.cso" "$out\fullscreen_vs.cso" "$out\lab25_output.f32" *> "$out\WARP_LAB25.txt"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & "$out\warp_harness.exe" "$out\input.f32" 24 24 36 36 "$out\lab27.cso" "$out\fullscreen_vs.cso" "$out\lab27_output.f32" *> "$out\WARP_LAB27.txt"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/lab_moe_ng_v02_warp_validate.py --outdir $out --gpu "$out\lab27_output.f32" --tol 0.000002
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item "$out\SUMMARY.json" "$out\LAB27_CPU_PARITY.json"
          @'
          import numpy as np
          from pathlib import Path
          p=Path('lab_results/moe_ng_v02_lab27'); H=W=24; y,x=np.mgrid[0:H,0:W]; F=np.float32
          def rgba(r,g,b): return np.stack([r,g,b,np.ones((H,W),np.float32)],2).astype(np.float32)
          checker=((x+y)&1).astype(np.float32); stripes=((2*x+y)%5<2).astype(np.float32)
          rng=np.random.default_rng(270925); noise=rng.random((H,W),dtype=np.float32)
          rgba(F(.03)+F(.94)*checker,F(.05)+F(.88)*stripes,F(.02)+F(.95)*noise).tofile(p/'probe_hf.f32')
          '@ | python -
          & "$out\warp_harness.exe" "$out\probe_hf.f32" 24 24 36 36 "$out\lab25.cso" "$out\fullscreen_vs.cso" "$out\probe_hf_25.f32" *> "$out\WARP_HF25.txt"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & "$out\warp_harness.exe" "$out\probe_hf.f32" 24 24 36 36 "$out\lab27.cso" "$out\fullscreen_vs.cso" "$out\probe_hf_27.f32" *> "$out\WARP_HF27.txt"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          @'
          import json,numpy as np
          from pathlib import Path
          p=Path('lab_results/moe_ng_v02_lab27')
          rows=[]
          for n,a0,b0 in [('canonical','lab25_output.f32','lab27_output.f32'),('hf','probe_hf_25.f32','probe_hf_27.f32')]:
              a=np.fromfile(p/a0,np.float32); b=np.fromfile(p/b0,np.float32); d=np.abs(a-b)
              rows.append({'probe':n,'values':int(a.size),'max_abs':float(d.max()),'different_values':int(np.count_nonzero(d)),'bit_exact':bool(np.array_equal(a,b))})
          out={'protocol':'LAB27_WARP_DIRECT_EQUIVALENCE','probes':rows,'pass':all(r['bit_exact'] for r in rows)}
          (p/'DIRECT_EQUIVALENCE.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not out['pass']: raise SystemExit('LAB27 not bit-exact to LAB25')
          '@ | python -

      - name: Emit provenance
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab27'
          Get-FileHash "$out\lab25.cso" -Algorithm SHA256 | Format-List | Out-File "$out\HASHES.txt"
          Get-FileHash "$out\lab27.cso" -Algorithm SHA256 | Format-List | Out-File "$out\HASHES.txt" -Append
          @("protocol=LAB27_SCALAR_PHASE_MOD","commit=$env:GITHUB_SHA","baseline=LAB25_HARDWARE_SELECTED","physical_gpu_executed=false") | Set-Content "$out\PROVENANCE.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab27-scalar-phase-mod
          path: lab_results/moe_ng_v02_lab27
