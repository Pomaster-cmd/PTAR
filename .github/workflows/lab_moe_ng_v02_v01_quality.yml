name: LAB PTAR-NG MoE v02 vs v01 Paired Quality

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  paired-quality:
    if: contains(github.event.head_commit.message, '[run-v01-v02-quality]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Run LAB10 paired spatial quality diagnostic
        run: >-
          python tools/lab_moe_ng_v02_v01_quality.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_v01_quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab10-v01-v02-quality
          path: lab_results/moe_ng_v02_v01_quality
