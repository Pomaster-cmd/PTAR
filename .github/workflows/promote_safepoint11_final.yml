name: promote-safepoint11-final

on:
  push:
    branches:
      - s11-promote-final-20260907

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s11-promote-final-20260907
          fetch-depth: 0
      - name: Reconstruct and verify exact SAFEPOINT11
        run: python3 .ptar_final/finalize.py
