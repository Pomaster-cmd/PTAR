name: LAB D3D9 R13 PLSR MAX1
on:
  push:
    branches:
      - lab/r13-plsr-max1
  workflow_dispatch:
jobs:
  shader-budget:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Fast R13 resolve compile and budget gate
        shell: pwsh
        run: |
          .\lab\tsr1\apply_r10_aliasresidual.ps1
          .\lab\tsr1\apply_r11_plsr1.ps1
          .\lab\tsr1\apply_r12_resaa1.ps1
          .\lab\tsr1\apply_r13_plsr_max1.ps1
          New-Item -ItemType Directory -Force artifact | Out-Null
          $fxc=Get-Command fxc.exe -ErrorAction Stop
          $fxcPath=if($fxc.Path){$fxc.Path}else{$fxc.FullName}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fo artifact\R13_FAST.cso /Fc artifact\R13_FAST_ASM.txt lab\tsr1\ptar_tsr1_resolve_ps.hlsl
          if($LASTEXITCODE){throw 'R13 fast resolve compile failed'}
          $asm=Get-Content artifact\R13_FAST_ASM.txt -Raw
          $tex=([regex]::Matches($asm,'(?im)^\s*texld')).Count
          $slots=[int]([regex]::Match($asm,'(?i)approximately\s+(\d+)\s+instruction slots').Groups[1].Value)
          Write-Host "R13_FAST_RESOLVE=$slots`_SLOTS_$tex`_TEXLD"
          if($tex -gt 18){throw "R13 resolve texture-read budget exceeded: $tex"}
          if($slots -gt 330){throw "R13 resolve slot budget exceeded: $slots"}
          Write-Host 'R13_FAST_SHADER_BUDGET=PASS'
  r13:
    needs: shader-budget
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Qualify R13 maximum practical GTX 960M quality lab
        shell: pwsh
        run: |
          .\lab\tsr1\apply_r10_aliasresidual.ps1
          .\lab\tsr1\apply_r11_plsr1.ps1
          .\lab\tsr1\apply_r12_resaa1.ps1
          .\lab\tsr1\apply_r13_plsr_max1.ps1
          .\lab\tsr1\run_r13_tsr_ci_compat.ps1
          .\lab\tsr1\run_tsr1_gpu_smoke.ps1
          .\lab\tsr1\run_tsr1_perf.ps1

          $src=Get-Content .\lab\tsr1\ptar_tsr1_resolve_ps.hlsl -Raw
          foreach($token in @(
            'PTAR R13 PLSR MAX1',
            'PtCatmull1D',
            'directionalSpatialLuma',
            'coherentStair',
            'detailProtect',
            'targetMicroLuma'))
          {
            if($src -notmatch [regex]::Escape($token)){throw "R13 MAX1 token missing: $token"}
          }

          $quality=Get-Content .\artifact\R8_TSR1_QUALITY_ORACLE.txt -Raw
          $x=[regex]::Match($quality,'TSR1_NATIVE_X_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          $y=[regex]::Match($quality,'TSR1_NATIVE_Y_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          $xy=[regex]::Match($quality,'TSR1_NATIVE_XY_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          if(-not ($x.Success -and $y.Success -and $xy.Success)){throw 'R13 quality oracle parse failed'}
          $ci=[Globalization.CultureInfo]::InvariantCulture
          $xp=[double]::Parse($x.Groups[3].Value,$ci)
          $yp=[double]::Parse($y.Groups[3].Value,$ci)
          $xyp=[double]::Parse($xy.Groups[3].Value,$ci)
          $worst=[Math]::Min($xp,[Math]::Min($yp,$xyp))
          if($worst -lt 60.0){throw "R13 native-reference reconstruction regression too large: $worst%"}

          $asm=Get-Content .\artifact\TSR1_RESOLVE_ASM.txt -Raw
          $tex=([regex]::Matches($asm,'(?im)^\s*texld')).Count
          $slots=[int]([regex]::Match($asm,'(?i)approximately\s+(\d+)\s+instruction slots').Groups[1].Value)
          if($tex -gt 18){throw "R13 resolve texture-read budget exceeded: $tex"}
          if($slots -gt 330){throw "R13 resolve slot budget exceeded: $slots"}

          $perf=Get-Content .\artifact\R8_TSR1_GPU_PERF.txt -Raw
          $ratioMatch=[regex]::Match($perf,'TSR1_PERF_R8_TOTAL_TO_R7_RATIO=([0-9.]+)')
          if(-not $ratioMatch.Success){throw 'R13 total GPU ratio missing'}
          $ratio=[double]::Parse($ratioMatch.Groups[1].Value,$ci)
          if($ratio -gt 3.20){throw "R13 lab total GPU envelope exceeded: $ratio x R7"}

          Copy-Item .\artifact\PTAR_R8_VALIDATION.txt .\artifact\PTAR_R13_VALIDATION.txt -Force
          @(
            'PTAR_D3D9_BRANCH=R13_PLSR_MAX1_OVER_R12_RESAA1',
            ('SOURCE_COMMIT='+$env:GITHUB_SHA),
            'R13_CLASS=MAXIMUM_PRACTICAL_GTX960M_LAB',
            'R13_PRIMARY_OBJECTIVE=PERCEIVED_1080P_FINE_DETAIL_SHARPNESS_EDGE_REGULARITY',
            'R13_WIDE_CURRENT_SUPPORT=4_TAP_DIRECTIONAL_CATMULL',
            'R13_COHERENT_EDGE_CLASSIFICATION=YES',
            'R13_FINE_DETAIL_R7_SUPPORT_GATE=YES',
            'R13_ZERO_MOTION_FALLBACK=EXACT_R7',
            'R13_EXTRA_HISTORY_SURFACES=0',
            'R13_EXTRA_PASSES=0',
            ('R13_RESOLVE_TEXLD='+$tex),
            ('R13_RESOLVE_SLOTS='+$slots),
            ('R13_NATIVE_X_IMPROVEMENT_PCT='+$xp.ToString('F3',$ci)),
            ('R13_NATIVE_Y_IMPROVEMENT_PCT='+$yp.ToString('F3',$ci)),
            ('R13_NATIVE_XY_IMPROVEMENT_PCT='+$xyp.ToString('F3',$ci)),
            ('R13_NATIVE_WORST_IMPROVEMENT_PCT='+$worst.ToString('F3',$ci)),
            ('R13_GPU_TOTAL_TO_R7_RATIO='+$ratio.ToString('F4',$ci)),
            'R13_FG_SCOPE=UNCHANGED_R12_FG_OFF_ONLY') | Add-Content .\artifact\PTAR_R13_VALIDATION.txt -Encoding ascii
          Write-Host "R13_RESOLVE=$slots`_SLOTS_$tex`_TEXLD"
          Write-Host "R13_NATIVE_WORST_IMPROVEMENT_PCT=$($worst.ToString('F3',$ci))"
          Write-Host "R13_GPU_TOTAL_TO_R7_RATIO=$($ratio.ToString('F4',$ci))"
          Write-Host 'R13_PLSR_MAX1=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: R13-PLSR-MAX1
          path: artifact/
          if-no-files-found: error
