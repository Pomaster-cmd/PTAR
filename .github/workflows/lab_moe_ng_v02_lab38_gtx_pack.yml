name: LAB38 GTX960M Six-Way Compare Pack

on:
  push:
    branches:
      - lab/moe-ng-v02-lab38-post-lab37b-sweep

permissions:
  contents: read

jobs:
  build-audit-pack:
    if: contains(github.event.head_commit.message, '[run-lab38-gtx-pack]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile and freeze LAB37B plus LAB38 DXBC
        shell: pwsh
        run: |
          $root='lab_results\lab38_gtx_pack'; $pack="$root\PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK"; $sh="$pack\shaders"
          New-Item -ItemType Directory -Force $sh | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          $src=@{
            'lab37b'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab37b_diag_axis_round_coeff_ps.hlsl'
            'lab38a'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38a_phase_round_early_ps.hlsl'
            'lab38b'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38b_coeff_early_ps.hlsl'
            'lab38c'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38c_f2_recurrence_ps.hlsl'
            'lab38d'='src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab38d_coeff_early_f2_recurrence_ps.hlsl'
          }
          foreach($n in $src.Keys){
            & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\$n.cso" /Fc "$root\$n.asm" $src[$n]
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab_fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_k185_control_ps.cso "$sh\ptar_k185_control_ps.cso"
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_vs.cso "$sh\ptar_vs.cso"
          $expected=@{
            'lab37b.cso'='cd92ead859b9e7e210b96b1b811c95f91b1eba3c18c64a7cfa83e0a004c5a0b5'
            'lab38a.cso'='e50ff93fca833141fd02f266819c8d1c3700ecc92bee00239bfad5b500166570'
            'lab38b.cso'='b05c573ebeb24754ee88abb6a319b5ed0f62667d4cb021cf285665c061497abc'
            'lab38c.cso'='4147b5964118e4341fd560bce61f8fe01a1bec68943e08848a412913f02aeaa0'
            'lab38d.cso'='12d25c573d00b23717c04c7104d63ca5365c47a3b917d40b67a747c03630cb5b'
            'ptar_k185_control_ps.cso'='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'
            'ptar_vs.cso'='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
            'lab_fullscreen_vs.cso'='f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          }
          $lines=@()
          foreach($n in $expected.Keys){
            $p="$sh\$n"; if(-not(Test-Path $p)){throw "missing $n"}
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant(); if($got -ne $expected[$n]){throw "$n hash mismatch $got"}
            $bytes=[IO.File]::ReadAllBytes($p); if($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes,0,4) -ne 'DXBC'){throw "$n not DXBC"}
            $lines += "$got  shaders/$n"
          }
          $lines | Sort-Object | Set-Content "$pack\HASHES.txt" -Encoding ascii

      - name: Audit Williams six-way order design
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          text=Path('hardware_validation/lab38/Lab38Variants.h').read_text(encoding='utf-8')
          rows=[]
          for m in re.finditer(r'\{([0-5](?:\s*,\s*[0-5]){5})\}',text):
              row=[int(x) for x in m.group(1).split(',')]
              if sorted(row)==list(range(6)): rows.append(row)
          rows=rows[-6:]
          pos=Counter(); adj=Counter()
          for row in rows:
              for p,v in enumerate(row): pos[v,p]+=1
              for a,b in zip(row,row[1:]): adj[a,b]+=1
          ok=len(rows)==6 and all(pos[v,p]==1 for v in range(6) for p in range(6)) and all(adj[a,b]==1 for a in range(6) for b in range(6) if a!=b)
          r={'protocol':'LAB38_WILLIAMS_ORDER_AUDIT','rows':rows,'every_variant_every_position_once':all(pos[v,p]==1 for v in range(6) for p in range(6)),'every_ordered_adjacent_pair_once':all(adj[a,b]==1 for a in range(6) for b in range(6) if a!=b),'pass':ok}
          root=Path('lab_results/lab38_gtx_pack'); (root/'ORDER_DESIGN_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not ok: raise SystemExit('order design audit failed')
          '@ | python -

      - name: Audit frozen codegen contract
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab38_gtx_pack'); pack=root/'PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK'; pat=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b')
          expected={'lab37b':(52,2532),'lab38a':(52,2532),'lab38b':(52,2532),'lab38c':(52,2512),'lab38d':(52,2512)}; rows={}
          for n,(ei,eb) in expected.items():
              ops=[]
              for raw in (root/f'{n}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'): continue
                  m=pat.match(raw)
                  if not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}: continue
                  ops.append(op)
              c=Counter(ops); b=(pack/'shaders'/f'{n}.cso').stat().st_size
              rows[n]={'instructions':len(ops),'bytes':b,'gather4':sum(v for k,v in c.items() if k.startswith('gather4')),'sample_l':sum(v for k,v in c.items() if k.startswith('sample_l')),'div':c.get('div',0),'udiv':c.get('udiv',0),'uav':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_')),'expected':len(ops)==ei and b==eb}
          ok=all(v['expected'] and v['gather4']==1 and v['sample_l']==4 and v['div']==0 and v['udiv']==0 and v['uav']==0 for v in rows.values())
          r={'protocol':'LAB38_GTX_PACK_STATIC_DXBC_AUDIT','rows':rows,'pass':ok}; (root/'STATIC_DXBC_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not ok: raise SystemExit('DXBC audit failed')
          '@ | python -

      - name: Build Win81 x64 MT six-way host
        shell: pwsh
        run: |
          $root='lab_results\lab38_gtx_pack'; $pack="$root\PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){throw 'vcvars64.bat not found'}
          $inc='runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\include'; $src='hardware_validation\lab38'
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /MT /W4 /WX /std:c++17 /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I `"$inc`" /I `"$src`" `"$src\main.cpp`" `"$src\Lab38Bench.cpp`" `"$src\Lab38Report.cpp`" /Fe:`"$pack\ptar_lab38_gtx960m_sixway_compare.exe`" /Fo:`"$root\\`" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib"
          cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Audit PE imports architecture and subsystem
        shell: pwsh
        run: |
          $root='lab_results\lab38_gtx_pack'; $pack="$root\PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          $cmd="call `"$vcvars`" && dumpbin /dependents `"$pack\ptar_lab38_gtx960m_sixway_compare.exe`" > `"$pack\IMPORTS.txt`" && dumpbin /headers `"$pack\ptar_lab38_gtx960m_sixway_compare.exe`" > `"$root\HEADERS.txt`""; cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $imports=Get-Content "$pack\IMPORTS.txt" -Raw; foreach($bad in @('D3DCOMPILER','VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($imports -match [regex]::Escape($bad)){throw "forbidden import $bad"}}
          $headers=Get-Content "$root\HEADERS.txt" -Raw; if($headers -notmatch '6\.03\s+subsystem version'){throw 'subsystem is not 6.03'}; if($headers -notmatch '8664\s+machine \(x64\)'){throw 'machine is not x64'}

      - name: WARP smoke all six variants
        shell: pwsh
        run: |
          $pack=(Resolve-Path 'lab_results\lab38_gtx_pack\PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK').Path; Push-Location $pack
          try { & .\ptar_lab38_gtx960m_sixway_compare.exe --warp-smoke | Tee-Object -FilePath WARP_SMOKE.txt; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} } finally { Pop-Location }
          $smoke=Get-Content "$pack\WARP_SMOKE.txt" -Raw; if($smoke -notmatch '\[PASS\] WARP smoke'){throw 'WARP PASS marker missing'}; foreach($n in @('LAB37B','LAB38A','LAB38B','LAB38C','LAB38D','K185')){if($smoke -notmatch $n){throw "WARP marker missing $n"}}

      - name: Finalize audited hardware pack
        shell: pwsh
        run: |
          $root='lab_results\lab38_gtx_pack'; $pack="$root\PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK"
          $exeHash=(Get-FileHash "$pack\ptar_lab38_gtx960m_sixway_compare.exe" -Algorithm SHA256).Hash.ToLowerInvariant(); Add-Content "$pack\HASHES.txt" "$exeHash  ptar_lab38_gtx960m_sixway_compare.exe" -Encoding ascii
          Copy-Item "$root\ORDER_DESIGN_AUDIT.json" "$pack\ORDER_DESIGN_AUDIT.json"
          Copy-Item "$root\STATIC_DXBC_AUDIT.json" "$pack\STATIC_DXBC_AUDIT.json"
          Copy-Item "$root\HEADERS.txt" "$pack\PE_HEADERS.txt"
          Copy-Item hardware_validation\lab38\*.cpp "$pack\"
          Copy-Item hardware_validation\lab38\*.h "$pack\"
          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "ptar_lab38_gtx960m_sixway_compare.exe" (echo [FAIL] Executable absent.& exit /b 10)
          echo [PTAR] LAB38 six-way compare - GTX 960M - 600 groupes Williams equilibres
          ptar_lab38_gtx960m_sixway_compare.exe
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" echo [FAIL] Code retour %RC%
          if "%RC%"=="0" echo [PASS] Resultats dans le dossier results
          pause
          exit /b %RC%
          '@ | Set-Content "$pack\RUN_LAB38_GTX960M_SIXWAY_COMPARE.bat" -Encoding ascii
          @'
          PTAR LAB38 - GTX960M SIX-WAY TARGETED HARDWARE COMPARE

          Frozen hardware baseline: LAB37B. Candidates LAB38A/B/C/D are all fully software-admitted bit-exact against LAB37B. K185 is the P-state/control path.

          This single run measures all six variants using a 6-sequence Williams balanced Latin-square order. Across every six measured groups, each variant occupies every timing position exactly once and every ordered adjacent pair occurs exactly once. The run uses 60 warmup groups and 600 measured groups.

          Run only RUN_LAB38_GTX960M_SIXWAY_COMPARE.bat on Windows 8.1 + GTX 960M. Return only the generated results folder as ZIP.

          Promotion rule: a LAB38 candidate can replace LAB37B only if paired real-GPU gain is reproducible across order positions/sequences and K185-defined stable P-state regimes. Software correctness is already frozen; neutral or negative hardware behavior keeps LAB37B.
          '@ | Set-Content "$pack\README_FIRST.txt" -Encoding utf8
          @(
            'protocol=LAB38_GTX960M_SIXWAY_WILLIAMS_COMPARE',
            "branch=$env:GITHUB_REF_NAME", "commit=$env:GITHUB_SHA",
            'target=Windows 8.1 x64 / D3D11 FL11_0', 'host_crt=/MT', 'subsystem=6.03',
            'warmup_groups=60', 'measured_groups=600', 'variants=LAB37B,LAB38A,LAB38B,LAB38C,LAB38D,K185',
            'order_design=Williams balanced Latin square; six sequences; 100 repetitions each',
            'baseline=LAB37B cd92ead859b9e7e210b96b1b811c95f91b1eba3c18c64a7cfa83e0a004c5a0b5'
          ) | Set-Content "$pack\BUILD_INFO.txt" -Encoding ascii
          Compress-Archive -Path "$pack\*" -DestinationPath "$root\PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK.zip" -CompressionLevel Optimal

      - name: Final ZIP integrity audit
        shell: pwsh
        run: |
          @'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('lab_results/lab38_gtx_pack'); zpath=root/'PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK.zip'
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip(); names=z.namelist()
              required=['RUN_LAB38_GTX960M_SIXWAY_COMPARE.bat','README_FIRST.txt','BUILD_INFO.txt','HASHES.txt','ORDER_DESIGN_AUDIT.json','STATIC_DXBC_AUDIT.json','ptar_lab38_gtx960m_sixway_compare.exe']+[f'shaders/{n}.cso' for n in ['lab37b','lab38a','lab38b','lab38c','lab38d','ptar_k185_control_ps','ptar_vs','lab_fullscreen_vs']]
              missing=[n for n in required if n not in names]
              info=json.loads(z.read('ORDER_DESIGN_AUDIT.json')); static=json.loads(z.read('STATIC_DXBC_AUDIT.json'))
          r={'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'zip_crc_pass':bad is None,'missing':missing,'order_design_pass':info['pass'],'static_dxbc_pass':static['pass'],'pass':bad is None and not missing and info['pass'] and static['pass']}
          (root/'FINAL_ZIP_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8'); print(json.dumps(r,indent=2))
          if not r['pass']: raise SystemExit('final ZIP audit failed')
          '@ | python -

      - uses: actions/upload-artifact@v4
        with:
          name: ptar-lab38-gtx960m-sixway-compare-pack
          path: |
            lab_results/lab38_gtx_pack/PTAR_LAB38_GTX960M_SIXWAY_COMPARE_PACK.zip
            lab_results/lab38_gtx_pack/FINAL_ZIP_AUDIT.json
