name: LAB D3D9 HF6 TEMPORALPAIR60 20261011

on:
  push:
    branches: [lab/d3d9-hf6-temporalpair60-20261011]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-lab:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Deterministic temporal mailbox/grid model
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .\lab\hf6_temporalpair60\validate_temporal_model.py | Tee-Object temporal_model.txt
          if($LASTEXITCODE){throw 'deterministic temporal model failed'}
          $r=Get-Content temporal_model.txt -Raw
          foreach($m in @(
            'CONST_33.0MS:',
            'JITTER_MEAN30.75MS:',
            'UNDERPRODUCED_34.715MS:',
            'STARVATION_120MS_RECOVERY:',
            'TEMPORAL_MODEL_STRICT_G_R=PASS',
            'TEMPORAL_MODEL_NO_MICROBURST=PASS',
            'TEMPORAL_MODEL_SUSTAINED_30PAIR_TO_60FPS=PASS',
            'TEMPORAL_MODEL_STARVATION_NO_CATCHUP=PASS')){
            if($r -notmatch [regex]::Escape($m)){throw "missing model gate $m"}
          }

      - name: Apply exact HF6 lineage plus FASTBLIT2 and temporal-only presenter patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\lab\pairbal2_fieldhotfix3\apply_existing_diag_ring.ps1
          python .\lab\hf6_visible60_fastblit2\apply_hf6_visible60_fastblit2.py | Tee-Object fastblit_apply.txt
          if($LASTEXITCODE){throw 'FASTBLIT2 apply failed'}
          python .\lab\hf6_temporalpair60\apply_temporalpair60.py | Tee-Object temporal_apply.txt
          if($LASTEXITCODE){throw 'TEMPORALPAIR60 apply failed'}
          $r=Get-Content temporal_apply.txt -Raw
          foreach($m in @(
            'HF6_TEMPORALPAIR60_PATCH=PASS',
            'FG_ALGORITHM=UNCHANGED_HF6',
            'TEMPORAL_SCOPE=PRESENTATION_ONLY',
            'DEVICE=EXISTING_GAME_D3D9_DEVICE',
            'DEVICE_THREADING=D3DCREATE_MULTITHREADED',
            'MAILBOX=3_PAIR_OFFSCREEN_RING',
            'DISPLAY_WORKER=SAME_DEVICE',
            'DISPLAY_GRID=60HZ_QPC_NO_CATCHUP',
            'DISPLAY_ORDER=GENERATED_THEN_REAL',
            'INITIAL_PREBUFFER=1_GRID_SLOT')){
            if($r -notmatch [regex]::Escape($m)){throw "missing patch gate $m"}
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x86}

      - name: Live Windows QPC temporal-grid stress x3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifact | Out-Null
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 lab\hf6_temporalpair60\temporal_grid_live_harness.cpp /link /OUT:temporal_grid_live.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE){throw 'temporal live harness compile failed'}
          $all=''
          1..3 | ForEach-Object {
            & .\temporal_grid_live.exe 2>&1 | Tee-Object -Variable one
            if($LASTEXITCODE){throw "temporal live harness pass $_ failed"}
            $all += (($one | Out-String) + "`r`n")
          }
          $all | Set-Content artifact\TEMPORAL_GRID_LIVE_X3.txt -Encoding ascii
          if(([regex]::Matches($all,'TEMPORAL_GRID_LIVE_NO_MICROBURST=PASS')).Count -ne 3){throw 'no-microburst x3 gate failed'}
          if(([regex]::Matches($all,'TEMPORAL_GRID_LIVE_60HZ_SHORT_PRESENT=PASS')).Count -ne 3){throw '60Hz live x3 gate failed'}

      - name: Compile unchanged HF6 FG shaders and patched Win81 x86 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build_x86,smoke_game | Out-Null
          $fxc=Get-Command fxc.exe -ErrorAction SilentlyContinue
          if(-not $fxc){foreach($root in @("$env:ProgramFiles(x86)\Windows Kits\10\bin","$env:ProgramFiles(x86)\Windows Kits\8.1\bin")){if(Test-Path $root){$fxc=Get-ChildItem $root -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue|Sort-Object FullName -Descending|Select-Object -First 1;if($fxc){break}}}}
          if(-not $fxc){throw 'fxc.exe not found'}
          $f=if($fxc.Path){$fxc.Path}else{$fxc.FullName}
          $jobs=@(
            @('ps_3_0','ptar_moe_d3d9_ps.hlsl','ptar_ps_bytecode.h','g_ptarPs'),
            @('ps_3_0','ptar_moe_universal_d3d9_ps.hlsl','ptar_universal_ps_bytecode.h','g_ptarUniversalPs'),
            @('ps_2_0','ptar_bilinear_ref_ps.hlsl','ptar_bilinear_ps_bytecode.h','g_ptarBilinearPs'),
            @('ps_3_0','ptar_gw16i_hud_ps.hlsl','ptar_gw16i_hud_ps_bytecode.h','g_ptarGw16iHudPs'),
            @('ps_3_0','ptar_gw16i_feedback_ps.hlsl','ptar_gw16i_feedback_ps_bytecode.h','g_ptarGw16iFeedbackPs'),
            @('ps_3_0','ptar_fg_me_coarse_ps.hlsl','ptar_fg_me_coarse_ps_bytecode.h','g_ptarFgMeCoarsePs'),
            @('ps_3_0','ptar_fg_me_refine_ps.hlsl','ptar_fg_me_refine_ps_bytecode.h','g_ptarFgMeRefinePs'),
            @('ps_3_0','ptar_fg_interpolate_ps.hlsl','ptar_fg_interpolate_ps_bytecode.h','g_ptarFgInterpolatePs'))
          foreach($j in $jobs){& $f /nologo /T $j[0] /E main /O3 /Fh ("build_x86\"+$j[2]) /Vn $j[3] ("compat\x86_d3d9\"+$j[1]);if($LASTEXITCODE){throw "FXC failed $($j[1])"}}
          'D3D9_HF6_FG_SHADER_SET_UNCHANGED_BUILD=PASS'|Set-Content artifact\D3D9_SHADER_BUILD.txt -Encoding ascii
          & cl.exe /nologo /LD /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\ptar_d3d9_proxy.cpp /link user32.lib /DEF:compat\x86_d3d9\d3d9_proxy.def /OUT:artifact\d3d9.dll /SUBSYSTEM:WINDOWS,6.03
          if($LASTEXITCODE){throw 'runtime compile failed'}
          dumpbin /headers artifact\d3d9.dll|Out-File artifact\HEADERS.txt -Encoding ascii
          dumpbin /exports artifact\d3d9.dll|Out-File artifact\EXPORTS.txt -Encoding ascii
          dumpbin /dependents artifact\d3d9.dll|Out-File artifact\DEPENDENTS.txt -Encoding ascii
          $hd=Get-Content artifact\HEADERS.txt -Raw;$ex=Get-Content artifact\EXPORTS.txt -Raw;$dp=Get-Content artifact\DEPENDENTS.txt -Raw
          if($hd -notmatch '14C machine \(x86\)' -or $hd -notmatch '6\.03 subsystem version'){throw 'Win8.1 x86 PE contract failed'}
          foreach($n in @('Direct3DCreate9','Direct3DCreate9Ex','PTAR_D3D9_DIAG_STATE')){if($ex -notmatch [regex]::Escape($n)){throw "missing export $n"}}
          foreach($bad in @('VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($dp -match $bad){throw "forbidden dependency $bad"}}
          $sha=(Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant();$sha|Set-Content artifact\D3D9_SHA256.txt -Encoding ascii;Write-Host "D3D9_DLL_SHA256=$sha"

      - name: Prove temporal-only scope and exact HF6 generation identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "from pathlib import Path;import subprocess; b='9a47a93e1c3cb87975903eb21298408e26c2957a'; p=Path('compat/x86_d3d9/ptar_d3d9_proxy.cpp').read_text(); q=subprocess.check_output(['git','show',b+':compat/x86_d3d9/ptar_d3d9_proxy.cpp'],text=True); f=lambda s,a,z:s[s.index(a):s.index(z,s.index(a))]; assert f(p,'static HRESULT RenderFGMotionAndIntermediate','static HRESULT PtRefreshQueuedRealBackBuffer')==f(q,'static HRESULT RenderFGMotionAndIntermediate','static HRESULT RenderTextureToBackBuffer'); print('HF6_FG_ME_REFINE_INTERPOLATE_IDENTICAL=PASS')" | Tee-Object artifact\HF6_FG_IDENTITY.txt
          if($LASTEXITCODE){throw 'HF6 generation identity failed'}
          git diff --exit-code 9a47a93e1c3cb87975903eb21298408e26c2957a -- compat/x86_d3d9/ptar_fg_me_coarse_ps.hlsl compat/x86_d3d9/ptar_fg_me_refine_ps.hlsl compat/x86_d3d9/ptar_fg_interpolate_ps.hlsl
          if($LASTEXITCODE){throw 'HF6 FG HLSL changed'}
          python -c "from pathlib import Path;import subprocess; a=Path('compat/x86_d3d9/ptar_fg_pacer.h').read_bytes(); b=subprocess.check_output(['git','show','b36e2be32678dcfb56b50cc4cc55d251d5c5f8b2:compat/x86_d3d9/ptar_fg_pacer.h']); assert a==b; print('EXACT_HF4_SYNC1_PACER_REUSED=PASS')" | Tee-Object artifact\HF4_PACER_IDENTITY.txt
          if($LASTEXITCODE){throw 'HF4 pacer identity failed'}
          $p=Get-Content compat\x86_d3d9\ptar_d3d9_proxy.cpp -Raw
          foreach($m in @('D3DCREATE_MULTITHREADED','PTAR_TEMPORAL_SLOT_COUNT 3','PtTemporalPresenterThread','PtTemporalPublishPair(self,hwnd)','TEMPORAL_WORKER_START','PtTemporalGridWaitUntilDeadline','PtTemporalGridRecordSubmission')){if($p -notmatch [regex]::Escape($m)){throw "temporal runtime marker missing $m"}}
          foreach($bad in @('IDirect3DDevice9Ex* g_ptarD3D9IsoDisplayDevice','PtD3D9IsolatedPresenterStart(','CreateAdditionalSwapChain')){if($p -match [regex]::Escape($bad)){throw "forbidden HF7+ presenter architecture leaked in: $bad"}}
          @(
            'FG_ALGORITHM=EXACT_HF6',
            'FG_SHADER_SOURCE=EXACT_HF6',
            'TEMPORAL_CHANGE=PRESENTATION_ONLY',
            'DEVICE=SAME_GAME_D3D9_DEVICE',
            'DEVICE_THREADING=D3DCREATE_MULTITHREADED',
            'MAILBOX=3_PAIR_OFFSCREEN_RING',
            'DISPLAY_GRID=60HZ_QPC_NO_CATCHUP',
            'DISPLAY_ORDER=GENERATED_THEN_REAL',
            'INITIAL_PREBUFFER=1_SLOT',
            'SOURCE_THREAD_GRID_WAIT=NONE',
            'SECOND_DEVICE=NONE',
            'D3D9EX_PRESENTER=NONE',
            'ADDITIONAL_SWAPCHAIN=NONE'
          )|Set-Content artifact\TEMPORAL_SCOPE_CONTRACT.txt -Encoding ascii

      - name: Compile and selftest existing F5/F1 verifiers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe";$shared='lab\ctrl_ui_real_visibility\PTARD3D9PresentTelemetryReader.cs'
          & $csc /nologo /target:exe /optimize+ /platform:x86 /out:artifact\ptar_vblank3_d3d9_autostart.exe $shared lab\ctrl_ui_real_visibility\PTARVisiblePacingVerifier_D3D9RuntimeRing.cs;if($LASTEXITCODE){throw 'F5 compile failed'}
          & $csc /nologo /target:exe /optimize+ /platform:x86 /out:artifact\ptar_presentshed1_visible.exe $shared lab\ctrl_ui_real_visibility\PTARVisiblePacingVerifierPresentShed1_D3D9RuntimeRing.cs;if($LASTEXITCODE){throw 'F1 compile failed'}
          & artifact\ptar_vblank3_d3d9_autostart.exe --selftest|Tee-Object artifact\F5_VERIFIER_SELFTEST.txt;if($LASTEXITCODE){throw 'F5 selftest failed'}
          & artifact\ptar_presentshed1_visible.exe --selftest|Tee-Object artifact\F1_VERIFIER_SELFTEST.txt;if($LASTEXITCODE){throw 'F1 selftest failed'}

      - name: Validate diagnostic ring ABI end to end
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 lab\ctrl_ui_real_visibility\d3d9_diag_ring_harness.cpp /link /OUT:smoke_game\game.exe /SUBSYSTEM:CONSOLE,6.03;if($LASTEXITCODE){throw 'ring harness compile failed'}
          Copy-Item artifact\d3d9.dll smoke_game\d3d9.dll -Force
          $root=(Resolve-Path smoke_game).Path;$game=(Resolve-Path smoke_game\game.exe).Path;$dll=(Resolve-Path smoke_game\d3d9.dll).Path;$env:PTAR_GAME_ROOT=$root;$env:PTAR_TARGET_EXE=$game
          $proc=Start-Process $game -ArgumentList ('"'+$dll+'" mixed 20000') -PassThru -RedirectStandardOutput artifact\HARNESS.txt;Start-Sleep -Milliseconds 300
          & artifact\ptar_vblank3_d3d9_autostart.exe 5 --autostart 2>&1|Tee-Object artifact\F5_RUNTIME_RING_SMOKE.txt;if($LASTEXITCODE){throw 'F5 ring failed'}
          $env:PTAR_FG_PRESENTSHED1_OUTPUT_PREFIX=Join-Path $root 'F1_SMOKE'; & artifact\ptar_presentshed1_visible.exe 5 --autostart 2>&1|Tee-Object artifact\F1_RUNTIME_RING_SMOKE.txt;if($LASTEXITCODE){throw 'F1 ring failed'}
          if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force}
          'CTRL_F5_RUNTIME_RING_ABI=PASS'|Set-Content artifact\CTRL_F5_RUNTIME_RING.txt -Encoding ascii
          'CTRL_F1_RUNTIME_RING_ABI=PASS'|Set-Content artifact\CTRL_F1_RUNTIME_RING.txt -Encoding ascii

      - name: Package only after every temporal gate passed
        shell: pwsh
        run: |
          Copy-Item temporal_model.txt artifact\TEMPORAL_MODEL.txt -Force
          Copy-Item temporal_apply.txt artifact\TEMPORAL_APPLY.txt -Force
          Copy-Item compat\x86_d3d9\ptar_temporal_grid.h artifact\ptar_temporal_grid.h -Force
          Copy-Item compat\x86_d3d9\ptar_d3d9_proxy.cpp artifact\ptar_d3d9_proxy_patched.cpp -Force
          @(
            'PTAR_D3D9_BRANCH=HF6_TEMPORALPAIR60',
            ('SOURCE_COMMIT='+$env:GITHUB_SHA),
            ('D3D9_SHA256='+(Get-Content artifact\D3D9_SHA256.txt -Raw).Trim()),
            'BASE=HF6_FUNCTIONAL_FG_PLUS_FASTBLIT2',
            'FIELD_DEFECT=G_DWELL_0.5MS_R_DWELL_31MS',
            'FG_ALGORITHM=EXACT_HF6',
            'TEMPORAL_SCOPE=PRESENTATION_ONLY',
            'PAIRING_TARGET=G16.667MS_R16.667MS',
            'LAB_DETERMINISTIC_MODEL=PASS',
            'LAB_LIVE_QPC_GRID_X3=PASS',
            'LAB_NO_MICROBURST=PASS',
            'LAB_SUSTAINED_30PAIR_TO_60FPS=PASS',
            'LAB_STARVATION_NO_CATCHUP=PASS',
            'CTRL_F5_F1=PRESERVED',
            'PHYSICAL_D3D9_SCANOUT=TARGET_HARDWARE_VALIDATION_PENDING'
          )|Set-Content artifact\PTAR_D3D9_HF6_TEMPORALPAIR60_VERSION.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-D3D9-HF6-TEMPORALPAIR60-LAB-VALIDATED
          path: artifact/
          if-no-files-found: error
