name: LAB PTAR-NG MoE v02 Local Harm Audit

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  local-harm-audit:
    if: contains(github.event.head_commit.message, '[run-local-harm-audit]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact audit dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scikit-image==0.26.0
      - name: Run LAB17 local harm feature audit
        run: >-
          python tools/lab_moe_ng_v02_local_harm_audit.py
          --frozen lab_protocols/LAB15_FROZEN_CANDIDATE.json
          --out lab_results/moe_ng_v02_local_harm_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab17-local-harm-audit
          path: lab_results/moe_ng_v02_local_harm_audit
