name: RC58 Initial Borderless Regression

on:
  push:
    branches: [lab/rc58-virtual-presenter-mode-20260915]
    paths:
      - 'lab/borderless/rc58/build_initial_borderless_host.py'
      - '.github/workflows/rc58-initial-borderless-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initial-borderless:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact P1U46 and RC55
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $o='lab/borderless/rc58/initial_borderless'
          New-Item -ItemType Directory -Force $o|Out-Null
          python lab/borderless/rc48/rebuild_exact_field_runtime.py payload/d3d11.dll "$o/d3d11.dll"
          if($LASTEXITCODE-ne0){throw 'runtime'}
          $h=(Get-FileHash "$o/d3d11.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'6f1686992bef971c9995df9f0cb91b93c6946988e12a837e5de956df37c9082b'){throw "runtime drift $h"}
          Copy-Item "$o/d3d11.dll" "$o/win81_nis_dx11_x64.dll"
          $ini=Get-Content payload/win81_nis.ini -Raw
          $ini=[regex]::Replace($ini,'(?m)^OutputWidth=.*$','OutputWidth=1920')
          $ini=[regex]::Replace($ini,'(?m)^OutputHeight=.*$','OutputHeight=1080')
          $ini=[regex]::Replace($ini,'(?m)^RenderWidth=.*$','RenderWidth=1280')
          $ini=[regex]::Replace($ini,'(?m)^RenderHeight=.*$','RenderHeight=720')
          Set-Content "$o/win81_nis.ini" $ini -Encoding ASCII
          python lab/raster/rc52/build_rc52_context_hooks.py lab/raster/rc58_initial_borderless_rc52.cpp
          if($LASTEXITCODE-ne0){throw 'rc52'}
          python lab/raster/rc55/build_rc55_context_hooks.py lab/raster/rc58_initial_borderless_rc52.cpp lab/raster/rc58_initial_borderless_rc55.cpp
          if($LASTEXITCODE-ne0){throw 'rc55'}

      - name: Generate initial-borderless host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python lab/borderless/rc58/build_initial_borderless_host.py
          if($LASTEXITCODE-ne0){throw 'host generation'}

      - name: Build exact carrier RC55 and initial-borderless host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 20
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          cl %CFLAGS% /LD lab\borderless\rc58\ptar_borderless_rc58_mode_bridge.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fo:lab\borderless\rc58\initial_borderless\ /Fe:lab\borderless\rc58\initial_borderless\ptar_borderless.dll user32.lib advapi32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 21
          set RCFLAGS=%CFLAGS% /I lab\raster\rc41
          cl %RCFLAGS% /LD lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc58_initial_borderless_rc55.cpp lab\raster\rc41\ptar_rc41_resource_bridge.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_swapchain_hooks.cpp lab\raster\rc41\ptar_rc41_prod.cpp /Fo:lab\borderless\rc58\initial_borderless\ /Fe:lab\borderless\rc58\initial_borderless\ptar_rc41.dll user32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 22
          cl %CFLAGS% lab\borderless\rc58\ptar_rc58_initial_borderless_host.cpp /Fo:lab\borderless\rc58\initial_borderless\ /Fe:lab\borderless\rc58\initial_borderless\Warhammer.exe user32.lib advapi32.lib gdi32.lib d3d11.lib dxgi.lib /link /SUBSYSTEM:WINDOWS,6.03 || exit /b 23

      - name: Exact binary identity gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $o='lab/borderless/rc58/initial_borderless'
          $c=(Get-FileHash "$o/ptar_borderless.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $r=(Get-FileHash "$o/ptar_rc41.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($c-ne'c04cbb21f87dd9a851f74b8334cbc6ba4c67274b4dc49f521b2f8523822cd633'){throw "carrier drift $c"}
          if($r-ne'271187ab9fd82b6829c52a667223f241ec79e98fa340b13c9a72270142156949'){throw "raster drift $r"}
          Write-Host 'RC58_INITIAL_BORDERLESS_EXACT_BINARIES=PASS'

      - name: Initial saved Borderless plus 500 transition cycles
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $o=(Resolve-Path 'lab/borderless/rc58/initial_borderless').Path
          $p=Start-Process "$o/Warhammer.exe" -WorkingDirectory $o -PassThru
          if(-not$p.WaitForExit(300000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'RC58 initial-borderless watchdog >300s'}
          $ev=Join-Path $o 'RC58_INITIAL_BORDERLESS_STRESS.txt'
          if(-not(Test-Path $ev)){throw 'evidence absent'}
          $e=[IO.File]::ReadAllText($ev,[Text.Encoding]::Unicode)
          Write-Host $e
          foreach($n in @('win81_nis.log','ptar_borderless_rc58.log','ptar_rc41_bootstrap.log','ptar_rc41.log')){$q=Join-Path $o $n;if(Test-Path $q){Write-Host "===== $n =====";Get-Content $q -Tail 160}}
          if($p.ExitCode-ne0){throw "host rc=$($p.ExitCode)"}
          if(-not$e.Contains('START_BORDERLESS=PASS presents=240 presenter=1920x1080')){throw 'initial borderless 240-Present marker absent'}
          if(-not$e.Contains('BORDERLESS_TO_WINDOWED=PASS game=1280x720')){throw 'borderless to windowed marker absent'}
          if(-not$e.Contains('INITIAL_BORDERLESS_ROUNDTRIP=PASS')){throw 'initial-borderless roundtrip marker absent'}
          if(-not$e.Contains('RC58_MODE_BRIDGE_STRESS=PASS cycles=500')){throw '500-cycle marker absent'}
          $rt=Get-Content (Join-Path $o 'win81_nis.log') -Raw
          if($rt.Contains('ERROR: P1U46 USR PRESENTER activation failed')){throw 'USR activation failure'}
          if(-not$rt.Contains('PTAR-NG MoE v01 exact x1.5 active')){throw 'x1.5 absent'}
          $hb=([regex]::Matches($rt,'CAPTRACE HEARTBEAT #')).Count
          if($hb-lt3){throw "insufficient runtime heartbeats $hb"}
          $boot=Get-Content (Join-Path $o 'ptar_rc41_bootstrap.log') -Raw
          if(-not$boot.Contains('RC41B_ACTIVATION_PROVEN')){throw 'RC55 bootstrap absent'}
          Write-Host "RC58_INITIAL_BORDERLESS_REGRESSION=PASS heartbeats=$hb"

      - name: Final summary
        shell: powershell
        run: |
          $o='lab/borderless/rc58/initial_borderless'
          @('RC58_INITIAL_BORDERLESS_REGRESSION=PASS','INITIAL_SAVED_WINDOWSTYLE_1=PASS','INITIAL_BORDERLESS_PRESENTS=240_PASS','INITIAL_PRESENTER=1920x1080_PASS','BORDERLESS_TO_WINDOWED_1280x720=PASS','WINDOWED_TO_BORDERLESS_ROUNDTRIP=PASS','F10_500_ROUNDTRIPS_AFTER_INITIAL_BORDERLESS=PASS','RESTORE_FAILURES=0','P1U46_EXACT=PASS','RC55_RASTER_EXACT=PASS','RC58_CARRIER_EXACT=c04cbb21f87dd9a851f74b8334cbc6ba4c67274b4dc49f521b2f8523822cd633')|Set-Content "$o/RC58_INITIAL_BORDERLESS_FINAL.txt" -Encoding ASCII
          Get-Content "$o/RC58_INITIAL_BORDERLESS_FINAL.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTAR_RC58_INITIAL_BORDERLESS_REGRESSION
          path: |
            lab/borderless/rc58/initial_borderless/*.txt
            lab/borderless/rc58/initial_borderless/*.log
          if-no-files-found: warn
          retention-days: 14
