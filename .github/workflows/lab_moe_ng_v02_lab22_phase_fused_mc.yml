name: LAB PTAR-NG MoE v02 LAB22 Phase-Fused MC

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  fxc-warp-equivalence:
    if: contains(github.event.head_commit.message, '[run-lab22]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Locate FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
                 Sort-Object FullName -Descending |
                 Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile frozen LAB07 and LAB22 identically
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab22'
          New-Item -ItemType Directory -Force $out | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab07.cso" /Fc "$out\lab07.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_mc_native_detail_ps.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$out\lab22.cso" /Fc "$out\lab22.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab22_phase_fused_mc_ps.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$out\fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Static DXBC audit and hard texture gate
        shell: pwsh
        run: |
          @'
          import csv, json, re
          from collections import Counter
          from pathlib import Path

          p=Path('lab_results/moe_ng_v02_lab22')
          rows=[]; hist={}
          op_re=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b')
          for name in ('lab07','lab22'):
              ops=[]
              for raw in (p/f'{name}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'):
                      continue
                  m=op_re.match(raw)
                  if not m: continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}:
                      continue
                  ops.append(op)
              c=Counter(ops); hist[name]=dict(sorted(c.items()))
              gather=sum(v for k,v in c.items() if k.startswith('gather4'))
              sample=sum(v for k,v in c.items() if k.startswith('sample'))
              uav=sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_'))
              branches=sum(c.get(k,0) for k in ('if_nz','if_z','else','endif','switch','case','default','endswitch'))
              rows.append({'shader':name,'instruction_total':len(ops),'gather4_ops':gather,'sample_ops':sample,'uav_ops':uav,'branch_structural_ops':branches,'cso_bytes':(p/f'{name}.cso').stat().st_size})
          with (p/'STATIC_SUMMARY.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          (p/'OPCODE_HISTOGRAM.json').write_text(json.dumps(hist,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          by={r['shader']:r for r in rows}; a=by['lab07']; b=by['lab22']
          d={'protocol':'LAB22_PHASE_FUSION_STATIC_DXBC','lab07':a,'lab22':b,'delta_lab22_minus_lab07':{k:b[k]-a[k] for k in ('instruction_total','gather4_ops','sample_ops','uav_ops','branch_structural_ops','cso_bytes')},'texture_contract_pass':all(r['gather4_ops']==1 and r['sample_ops']==4 and r['uav_ops']==0 for r in rows),'static_reduction_pass':bool(b['instruction_total']<a['instruction_total'] and b['cso_bytes']<a['cso_bytes'])}
          (p/'STATIC_DELTA.json').write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(d,indent=2))
          if not d['texture_contract_pass']: raise SystemExit('texture contract failure')
          if not d['static_reduction_pass']: raise SystemExit('LAB22 did not reduce both executable instruction count and CSO size')
          '@ | python -

      - name: Build WARP harness
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab22'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'vcvars64.bat not found' }
          $cmd = "call `"$vcvars`" && cl /nologo /EHsc /O2 /std:c++17 tools\lab_moe_ng_v02_warp_harness.cpp /Fe:$out\warp_harness.exe d3d11.lib dxgi.lib"
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare independent LAB07 CPU reference
        run: python tools/lab_moe_ng_v02_warp_validate.py --outdir lab_results/moe_ng_v02_lab22 --prepare

      - name: Execute canonical input on WARP
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab22'
          & "$out\warp_harness.exe" "$out\input.f32" 24 24 36 36 "$out\lab07.cso" "$out\fullscreen_vs.cso" "$out\lab07_output.f32" *> "$out\WARP_LAB07.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$out\warp_harness.exe" "$out\input.f32" 24 24 36 36 "$out\lab22.cso" "$out\fullscreen_vs.cso" "$out\lab22_output.f32" *> "$out\WARP_LAB22.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate both shaders against independent CPU reference
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab22'
          python tools/lab_moe_ng_v02_warp_validate.py --outdir $out --gpu "$out\lab07_output.f32" --tol 0.000002
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$out\SUMMARY.json" "$out\LAB07_CPU_PARITY.json"
          python tools/lab_moe_ng_v02_warp_validate.py --outdir $out --gpu "$out\lab22_output.f32" --tol 0.000002
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$out\SUMMARY.json" "$out\LAB22_CPU_PARITY.json"

      - name: Direct canonical LAB07 versus LAB22 equivalence gate
        shell: pwsh
        run: |
          @'
          import json, numpy as np
          from pathlib import Path
          p=Path('lab_results/moe_ng_v02_lab22')
          a=np.fromfile(p/'lab07_output.f32',dtype=np.float32)
          b=np.fromfile(p/'lab22_output.f32',dtype=np.float32)
          if a.size!=b.size: raise SystemExit('size mismatch')
          d=np.abs(a-b)
          s={'protocol':'LAB22_DIRECT_WARP_EQUIVALENCE_CANONICAL','values':int(a.size),'max_abs':float(d.max()),'mean_abs':float(d.mean()),'different_values':int(np.count_nonzero(d)),'values_over_2e-6':int(np.count_nonzero(d>np.float32(2e-6))),'pass':bool(float(d.max())<=2e-6)}
          (p/'DIRECT_EQUIVALENCE_CANONICAL.json').write_text(json.dumps(s,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(s,indent=2))
          if not s['pass']: raise SystemExit('LAB22 canonical WARP drift exceeds 2e-6')
          '@ | python -

      - name: Generate additional deterministic equivalence probes
        shell: pwsh
        run: |
          @'
          import numpy as np
          from pathlib import Path
          p=Path('lab_results/moe_ng_v02_lab22')
          H=W=24; y,x=np.mgrid[0:H,0:W]; F=np.float32
          def rgba(r,g,b,a=None):
              if a is None: a=np.ones((H,W),dtype=np.float32)
              return np.stack([r,g,b,a],axis=2).astype(np.float32)
          const=np.full((H,W),F(0.37),dtype=np.float32)
          rgba(const,const,const).tofile(p/'probe_constant.f32')
          xf=x.astype(np.float32)/F(W-1); yf=y.astype(np.float32)/F(H-1)
          rgba(F(.05)+F(.85)*xf,F(.08)+F(.80)*yf,F(.10)+F(.40)*xf+F(.35)*yf).tofile(p/'probe_affine.f32')
          step=(x>=12).astype(np.float32); diag=((x+y)>=23).astype(np.float32)
          rgba(step,diag,F(.25)+F(.70)*step).tofile(p/'probe_steps.f32')
          checker=((x+y)&1).astype(np.float32); stripes=((2*x+y)%5<2).astype(np.float32)
          rng=np.random.default_rng(0x4C41423232); noise=rng.random((H,W),dtype=np.float32)
          rgba(F(.05)+F(.9)*checker,F(.05)+F(.8)*stripes,F(.05)+F(.75)*noise).tofile(p/'probe_hf_noise.f32')
          '@ | python -

      - name: Execute and compare additional WARP probes
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab22'
          $names=@('constant','affine','steps','hf_noise')
          foreach($n in $names) {
            & "$out\warp_harness.exe" "$out\probe_$n.f32" 24 24 36 36 "$out\lab07.cso" "$out\fullscreen_vs.cso" "$out\probe_${n}_lab07.f32" *> "$out\WARP_${n}_LAB07.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$out\warp_harness.exe" "$out\probe_$n.f32" 24 24 36 36 "$out\lab22.cso" "$out\fullscreen_vs.cso" "$out\probe_${n}_lab22.f32" *> "$out\WARP_${n}_LAB22.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          @'
          import json, numpy as np
          from pathlib import Path
          p=Path('lab_results/moe_ng_v02_lab22'); rows=[]
          for n in ('constant','affine','steps','hf_noise'):
              a=np.fromfile(p/f'probe_{n}_lab07.f32',dtype=np.float32)
              b=np.fromfile(p/f'probe_{n}_lab22.f32',dtype=np.float32)
              if a.size!=b.size: raise SystemExit(f'{n}: size mismatch')
              d=np.abs(a-b)
              rows.append({'probe':n,'values':int(a.size),'max_abs':float(d.max()),'mean_abs':float(d.mean()),'different_values':int(np.count_nonzero(d)),'values_over_2e-6':int(np.count_nonzero(d>np.float32(2e-6))),'finite':bool(np.isfinite(b).all()),'pass':bool(np.isfinite(b).all() and float(d.max())<=2e-6)})
          s={'protocol':'LAB22_DIRECT_WARP_EQUIVALENCE_EXTRA_PROBES','tolerance_abs':2e-6,'probes':rows,'pass':all(r['pass'] for r in rows)}
          (p/'DIRECT_EQUIVALENCE_PROBES.json').write_text(json.dumps(s,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(s,indent=2))
          if not s['pass']: raise SystemExit('LAB22 extra-probe WARP equivalence failure')
          '@ | python -

      - name: Emit hashes and provenance
        shell: pwsh
        run: |
          $out='lab_results\moe_ng_v02_lab22'
          Get-FileHash "$out\lab07.cso" -Algorithm SHA256 | Format-List | Out-File "$out\HASHES.txt"
          Get-FileHash "$out\lab22.cso" -Algorithm SHA256 | Format-List | Out-File "$out\HASHES.txt" -Append
          @(
            "protocol=LAB22_PHASE_FUSED_MC",
            "branch=$env:GITHUB_REF_NAME",
            "commit=$env:GITHUB_SHA",
            "baseline=src/hlsl/moe_ng_v02/ptar_moe_ng_v02_mc_native_detail_ps.hlsl",
            "candidate=src/hlsl/moe_ng_v02/ptar_moe_ng_v02_lab22_phase_fused_mc_ps.hlsl",
            "fxc=${{ steps.fxc.outputs.path }}",
            "physical_gpu_executed=false"
          ) | Set-Content "$out\PROVENANCE.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab22-phase-fused-mc
          path: lab_results/moe_ng_v02_lab22
