name: RC54 GUI Callsite Probe Lab

on:
  push:
    branches:
      - lab/rc54-gui-callsite-probe-20260915
    paths:
      - 'lab/gui/rc54/**'
      - '.github/workflows/rc54-gui-callsite-probe.yml'
  workflow_dispatch:

jobs:
  windows-gui-callsite-probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Generate inherited RC52 raster and RC54 observational sources
        shell: cmd
        run: |
          python lab\raster\rc52\build_rc52_context_hooks.py lab\gui\rc54\generated\ptar_rc41_context_hooks_rc52.cpp || exit /b 10
          python lab\gui\rc54\build_rc54_swapchain_hooks.py lab\gui\rc54\generated\ptar_rc41_swapchain_hooks_rc54.cpp || exit /b 11
          python lab\gui\rc54\build_rc54_prod.py lab\gui\rc54\generated\ptar_rc41_prod_rc54.cpp || exit /b 12
          findstr /C:"requestedViewportCount_=0;haveViewportState_=false" lab\gui\rc54\generated\ptar_rc41_context_hooks_rc52.cpp >nul || exit /b 13
          findstr /C:"global_gui_callsite_probe().observe(observation)" lab\gui\rc54\generated\ptar_rc41_swapchain_hooks_rc54.cpp >nul || exit /b 14
          findstr /C:"ACTIVE_RC54_GUI_CALLSITE_PROBE observe-only" lab\gui\rc54\generated\ptar_rc41_prod_rc54.cpp >nul || exit /b 15

      - name: Build and run probe unit host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 20
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\raster\rc41 /I lab\gui\rc54
          mkdir lab\gui\rc54\out 2>nul
          cl %CFLAGS% lab\gui\rc54\ptar_rc54_probe_host.cpp lab\gui\rc54\ptar_rc54_gui_callsite_probe.cpp /Fo:lab\gui\rc54\out\ /Fe:lab\gui\rc54\out\probe_host.exe user32.lib /link /SUBSYSTEM:CONSOLE,6.03 || exit /b 21
          pushd lab\gui\rc54\out
          probe_host.exe || exit /b 22
          type ptar_rc54_gui_callsites.log
          findstr /C:"RC54_GUI_CALLSITE_PROBE=ACTIVE" ptar_rc54_gui_callsites.log >nul || exit /b 23
          findstr /C:"physical=1280x720 reported=1920x1080 virtualized=1" ptar_rc54_gui_callsites.log >nul || exit /b 24
          popd

      - name: Prove RC41 swapchain behavior is unchanged under RC54 instrumentation
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 30
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\raster\rc41 /I lab\gui\rc54
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_dual_interface_harness.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\gui\rc54\generated\ptar_rc41_swapchain_hooks_rc54.cpp lab\gui\rc54\ptar_rc54_gui_callsite_probe.cpp /Fo:lab\gui\rc54\out\ /Fe:lab\gui\rc54\out\swapchain_parity.exe user32.lib dxgi.lib /link /SUBSYSTEM:CONSOLE,6.03 || exit /b 31
          pushd lab\gui\rc54\out
          swapchain_parity.exe > swapchain_parity.txt || exit /b 32
          type swapchain_parity.txt
          findstr /C:"RC41_DUAL_INTERFACE=PASS" swapchain_parity.txt >nul || exit /b 33
          popd

      - name: Build production RC54 sidecar on RC52 raster baseline
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 40
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\raster\rc41 /I lab\gui\rc54
          cl %CFLAGS% /LD lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\gui\rc54\generated\ptar_rc41_context_hooks_rc52.cpp lab\raster\rc41\ptar_rc41_resource_bridge.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\gui\rc54\generated\ptar_rc41_swapchain_hooks_rc54.cpp lab\gui\rc54\ptar_rc54_gui_callsite_probe.cpp lab\gui\rc54\generated\ptar_rc41_prod_rc54.cpp /Fo:lab\gui\rc54\out\ /Fe:lab\gui\rc54\out\ptar_rc41.dll user32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 41
          certutil -hashfile lab\gui\rc54\out\ptar_rc41.dll SHA256

      - name: Run inherited production host against RC54
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 50
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\raster\rc41
          cl %CFLAGS% lab\raster\rc41\ptar_rc41_prod_host.cpp /Fo:lab\gui\rc54\out\prod_host.obj /Fe:lab\gui\rc54\out\prod_host.exe d3d11.lib dxgi.lib user32.lib /link /SUBSYSTEM:CONSOLE,6.03 || exit /b 51
          pushd lab\gui\rc54\out
          prod_host.exe || exit /b 52
          type RC41_PROD_HOST_RESULT.txt
          findstr /C:"RC41_PROD_HOST=PASS" RC41_PROD_HOST_RESULT.txt >nul || exit /b 53
          if not exist ptar_rc54_gui_callsites.log exit /b 54
          findstr /C:"policy=observe_only_no_behavior_change" ptar_rc54_gui_callsites.log >nul || exit /b 55
          popd

      - name: Stress inherited RC52 raster behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:CFLAGS='/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603 /I lab\raster\rc41'
          cmd /c "call `"%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cl %CFLAGS% lab\raster\rc52\ptar_rc52_raster_state_host.cpp lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\gui\rc54\generated\ptar_rc41_context_hooks_rc52.cpp /Fo:lab\gui\rc54\out\ /Fe:lab\gui\rc54\out\raster_fixed.exe d3d11.lib user32.lib /link /SUBSYSTEM:CONSOLE,6.03"
          if($LASTEXITCODE -ne 0){ throw 'RC54 inherited RC52 raster host build failed' }
          1..32 | ForEach-Object {
            Push-Location 'lab/gui/rc54/out'
            try { & .\raster_fixed.exe; if($LASTEXITCODE -ne 0){ throw "RC52 raster regression at iteration $_" } }
            finally { Pop-Location }
          }
          $sha=(Get-FileHash 'lab/gui/rc54/out/ptar_rc41.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'RC54_GUI_CALLSITE_PROBE=PASS',
            'BEHAVIOR_CHANGE=NONE',
            'BASELINE=RC52_RASTER_STATE_QUARANTINE',
            'SWAPCHAIN_PARITY=PASS',
            'RC41_PROD_HOST=PASS',
            'RC52_RASTER_STRESS=32 PASS',
            "RC54_SIDECAR_SHA256=$sha"
          ) | Set-Content 'lab/gui/rc54/out/RC54_VALIDATION_SUMMARY.txt' -Encoding ASCII
          Get-Content 'lab/gui/rc54/out/RC54_VALIDATION_SUMMARY.txt'

      - name: Upload RC54 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTAR_RC54_GUI_CALLSITE_PROBE
          path: |
            lab/gui/rc54/out/RC54_VALIDATION_SUMMARY.txt
            lab/gui/rc54/out/swapchain_parity.txt
            lab/gui/rc54/out/RC41_PROD_HOST_RESULT.txt
            lab/gui/rc54/out/RC52_RASTER_STATE_HOST.txt
            lab/gui/rc54/out/ptar_rc54_gui_callsites.log
            lab/gui/rc54/out/ptar_rc41.dll
            lab/gui/rc54/generated/*.cpp
          retention-days: 14
