name: Promote GW15 LOCK30

on:
  push:
    branches:
      - staging/gw15-main-promote

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover current-main runtime
        shell: bash
        run: |
          git show 67ff5610bf603ab8b8491e8421ab01ee1e832e13:win81_nis_dx11_x64.dll > /tmp/ptar_main_base.dll
          echo '3d4d777c943ced0f475df1371d3a2f9eeb5eeb80c66e9fb217c4d91057f32453  /tmp/ptar_main_base.dll' | sha256sum -c -

      - name: Materialize and validate exact GW15 tree
        run: python .github/promote_gw15_bootstrap.py

      - name: Commit validated promotion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No promotion diff'; exit 1; }
          git commit -m 'Promote hardware-validated PTAR GW15 LOCK30'
          git push origin HEAD:staging/gw15-main-promote
