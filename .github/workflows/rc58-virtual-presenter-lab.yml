name: RC58 Virtual Presenter Mode Lab

on:
  push:
    branches: [lab/rc58-virtual-presenter-mode-20260915]
    paths:
      - 'lab/borderless/rc58/**'
      - '.github/workflows/rc58-virtual-presenter-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-static:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate RC58 production source
        shell: cmd
        run: |
          python lab\borderless\rc58\build_rc58_virtual_presenter.py lab\borderless\rc58\generated || exit /b 10
          findstr /C:"RC58_INITIAL_MODE=WINDOWED_NATIVE_BASELINE" lab\borderless\rc58\generated\ptar_borderless_rc46_presenter_only.cpp >nul || exit /b 11
          findstr /C:"RC58_APPLY=BORDERLESS_PRESENT_BOUNDARY" lab\borderless\rc58\generated\ptar_borderless_rc58_prod.cpp >nul || exit /b 12
          findstr /C:"STARTUP_BARRIER=180_PRESENTS_AND_5000MS" lab\borderless\rc58\generated\RC58_GENERATION.txt >nul || exit /b 13
      - name: Static architecture gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Content 'lab/borderless/rc58/generated/ptar_borderless_rc58_prod.cpp' -Raw
          $c=Get-Content 'lab/borderless/rc58/generated/ptar_borderless_rc46_presenter_only.cpp' -Raw
          $b=Get-Content 'lab/borderless/rc58/generated/ptar_borderless_rc45_presenter_only.cpp' -Raw
          $t=$p+"`n"+$c+"`n"+$b
          foreach($needle in @('Ctrl+F10','RC58_MODE_REQUEST_REJECTED_STARTUP_NOT_STABLE','RC58_NATIVE_BORDERLESS_VIRTUALIZED','RC58_REGISTRY_BORDERLESS_VIRTUALIZED','RC58_STARTUP_STABLE presents/ms','PTAR_RC58_QueryVirtualMode')){if(-not $t.Contains($needle)){throw "missing $needle"}}
          if($t.Contains('RC57_INITIAL_BORDERLESS_DEFERRED_WINDOWED_BOOT')){throw 'RC57 handshake leaked'}
          if($c -notmatch 'g_rc45LastWindowStylePreference=0'){throw 'native baseline not pinned'}
          if($c -match 'preference==1\).*enter_borderless'){throw 'native initial borderless remains'}
          Write-Host 'RC58_STATIC_ARCHITECTURE=PASS'
      - name: Build production RC58
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 20
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          mkdir lab\borderless\rc58\bin 2>nul
          cl %CFLAGS% /LD lab\borderless\rc58\generated\ptar_borderless_rc58_prod.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fo:lab\borderless\rc58\bin\ /Fe:lab\borderless\rc58\bin\ptar_borderless.dll user32.lib advapi32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 21
      - name: Binary gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$p='lab/borderless/rc58/bin/ptar_borderless.dll';$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();$b=[IO.File]::ReadAllBytes($p);if([BitConverter]::ToUInt16($b,0)-ne 0x5A4D){throw 'not PE'};$pe=[BitConverter]::ToInt32($b,0x3C);$machine=[BitConverter]::ToUInt16($b,$pe+4);$magic=[BitConverter]::ToUInt16($b,$pe+24);$subMajor=[BitConverter]::ToUInt16($b,$pe+24+48);$subMinor=[BitConverter]::ToUInt16($b,$pe+24+50);if($machine-ne0x8664-or$magic-ne0x20B-or$subMajor-ne6-or$subMinor-ne3){throw "PE gate $machine $magic $subMajor.$subMinor"};Write-Host "RC58_CARRIER_SHA256=$h";Write-Host 'RC58_PE_X64_WIN81=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: PTAR_RC58_BUILD_STATIC
          path: |
            lab/borderless/rc58/bin/ptar_borderless.dll
            lab/borderless/rc58/generated/RC58_GENERATION.txt
          if-no-files-found: error
          retention-days: 14
