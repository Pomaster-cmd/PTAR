name: LAB D3D9 SPEC5 BLENDREFINE1 EDGE 20261012

on:
  push:
    branches: [lab/d3d9-spec5-blendrefine1-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-mtf:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile blend sweep bytecode
        shell: pwsh
        run: .\lab\blendrefine1\compile_blend_sweep.ps1
      - name: Run targeted halo line-width and MTF proxy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 lab\blendrefine1\blend_edge_mtf_generated.cpp /link d3d9.lib user32.lib /OUT:artifact\blend_edge_mtf.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE){throw 'edge/MTF harness compile failed'}
          Push-Location artifact
          & .\blend_edge_mtf.exe 2>&1 | Tee-Object BLENDREFINE_EDGE_MTF_LOG.txt
          $rc=$LASTEXITCODE
          Pop-Location
          if($rc){throw "edge/MTF harness failed rc=$rc"}
          if((Get-Content artifact\BLENDREFINE_EDGE_MTF_LOG.txt -Raw) -notmatch 'BLENDREFINE_EDGE_MTF_GATE=PASS'){throw 'edge/MTF PASS marker missing'}
          'BLENDREFINE_EDGE_MTF=PASS' | Set-Content artifact\BLENDREFINE_EDGE_MTF_STATUS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-D3D9-SPEC5-BLENDREFINE1-EDGE
          path: artifact/
          if-no-files-found: error
