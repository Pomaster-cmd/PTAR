name: LAB D3D9 validated baseline rebuild

on:
  push:
    branches:
      - lab/d3d9-validated-baseline-rebuild
    paths:
      - 'compat/x86_d3d9/**'
      - '.github/workflows/lab-d3d9-validated-baseline-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile exact SPATIAL2 shaders
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build_x86,artifact | Out-Null
          $fxc=Get-Command fxc.exe -ErrorAction SilentlyContinue
          if(-not $fxc){
            $roots=@("$env:ProgramFiles(x86)\Windows Kits\10\bin","$env:ProgramFiles(x86)\Windows Kits\8.1\bin")
            foreach($root in $roots){
              if(Test-Path $root){
                $fxc=Get-ChildItem $root -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
                if($fxc){break}
              }
            }
          }
          if(-not $fxc){throw 'fxc.exe not found'}
          $fxcPath=if($fxc.Path){$fxc.Path}else{$fxc.FullName}
          & $fxcPath /nologo /T ps_3_0 /E main /O3 /Fh build_x86\ptar_ps_bytecode.h /Vn g_ptarPs compat\x86_d3d9\ptar_moe_d3d9_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $fxcPath /nologo /T ps_2_0 /E main /O3 /Fh build_x86\ptar_bilinear_ps_bytecode.h /Vn g_ptarBilinearPs compat\x86_d3d9\ptar_bilinear_ref_ps.hlsl
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Build exact validated x86 D3D9 architecture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /LD /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /I build_x86 compat\x86_d3d9\ptar_d3d9_proxy.cpp /link user32.lib /DEF:compat\x86_d3d9\d3d9_proxy.def /OUT:artifact\d3d9.dll /SUBSYSTEM:WINDOWS,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: PE export dependency gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dumpbin /headers artifact\d3d9.dll | Tee-Object artifact\HEADERS.txt
          dumpbin /exports artifact\d3d9.dll | Tee-Object artifact\EXPORTS.txt
          dumpbin /dependents artifact\d3d9.dll | Tee-Object artifact\DEPENDENTS.txt
          $h=Get-Content artifact\HEADERS.txt -Raw
          $e=Get-Content artifact\EXPORTS.txt -Raw
          $d=Get-Content artifact\DEPENDENTS.txt -Raw
          if($h -notmatch '14C machine \(x86\)'){throw 'PE is not x86/I386'}
          foreach($n in @('Direct3DCreate9','Direct3DCreate9Ex','D3DPERF_BeginEvent','D3DPERF_EndEvent')){if($e -notmatch [regex]::Escape($n)){throw "missing export $n"}}
          foreach($bad in @('VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($d -match $bad){throw "forbidden runtime $bad"}}
          $sha=(Get-FileHash artifact\d3d9.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'BASELINE_COMMIT=063f71273777644e864c99aa1e025d9006470fc8',
            'FIELD_VALIDATION_COMMIT=f12485402fb5af5f1cfcbb39242cfb857987cd0a',
            'FIELD_VALIDATED_DLL_SHA256=46c6a5c90c954c2a2ce6046d1c7e5ab6c9c198633edea6cd4c522672c7977e97',
            ('REBUILT_DLL_SHA256='+$sha),
            'ARCH=SPATIAL2_HUDCOMPARE1_VTABLEFIX2_CRASHLOG1',
            'FG=NOT_PORTED',
            'D3D9EX_SEPARATE_PRESENTER=NO',
            'HIDDEN_SOURCE_SWAPCHAIN=NO',
            'MANAGED_RESOURCE_TRANSLATION=NO'
          ) | Set-Content artifact\BASELINE_IDENTITY.txt -Encoding ASCII

      - name: Run object lifetime regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /MT /W4 /WX /EHsc /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 compat\x86_d3d9\d3d9_object_lifetime_smoke.cpp /link user32.lib /OUT:artifact\d3d9_object_lifetime_smoke.exe /SUBSYSTEM:CONSOLE,6.03
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Push-Location artifact
          try {
            & .\d3d9_object_lifetime_smoke.exe | Tee-Object OBJECT_LIFETIME.txt
            if($LASTEXITCODE -ne 0){throw "object lifetime smoke failed rc=$LASTEXITCODE"}
          } finally { Pop-Location }
          if((Get-Content artifact\OBJECT_LIFETIME.txt -Raw) -notmatch 'D3D9_OBJECT_LIFETIME_SMOKE=PASS'){throw 'PASS marker missing'}

      - uses: actions/upload-artifact@v4
        with:
          name: LAB_D3D9_VALIDATED_BASELINE_REBUILD
          path: artifact/
          if-no-files-found: error
          retention-days: 30
