name: LAB30C GTX960M Compare Pack

on:
  push:
    branches:
      - lab/moe-ng-v02-lab30-codegen-sweep

permissions:
  contents: read

jobs:
  build-audit-pack:
    if: contains(github.event.head_commit.message, '[run-lab30c-gtx-pack]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate x64 FXC
        id: fxc
        shell: pwsh
        run: |
          $fxc=Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $fxc){ throw 'x64 fxc.exe not found' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile and freeze LAB29 LAB30C DXBC
        shell: pwsh
        run: |
          $root='lab_results\lab30c_gtx_pack'; $pack="$root\PTAR_LAB30C_GTX960M_COMPARE_PACK"; $sh="$pack\shaders"
          New-Item -ItemType Directory -Force $sh | Out-Null
          $fxc='${{ steps.fxc.outputs.path }}'
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab29.cso" /Fc "$root\lab29.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab29_doubled_mc_slope_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T ps_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab30c.cso" /Fc "$root\lab30c.asm" src\hlsl\moe_ng_v02\ptar_moe_ng_v02_lab30c_movc_frac_ps.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & $fxc /nologo /T vs_5_0 /E main /O3 /Ges /WX /Fo "$sh\lab_fullscreen_vs.cso" src\hlsl\moe_ng_v02\lab_fullscreen_vs.hlsl
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_k185_control_ps.cso "$sh\ptar_k185_control_ps.cso"
          Copy-Item runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\shaders\ptar_vs.cso "$sh\ptar_vs.cso"
          $expected=@{
            'lab29.cso'='6a407b37938ec6a0bf89d13cf84fa4ae23c6f712a947fc6926bbfde9725028ed'
            'lab30c.cso'='be967e9bdb56cad2f1b90e9d7e553a0316140577329e900f4caa02d337aabb8a'
            'ptar_k185_control_ps.cso'='6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16'
            'ptar_vs.cso'='6328bbd87aac73b07d6112de593f781b2769381aae65fa9c2bcfa06fdc68585c'
            'lab_fullscreen_vs.cso'='f5d7c0f9be164a924fbe821137fc7bb216c479abc5701411bd1a09346dd5078b'
          }
          $lines=@()
          foreach($n in $expected.Keys){
            $p="$sh\$n"; if(-not(Test-Path $p)){throw "missing $n"}
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant(); if($got -ne $expected[$n]){throw "$n hash mismatch $got"}
            $bytes=[IO.File]::ReadAllBytes($p); if($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes,0,4) -ne 'DXBC'){throw "$n not DXBC"}
            $lines += "$got  shaders/$n"
          }
          $lines | Set-Content "$pack\HASHES.txt" -Encoding ascii

      - name: Static DXBC contract and codegen audit
        shell: pwsh
        run: |
          @'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('lab_results/lab30c_gtx_pack'); pack=root/'PTAR_LAB30C_GTX960M_COMPARE_PACK'; op_re=re.compile(r'^\s*([A-Za-z][A-Za-z0-9_]*)\b'); out={}
          for n in ('lab29','lab30c'):
              ops=[]
              for raw in (root/f'{n}.asm').read_text(encoding='utf-8',errors='replace').splitlines():
                  s=raw.lstrip()
                  if not s or s.startswith('//') or s.startswith('ps_5_0'):continue
                  m=op_re.match(raw)
                  if not m:continue
                  op=m.group(1).lower()
                  if op.startswith('dcl_') or op in {'def','defi','defb'}:continue
                  ops.append(op)
              c=Counter(ops); out[n]={'instructions':len(ops),'bytes':(pack/'shaders'/f'{n}.cso').stat().st_size,'div':c.get('div',0),'udiv':c.get('udiv',0),'frc':c.get('frc',0),'mul':c.get('mul',0),'gather4':sum(v for k,v in c.items() if k.startswith('gather4')),'sample_l':sum(v for k,v in c.items() if k.startswith('sample_l')),'uav':sum(v for k,v in c.items() if k.startswith('store_uav') or k.startswith('atomic_'))}
          contract=all(v['gather4']==1 and v['sample_l']==4 and v['uav']==0 for v in out.values()); expected=out['lab29']['instructions']==57 and out['lab29']['bytes']==2732 and out['lab30c']['instructions']==55 and out['lab30c']['bytes']==2632 and out['lab30c']['udiv']==0
          r={'protocol':'LAB30C_GTX_PACK_STATIC_DXBC_AUDIT','lab29':out['lab29'],'lab30c':out['lab30c'],'texture_contract_pass':contract,'expected_codegen_pass':expected,'instruction_delta':out['lab30c']['instructions']-out['lab29']['instructions'],'byte_delta':out['lab30c']['bytes']-out['lab29']['bytes'],'pass':bool(contract and expected)}
          (root/'STATIC_DXBC_AUDIT.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          if not r['pass']:raise SystemExit('DXBC audit failed')
          '@ | python -

      - name: Generate LAB29 vs LAB30C comparator from audited LAB29 host
        shell: pwsh
        run: |
          $src=Get-Content hardware_validation\ptar_moe_ng_v02_lab29_compare.cpp -Raw
          $old28='fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77'
          $old29='6a407b37938ec6a0bf89d13cf84fa4ae23c6f712a947fc6926bbfde9725028ed'
          $new30='be967e9bdb56cad2f1b90e9d7e553a0316140577329e900f4caa02d337aabb8a'
          $src=$src.Replace($old28,'__BASE_HASH__').Replace($old29,$new30).Replace('__BASE_HASH__',$old29)
          $src=$src.Replace('Lab28','Base29').Replace('Lab29','Lab30C').Replace('Base29','Lab29')
          $src=$src.Replace('LAB28','BASE29').Replace('LAB29','LAB30C').Replace('BASE29','LAB29')
          $src=$src.Replace('lab28','base29').Replace('lab29','lab30c').Replace('base29','lab29')
          Set-Content lab_results\lab30c_gtx_pack\ptar_lab30c_compare.cpp $src -Encoding utf8
          $check=Get-Content lab_results\lab30c_gtx_pack\ptar_lab30c_compare.cpp -Raw
          foreach($bad in @('LAB28','lab28','fb77c785fd79891c321a4abf5d517367a7d873574c04046fe6c44b45a0df9a77')){if($check.Contains($bad)){throw "stale comparator token $bad"}}
          foreach($need in @('LAB29','LAB30C','lab29.cso','lab30c.cso','LAB30C_COMPARE_RAW.csv','LAB30C_COMPARE_SUMMARY.json')){if(-not $check.Contains($need)){throw "missing comparator token $need"}}

      - name: Build Win81 x64 MT comparison host
        shell: pwsh
        run: |
          $root='lab_results\lab30c_gtx_pack'; $pack="$root\PTAR_LAB30C_GTX960M_COMPARE_PACK"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if(-not $vcvars){throw 'vcvars64.bat not found'}
          $inc='runtime_autonomous\PTAR_NG_MOE_V01_WIN81_X64\include'; $src="$root\ptar_lab30c_compare.cpp"
          $cmd="call `"$vcvars`" && cl /nologo /EHsc /O2 /MT /W4 /WX /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DUNICODE /D_UNICODE /I `"$inc`" `"$src`" /Fe:`"$pack\ptar_lab30c_gtx960m_compare.exe`" /Fo:`"$root\ptar_lab30c_compare.obj`" /link /SUBSYSTEM:CONSOLE,6.03 d3d11.lib dxgi.lib bcrypt.lib"
          cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Audit PE imports and subsystem
        shell: pwsh
        run: |
          $root='lab_results\lab30c_gtx_pack'; $pack="$root\PTAR_LAB30C_GTX960M_COMPARE_PACK"; $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vcvars=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          $cmd="call `"$vcvars`" && dumpbin /dependents `"$pack\ptar_lab30c_gtx960m_compare.exe`" > `"$pack\IMPORTS.txt`" && dumpbin /headers `"$pack\ptar_lab30c_gtx960m_compare.exe`" > `"$root\HEADERS.txt`""; cmd.exe /d /s /c $cmd; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $imports=Get-Content "$pack\IMPORTS.txt" -Raw; foreach($bad in @('D3DCOMPILER','VCRUNTIME','MSVCP','UCRTBASE','API-MS-WIN-CRT')){if($imports -match [regex]::Escape($bad)){throw "forbidden import $bad"}}
          $headers=Get-Content "$root\HEADERS.txt" -Raw; if($headers -notmatch '6\.03\s+subsystem version'){throw 'subsystem is not 6.03'}

      - name: WARP smoke
        shell: pwsh
        run: |
          $pack=(Resolve-Path 'lab_results\lab30c_gtx_pack\PTAR_LAB30C_GTX960M_COMPARE_PACK').Path; Push-Location $pack
          try { & .\ptar_lab30c_gtx960m_compare.exe --warp-smoke | Tee-Object -FilePath WARP_SMOKE.txt; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} } finally { Pop-Location }
          if((Get-Content "$pack\WARP_SMOKE.txt" -Raw) -notmatch '\[PASS\] WARP smoke'){throw 'WARP PASS marker missing'}

      - name: Finalize audited hardware pack
        shell: pwsh
        run: |
          $root='lab_results\lab30c_gtx_pack'; $pack="$root\PTAR_LAB30C_GTX960M_COMPARE_PACK"
          $exeHash=(Get-FileHash "$pack\ptar_lab30c_gtx960m_compare.exe" -Algorithm SHA256).Hash.ToLowerInvariant(); Add-Content "$pack\HASHES.txt" "$exeHash  ptar_lab30c_gtx960m_compare.exe" -Encoding ascii
          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "ptar_lab30c_gtx960m_compare.exe" (echo [FAIL] Executable absent.& exit /b 10)
          echo [PTAR] LAB30C vs LAB29 vs K185 - GTX 960M - 600 triades equilibrees
          ptar_lab30c_gtx960m_compare.exe
          set "RC=%ERRORLEVEL%"
          echo.
          if not "%RC%"=="0" echo [FAIL] Code retour %RC%
          if "%RC%"=="0" echo [PASS] Resultats dans le dossier results
          pause
          exit /b %RC%
          '@ | Set-Content "$pack\RUN_LAB30C_GTX960M_COMPARE.bat" -Encoding ascii
          @'
          PTAR LAB30C - GTX960M TARGETED HARDWARE COMPARE

          LAB30C is software-admitted against hardware-selected LAB29.
          It preserves the exact validated output while reducing codegen from 57 to 55 instructions, 2732 to 2632 bytes, and removes the integer UDIV phase operation.

          Run only RUN_LAB30C_GTX960M_COMPARE.bat on Windows 8.1 + GTX 960M.
          The test performs 60 warmup triads then 600 measured triads over all six balanced LAB29/LAB30C/K185 permutations.
          Return the generated results folder as ZIP.
          Do not rerun older LAB27/LAB28/LAB29 packs.

          Promotion rule: LAB30C replaces LAB29 only if paired real-GPU gain is reproducible across permutations/P-state regimes. Neutral or negative = keep LAB29.
          '@ | Set-Content "$pack\README_FIRST.txt" -Encoding utf8
          @(
            'protocol=LAB30C_GTX960M_SAME_RUN_BALANCED_COMPARE',"branch=$env:GITHUB_REF_NAME","commit=$env:GITHUB_SHA",'target=Windows 8.1 x64 / D3D11 FL11_0','host_crt=/MT','runtime_hlsl_compiler=false','dimensions=1280x720 -> 1920x1080','warmup_triads=60','measured_triads=600','order_protocol=SIX_ROTATING_PERMUTATIONS_BALANCED','lab29_sha256=6a407b37938ec6a0bf89d13cf84fa4ae23c6f712a947fc6926bbfde9725028ed','lab30c_sha256=be967e9bdb56cad2f1b90e9d7e553a0316140577329e900f4caa02d337aabb8a','k185_sha256=6bd926e85f21dd08788ff9d189c472800a5e0eb726091158ed1ecde3d06d8c16','texture_contract=1 GatherGreen + 4 SampleLevel + 0 UAV','lab30c_full_software_gate=PASS','lab29_codegen=57 instructions / 2732 bytes / 1 udiv','lab30c_codegen=55 instructions / 2632 bytes / 0 udiv','warp_smoke=PASS','physical_gtx960m_executed=false','main_modified=false','production_runtime_modified=false') | Set-Content "$pack\PROVENANCE.txt" -Encoding ascii
          Copy-Item "$root\STATIC_DXBC_AUDIT.json" "$pack\STATIC_DXBC_AUDIT.json"; Copy-Item "$root\HEADERS.txt" "$pack\PE_HEADERS.txt"; Copy-Item "$root\ptar_lab30c_compare.cpp" "$pack\COMPARATOR_SOURCE.cpp"
          $manifest=Get-ChildItem $pack -Recurse -File | Sort-Object FullName | ForEach-Object { $rel=$_.FullName.Substring((Resolve-Path $pack).Path.Length+1).Replace('\','/'); $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$h  $rel" }
          $manifest | Set-Content "$pack\SHA256_MANIFEST.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptar-lab30c-gtx960m-compare-pack
          path: lab_results/lab30c_gtx_pack
