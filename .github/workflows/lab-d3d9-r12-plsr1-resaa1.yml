name: LAB D3D9 R12 PLSR1 RESAA1
on:
  push:
    branches:
      - lab/r12-plsr1-resaa1
  workflow_dispatch:
jobs:
  r12:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Qualify R12 selective resolution AA over R11 PLSR1
        shell: pwsh
        run: |
          .\lab\tsr1\apply_r10_aliasresidual.ps1
          .\lab\tsr1\apply_r11_plsr1.ps1
          .\lab\tsr1\apply_r12_resaa1.ps1
          .\lab\tsr1\run_r8_tsr_ci_compat.ps1
          .\lab\tsr1\run_tsr1_gpu_smoke.ps1
          .\lab\tsr1\run_tsr1_perf.ps1

          $src=Get-Content .\lab\tsr1\ptar_tsr1_resolve_ps.hlsl -Raw
          foreach($token in @(
            'PTAR R11 PLSR1 PHASELATTICE1',
            'PTAR R12 RESAA1',
            'stairOrientation',
            'edgeAgreement',
            'aaReferenceLuma',
            'aaDetailGate=lerp(1.00f,0.30f,detailProtect)',
            'aaStrength=0.32f*aaEdge*aaStable*aaDetailGate'))
          {
            if($src -notmatch [regex]::Escape($token)){throw "R12 RESAA token missing: $token"}
          }

          $quality=Get-Content .\artifact\R8_TSR1_QUALITY_ORACLE.txt -Raw
          $x=[regex]::Match($quality,'TSR1_NATIVE_X_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          $y=[regex]::Match($quality,'TSR1_NATIVE_Y_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          $xy=[regex]::Match($quality,'TSR1_NATIVE_XY_HALF_R7_MAE=([0-9.]+) TSR_MAE=([0-9.]+) IMPROVEMENT_PCT=([0-9.]+)')
          if(-not ($x.Success -and $y.Success -and $xy.Success)){throw 'R12 quality oracle parse failed'}
          $ci=[Globalization.CultureInfo]::InvariantCulture
          $xp=[double]::Parse($x.Groups[3].Value,$ci)
          $yp=[double]::Parse($y.Groups[3].Value,$ci)
          $xyp=[double]::Parse($xy.Groups[3].Value,$ci)
          $worst=[Math]::Min($xp,[Math]::Min($yp,$xyp))
          if($worst -lt 60.0){throw "R12 native-reference reconstruction regression too large: $worst%"}

          $asm=Get-Content .\artifact\TSR1_RESOLVE_ASM.txt -Raw
          $tex=([regex]::Matches($asm,'(?im)^\s*texld')).Count
          $slots=[int]([regex]::Match($asm,'(?i)approximately\s+(\d+)\s+instruction slots').Groups[1].Value)
          if($tex -ne 10){throw "R12 resolve texture-read regression: $tex"}
          if($slots -gt 240){throw "R12 resolve slot budget exceeded: $slots"}

          Copy-Item .\artifact\PTAR_R8_VALIDATION.txt .\artifact\PTAR_R12_VALIDATION.txt -Force
          @(
            'PTAR_D3D9_BRANCH=R12_PLSR1_RESAA1_OVER_R11_PHASELATTICE1',
            ('SOURCE_COMMIT='+$env:GITHUB_SHA),
            'R12_AA=SELECTIVE_LUMA_COVERAGE_EDGE_RECONSTRUCTION',
            'R12_GENERIC_FXAA=NO',
            'R12_EDGE_TARGET=SLANTED_COHERENT_720P_STAIRCASE_GEOMETRY',
            'R12_DETAIL_PROTECTION=YES',
            'R12_CHROMA_BLUR=NONE',
            'R12_EXTRA_TEXTURE_READS_OVER_R11=0',
            'R12_EXTRA_PASSES_OVER_R11=0',
            ('R12_RESOLVE_TEXLD='+$tex),
            ('R12_RESOLVE_SLOTS='+$slots),
            'R12_FG_SCOPE=UNCHANGED_R11_FG_OFF_ONLY',
            ('R12_NATIVE_X_IMPROVEMENT_PCT='+$xp.ToString('F3',$ci)),
            ('R12_NATIVE_Y_IMPROVEMENT_PCT='+$yp.ToString('F3',$ci)),
            ('R12_NATIVE_XY_IMPROVEMENT_PCT='+$xyp.ToString('F3',$ci)),
            ('R12_NATIVE_WORST_IMPROVEMENT_PCT='+$worst.ToString('F3',$ci)),
            'R12_PRIMARY_OBJECTIVE=PERCEIVED_RESOLUTION_FINE_DETAIL_PLUS_ANTI_ALIASING') | Add-Content .\artifact\PTAR_R12_VALIDATION.txt -Encoding ascii
          Write-Host "R12_RESOLVE=$slots`_SLOTS_$tex`_TEXLD"
          Write-Host "R12_NATIVE_WORST_IMPROVEMENT_PCT=$($worst.ToString('F3',$ci))"
          Write-Host 'R12_PLSR1_RESAA1=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: R12-PLSR1-RESAA1
          path: artifact/
          if-no-files-found: error
