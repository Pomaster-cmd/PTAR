name: LAB PTAR-NG MoE v02 Router Ablation

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  router-ablation:
    if: contains(github.event.head_commit.message, '[run-ablation]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Compare routed and always-on MC architectures on A+B then evaluate C
        run: >-
          python tools/lab_moe_ng_v02_router_ablation.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_router_ablation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab06-router-ablation
          path: lab_results/moe_ng_v02_router_ablation
