name: LAB D3D9 R15 CALIBRATED GATES
on:
  push:
    branches:
      - lab/r15-jitter9-true720
  workflow_dispatch:

jobs:
  calibrated-gates:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Prove calibrated lattice model
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .\lab\r15_jitter9\r15_lattice_oracle.py

      - name: Compile shader headers used by D3D9 calibration oracles
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifact,build_x86 | Out-Null
          $fxc=Get-Command fxc.exe -ErrorAction Stop
          $fxcPath=if($fxc.Path){$fxc.Path}else{$fxc.FullName}

          & $fxcPath /nologo /T vs_3_0 /E main /O3 `
            /Fh build_x86\r15_scene_vs_bytecode.h /Vn g_r15SceneVs `
            /Fo artifact\R15_SCENE_VS.cso /Fc artifact\R15_SCENE_VS_ASM.txt `
            lab\r15_jitter9\r15_scene_vs.hlsl
          if($LASTEXITCODE){throw 'R15 scene VS compile failed'}

          & $fxcPath /nologo /T ps_3_0 /E main /O3 `
            /Fh build_x86\r15_scene_ps_bytecode.h /Vn g_r15ScenePs `
            /Fo artifact\R15_SCENE_PS.cso /Fc artifact\R15_SCENE_PS_ASM.txt `
            lab\r15_jitter9\r15_scene_ps.hlsl
          if($LASTEXITCODE){throw 'R15 scene PS compile failed'}

          & $fxcPath /nologo /T vs_3_0 /E main /O3 `
            /Fh build_x86\r15_geometry_vs_bytecode.h /Vn g_r15GeometryVs `
            /Fo artifact\R15_GEOMETRY_VS.cso /Fc artifact\R15_GEOMETRY_VS_ASM.txt `
            lab\r15_jitter9\r15_geometry_vs.hlsl
          if($LASTEXITCODE){throw 'R15 geometry VS compile failed'}

          & $fxcPath /nologo /T ps_3_0 /E main /O3 `
            /Fh build_x86\r15_geometry_ps_bytecode.h /Vn g_r15GeometryPs `
            /Fo artifact\R15_GEOMETRY_PS.cso /Fc artifact\R15_GEOMETRY_PS_ASM.txt `
            lab\r15_jitter9\r15_geometry_ps.hlsl
          if($LASTEXITCODE){throw 'R15 geometry PS compile failed'}

          & $fxcPath /nologo /T ps_3_0 /E main /O3 `
            /Fh build_x86\r15_exact_reservoir_ps_bytecode.h /Vn g_r15ExactReservoirPs `
            /Fo artifact\R15_EXACT_RESERVOIR.cso /Fc artifact\R15_EXACT_RESERVOIR_ASM.txt `
            lab\r15_jitter9\r15_exact_reservoir_ps.hlsl
          if($LASTEXITCODE){throw 'R15 exact reservoir PS compile failed'}

      - name: Gate calibrated textured-raster convention
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /W4 /WX /EHsc `
            /I lab\r15_jitter9 /I build_x86 `
            lab\r15_jitter9\r15_raster_jitter_oracle.cpp `
            /link d3d9.lib user32.lib `
            /OUT:artifact\r15_raster_jitter_oracle.exe
          if($LASTEXITCODE){throw 'R15 raster oracle compile failed'}

          $out=& .\artifact\r15_raster_jitter_oracle.exe 2>&1
          $oracleExit=$LASTEXITCODE
          $text=($out -join "`n")
          $text | Set-Content artifact\R15_CALIBRATED_RASTER_RESULT.txt -Encoding ascii
          Write-Host $text

          # This oracle historically returned failure because it demanded
          # byte-exact equality across textured raster edges. That is not the
          # right contract: the geometry oracle isolates raster exactness and
          # this test selects the lowest-error D3D9 sampling convention.
          $best=[regex]::Match($text,'R15_RASTER_BEST=([A-Z0-9_]+) MAE=([0-9.]+) CHANGED=([0-9]+) MAX=([0-9]+)')
          if(!$best.Success){throw "R15 raster metrics missing, exit=$oracleExit"}
          $name=$best.Groups[1].Value
          $mae=[double]$best.Groups[2].Value
          $changed=[int]$best.Groups[3].Value
          $max=[int]$best.Groups[4].Value
          if($name -ne 'D3D9_CENTER'){throw "R15 calibrated convention drifted: $name"}
          if($mae -gt 6.10){throw "R15 D3D9_CENTER MAE regression: $mae"}
          if($changed -gt 1500){throw "R15 D3D9_CENTER changed-pixel regression: $changed"}
          if($max -gt 255){throw "R15 D3D9_CENTER invalid max: $max"}
          Write-Host "R15_RASTER_CALIBRATED_GATE=PASS name=$name mae=$mae changed=$changed max=$max legacy_exit=$oracleExit"

      - name: Gate geometry exactness with one documented top-left tie pixel
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & cl.exe /nologo /O2 /W4 /WX /EHsc `
            /I lab\r15_jitter9 /I build_x86 `
            lab\r15_jitter9\r15_geometry_jitter_oracle.cpp `
            /link d3d9.lib user32.lib `
            /OUT:artifact\r15_geometry_jitter_oracle.exe
          if($LASTEXITCODE){throw 'R15 geometry oracle compile failed'}

          $out=& .\artifact\r15_geometry_jitter_oracle.exe 2>&1
          $oracleExit=$LASTEXITCODE
          $text=($out -join "`n")
          $text | Set-Content artifact\R15_CALIBRATED_GEOMETRY_RESULT.txt -Encoding ascii
          Write-Host $text

          $maeM=[regex]::Match($text,'R15_GEOM_MAE_8BIT=([0-9.]+)')
          $changedM=[regex]::Match($text,'R15_GEOM_CHANGED_PIXELS=([0-9]+)')
          $firstM=[regex]::Match($text,'R15_GEOM_FIRST_MISMATCH=([0-9]+),([0-9]+)')
          if(!$maeM.Success -or !$changedM.Success -or !$firstM.Success){throw "R15 geometry metrics missing, exit=$oracleExit"}
          $mae=[double]$maeM.Groups[1].Value
          $changed=[int]$changedM.Groups[1].Value
          if($changed -gt 1){throw "R15 geometry changed-pixel regression: $changed"}
          if($mae -gt 0.0070){throw "R15 geometry MAE regression: $mae"}
          if($text -notmatch 'R15_GEOM_PHASE_2_0_CHANGED=1'){throw 'R15 documented phase-2/0 edge tie moved'}
          foreach($token in @(
            'R15_GEOM_PHASE_0_0_CHANGED=0','R15_GEOM_PHASE_1_0_CHANGED=0',
            'R15_GEOM_PHASE_0_1_CHANGED=0','R15_GEOM_PHASE_1_1_CHANGED=0','R15_GEOM_PHASE_2_1_CHANGED=0',
            'R15_GEOM_PHASE_0_2_CHANGED=0','R15_GEOM_PHASE_1_2_CHANGED=0','R15_GEOM_PHASE_2_2_CHANGED=0'))
          {
            if($text -notmatch [regex]::Escape($token)){throw "R15 unexpected geometry mismatch: $token"}
          }
          Write-Host "R15_GEOMETRY_CALIBRATED_GATE=PASS mae=$mae changed=$changed first=$($firstM.Groups[1].Value),$($firstM.Groups[2].Value) legacy_exit=$oracleExit"

      - name: Prove byte-exact calibrated D3D9-center 9-phase GPU reservoir
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # The original reservoir harness predates the D3D9-center calibration.
          # Patch only its synthetic sampling coordinates into a generated test
          # source; the production shader under test remains unmodified.
          $src=Get-Content lab\r15_jitter9\r15_reservoir_gpu_oracle.cpp -Raw
          $src=$src.Replace('{-0.5f,       1,1},','{-1.0f/3.0f, 1,1},')
          $src=$src.Replace('{-1.0f/6.0f, 0,0},','{ 0.0f,       0,0},')
          $src=$src.Replace('{ 1.0f/6.0f, 1,2}','{ 1.0f/3.0f, 1,2}')
          $src=$src.Replace('1.5f*(float)sy+0.25f+1.5f*jitterY','1.5f*(float)sy+1.5f*jitterY')
          $src=$src.Replace('1.5f*(float)sx+0.25f+1.5f*jitterX','1.5f*(float)sx+1.5f*jitterX')
          if($src -match '0\.25f\+1\.5f\*jitter'){throw 'R15 stale half-center coordinate survived generated reservoir source'}
          $src | Set-Content artifact\r15_reservoir_d3d9center_gpu_oracle.cpp -Encoding utf8

          & cl.exe /nologo /O2 /W4 /WX /EHsc `
            /I build_x86 `
            artifact\r15_reservoir_d3d9center_gpu_oracle.cpp `
            /link d3d9.lib user32.lib `
            /OUT:artifact\r15_reservoir_d3d9center_gpu_oracle.exe
          if($LASTEXITCODE){throw 'R15 calibrated reservoir oracle compile failed'}

          & .\artifact\r15_reservoir_d3d9center_gpu_oracle.exe | Tee-Object artifact\R15_CALIBRATED_RESERVOIR_RESULT.txt
          if($LASTEXITCODE){throw 'R15 calibrated reservoir GPU oracle failed'}
          $text=Get-Content artifact\R15_CALIBRATED_RESERVOIR_RESULT.txt -Raw
          foreach($token in @(
            'R15_RESERVOIR_INVALID_PIXELS=0',
            'R15_RESERVOIR_CHANGED_PIXELS=0',
            'R15_RESERVOIR_MAE_8BIT=0.000000000',
            'R15_RESERVOIR_MAX_ABS=0',
            'R15_EXACT_RESERVOIR_GPU=PASS'))
          {
            if($text -notmatch [regex]::Escape($token)){throw "R15 calibrated reservoir token missing: $token"}
          }
          Write-Host 'R15_D3D9_CENTER_EXACT_RESERVOIR_GATE=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: R15-CALIBRATED-GATES-LAB
          path: |
            artifact/R15_CALIBRATED_RASTER_RESULT.txt
            artifact/R15_CALIBRATED_GEOMETRY_RESULT.txt
            artifact/R15_CALIBRATED_RESERVOIR_RESULT.txt
            artifact/R15_EXACT_RESERVOIR_ASM.txt
            artifact/r15_reservoir_d3d9center_gpu_oracle.cpp
          if-no-files-found: error
