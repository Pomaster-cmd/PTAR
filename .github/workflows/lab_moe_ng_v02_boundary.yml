name: LAB PTAR-NG MoE v02 Boundary Sweep

on:
  push:
    branches:
      - lab/moe-ng-v02-native-detail

permissions:
  contents: read

jobs:
  boundary-sweep:
    if: contains(github.event.head_commit.message, '[run-boundary]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Expand LAB05-MC routing boundary on A+B and evaluate C holdout
        run: >-
          python tools/lab_moe_ng_v02_boundary_sweep.py
          --bgrid corpus/current/PTAR_PERCEPTUAL_V1_B_GRID
          --v1a corpus/current/PTAR_PERCEPTUAL_V1_A
          --out lab_results/moe_ng_v02_boundary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moe-ng-v02-lab05-boundary-sweep
          path: lab_results/moe_ng_v02_boundary
