name: RC58 P1U46 Mode Bridge Stress

on:
  push:
    branches: [lab/rc58-virtual-presenter-mode-20260915]
    paths:
      - 'lab/borderless/rc58/ptar_borderless_rc58_mode_bridge.cpp'
      - 'lab/borderless/rc58/ptar_rc58_mode_bridge_host.cpp'
      - '.github/workflows/rc58-native-p1u46-toggle-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mode-bridge:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reconstruct exact P1U46 and RC55
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o='lab/borderless/rc58/bridge_test';New-Item -ItemType Directory -Force $o|Out-Null
          python lab/borderless/rc48/rebuild_exact_field_runtime.py payload/d3d11.dll "$o/d3d11.dll";if($LASTEXITCODE-ne0){throw 'runtime'}
          $h=(Get-FileHash "$o/d3d11.dll" -Algorithm SHA256).Hash.ToLowerInvariant();if($h-ne'6f1686992bef971c9995df9f0cb91b93c6946988e12a837e5de956df37c9082b'){throw "runtime drift $h"};Copy-Item "$o/d3d11.dll" "$o/win81_nis_dx11_x64.dll"
          $ini=Get-Content payload/win81_nis.ini -Raw;$ini=[regex]::Replace($ini,'(?m)^OutputWidth=.*$','OutputWidth=1920');$ini=[regex]::Replace($ini,'(?m)^OutputHeight=.*$','OutputHeight=1080');$ini=[regex]::Replace($ini,'(?m)^RenderWidth=.*$','RenderWidth=1280');$ini=[regex]::Replace($ini,'(?m)^RenderHeight=.*$','RenderHeight=720');Set-Content "$o/win81_nis.ini" $ini -Encoding ASCII
          python lab/raster/rc52/build_rc52_context_hooks.py lab/raster/rc58_bridge_rc52.cpp;if($LASTEXITCODE-ne0){throw 'rc52'}
          python lab/raster/rc55/build_rc55_context_hooks.py lab/raster/rc58_bridge_rc52.cpp lab/raster/rc58_bridge_rc55.cpp;if($LASTEXITCODE-ne0){throw 'rc55'}
      - name: Build bridge twice RC55 and host
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 20
          set CFLAGS=/nologo /EHsc /std:c++17 /W4 /WX /MT /D_WIN32_WINNT=0x0603 /DWINVER=0x0603
          mkdir lab\borderless\rc58\bridge_test\p1 2>nul
          mkdir lab\borderless\rc58\bridge_test\p2 2>nul
          cl %CFLAGS% /LD lab\borderless\rc58\ptar_borderless_rc58_mode_bridge.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fo:lab\borderless\rc58\bridge_test\p1\ /Fe:lab\borderless\rc58\bridge_test\p1\ptar_borderless.dll user32.lib advapi32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 21
          cl %CFLAGS% /LD lab\borderless\rc58\ptar_borderless_rc58_mode_bridge.cpp lab\raster\rc41b\ptar_rc41b_bootstrap.cpp /Fo:lab\borderless\rc58\bridge_test\p2\ /Fe:lab\borderless\rc58\bridge_test\p2\ptar_borderless.dll user32.lib advapi32.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 22
          set RCFLAGS=%CFLAGS% /I lab\raster\rc41
          cl %RCFLAGS% /LD lab\raster\rc41\ptar_rc41_target_classifier.cpp lab\raster\rc58_bridge_rc55.cpp lab\raster\rc41\ptar_rc41_resource_bridge.cpp lab\raster\rc41\ptar_rc41_swapchain_policy.cpp lab\raster\rc41\ptar_rc41_swapchain_hooks.cpp lab\raster\rc41\ptar_rc41_prod.cpp /Fo:lab\borderless\rc58\bridge_test\ /Fe:lab\borderless\rc58\bridge_test\ptar_rc41.dll user32.lib d3d11.lib dxgi.lib /link /Brepro /SUBSYSTEM:WINDOWS,6.03 || exit /b 23
          cl %CFLAGS% lab\borderless\rc58\ptar_rc58_mode_bridge_host.cpp /Fo:lab\borderless\rc58\bridge_test\ /Fe:lab\borderless\rc58\bridge_test\Warhammer.exe user32.lib advapi32.lib gdi32.lib d3d11.lib dxgi.lib /link /SUBSYSTEM:WINDOWS,6.03 || exit /b 24
          copy /y lab\borderless\rc58\bridge_test\p1\ptar_borderless.dll lab\borderless\rc58\bridge_test\ptar_borderless.dll >nul
      - name: Binary and architecture gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$p1='lab/borderless/rc58/bridge_test/p1/ptar_borderless.dll';$p2='lab/borderless/rc58/bridge_test/p2/ptar_borderless.dll';$h1=(Get-FileHash $p1 -Algorithm SHA256).Hash.ToLowerInvariant();$h2=(Get-FileHash $p2 -Algorithm SHA256).Hash.ToLowerInvariant();if($h1-ne$h2){throw 'not reproducible'};$r=(Get-FileHash 'lab/borderless/rc58/bridge_test/ptar_rc41.dll' -Algorithm SHA256).Hash.ToLowerInvariant();if($r-ne'271187ab9fd82b6829c52a667223f241ec79e98fa340b13c9a72270142156949'){throw "RC55 drift $r"};$src=Get-Content 'lab/borderless/rc58/ptar_borderless_rc58_mode_bridge.cpp' -Raw;foreach($bad in @('ResizeBuffers(','SetParent(','SetWindowRgn(')){if($src.Contains($bad)){throw "forbidden $bad"}};if($src -notmatch 'RC58_PRESENTER_MUTATION=NONE' -or $src -notmatch 'RC58_DXGI_RESIZE=NONE'){throw 'architecture contract absent'};$b=[IO.File]::ReadAllBytes($p1);$pe=[BitConverter]::ToInt32($b,0x3C);if([BitConverter]::ToUInt16($b,$pe+4)-ne0x8664-or[BitConverter]::ToUInt16($b,$pe+24)-ne0x20B-or[BitConverter]::ToUInt16($b,$pe+72)-ne6-or[BitConverter]::ToUInt16($b,$pe+74)-ne3){throw 'PE gate'};@("RC58_BRIDGE_SHA256=$h1","RC55_RASTER_SHA256=$r",'RC58_REPRODUCIBLE=PASS','PE_X64_WIN81=PASS','PRESENTER_MUTATION=NONE','DXGI_RESIZE=NONE')|Set-Content 'lab/borderless/rc58/bridge_test/RC58_BRIDGE_BUILD.txt' -Encoding ASCII;Get-Content 'lab/borderless/rc58/bridge_test/RC58_BRIDGE_BUILD.txt'
      - name: Exact P1U46 setting roundtrip and 500 F10 cycles
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$o=(Resolve-Path 'lab/borderless/rc58/bridge_test').Path;$p=Start-Process "$o/Warhammer.exe" -WorkingDirectory $o -PassThru;if(-not$p.WaitForExit(900000)){Stop-Process $p.Id -Force;throw 'timeout'};$ev=Join-Path $o 'RC58_MODE_BRIDGE_STRESS.txt';if(Test-Path $ev){$e=[IO.File]::ReadAllText($ev,[Text.Encoding]::Unicode);Write-Host $e}else{throw 'evidence absent'};foreach($n in @('win81_nis.log','ptar_borderless_rc58.log','ptar_rc41_bootstrap.log','ptar_rc41.log')){$q=Join-Path $o $n;if(Test-Path $q){Write-Host "===== $n =====";Get-Content $q -Tail 180}};if($p.ExitCode-ne0){throw "host rc=$($p.ExitCode)"};if(-not$e.Contains('RC58_MODE_BRIDGE_STRESS=PASS cycles=500')){throw 'stress marker absent'};$rt=Get-Content (Join-Path $o 'win81_nis.log') -Raw;$gd=([regex]::Matches($rt,'HOTKEY TOGGLE PRESENTER: GAME DIRECT requested')).Count;$usr=([regex]::Matches($rt,'HOTKEY TOGGLE PRESENTER: USR PRESENTER requested')).Count;if($gd-lt501-or$usr-lt501){throw "toggle counts direct=$gd usr=$usr"};if(-not$rt.Contains('OK: P1U46 ACTIVE OUTPUT PATH = GAME DIRECT')-or-not$rt.Contains('OK: P1U46 ACTIVE OUTPUT PATH = USR PRESENTER')){throw 'P1U46 path activation absent'};if($rt.Contains('ERROR: P1U46 USR PRESENTER activation failed')){throw 'USR activation failure'};if(-not$rt.Contains('PTAR-NG MoE v01 exact x1.5 active')){throw 'x1.5 absent'};$c=Get-Content (Join-Path $o 'ptar_borderless_rc58.log') -Raw;if(-not$c.Contains('RC58_PRESENTER_MUTATION=NONE')-or-not$c.Contains('RC58_MODE_BRIDGE_INSTALLED')){throw 'bridge contract absent'};$boot=Get-Content (Join-Path $o 'ptar_rc41_bootstrap.log') -Raw;if(-not$boot.Contains('RC41B_ACTIVATION_PROVEN')){throw 'RC55 bootstrap absent'};Write-Host "RC58_MODE_BRIDGE_500=PASS direct=$gd usr=$usr"
      - name: Final summary
        shell: powershell
        run: |
          $o='lab/borderless/rc58/bridge_test';$h=(Get-FileHash "$o/p1/ptar_borderless.dll" -Algorithm SHA256).Hash.ToLowerInvariant();@('RC58_MODE_BRIDGE_FINAL=PASS','WINDOWED=P1U46_GAME_DIRECT_PLUS_GAME_WINDOW_GUARD','BORDERLESS=P1U46_NATIVE_USR_PRESENTER','GAME_SETTINGS_WINDOWSTYLE_0_1_ROUNDTRIP=PASS','F10_500_ROUNDTRIPS=PASS','PRESENTER_MUTATION=NONE','DXGI_RESIZE=NONE','RC55_RASTER_UNCHANGED=PASS',"RC58_CARRIER_SHA256=$h")|Set-Content "$o/RC58_BRIDGE_FINAL.txt" -Encoding ASCII;Get-Content "$o/RC58_BRIDGE_FINAL.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PTAR_RC58_MODE_BRIDGE_STRESS
          path: |
            lab/borderless/rc58/bridge_test/*.txt
            lab/borderless/rc58/bridge_test/*.log
            lab/borderless/rc58/bridge_test/p1/ptar_borderless.dll
            lab/borderless/rc58/bridge_test/ptar_rc41.dll
          if-no-files-found: warn
          retention-days: 14
