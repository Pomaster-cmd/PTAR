name: finalize-hudrec1-main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-hudrec1-main.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize HUDREC1 metadata and registries
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-hudrec1-main.yml
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('diag/BUILD_MANIFEST.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          RT='e81e4c6239462bc7a93c3fd7d7abb4bd96e09db1f013eb48a46f40341ffa6429'
          BASE='864c0ca8f24f22f6a3cd4c21a0e213f431f5268e69b04e3860c52fe72600fc3c'
          INI='bd39b7c703ddf7a8658bed4df620232d00c06972351ca404c2d8386187fd3f50'
          VER='7ea6a7a47b463d780aeb752c7a8b9c1ea74db61336f8a44f6e1799fd8439d2fc'
          PKG='PTAR_GW16H_UNIFIEDREC3_SAFEPOINT11_FUSEDDETAIL1_HUDREC1'
          m['package']=PKG
          m['package_filename']=PKG+'.zip'
          m['build_date']='2026-09-16'
          m['runtime']['sha256']=RT
          m['runtime']['recorder_hudrec1']={
            'base_sha256':BASE,
            'runtime_sha256':RT,
            'native_wrapper_rva':'0x34FE980',
            'patch_site_rva':'0x34FE9B9',
            'old_fg_off_swapchain_rva':'0x02C7E010',
            'new_fg_off_swapchain_rva':'0x02C7DFC8',
            'native_hud_helper_rva':'0x13CE0',
            'native_f9_presenter_swapchain_rva':'0x02C7DFC8',
            'fg_on_final_backbuffer_rva':'0x02C93CE8',
            'functional_byte_changes':1,
            'pe_checksum_byte_changes':2,
            'fg_algorithm_changed':False,
            'fuseddetail1_changed':False,
            'qsv_conversion_changed':False,
            'hardware_video_gate':'PASS_HUD_FPS_CONFIRMED_ON_REFERENCE_HARDWARE',
            'base_bundle':'diag/base/SAFEPOINT11_FUSEDDETAIL1_BASE.dll',
            'whole_binary_delta_file_offsets':['0xD0','0xD1','0x4CBBC'],
            'whole_binary_delta_count':3,
            'fg_on_hud_render_call':'0x25A8C -> 0x26D50 -> dedicated HUD helper 0x28750 before recorder 0x25B49',
            'fg_on_fps_sources':['0x02CCE5BC live','0x02CCE4FC fallback']
          }
          ins=m.setdefault('installer_fix',{})
          ins.update({
            'scope':'HUDREC1 exact payload hashes; baseline SAFEPOINT11 retained as known upgrade source; marker toggle supported only in installed INI verifier',
            'expected_runtime_sha256':RT,
            'expected_ini_sha256':INI,
            'expected_version_sha256':VER,
            'known_ptar_includes_safepoint11':True,
            'known_ptar_includes_hudrec1':True
          })
          rec=m.setdefault('recorder_policy',{})
          rec.update({
            'fg_on':'production recorder captures final REAL+GENERATED isolated presenter texture after HUD composition',
            'fg_off':'production recorder captures visible PTAR presenter BackBuffer0 after native HUD draw; HUD/FPS included when Overlay=1',
            'patch_scope':'HUDREC1 changes only FG-OFF recorder source game swapchain -> visible PTAR presenter; SAFEPOINT2/3/4/5 and FG-ON route retained',
            'native_backbuffer_api':'IDXGISwapChain::GetBuffer(0, IID_ID3D11Texture2D) on visible presenter swapchain RVA 0x02C7DFC8 for FG OFF',
            'hud_recording':'Overlay/HUD/FPS are on the recorded final presenter surface; confirmed on reference hardware'
          })
          hw=m.setdefault('hardware_state',{})
          hw.update({
            'canonical_runtime':'SAFEPOINT11/FUSEDDETAIL1/HUDREC1 is the current hardware-validated baseline.',
            'required_targeted_gates':['One short GTX 960M session: Clip A ~5 s CTRL+F9 with FG OFF confirming HUD/FPS in MP4 on the modified route; Clip B ~5 s CTRL+F9 with FG ON confirming HUD/FPS on the unchanged route; no broad regression suite requested.'],
            'safepoint11':'PROMOTED_HARDWARE_VALIDATED_ANCESTOR',
            'hudrec1':'HARDWARE_VALIDATED_HUD_FPS_VIDEO_RECORDING_CONFIRMED'
          })
          val=m.setdefault('validation',{})
          val['recorder_hudrec1']='38/38 PASS'
          val['fg_marker_visibility']='17/17 PASS'
          m['marker_control']={
            'tool':'diag/FG_MARKER_VISIBILITY.bat',
            'key':'WIN81_NIS/VBlankDiagnostics',
            'values':{'0':'hide visible cadence squares','1':'show visible cadence squares'},
            'hud_fps_independent':True,
            'backup_before_write':True,
            'verify_policy':'only VBlankDiagnostics=0/1 may differ from payload INI'
          }
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          f=Path('diag/GW16H_HUDREC1_FINDING.txt')
          s=f.read_text(encoding='utf-8')
          s=s.replace('STATUS=LAB_STATIC_VALIDATED_HARDWARE_VIDEO_GATE_PENDING','STATUS=HARDWARE_VALIDATED')
          s=s.replace('One short GTX 960M session with two approximately 5-second recordings is still required:','Hardware field gate completed on the Windows 8.1 / GTX 960M reference machine:')
          s=s.replace('- CLIP A, FG OFF: confirms the actually modified native recorder route captures the visible HUD/FPS.','- CLIP A, FG OFF: visible HUD/FPS recording confirmed on the modified native route.')
          s=s.replace('- CLIP B, FG ON: confirms the unchanged isolated final-backbuffer recorder route still captures HUD/FPS.','- CLIP B, FG ON: HUD/FPS recording confirmed on the unchanged isolated final-backbuffer route.')
          if 'FIELD_RESULT=' not in s:
              s += '\nFIELD_RESULT=HUD_FPS_VIDEO_RECORDING_CONFIRMED_ON_WINDOWS_8_1_GTX_960M\n'
          f.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          files=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              rel=p.as_posix()
              if rel.startswith('_PTAR_UNINSTALL/state/') or rel.startswith('diag/backups/'): continue
              files.append(rel)
          files=sorted(files)
          sums=[f'{sha(root/r)}  {r}' for r in files if r not in ('diag/SHA256SUMS.txt','_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv')]
          Path('diag/SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          files=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              rel=p.as_posix()
              if rel.startswith('_PTAR_UNINSTALL/state/') or rel.startswith('diag/backups/'): continue
              files.append(rel)
          files=sorted(r for r in files if r!='_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv')
          lines=['PTAR_STATIC_OWNERSHIP_SCHEMA\t3']
          for i,r in enumerate(files,82600001):
              lines.append(f'{i:08d}|{r}|{sha(root/r)}')
          Path('_PTAR_UNINSTALL/PTAR_STATIC_OWNERSHIP.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('SHA_ENTRIES',len(sums),'OWNERSHIP_ENTRIES',len(files))
          PY

          python3 diag/validate_recorder_hudrec1.py .
          python3 diag/validate_fg_marker_visibility.py .
          python3 diag/validate_gw16_hudrec1_package.py .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: finalize hardware-validated HUDREC1 baseline'
          git push origin HEAD:main
