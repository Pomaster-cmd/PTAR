name: LAB D3D9 SPEC5 BLENDHYBRID1 20261012

on:
  push:
    branches: [lab/d3d9-spec5-blendhybrid1-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile and evaluate hybrid blends
        shell: pwsh
        run: .\lab\blendhybrid1\run_blendhybrid1.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PTAR-D3D9-SPEC5-BLENDHYBRID1
          path: artifact/
          if-no-files-found: error
